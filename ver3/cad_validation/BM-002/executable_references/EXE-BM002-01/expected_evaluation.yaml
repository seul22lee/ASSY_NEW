divergences_from_the_frozen_expectation: []
divergence_note: >
  None. Every invariant landed where REFERENCE_SELECTION.yaml said it would. That
  is a weaker result than it looks: the selection was frozen at the level of
  "which invariants should pass", not at the level of the geometry, and the
  geometry needed three changes before it could deliver them. Those are recorded in
  DESIGN_AND_OPERATION_RATIONALE.md as CHG-01, CHG-02 and CHG-03.

# --------------------------------------- what the geometry cost to get right
errors_found_during_this_phase:
  - id: CHG-01
    kind: CAD_DEFECT
    what: the crank arm sat 3.000 mm inside the housing floor at bottom dead centre
    measured: crank shaft / housing common volume 278.7734 mm3 at BDC with crank_axis_z = 55.0
    fixed_by: crank_axis_z 55.0 -> 60.0, the least height that clears the floor by 2.0 mm
    travel_after: 90.000000 mm, unchanged
  - id: CHG-02
    kind: LAYOUT_CONTRADICTION
    what: >
      the provisional decision that the rear panel carries the second crank-shaft
      journal is unrealizable
    measured: >
      64.0000 mm3 of connecting-rod material inside a 4 x 4 x 4 probe centred on the
      crank axis at BDC, and a rod-to-axis-line distance of 0.0000 mm; a shaft
      extending past the rod is struck by it, and a two-web crankshaft cannot be a
      single connected solid for the same reason
    fixed_by: >
      a second journal land inside the housing, separated from the first by a relief
      bore so the two are physically distinct; the rear panel keeps its closure and
      pin-retention roles
    travel_after: 90.000000 mm, unchanged
  - id: CHG-03
    kind: DERIVED_DIMENSION
    what: proposed plate at 197-207 and rim at 215 are unreachable once the clevis must clear the rod eye
    fixed_by: clevis_offset 18.0; plate at TOP 208-216, rim 224, top clearance 8.000 unchanged
    travel_after: 90.000000 mm, unchanged
  - id: DEF-01
    kind: VALIDATOR_DEFECT
    what: the boundary-crossing negative control left the handle grip outside the housing, so it was a no-op
    fixed_by: the mutation now pulls the whole shaft inboard, which is what INA-BM-002-H describes
  - id: DEF-02
    kind: VALIDATOR_DEFECT
    what: >
      the pitch/roll negative control removed the followers but left the plate edges
      0.400 mm from the guide bosses, so a 4 degree rotation still fouled them by
      13.7431 mm3 and no escape was achieved
    fixed_by: the mutation now also pulls the plate edges 6 mm clear of the bosses
  - id: DEF-03
    kind: VALIDATOR_DEFECT
    what: >
      guide engagement compared the PLATFORM's z-extent against the channel's, but
      the platform's box reaches to z = 89 because of the clevis, 5 mm below the
      channel's lower end, so the check reported the followers leaving the channel
      at every sample when they never do
    fixed_by: >
      clip the platform to the channel footprint first and measure the FOLLOWER's
      extent; measured 114.0 to 130.0 at BOTTOM inside a channel spanning 94.0 to 224.0

no_oracle_file_was_modified: true
