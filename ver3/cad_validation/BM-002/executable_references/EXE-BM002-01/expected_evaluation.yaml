weakening_check: >
  No check was relaxed to obtain a PASS, and no CAD was weakened. contact_tol stayed
  at 0.05 mm and overlap_tol_mm3 at 1.0e-6 throughout; the alternative to CHG-01 was
  to raise the overlap tolerance above 278.77 mm3, which would have blinded the
  check that found the defect, and it was not done. Three checks were made STRICTER
  during the phase: the two-journal check now measures the relief between the lands
  as well as the lands themselves; axial retention now requires the blocking body to
  be the DECLARED retention body and not merely some obstruction; and guide
  engagement now measures the follower rather than the whole platform. Two negative
  controls were strengthened after they were found to be no-ops.

