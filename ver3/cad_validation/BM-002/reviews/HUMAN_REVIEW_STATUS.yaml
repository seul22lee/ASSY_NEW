author_raised_concerns:
  note: >
    Raised by the author while producing the media. None is a defect in the CAD;
    each is a design question only a human can settle.
  items:
    - id: SC-01
      concern: >
        The O70 hub is load-bearing in three ways at once - exterior crank body,
        boundary-crossing element, and journal surface for both lands. It is that
        large because the shaft is inserted from the open +X side, so the handle
        end must pass through the whole journal bore.
      relates_to: [M1, M2]
    - id: SC-02
      concern: >
        26 mm is a small hand-crank radius, and it is bounded above by the hub
        radius of 35 mm for the same assembly reason.
      relates_to: [U2, U4]
    - id: SC-03
      concern: >
        The grip reaches z = 34 at its lowest, 34 mm above the desk. Whether
        knuckles clear the surface is not measured anywhere.
      relates_to: [U3]
    - id: SC-04
      concern: The 8 mm recess at TOP is tight for placing a payload by hand.
      relates_to: [G2, G3]
    - id: SC-05
      concern: >
        The overhung crank is a consequence of the connecting rod occupying the
        crank axis, not a preference. A reviewer may still judge it the wrong
        architecture.
      relates_to: [M1]
    - id: SC-06
      concern: >
        No holding feature. Release the crank and nothing holds the platform. The
        source states no such requirement (UNR-BM-002-004) so none was added.
      relates_to: [C2]
    - id: SC-07
      concern: >
        The product is tall and narrow. "Desktop-sized" has no stated envelope
        (UNR-BM-002-006).
      relates_to: [P1, P2]

