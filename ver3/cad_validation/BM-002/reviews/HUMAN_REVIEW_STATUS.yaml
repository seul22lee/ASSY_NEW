  - contact-level jamming, tolerance binding, frictional wedging, guide wear
  - fatigue, wear, life
  - manufacturing feasibility, physical assembly force
  - user ergonomic suitability, pinch safety
  - self-locking outside the exact tested model
  note: >
    No FEA was run. No contact model exists. No strength PASS and no jamming PASS
    was claimed anywhere.
