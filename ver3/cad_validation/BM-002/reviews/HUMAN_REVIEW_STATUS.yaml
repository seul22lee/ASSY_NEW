    what: geometry and kinematics measured on B-rep solids; no force anywhere
    result: 14 Oracle predicates PASS, 20/20 negative controls, travel 90.000000 mm
  - id: PHASE_A_MEDIA
    what: 42 CAD-derived review images and two PRESCRIBED CAD animations
    result: PNG audit YES; video audit conclusive
  - id: PHASE_B_MUJOCO
    what: >
      MuJoCo rigid-body dynamics at a DECLARED IDEAL-JOINT fidelity; forces, but
