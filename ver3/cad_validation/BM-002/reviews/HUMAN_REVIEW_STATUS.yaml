    The three are different kinds of evidence and are never merged. MuJoCo did not
    exist during Phase A and nothing in Phase A depends on it.

what_author_self_review_covered: >
  Legibility and correctness of the CAD-derived review media only: that every
  image and video frame was rendered from the accepted B-rep geometry, that the
  features they claim to show are actually visible in them, that the annotations
  match the measured values in validation/, and that nothing is claimed on an
  image that the Phase A evidence does not support. It did NOT review the design.

what_author_self_review_did_not_cover: >
  Whether the design is good. Proportions, the overhung crank architecture, the
  Ø70 hub, the 26 mm hand radius, the 8 mm top recess, whether the rear panel
  earns its place, and whether further engineering is required before treating
  this as a practical 1 kg product are all human decisions and all remain PENDING.

