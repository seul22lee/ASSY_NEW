EXE-BM001-01:
  revision_completed: true
  revision_rounds:
    - round: 1
      driver: HCR-BM001-002
      what: hinge pin replaced with a headed pin carrying two snap arms
      signature: f2bc9599cdd6832dcb52ea0f24645b6cf6c374308324320b08d93f7f6e8d8967
    - round: 2
      drivers: [HCR-BM001-008, HCR-BM001-009, HCR-BM001-010]
      what: >
        separate lift-bolt realization rejected as functionally excessive and
        removed - BODY-BOLT, its knob and shaft, the closure guide boss and the
        enclosure socket all gone. BODY-CLOSURE gained an integral exterior snap
        latch and BODY-ENCLOSURE gained the keeper. Four bodies became three.
      signature: 97613a0815b794fb14a92364a7f8d7ac70c4d4c34b10ace6eb26b1aba7aba109
  product_bodies: [BODY-ENCLOSURE, BODY-CLOSURE, BODY-PIN]
  body_bolt_absent: true
  hinge_pin: >
    UNCHANGED. Its sub-signature over volume, area, centre of mass and bounding
    box is identical before and after (f5c3ec81480611b3). The accepted
    head-plus-snap-barb hinge is carried through, not rebuilt.
  latch:
    architecture: >
      release pad, compliant cantilever beam, lead-in ramp, tooth and retaining
      shoulder, all integral to BODY-CLOSURE; keeper rib integral to
      BODY-ENCLOSURE
    compliant_region: REG-CLOSURE-LATCH-COMPLIANT
    terminology: >
      a latch. Not a key, not a lock, no keying, no authorization and no security
      function is provided or claimed.
    engagement_mm: 2.2
    engaged_free_play_deg: 0.2570
    release_direction: -Y, the exterior pad pulled outward
    release_deflection_mm: 2.4
    tooth_under_keeper_mm3: {engaged: 113.62, released: 0.0}
    reengages_without_user_action: true
  previous_geometry_signature: f2bc9599cdd6832dcb52ea0f24645b6cf6c374308324320b08d93f7f6e8d8967
  revised_geometry_signature: 97613a0815b794fb14a92364a7f8d7ac70c4d4c34b10ace6eb26b1aba7aba109
  validation: all ten steps PASS, 0 findings, 24/24 negative controls detected
  predicate_totals: {PASS: 12, FAIL: 0, NOT_VERIFIED: 0, NOT_EVALUABLE: 1}
  independently_reviewed: false
  simulation_recomputed_from_the_revised_cad: >
    the closure gained the latch and the front lip, so mass went 0.0523 ->
    0.056264 kg, inertia about the hinge 1.401e-04 -> 1.803e-04 kg m^2, and peak
    static torque 0.0221 -> 0.0258 N m. No previous torque result was carried
    over on the grounds that the geometry change looked small.
  stale_claim_corrected: >
    manifest LIM-03 still said the compressed pin configuration was 4.08 mm^3
    (0.38%) smaller than the relaxed one, from a superseded build that rotated
    the arms about their roots. Measured now, both are 0.000 mm^3 apart.

EXE-BM001-02:
  revision_completed: true
  drivers: [HCR-BM001-004, HCR-BM001-005, HCR-BM001-006, HCR-BM001-007]
  topology: integrated snap-rail captive sliding cover
  product_bodies: [BODY-ENCLOSURE, BODY-COVER]
  no_third_product_body: true
  previous_geometry_signature: 870af742b622b85628ceb5beb4f6fc8561993abdd9c6b6883f9e735174106649
  revised_geometry_signature: 1eba7a573b5787ba86257e007512832b0538688e76b9268c12c2717b15b7b111
  artifact_manifest_sha256: 6938358b3422b59ec6b788e815c8d6c41cd3f75e6399f57c707cd4b9d0d87d32
  validation: all ten steps PASS, 0 findings, 16/16 negative controls detected
  predicate_totals: {PASS: 12, FAIL: 0, NOT_VERIFIED: 0, NOT_EVALUABLE: 1}
  independently_reviewed: false
  reason_for_complete_redesign: >
    The previous realization put retention on a separate snap rivet pressed
    through cover and enclosure, and the closed-state latch on a keeper bridge
    spanning the top of the product. That is a fastener compensating for rails
    with no overhang: a third body doing the rail's job. The rails are now
    complete - ledge, guide wall and overhanging retaining lip on both sides -
    and every snap feature is integral to one of the two product bodies.
  how_each_decision_is_met:
    HCR-BM001-003_84_of_90: >
      84.0 mm of a 90.0 mm aperture, unchanged, with 0.000 mm^3 of intrusion into
      the declared region in both the aperture band and the prism above it
    HCR-BM001-004_not_removable_at_full_open: >
      the retaining lips run the whole rail length and all four tabs are under
      them at every position. A 3 mm lift is blocked at 0, 10, 40, 70 and 84 mm
      (124.8 to 133.6 mm^3), and 12 pitch/roll probes are blocked as well.
    HCR-BM001-005_no_user_handled_separate_part: >
      two product bodies. Nothing is inserted, removed, set aside or managed by
      the user; the release feature is the cover's own finger.
    HCR-BM001-006_no_orientation_free_retainer: >
      one engaged and one released configuration and no orientation to lose. The
      latch recovers on its own through its lead-in ramp.
    HCR-BM001-007_directed_topology: >
      guided captive sliding cover on real captive rails; integrated snap-in
      captive retention through four integral cover tabs; integrated releasable
      closed-state snap latch reachable from outside the product envelope.
  drawings_caught_what_the_checker_missed: >
    An earlier arrangement of this redesign put the latch finger on the
    centreline, where it retracted INTO the declared 84 mm opening at full open.
    The access probe missed it because the probe sampled only the prism above the
    cover, and the finger sits level with it. It was found by looking at the
    full-open drawing. The latch was moved out over the near rail and the probe
    now measures the aperture band as well.
  artifacts_deleted: >
    all rivet geometry and metadata, the keeper bridge, rivet.step, rivet.brep,
    and every review image depicting a superseded topology. Nothing in the
    directory now describes a design that no longer exists.

