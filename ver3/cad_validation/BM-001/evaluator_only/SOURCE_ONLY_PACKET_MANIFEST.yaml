sufficiency_statement: This packet is INSUFFICIENT to expose any Oracle answer. It contains no invariant,
  no predicate, no fixture, no tag vocabulary and no evaluation outcome, and it names no mechanism. An
  author working from it can determine what the product must DO, and cannot determine what the acceptance
  criteria will CHECK, nor what anyone else has built. That asymmetry is the point of the exercise.
rank1_topology_words: 'S1 uses "latch", "mechanism", "box" and "storage" and is reproduced verbatim, so
  those words are present. They name a FUNCTION and an object, not a mechanism family: S1 never says how
  the latch works or how the closure moves. No other topology word was introduced anywhere in the packet.'
contamination_rule: If a Demonstration author reads any excluded artifact, the run is CONTAMINATED and
  must be declared so. A contaminated run declared as such is useful; one that is quietly contaminated
  is worse than none, because it produces a false result about source sufficiency.
