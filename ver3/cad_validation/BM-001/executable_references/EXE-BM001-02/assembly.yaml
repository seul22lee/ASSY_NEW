reference_id: EXE-BM001-02
schema_version: 0.1.0
units: mm

principle: >
  Every insertion is a straight-line translation of one rigid body. No step
  requires a body to deform, and no step requires any body to pass through the
  material of another. Steps that only move an already-installed body along a
  path already validated in step 5 are marked as operations and cite the segment
  that validated them, rather than being swept again.

steps:
  - id: ASM-01
    place: BODY-ENCLOSURE
    kind: base
    note: fixed reference body; nothing is inserted.
  - id: ASM-02
    place: BODY-COVER
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 40.0
    at_offset: [-84.0, 0.0, 0.0]
    note: >
      Lowered vertically into the channel at the open position, where the lips
      are relieved. This is why the lips stop at lip_relief_x1: without that
      relief there is no way to get the closure into its own rails, because a
      lipped channel closed at both ends cannot be entered by any translation.
    ends_in_contact_with:
      - {body: BODY-ENCLOSURE, interaction: INT-03}
      - {body: BODY-ENCLOSURE, interaction: INT-04}
      - {body: BODY-ENCLOSURE, interaction: INT-08}
      - {body: BODY-ENCLOSURE, interaction: INT-13}
  - id: ASM-03
    place: BODY-COVER
    kind: operation
    note: Slide to the closed position. Same path as M3_OPEN reversed.
    validated_by: motion segment M3_OPEN
  - id: ASM-04
    place: BODY-CAM
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 40.0
    at_offset: [0.0, 0.0, 0.0]
    requires: BODY-COVER at the closed position
    note: >
      Lowered through FEA-C-KEYWAY and FEA-E-KEYWAY with the blade aligned. The
      cam is as-built in this orientation, so the insertion sweep is a check on
      the same solid that is later locked.
    ends_in_contact_with:
      - {body: BODY-COVER, interaction: INT-11}
  - id: ASM-05
    place: BODY-CAM
    kind: operation
    note: Quarter turn to the locked orientation. Same path as M1_UNLOCK reversed.
    validated_by: motion segment M1_UNLOCK

disassembly: >
  The reverse order is available and uses the same paths. No step is
  irreversible and no body is permanently joined.

not_established_here: >
  Insertion force, ease of assembly and process suitability. REQ-007 asks for a
  product that is easy to assemble; what is shown is that an assembly ordering
  exists and is geometrically unobstructed. Ease is an effort claim and remains
  NOT_VERIFIED.
