reference_id: EXE-BM001-02
schema_version: 0.2.0
units: mm

principle: >
  Every insertion is a straight-line translation of one rigid body, or a declared
  compliant passage that is measured rather than assumed. No separate part is
  handled by the user in service: the pin is fitted once and snap-retained.

steps:
  - id: ASM-01
    place: BODY-ENCLOSURE
    kind: base
    note: fixed reference body

  - id: ASM-02
    place: BODY-COVER
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 30.0
    at_offset: [-100.0, 0.0, 0.0]
    note: >
      Lowered into the channel at the LOADING position, which is 16 mm beyond the
      open bound. The pin ear passes down through FEA-E-LOAD-RELIEF, the only
      break in the lips. This position is outside the operating range and the pin
      makes it unreachable once fitted.

  - id: ASM-03
    place: BODY-COVER
    kind: operation
    note: slide to the closed position; same path as M3_CLOSE
    validated_by: motion segment M3_CLOSE

  - id: ASM-04
    place: BODY-PIN
    kind: insertion
    direction: [0.0, 0.0, 1.0]
    approach_distance: 25.0
    at_offset: [0.0, 0.0, 0.0]
    configuration_during_step: CFG-PIN-COMPRESSED
    configuration_after_step: CFG-PIN-RELAXED
    compliant_region: REG-P-SNAP-COMPLIANT
    steps:
      - 1. reach in through the open aperture, under the front ledge
      - 2. enter the barb UPWARD into the slot, lead-in first
      - 3. compress ONLY REG-P-SNAP-COMPLIANT
      - 4. pass the lugs up through the slot and the cover bore
      - 5. recover the lugs in the cover counterbore
      - 6. seat FEA-P-HEAD under FEA-E-LEDGE-UNDER
    note: >
      Fitted from BELOW, through the cavity. A top-down pin cannot work here: its
      head would have to pass through the lips the cover is already under, which
      the assembly sweep caught.
      From this point the cover is captive at every operating position and the
      slot ends bound the travel. The loading position can no longer be reached.
    ends_retained_by:
      - {body: BODY-ENCLOSURE, interaction: INT-07, direction: upward, what: cover captivity}
      - {body: BODY-COVER, interaction: INT-11, direction: downward}

disassembly: >
  Service removal requires compressing the pin arms from under the front ledge, a
  deliberate act with a tool. It is not an ordinary lift-out, which is the point
  of HCR-BM001-004.

not_established_here: >
  Insertion force, snap strain, release effort and process suitability. What is
  shown is that an assembly ordering exists and is geometrically unobstructed.
