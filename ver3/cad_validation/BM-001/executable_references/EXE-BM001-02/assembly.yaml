reference_id: EXE-BM001-02
schema_version: 0.3.0
units: mm

principle: >
  Two straight presses, in the same direction. Nothing overhangs the cover, so
  nothing has to be threaded past anything; the only compliant passage is the
  rivet's arms through the slot, and that is measured rather than assumed.

steps:
  - id: ASM-01
    place: BODY-ENCLOSURE
    kind: base
    note: fixed reference body

  - id: ASM-02
    place: BODY-COVER
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 30.0
    at_offset: [0.0, 0.0, 0.0]
    note: >
      Lowered straight down between the guide walls onto the ledges, at the
      closed position. Nothing obstructs it: the guide walls locate it sideways
      and there is no lip over it. This is the step that two earlier versions
      could not perform without a relief and a loading position outside the
      operating range.
    ends_in_contact_with:
      - {body: BODY-ENCLOSURE, interaction: INT-01}
      - {body: BODY-ENCLOSURE, interaction: INT-02}

  - id: ASM-03
    place: BODY-RIVET
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 25.0
    at_offset: [0.0, 0.0, 0.0]
    configuration_during_step: CFG-RIVET-COMPRESSED
    configuration_after_step: CFG-RIVET-RELAXED
    compliant_region: REG-R-SNAP-COMPLIANT
    steps:
      - 1. align the cover bore over the slot
      - 2. enter the tapered tip into the bore and the slot
      - 3. compress ONLY REG-R-SNAP-COMPLIANT, across the slot's width
      - 4. pass the lugs down through the slot
      - 5. recover the lugs under FEA-E-LEDGE-UNDER
      - 6. seat FEA-R-HEAD flush in the cover counterbore
    note: >
      After this step the cover is captive at every position of its travel and
      the slot ends bound it. The rivet cannot be withdrawn: its recovered lugs
      span 7.6 mm across a 5.4 mm slot.
    ends_retained_by:
      - {body: BODY-ENCLOSURE, interaction: INT-07, direction: upward,
         what: cover captivity and rivet anti-withdrawal}
      - {body: BODY-COVER, interaction: INT-11, direction: downward}

disassembly: >
  The rivet cannot be removed without destroying it, which is what makes the
  cover captive at full open. That is a declared consequence, recorded as LIM-01
  rather than presented as a feature.

not_established_here: >
  Insertion force, snap strain, release effort and process suitability. What is
  shown is that an assembly ordering exists and is geometrically unobstructed.
