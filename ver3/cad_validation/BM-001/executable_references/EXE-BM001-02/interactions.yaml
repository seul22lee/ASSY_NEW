reference_id: EXE-BM001-02
schema_version: 0.3.0
units: mm

rule: >
  The prohibition is undeclared volumetric overlap, not positive clearance
  everywhere. Any pair whose common volume exceeds overlap_tol_mm3 in any state
  or at any sampled point of any motion segment is a failure regardless of what
  is declared here.

evaluation_tolerance:
  contact_tol_mm: 0.02
  overlap_tol_mm3: 1.0e-6

interactions:
  - id: INT-01
    bodies: [BODY-COVER, BODY-ENCLOSURE]
    features: [FEA-C-PLATE, FEA-E-LEDGE-F]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: ALL_STATES
    role: the cover rides on the front ledge throughout the travel

  - id: INT-02
    bodies: [BODY-COVER, BODY-ENCLOSURE]
    features: [FEA-C-PLATE, FEA-E-LEDGE-R]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: ALL_STATES
    role: the cover rides on the rear ledge

  - id: INT-03
    bodies: [BODY-COVER, BODY-ENCLOSURE]
    features: [FEA-C-EDGE-F, FEA-E-GUIDE-F]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.2
    active: ALL_STATES
    role: >
      lateral running clearance against the front guide wall. Guidance only:
      nothing overhangs the cover, because the rivet does the holding down.

  - id: INT-04
    bodies: [BODY-COVER, BODY-ENCLOSURE]
    features: [FEA-C-EDGE-R, FEA-E-GUIDE-R]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.2
    active: ALL_STATES
    role: lateral running clearance against the rear guide wall

  - id: INT-05
    bodies: [BODY-COVER, BODY-RIVET]
    features: [FEA-C-BORE, FEA-R-SHAFT]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.3
    active: ALL_STATES
    role: the shaft in the cover bore; the rivet travels with the cover

  - id: INT-06
    bodies: [BODY-ENCLOSURE, BODY-RIVET]
    features: [FEA-E-SLOT, FEA-R-SHAFT]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.2
    active: ALL_STATES
    role: >
      the shaft runs in the slot. The slot ends are the terminal bounds, so this
      clearance is what sets both of them.
    determines: TERMINAL_BOUNDS

  - id: INT-07
    bodies: [BODY-ENCLOSURE, BODY-RIVET]
    features: [FEA-E-LEDGE-UNDER, FEA-R-LUG-SHOULDER]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.3
    active: ALL_STATES
    role: >
      the recovered lugs stand under the ledge. They are what stops the cover
      lifting at any position, full open included, and what stops the rivet
      withdrawing. Whether they WITHSTAND a pull is a force question and is
      NOT_VERIFIED.
    determines: COVER_CAPTIVITY_AND_ANTI_WITHDRAWAL

  - id: INT-08
    bodies: [BODY-COVER, BODY-ENCLOSURE]
    features: [FEA-C-LATCH-HOOK, FEA-E-KEEPER]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 1.0
    active: [S_CLOSED_LATCHED]
    role: >
      the recovered hook stands 1.0 mm clear of the keeper's near face. That gap
      is the closed-state free play: the cover can shift 1 mm before the hook
      bites, and then it is blocked. Declaring it a CONTACT would contradict the
      measurement.
    determines: CLOSED_STATE_RETENTION

  - id: INT-09
    bodies: [BODY-COVER, BODY-ENCLOSURE]
    features: [FEA-C-LATCH-RAMP, FEA-E-KEEPER]
    type: DECLARED_COMPLIANT_INTERACTION
    active: [M1_RELEASE, M2_OPEN, M3_CLOSE]
    compliant_region: REG-C-LATCH-COMPLIANT
    deflection_mm: 2.6
    role: >
      the declared compliant passage of the latch past the keeper. On closing the
      ramp deflects the beam; on opening the beam stays down until the ramp
      clears. Measured by the latch probe, not assumed.
    not_established: strain, release effort, snap force, fatigue

  - id: INT-10
    bodies: [BODY-ENCLOSURE, BODY-RIVET]
    features: [FEA-E-SLOT, FEA-R-LEADIN]
    type: DECLARED_COMPLIANT_INTERACTION
    active: [ASM-03]
    compliant_region: REG-R-SNAP-COMPLIANT
    deflection_mm: 1.30
    role: >
      the declared compliant passage of the arms through the slot as the rivet is
      pressed home. The compressed envelope is measured against the slot width
      rather than assumed.
    not_established: strain, insertion force, pull-out force, fatigue

  - id: INT-11
    bodies: [BODY-COVER, BODY-RIVET]
    features: [FEA-C-BORE, FEA-R-HEAD]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: ALL_STATES
    role: the head seats in the counterbore and caps the cover

pairs_not_declared: []

undeclared_contact_policy: >
  validate.py scans all three body pairs in every state and at every sampled
  point of all three motion segments, so the declaration cannot be completed by
  omission.
