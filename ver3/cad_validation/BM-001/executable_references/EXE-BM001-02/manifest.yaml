reference_id: EXE-BM001-02
schema_version: 0.2.0
title: guided captive sliding cover with integral snap features
kind: ADMISSIBLE_EXECUTABLE_REFERENCE
author_awareness: ORACLE_AWARE
revision:
  supersedes: quarter-turn cam design (v0.1)
  driver: HCR-BM001-004, -005, -006, -007
  removed: [BODY-CAM, quarter-turn cam, keyed cam bore, cam keeper, cam poses,
            cam assembly steps, full-open lift-out]
is_not:
  - a source-only Demonstration
  - evidence that the source alone leads here
  - evidence that the design satisfies the rank-1 source
maps_to_semantic_fixture: null
mapping_fidelity: NEW_ADMISSIBLE_REALIZATION
units: mm

bodies:
  - id: BODY-ENCLOSURE
    name: enclosure
    material_class: GENERIC_RIGID_POLYMER
    installed_as: DISCRETE
    role: >
      Fixed body. Cavity; solid top panel; two ledges the cover runs on; two
      lipped rails; the slot the captive pin runs in; the latch keeper bridge;
      and the loading relief through which the cover is fitted.
    features:
      - {id: FEA-E-LEDGE-F, what: front ledge top face; the cover runs on it}
      - {id: FEA-E-LEDGE-R, what: rear ledge top face}
      - {id: FEA-E-LEDGE-UNDER, what: front ledge underside; the barb lugs recover against it}
      - {id: FEA-E-LIP-F, what: front retaining lip, overhanging the channel}
      - {id: FEA-E-LIP-R, what: rear retaining lip}
      - {id: FEA-E-SLOT, what: slot through the front ledge; its ends are the terminal bounds}
      - {id: FEA-E-SLOT-END-NEAR, what: near slot end; the open terminal bound}
      - {id: FEA-E-SLOT-END-FAR, what: far slot end; the closed terminal bound}
      - {id: FEA-E-KEEPER, what: bridge across the aperture; the latch hook catches on its near face}
      - {id: FEA-E-LATCH-RELIEF, what: pocket in the top panel giving the deflected beam room}
      - {id: FEA-E-LOAD-RELIEF, what: lip relief through which the pin ear is lowered at assembly}
      - {id: FEA-E-DECK, what: solid top panel; the cover parks over it when open}
      - {id: FEA-E-APERTURE, what: opening in the top}
  - id: BODY-COVER
    name: sliding cover
    material_class: GENERIC_COMPLIANT_POLYMER
    installed_as: DISCRETE_SNAP_IN
    role: >
      Movable cover. Plate, the ear carrying the captive pin, and an integral
      compliant latch beam cut from the plate with a hook and a lead-in ramp.
    material_model:
      kinematically_rigid: [FEA-C-PLATE, FEA-C-EAR]
      declared_compliant_region: REG-C-LATCH-COMPLIANT
      compliant_members: [FEA-C-LATCH-BEAM, FEA-C-LATCH-HOOK, FEA-C-LATCH-RAMP]
      statement: >
        Only the latch beam is treated as deformable, and only while the hook is
        alongside the keeper. The plate is a rigid slider everywhere else. The
        whole cover is NOT claimed to deform.
    configurations:
      - {id: CFG-COVER-RELAXED, what: latch recovered; the state at rest and through most of the travel}
      - {id: CFG-COVER-LATCH-DEFLECTED, what: beam pressed down; release and the first 10.5 mm of travel}
    features:
      - {id: FEA-C-PLATE, what: the plate covering the aperture}
      - {id: FEA-C-EAR, what: lateral ear over the front ledge, carrying the pin bore}
      - {id: FEA-C-BORE, what: pin bore with a counterbore for the head}
      - {id: FEA-C-LATCH-BEAM, what: cantilever cut from the plate, rooted at its +X end}
      - {id: FEA-C-LATCH-HOOK, what: hook standing above the beam tip; catches the keeper}
      - {id: FEA-C-LATCH-RAMP, what: lead-in on the hook so closing deflects the beam}
      - {id: FEA-C-RELEASE-FACE, what: the beam's own top face; the release surface, reached through the aperture}
      - {id: FEA-C-LEAD, what: leading end face}
      - {id: FEA-C-TRAIL, what: trailing end face}
  - id: BODY-PIN
    name: captive retention pin
    material_class: GENERIC_COMPLIANT_POLYMER
    installed_as: DISCRETE_SNAP_IN
    role: >
      Fixed in the cover ear and running in the enclosure slot. Its head caps the
      ear and its recovered snap lugs bear under the ledge, so the cover cannot
      lift; the slot ends bound the travel.
    material_model:
      kinematically_rigid: [FEA-P-SHAFT, FEA-P-HEAD]
      declared_compliant_region: REG-P-SNAP-COMPLIANT
      compliant_members: [FEA-P-ARM-A, FEA-P-ARM-B, FEA-P-LUG-A, FEA-P-LUG-B]
      statement: same principle as EXE-BM001-01; compliant only during ASM-03
    configurations:
      - {id: CFG-PIN-RELAXED, what: as-built; every operating state}
      - {id: CFG-PIN-COMPRESSED, what: arms deflected inward; assembly only, never exported}
    features:
      - {id: FEA-P-HEAD, what: head capping the cover ear}
      - {id: FEA-P-SHAFT, what: shaft running in the enclosure slot}
      - {id: FEA-P-ARM-A, what: first cantilever snap arm}
      - {id: FEA-P-ARM-B, what: second cantilever snap arm}
      - {id: FEA-P-LUG-A, what: retaining lug on arm A}
      - {id: FEA-P-LUG-B, what: retaining lug on arm B}
      - {id: FEA-P-LUG-SHOULDER, what: lug upper faces; bear under FEA-E-LEDGE-UNDER}

declared_usable_access:
  region: {x: [103.0, 187.0], y: [13.0, 57.0], z: [45.0, 145.0]}
  what: the part of the aperture open in the open state
  fraction: 84 of 90 mm
  human_decision: APPROVED (HCR-BM001-003)

how_the_cover_is_captive_and_still_assemblable:
  problem: >
    A cover that cannot come out at full open cannot have gone in at full open
    either. The two requirements fight, and something has to give.
  resolution: >
    The loading position is OUTSIDE the operating range. The lips carry a relief
    at FEA-E-LOAD-RELIEF; the pin ear passes down through it only when the cover
    is pushed well beyond its open bound. The pin is fitted afterwards, and from
    then on FEA-E-SLOT limits travel to 0..84 mm, which never brings the ear back
    under the relief.
  consequence: >
    Captive at every operating position including full open, and still
    assemblable. Service removal needs the pin's arms compressed from below - a
    deliberate act with a tool, not an ordinary lift.

known_limitations:
  - id: LIM-01
    what: Service removal requires access under the front ledge to compress the pin arms.
    status: DECLARED_DESIGN_CHOICE
    why: >
      That is the price of the cover being captive at full open, which
      HCR-BM001-004 requires. Whether the access is practical is a judgement
      nobody has made.
  - id: LIM-02
    what: The latch release is the beam's own face, not a shaped finger pad.
    status: DECLARED_DESIGN_CHOICE
    why: >
      A raised pad was tried and struck the keeper bridge as the cover slid under
      it. Whether a bare beam face is comfortable to press is an ergonomics
      question this pilot does not answer.
  - id: LIM-03
    what: >
      The compliant states are declared kinematic configurations, not continuum
      deformations.
    status: DECLARED_MODELLING_APPROXIMATION
    why: >
      They test geometric passage and engagement. They do not predict strain, and
      exact volume behaviour under real bending is not claimed.
