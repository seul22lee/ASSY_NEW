reference_id: EXE-BM001-02
schema_version: 0.4.0
title: integrated snap-rail captive sliding cover
kind: ADMISSIBLE_EXECUTABLE_REFERENCE
author_awareness: ORACLE_AWARE
units: mm

concept:
  name: integrated snap-rail captive sliding cover
  product_bodies: [BODY-ENCLOSURE, BODY-COVER]
  no_other_product_body_exists: true
  one_line: >
    Two captive C-section rails carry the whole retention job - the ledge
    supports, the guide wall locates, the retaining lip holds down - and the
    cover snaps past those lips on four integral tabs. A second integral snap, a
    finger at the cover's exposed end, holds it shut.
  supersedes: >
    two earlier topologies for this reference, both rejected. What replaced them
    and why is in DESIGN_AND_OPERATION_RATIONALE.md.

bodies:
  - id: BODY-ENCLOSURE
    name: enclosure
    material_class: GENERIC_RIGID_POLYMER
    installed_as: DISCRETE
    role: >
      Fixed body. Cavity, solid top panel, and two captive rails. Its far end
      wall carries the latch slot, and the strip of wall standing outboard of
      that slot is the keeper.
    material_model:
      kinematically_rigid: ALL
      declared_compliant_region: none
    features:
      - {id: FEA-E-RAIL-L-LEDGE, what: near rail ledge; its top face carries the cover}
      - {id: FEA-E-RAIL-L-GUIDE, what: near guide wall inner face; the tab tips run on it}
      - {id: FEA-E-RAIL-L-LIP, what: near retaining lip; overhangs the tabs, blocks lift}
      - {id: FEA-E-RAIL-R-LEDGE, what: far rail ledge}
      - {id: FEA-E-RAIL-R-GUIDE, what: far guide wall inner face}
      - {id: FEA-E-RAIL-R-LIP, what: far retaining lip}
      - {id: FEA-E-STOP-OPEN, what: solid rail fill at x = 13; the open terminal bound}
      - {id: FEA-E-STOP-CLOSED, what: far end wall inner face; the closed terminal bound}
      - {id: FEA-E-LATCH-SLOT, what: open-topped slot through the far end wall the finger reaches through}
      - {id: FEA-E-KEEPER, what: the strip of far end wall standing OUTBOARD of that slot; the tooth hooks behind its outer face}
      - {id: FEA-E-DECK, what: solid top panel the cover parks over}
      - {id: FEA-E-APERTURE, what: opening in the top}
      - {id: FEA-E-CAVITY, what: interior volume}
  - id: BODY-COVER
    name: sliding cover
    material_class: GENERIC_COMPLIANT_POLYMER
    installed_as: DISCRETE_SNAP_IN
    role: >
      Movable cover. Four integral retention tabs run under the rail lips; an
      integral latch finger reaches out through the end wall over the near rail
      and hooks behind the keeper strip. Everything that retains or latches this
      cover is part of it.
    material_model:
      kinematically_rigid: [FEA-C-PLATE]
      declared_compliant_regions:
        - REG-COVER-RETAIN-LEFT-COMPLIANT
        - REG-COVER-RETAIN-RIGHT-COMPLIANT
        - REG-COVER-LATCH-COMPLIANT
      statement: >
        Only the four tabs and the latch finger are treated as deformable, and
        each only during its own declared action. The plate is a rigid slider
        everywhere else and throughout normal operation.
    configurations:
      - {id: CFG-COVER-RELAXED, what: everything at rest; every operating state}
      - {id: CFG-TABS-COMPRESSED, what: tabs 2.2 mm inboard; assembly only, never exported}
      - {id: CFG-LATCH-DEFLECTED, what: finger 2.6 mm inboard; release and lead-in only}
    features:
      - {id: FEA-C-PLATE, what: the plate covering the aperture}
      - {id: FEA-C-PLATE-END-CLOSE, what: its +X face; lands on the closed bound}
      - {id: FEA-C-PLATE-END-OPEN, what: its -X face; lands on the open bound}
      - {id: FEA-C-TAB-L1-BEAM, what: near trailing cantilever, rooted at its +X end}
      - {id: FEA-C-TAB-L1-EAR, what: its ear; projects outward under the near lip}
      - {id: FEA-C-TAB-L1-SHOULDER, what: the ear's top face; the anti-lift surface}
      - {id: FEA-C-TAB-L2-BEAM, what: near leading cantilever}
      - {id: FEA-C-TAB-L2-EAR, what: its ear}
      - {id: FEA-C-TAB-L2-SHOULDER, what: its anti-lift surface}
      - {id: FEA-C-TAB-R1-BEAM, what: far trailing cantilever}
      - {id: FEA-C-TAB-R1-EAR, what: its ear}
      - {id: FEA-C-TAB-R1-SHOULDER, what: its anti-lift surface}
      - {id: FEA-C-TAB-R2-BEAM, what: far leading cantilever}
      - {id: FEA-C-TAB-R2-EAR, what: its ear}
      - {id: FEA-C-TAB-R2-SHOULDER, what: its anti-lift surface}
      - {id: FEA-C-LATCH-FINGER, what: cantilever reaching out through the end wall, over the NEAR RAIL}
      - {id: FEA-C-LATCH-TOOTH, what: lug projecting outboard from the finger, behind the keeper strip}
      - {id: FEA-C-LATCH-FACE, what: the tooth's -X face; what blocks opening}
      - {id: FEA-C-LATCH-RAMP, what: the tooth's sloped face; deflects the finger inboard on closing}
      - {id: FEA-C-RELEASE-PAD, what: the finger beyond the tooth, outside the product; where the user pushes}

# ------------------------------------------------------ no redundant feature
feature_function_table:
  rule: >
    Every feature below carries at least one required function and cannot be
    deleted without losing it. There is no feature here whose only purpose is to
    make a validator report PASS, and no feature that duplicates another's job.
  entries:
    - features: [FEA-E-RAIL-L-LEDGE, FEA-E-RAIL-R-LEDGE]
      body: BODY-ENCLOSURE
      functions: [vertical support]
      cannot_be_deleted_because: the cover would have nothing to sit on
    - features: [FEA-E-RAIL-L-GUIDE, FEA-E-RAIL-R-GUIDE]
      body: BODY-ENCLOSURE
      functions: [lateral guidance]
      cannot_be_deleted_because: the cover would wander across the aperture
    - features: [FEA-E-RAIL-L-LIP, FEA-E-RAIL-R-LIP]
      body: BODY-ENCLOSURE
      functions: [anti-lift capture]
      cannot_be_deleted_because: >
        the cover would lift straight off at every position. CTL-01 removes the
        lip while leaving the guide wall and the checker reports the lift-out.
    - features: [FEA-C-TAB-L1-EAR, FEA-C-TAB-L2-EAR, FEA-C-TAB-R1-EAR, FEA-C-TAB-R2-EAR]
      body: BODY-COVER
      functions: [snap-in assembly, engagement beneath the lips]
      cannot_be_deleted_because: >
        nothing would reach under a lip. Two per side, spaced 52 mm apart,
        because a single pair would let the cover pitch out.
    - features: [FEA-C-TAB-L1-BEAM, FEA-C-TAB-L2-BEAM, FEA-C-TAB-R1-BEAM, FEA-C-TAB-R2-BEAM]
      body: BODY-COVER
      functions: [compliance for the ears]
      cannot_be_deleted_because: the ears could not deflect to enter
    - features: [FEA-E-STOP-OPEN, FEA-E-STOP-CLOSED]
      body: BODY-ENCLOSURE
      functions: [terminal bounds]
      cannot_be_deleted_because: >
        travel would be unbounded in one or both directions. FEA-E-STOP-OPEN is
        a stop face, not a relief; there is no break in either lip anywhere.
    - features: [FEA-C-LATCH-TOOTH, FEA-E-KEEPER]
      body: both
      functions: [closed-state translation block]
      cannot_be_deleted_because: >
        the cover would slide open unaided. CTL-12 removes the tooth and the
        checker reports the loss of the block.
    - features: [FEA-C-LATCH-RAMP]
      body: BODY-COVER
      functions: [automatic deflection on closing]
      cannot_be_deleted_because: >
        closing would jam against the end wall instead of snapping over it
    - features: [FEA-C-RELEASE-PAD, FEA-E-LATCH-SLOT]
      body: both
      functions: [exterior-reachable release]
      cannot_be_deleted_because: >
        there would be no way to release the latch from outside, and the user
        would be back to handling something separate
    - features: [FEA-E-DECK]
      body: BODY-ENCLOSURE
      functions: [closes the top where the aperture is not, gives the cover somewhere to park]
      cannot_be_deleted_because: the box would be open along its whole length

declared_usable_access:
  region: {x: [103.0, 187.0], y: [13.0, 57.0], z: [45.0, 105.0]}
  nominal_aperture_mm: 90.0
  usable_mm: 84.0
  human_decision: APPROVED (HCR-BM001-003)
  not_narrowed_since: true

how_the_human_decisions_are_met:
  HCR-BM001-003_84_of_90: travel 84 mm of a 90 mm aperture, unchanged
  HCR-BM001-004_not_removable_at_full_open: >
    the retaining lips run the whole rail length and the tabs are under them at
    every position. A 3 mm lift is blocked at 0, 10, 40, 70 and 84 mm, and a
    1.5 degree tilt with a 1.5 mm lift is blocked too.
  HCR-BM001-005_no_user_handled_separate_part: >
    the product is two bodies. Nothing is inserted, removed, set aside or
    managed by the user; the release feature is the cover's own finger.
  HCR-BM001-006_no_orientation_free_retainer: >
    the latch has one engaged and one released configuration and no orientation
    to lose. It recovers on its own through its lead-in ramp.
  HCR-BM001-007_directed_topology: >
    guided captive sliding cover on real captive rails; integrated snap-in
    captive retention through four integral cover tabs; integrated releasable
    closed-state snap latch reachable from outside.
  snap_fit_means: >
    an integral compliant geometric feature belonging to one of the two product
    bodies. All five compliant features here - four tabs and one latch finger -
    are part of BODY-COVER.
  no_fastener_compensating_for_rail_geometry: >
    the rails are complete: ledge, guide wall and overhanging lip on both sides.
    Nothing is added to make up for a missing overhang.

known_limitations:
  - id: LIM-01
    what: >
      Removing the cover for service needs all four tabs deflected inboard at
      once, reached through the rail channels.
    status: DECLARED_DESIGN_CHOICE
    why: >
      That is the price of captivity at full open, which HCR-BM001-004 requires.
      It is non-destructive but it is not a one-hand job, and whether it is
      acceptable is a human judgement this pilot does not make.
  - id: LIM-02
    what: The release pad stands 11 mm proud of the product's end face.
    status: DECLARED_DESIGN_CHOICE
    why: >
      An exterior-reachable release has to be somewhere. It is on the end face,
      over the near rail rather than on the centreline, so the top surface stays
      flush, nothing bridges over the cover, and at full open the finger retracts
      over the ledge instead of into the 84 mm opening. It is still a protrusion
      and a reviewer may object to it.
  - id: LIM-03
    what: The compliant states are declared kinematic configurations.
    status: DECLARED_MODELLING_APPROXIMATION
    why: >
      They test geometric passage and engagement, conserve volume exactly, and
      predict nothing about strain. No force is computed anywhere here.
