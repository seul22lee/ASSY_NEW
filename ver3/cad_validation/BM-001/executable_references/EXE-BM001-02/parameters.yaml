reference_id: EXE-BM001-02
units: mm
schema_version: 0.2.0

revision:
  supersedes: quarter-turn cam design (v0.1)
  driver: HCR-BM001-004, -005, -006, -007
  what_changed: >
    BODY-CAM and every cam feature removed. The cover is now held captive by a
    snap-retained pin running in an enclosure slot, and the closed state is held
    by an integral compliant snap latch. No part is handled separately by the
    user.

frame:
  description: >
    Origin at the enclosure's minimum outer corner. X is length (the sliding
    direction), Y is depth, Z is up. The enclosure is fixed.

note_on_absolute_size: >
  UNR-BM-001-003 leaves every absolute dimension open. None of these numbers is a
  requirement; each is a declared design choice.

parameters:

  # ---------------------------------------------------------------- enclosure
  - name: box_x
    value: 190.0
    purpose: enclosure outer length
    range: [80.0, 400.0]
  - name: box_y
    value: 70.0
    purpose: enclosure outer depth
    range: [40.0, 200.0]
  - name: box_z
    value: 40.0
    purpose: height to the plane the cover runs on
    range: [20.0, 150.0]
  - name: wall
    value: 3.0
    purpose: uniform wall and floor thickness
    range: [1.5, 10.0]
  - name: rail_top_z
    value: 48.0
    purpose: top of the side rails
    range: [42.0, 80.0]
  - name: far_wall_x
    value: 187.0
    purpose: >
      inner face of the far end wall. The closed terminal bound; the near end is
      deliberately open so the cover can be loaded, and the near travel bound is
      the pin slot instead of a wall.
    range: [40.0, 380.0]

  # -------------------------------------------------------------------- deck
  - name: deck_x1
    value: 97.0
    purpose: >
      the solid top panel runs from the near wall to here. Beyond it is the
      aperture. The panel is what the cover parks over when open.
    range: [20.0, 320.0]
  - name: deck_z0
    value: 37.0
    purpose: underside of the top panel
    range: [10.0, 39.0]

  # ------------------------------------------------------------------- rails
  - name: ledge_y
    value: 13.0
    purpose: >
      inboard edge of the two ledges the cover runs on. The aperture between
      them is y = ledge_y to box_y - ledge_y.
    range: [6.0, 30.0]
  - name: ledge_z0
    value: 34.0
    purpose: underside of the ledges; the snap barb recovers against this face
    range: [10.0, 39.0]
  - name: lip_inner_y
    value: 12.0
    purpose: >
      inboard edge of the retaining lips. Deliberately INBOARD of the cover
      plate edge, so the lips overlap the plate and resist lift directly.
    range: [5.0, 29.0]
  - name: lip_z0
    value: 45.2
    purpose: underside of the retaining lips; cover top plus slot_gap
    range: [40.5, 60.0]
  - name: slot_gap
    value: 0.2
    purpose: running clearance between the cover and its channel
    range: [0.05, 1.0]
  - name: load_relief_x0
    value: 34.0
    purpose: >
      start of the lip relief through which the cover's pin ear is lowered during
      assembly.
    range: [4.0, 300.0]
  - name: load_relief_x1
    value: 50.0
    purpose: >
      end of the lip relief. The ear only reaches this band when the cover is
      pushed BEYOND its open bound, which the pin slot prevents once the pin is
      fitted. That is what makes the cover captive at full open while still being
      assemblable.
    range: [5.0, 320.0]

  # ----------------------------------------------------------------- closure
  - name: cover_len
    value: 90.0
    purpose: cover length; equal to the aperture length
    range: [30.0, 350.0]
  - name: cover_t
    value: 5.0
    purpose: cover thickness
    range: [2.0, 15.0]
  - name: travel
    value: 84.0
    purpose: >
      slide from closed to open. Set by the pin slot, not by an end wall.
      Approved at 84 of a 90 mm aperture by HCR-BM001-003.
    range: [10.0, 350.0]

  # ------------------------------------------------- captive pin and its slot
  - name: pin_offset_x
    value: 45.0
    purpose: >
      pin position measured from the cover's trailing end. Mid-cover, so the
      slot it needs sits over solid ledge at every point of the travel.
    range: [10.0, 300.0]
  - name: pin_y
    value: 8.0
    purpose: Y of the pin axis, over the centre of the front ledge
    range: [4.0, 30.0]
  - name: pin_shaft_d
    value: 5.0
    purpose: pin shaft diameter, running in the enclosure slot
    range: [2.0, 14.0]
  - name: pin_head_d
    value: 7.5
    purpose: >
      pin head diameter. Wider than the cover's bore so the head caps the ear,
      and small enough to stay inside the running channel - at 11.0 it fouled
      the rail, which the interference check caught.
    range: [6.0, 24.0]
  - name: pin_head_h
    value: 2.5
    purpose: pin head height, sitting in a counterbore in the cover ear
    range: [1.0, 8.0]
  - name: pin_bore_d
    value: 5.6
    purpose: >
      bore through the cover ear. Wider than the slot, because the compressed
      barb has to pass through the COVER before it reaches the slot - at 5.2 it
      did not fit and the assembly sweep caught it.
    range: [2.1, 14.5]
  - name: slot_w
    value: 5.4
    purpose: >
      width of the enclosure slot the shaft runs in; 0.2 radial clearance so the
      pin slides without binding
    range: [2.2, 15.0]
  - name: slot_end_margin
    value: 0.0
    purpose: >
      extra slot length beyond the travel. Zero on purpose: the slot ends ARE the
      terminal bounds, so lengthening it would move them.
    range: [0.0, 5.0]

  # ---------------------------------------------------- pin snap-barb retention
  - name: barb_d
    value: 7.6
    purpose: >
      recovered span across the barb lugs. Wider than slot_w, so the lugs cannot
      re-enter the slot and the pin cannot withdraw upward.
    range: [3.0, 16.0]
  - name: barb_arm_inner_r
    value: 1.4
    purpose: >
      inner radius of each cantilever arm. The arms stand 2.8 apart, which must
      exceed 2 x barb_deflection so they cannot bottom out during insertion.
    range: [0.3, 4.0]
  - name: barb_beam_w
    value: 2.6
    purpose: width of each cantilever arm across the slot
    range: [0.8, 5.0]
  - name: barb_lug_len
    value: 2.4
    purpose: axial length of the retaining lug below the ledge
    range: [1.0, 8.0]
  - name: barb_leadin_len
    value: 2.2
    purpose: tapered lead-in that deflects the arms on insertion
    range: [0.5, 8.0]
  - name: barb_deflection
    value: 1.30
    purpose: >
      inward deflection of each arm in the declared compressed state. Sized
      against the arm's greatest distance from the pin axis, not its flat span:
      a slot is bounded in one direction but the lug corners are not.
    range: [0.0, 5.0]
  - name: barb_gap
    value: 0.3
    purpose: >
      gap between the recovered lug shoulders and the ledge underside. The cover
      is located by the pin head on the ear, not by the barb, so this stays a
      clearance.
    range: [0.05, 2.0]

  # --------------------------------------------- integral closed-state latch
  - name: latch_y0
    value: 25.0
    purpose: >
      inboard edge of the latch beam. Well clear of the lips: at the rail the
      only space above the cover is 0.2 mm, so a latch there cannot exist.
    range: [13.0, 50.0]
  - name: latch_slot_w
    value: 1.6
    purpose: width of the two slots that free the beam from the plate
    range: [0.4, 4.0]
  - name: latch_len
    value: 24.0
    purpose: free length of the compliant latch beam, rooted at its +X end
    range: [6.0, 60.0]
  - name: latch_w
    value: 10.0
    purpose: width of the latch beam across Y
    range: [3.0, 30.0]
  - name: latch_t
    value: 2.0
    purpose: thickness of the latch beam; the compliant member
    range: [0.6, 6.0]
  - name: latch_hook_h
    value: 2.2
    purpose: >
      height the hook stands above the beam. Must exceed the keeper's downward
      projection so the hook can catch behind it.
    range: [0.6, 6.0]
  - name: latch_hook_len
    value: 3.0
    purpose: axial length of the hook
    range: [1.0, 8.0]
  - name: latch_deflection
    value: 2.4
    purpose: >
      downward deflection of the latch beam needed to clear the keeper. The
      release travel; larger than latch_hook_h so the hook fully clears.
    range: [0.2, 8.0]
  - name: keeper_x0
    value: 93.0
    purpose: >
      X of the keeper bridge. Chosen so it is always over the cover - at full
      open the cover reaches x = 103 - and therefore never obstructs the open
      aperture.
    range: [20.0, 380.0]
  - name: keeper_len
    value: 3.0
    purpose: axial length of the keeper rib
    range: [1.0, 10.0]
  - name: keeper_z1
    value: 47.0
    purpose: top of the keeper bridge
    range: [45.5, 60.0]

  # --------------------------------------------------------------- evaluation
  - name: contact_tol
    value: 0.02
    purpose: >
      evaluation tolerance for declared contact. An evaluation tolerance, never a
      material allowance.
    range: [0.001, 0.02]
  - name: overlap_tol_mm3
    value: 1.0e-6
    purpose: volume below which a boolean common is numerical noise
    range: [1.0e-9, 1.0e-4]

materials:
  BODY-ENCLOSURE: GENERIC_RIGID_POLYMER
  BODY-COVER: GENERIC_COMPLIANT_POLYMER
  BODY-PIN: GENERIC_COMPLIANT_POLYMER
