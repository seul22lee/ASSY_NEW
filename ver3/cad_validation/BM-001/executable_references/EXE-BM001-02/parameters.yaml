reference_id: EXE-BM001-02
units: mm
schema_version: 0.4.0

concept:
  name: integrated snap-rail captive sliding cover
  bodies: [BODY-ENCLOSURE, BODY-COVER]
  one_line: >
    Two captive C-section rails do the whole retention job - ledge supports,
    guide wall locates, retaining lip holds down - and the cover snaps into them
    on four integral tabs. A second integral snap, a finger at the cover's
    exposed end, holds it shut.
  supersedes: >
    two earlier topologies for this reference, both rejected. The history is in
    DESIGN_AND_OPERATION_RATIONALE.md; nothing about them survives in the
    geometry or in this file.
  what_each_feature_does:
    rail ledge: carries the cover vertically
    rail guide wall: locates the cover laterally, running on the tab tips
    rail retaining lip: overhangs the tabs, so ordinary lift is blocked
    cover retention tabs: deflect to enter, recover under the lips
    rail fill at x < rail_x0: the open terminal bound
    far end wall inner face: the closed terminal bound
    latch finger, tooth and ramp: closed-state translation block and release

frame:
  description: >
    Origin at the enclosure's minimum outer corner. X is length and the slide
    axis, Y is depth, Z is up. The cover opens toward -X.

note_on_absolute_size: >
  UNR-BM-001-003 leaves every absolute dimension open. None of these numbers is
  a requirement; each is a declared design choice.

parameters:

  # ---------------------------------------------------------------- enclosure
  - name: box_x
    value: 190.0
    purpose: enclosure outer length
    range: [80.0, 400.0]
  - name: box_y
    value: 70.0
    purpose: enclosure outer depth
    range: [40.0, 200.0]
  - name: box_z
    value: 40.0
    purpose: height of the ledge top faces, the plane the cover slides on
    range: [20.0, 150.0]
  - name: wall
    value: 3.0
    purpose: uniform wall and floor thickness; also the guide wall inner face
    range: [1.5, 10.0]
  - name: far_wall_x
    value: 187.0
    purpose: >
      inner face of the far end wall. The cover's +X face lands on it, so this
      face is the closed terminal bound.
    range: [40.0, 380.0]

  # ------------------------------------------------------- deck and aperture
  - name: deck_x1
    value: 97.0
    purpose: >
      the solid top panel runs from the near wall to here; beyond it is the
      aperture. A sliding cover has to park somewhere and this is that surface.
    range: [20.0, 320.0]
  - name: deck_z0
    value: 34.0
    purpose: underside of the top panel
    range: [10.0, 39.0]
  - name: deck_gap
    value: 0.4
    purpose: >
      how far the top panel is held below the ledge tops. The ledges alone carry
      the cover; the panel is a surface to park over, not a bearing.
    range: [0.1, 3.0]

  # --------------------------------------------------------------- the rails
  - name: ledge_y
    value: 13.0
    purpose: >
      inboard edge of each ledge. The aperture between them is y = ledge_y to
      box_y - ledge_y.
    range: [6.0, 30.0]
  - name: ledge_z0
    value: 34.0
    purpose: underside of the ledges
    range: [10.0, 39.0]
  - name: lip_overhang
    value: 2.2
    purpose: >
      how far each retaining lip reaches inboard from the guide wall. This is
      what the retention tabs hide under, so it is the anti-lift engagement.
    range: [0.8, 8.0]
  - name: lip_z0
    value: 45.4
    purpose: >
      underside of the lips: the cover top plus running clearance. The tab
      shoulders bear on this face when the cover is lifted.
    range: [41.0, 60.0]
  - name: lip_z1
    value: 48.4
    purpose: top of the lips and of the guide walls
    range: [42.0, 70.0]
  - name: rail_x0
    value: 13.0
    purpose: >
      where the rails begin. -X of it the rail band is solid to the lip top, and
      that face is the open terminal bound. The lips run from here to
      far_wall_x, which is the whole operating interval and then some.
    range: [3.0, 100.0]
  - name: guide_gap
    value: 0.2
    purpose: running clearance between each tab tip and its guide wall
    range: [0.05, 1.0]
  - name: plate_gap
    value: 0.3
    purpose: >
      clearance between the cover plate edge and the lip inner edge. It is what
      lets the plate be pressed straight down between the lips.
    range: [0.05, 2.0]

  # ----------------------------------------------------------------- closure
  - name: cover_len
    value: 90.0
    purpose: cover length; equal to the aperture length
    range: [30.0, 350.0]
  - name: cover_t
    value: 5.0
    purpose: cover thickness
    range: [2.0, 15.0]
  - name: travel
    value: 84.0
    purpose: >
      slide from closed to open. 84 of a 90 mm aperture, approved by
      HCR-BM001-003 and not narrowed since.
    range: [10.0, 350.0]

  # -------------------------------------------------- integral retention tabs
  - name: tab_a_offset
    value: 10.0
    purpose: cover-local X of the trailing tab pair
    range: [2.0, 120.0]
  - name: tab_b_offset
    value: 62.0
    purpose: >
      cover-local X of the leading tab pair. Spaced far from tab A on purpose:
      two tabs a side that sat together would let the cover pitch out.
    range: [2.0, 300.0]
  - name: tab_len
    value: 20.0
    purpose: free length of each cantilever tab beam, rooted at its +X end
    range: [5.0, 60.0]
  - name: tab_beam_w
    value: 3.0
    purpose: width of the tab beam across Y
    range: [1.0, 10.0]
  - name: tab_ear_len
    value: 6.0
    purpose: axial length of the ear that reaches under the lip
    range: [1.5, 20.0]
  - name: tab_slot_w
    value: 2.4
    purpose: >
      width of the slot that frees each beam from the plate. It must exceed
      tab_deflection, or the beam would have nowhere to deflect into and the
      compressed configuration would eat plate material instead of moving.
    range: [0.4, 4.0]
  - name: tab_deflection
    value: 2.2
    purpose: >
      inward deflection of each tab in the declared compressed state. It must
      carry the ear tip inboard of the lip inner edge, which is lip_overhang
      minus guide_gap plus the pass clearance.
    range: [0.0, 8.0]

  # ----------------------------------------------- integral closed-state latch
  # It sits over the NEAR RAIL, not on the centreline. A finger on the centreline
  # retracts into the aperture at full open and stands in the way of the 84 mm
  # the design promises; out here it retracts over the ledge instead.
  - name: latch_y0
    value: 6.0
    purpose: outboard edge of the latch finger, in the near rail channel
    range: [3.5, 40.0]
  - name: latch_w
    value: 6.0
    purpose: width of the latch finger across Y
    range: [2.0, 20.0]
  - name: latch_lug_w
    value: 2.6
    purpose: >
      how far the tooth projects outboard from the finger. Minus the slot
      clearance this is the width of the face that blocks opening, so it is the
      latch engagement.
    range: [0.6, 8.0]
  - name: latch_slot_gap
    value: 0.4
    purpose: >
      clearance between the finger and the outboard edge of its slot. It sets
      how much of the tooth stands behind solid wall.
    range: [0.05, 2.0]
  - name: latch_free_play
    value: 0.6
    purpose: >
      gap between the tooth's blocking face and the end wall's outer face when
      closed. The cover moves this far before the latch bites; reported as
      measured rather than rounded to zero.
    range: [0.05, 3.0]
  - name: latch_tooth_len
    value: 3.9
    purpose: axial length of the tooth, lead-in ramp included
    range: [1.0, 12.0]
  - name: latch_ramp_run
    value: 0.8
    purpose: >
      flat length at the tooth's outboard edge before the lead-in ramp starts.
      The ramp runs from there to the tooth's +X end.
    range: [0.0, 6.0]
  - name: latch_pad_len
    value: 6.5
    purpose: >
      length of the release pad beyond the tooth: the part standing outside the
      product that the user pushes.
    range: [2.0, 25.0]
  - name: latch_shift
    value: 2.6
    purpose: >
      inboard deflection of the finger in the declared released configuration.
      Larger than the engagement so the tooth fully clears the keeper strip.
    range: [0.2, 10.0]
  - name: latch_hold_travel
    value: 8.0
    purpose: >
      how far the cover must move with the finger still deflected before the
      tooth is clear of the end wall. Below this the finger cannot be let go.
    range: [0.5, 40.0]

  # --------------------------------------------------------------- evaluation
  - name: contact_tol
    value: 0.02
    purpose: evaluation tolerance for declared contact; never a material allowance
    range: [0.001, 0.02]
  - name: overlap_tol_mm3
    value: 1.0e-6
    purpose: volume below which a boolean common is numerical noise
    range: [1.0e-9, 1.0e-4]

materials:
  BODY-ENCLOSURE: GENERIC_RIGID_POLYMER
  BODY-COVER: GENERIC_COMPLIANT_POLYMER

compliant_regions:
  - id: REG-COVER-RETAIN-LEFT-COMPLIANT
    body: BODY-COVER
    members: [FEA-C-TAB-L1-BEAM, FEA-C-TAB-L1-EAR, FEA-C-TAB-L2-BEAM, FEA-C-TAB-L2-EAR]
    deflection_mm: 2.2
    direction: inboard, +Y
    active_only_during: [ASM-02, declared service disassembly]
  - id: REG-COVER-RETAIN-RIGHT-COMPLIANT
    body: BODY-COVER
    members: [FEA-C-TAB-R1-BEAM, FEA-C-TAB-R1-EAR, FEA-C-TAB-R2-BEAM, FEA-C-TAB-R2-EAR]
    deflection_mm: 2.2
    direction: inboard, -Y
    active_only_during: [ASM-02, declared service disassembly]
  - id: REG-COVER-LATCH-COMPLIANT
    body: BODY-COVER
    members: [FEA-C-LATCH-FINGER, FEA-C-LATCH-TOOTH, FEA-C-LATCH-RAMP, FEA-C-RELEASE-PAD]
    deflection_mm: 2.6
    direction: inboard, +Y
    active_only_during: [release, the first latch_hold_travel of opening, closing lead-in]

modelling_statement: >
  Every compliant configuration is a rigid translation of a declared region.
  That is a DECLARED_KINEMATIC_APPROXIMATION: it conserves volume exactly and
  tests geometric passage and engagement. It does not model continuum
  deformation and predicts nothing about strain.
