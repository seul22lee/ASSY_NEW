reference_id: EXE-BM001-01
schema_version: 0.1.0
units: mm

principle: >
  Every step is a straight-line insertion of one rigid body along a stated
  direction. No step requires a body to deform, and no step requires any body to
  pass through the material of another. validate.py samples each insertion path
  and reports the boolean common volume at every sample.

steps:
  - id: ASM-01
    place: BODY-ENCLOSURE
    kind: base
    note: fixed reference body; nothing is inserted.
  - id: ASM-02
    place: BODY-CLOSURE
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 40.0
    note: >
      Lowered vertically onto the enclosure in the closed orientation. The
      closure knuckle segments occupy the axial gaps between the enclosure
      segments and never share an X band with them, so nothing has to be sprung
      apart. FEA-C-RELIEF keeps the plate clear of the enclosure knuckles.
    ends_in_contact_with:
      - {body: BODY-ENCLOSURE, interaction: INT-07}
      - {body: BODY-ENCLOSURE, interaction: INT-13}
  - id: ASM-03
    place: BODY-PIN
    kind: insertion
    direction: [1.0, 0.0, 0.0]
    approach_distance: 30.0
    configuration_during_step: CFG-PIN-COMPRESSED
    configuration_after_step: CFG-PIN-RELAXED
    compliant_region: REG-P-SNAP-COMPLIANT
    steps:
      - 1. align the enclosure and closure knuckles so all five bores are coaxial
      - 2. orient the pin with its lead-in leading and its arms across the slot plane
      - 3. insert the barb end into the first bore
      - 4. compress ONLY REG-P-SNAP-COMPLIANT; the lead-in taper does the work
      - 5. pass the compressed arms through the final bore
      - 6. recover the lugs beyond FEA-E-FARFACE
      - 7. seat FEA-P-SHOULDER in FEA-E-CBORE
    note: >
      The shaft is a slip fit throughout. The arms are deflected only while the
      lugs are inside a bore, and they recover as soon as the last one clears.
      Step 5 is a DECLARED compliant passage (INT-17), not undeclared rigid
      penetration: validate.py sweeps the compressed configuration along this path
      and requires zero common volume against every placed body, so the passage is
      measured rather than assumed.
    ends_in_contact_with:
      - {body: BODY-ENCLOSURE, interaction: INT-06}
    ends_retained_by:
      - {body: BODY-ENCLOSURE, interaction: INT-16, direction: toward the head}
      - {body: BODY-ENCLOSURE, interaction: INT-06, direction: toward the barb}
    reversibility: >
      Withdrawal requires deliberate re-compression of both arms from the far
      side. It is not a slip fit any more, which is the point of the correction.
      The force needed is NOT_VERIFIED.
  - id: ASM-04
    place: BODY-BOLT
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 30.0
    note: >
      Dropped through FEA-C-GUIDE into FEA-E-SOCKET until FEA-B-END seats on the
      socket floor. This step requires the closure already in place and closed.
    ends_in_contact_with:
      - {body: BODY-ENCLOSURE, interaction: INT-12}

disassembly: >
  The reverse order is available for BODY-CLOSURE and BODY-BOLT and uses the same
  paths. BODY-PIN is different after this revision: removing it requires
  compressing REG-P-SNAP-COMPLIANT from the far side, which is a deliberate act
  rather than a pull. No body is permanently joined, and no step consumes
  material.

not_established_here: >
  Insertion FORCE, ease of assembly and process suitability. REQ-007 asks for a
  product that is easy to assemble; what is shown here is that an assembly
  ordering exists and is geometrically unobstructed. Ease is an effort claim and
  remains NOT_VERIFIED (UNR-BM-001-009).
