reference_id: EXE-BM001-01
schema_version: 0.1.0
units: mm

principle: >
  Every step is a straight-line insertion of one rigid body along a stated
  direction. No step requires a body to deform, and no step requires any body to
  pass through the material of another. validate.py samples each insertion path
  and reports the boolean common volume at every sample.

steps:
  - id: ASM-01
    place: BODY-ENCLOSURE
    kind: base
    note: fixed reference body; nothing is inserted.
  - id: ASM-02
    place: BODY-CLOSURE
    kind: insertion
    direction: [0.0, 0.0, -1.0]
    approach_distance: 40.0
    note: >
      Lowered vertically onto the enclosure in the closed orientation. The
      closure knuckle segments occupy the axial gaps between the enclosure
      segments and never share an X band with them, so nothing has to be sprung
      apart. FEA-C-RELIEF keeps the plate clear of the enclosure knuckles.

      Lowering the closure in the closed orientation also takes the latch tooth
      straight past the keeper, so REG-CLOSURE-LATCH-COMPLIANT is deflected for
      this step exactly as it is when the lid is pushed shut in service. It
      recovers at the end of the step.
    configuration_during_step: REG-CLOSURE-LATCH-COMPLIANT deflected 2.4 mm along -Y
    configuration_after_step: relaxed
    compliant_region: REG-CLOSURE-LATCH-COMPLIANT
    ends_in_contact_with:
      - {body: BODY-ENCLOSURE, interaction: INT-07}
    ends_retained_by:
      - {body: BODY-ENCLOSURE, interaction: INT-10, direction: opening rotation,
         what: closed-state rotation block}
  - id: ASM-04
    place: BODY-CLOSURE
    kind: operation
    note: >
      Rotate the lid toward CLOSED. Nothing is inserted here - the latch is part
      of the closure and the keeper is part of the enclosure, so closing the lid
      is the whole of it.
    steps:
      - 1. rotate the lid down about AX-CLOSURE
      - 2. the keeper's top corner reaches FEA-C-LATCH-RAMP
      - 3. the ramp drives REG-CLOSURE-LATCH-COMPLIANT outward 2.4 mm
      - 4. FEA-C-LATCH-TOOTH passes the keeper
      - 5. the beam recovers on its own
      - 6. FEA-C-LATCH-SHOULDER comes to rest 0.4 mm under FEA-E-KEEPER
      - 7. CLOSED_LATCH_ENGAGED is established
    ends_retained_by:
      - {body: BODY-ENCLOSURE, interaction: INT-10, direction: opening rotation,
         what: closed-state rotation block}
    note_on_the_user: >
      There is no bolt to push back. The user pushes the lid shut and the latch
      does the rest.

disassembly: >
  The reverse order is available for BODY-CLOSURE and uses the same
  paths. BODY-PIN is different after this revision: removing it requires
  compressing REG-P-SNAP-COMPLIANT from the far side, which is a deliberate act
  rather than a pull. No body is permanently joined, and no step consumes
  material.

not_established_here: >
  Insertion FORCE, ease of assembly and process suitability. REQ-007 asks for a
  product that is easy to assemble; what is shown here is that an assembly
  ordering exists and is geometrically unobstructed. Ease is an effort claim and
  remains NOT_VERIFIED (UNR-BM-001-009).
