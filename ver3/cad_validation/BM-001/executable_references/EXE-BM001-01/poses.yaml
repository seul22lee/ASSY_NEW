reference_id: EXE-BM001-01
schema_version: 0.1.0
units: mm
angle_units: degrees

frame: >
  Enclosure-fixed. Origin at the enclosure's minimum outer corner. Transforms
  are applied to a body's as-built shape; the as-built shape of every body is
  its CLOSED_LATCH_ENGAGED pose.

pin_configuration:
  every_operating_state: CFG-PIN-RELAXED
  assembly_only: CFG-PIN-COMPRESSED
  note: >
    The compressed configuration is never an operating state. It exists only
    inside ASM-03 and is never exported, so no state transform below refers to
    it. BODY-PIN is stationary in every state; it is the axis, not a mover.

axis:
  id: AX-CLOSURE
  type: revolute
  point: [0.0, 84.0, 50.0]
  direction: [1.0, 0.0, 0.0]
  sense: >
    Opening is a rotation of -open_angle_deg about +X, which lifts the front of
    the closure. Reported angles are positive in the opening sense.

states:
  - id: CLOSED_LATCH_ENGAGED
    what: lid seated, latch tooth recovered behind the keeper
    lid_angle_deg: 0.0
    latch: relaxed
    pin: relaxed
  - id: CLOSED_LATCH_RELEASED
    what: the user has deflected the exterior latch beam outward; the tooth is clear
    lid_angle_deg: 0.0
    latch: deflected 2.4 mm along -Y
    pin: relaxed
  - id: OPENING_STARTED
    what: >
      the lid has begun to rotate. The tooth is above the keeper, so the beam has
      already sprung back on its own.
    lid_angle_deg: 6.0
    latch: relaxed
    pin: relaxed
  - id: OPEN
    what: terminal open pose, stop block on the rear wall
    lid_angle_deg: 110.0
    latch: relaxed
    pin: relaxed
  - id: CLOSING_LATCH_LEADIN
    what: >
      coming down, the keeper's top corner is riding the tooth's lead-in ramp and
      holding the beam out. The user is doing nothing.
    lid_angle_deg: 0.0
    latch: deflected 2.4 mm along -Y
    pin: relaxed
  - id: CLOSED_REENGAGED
    what: >
      the tooth is past the keeper and the beam has recovered. Identical to
      CLOSED_LATCH_ENGAGED, which is the point: the cycle returns what it started
      with, and the user pushes nothing back into place.
    lid_angle_deg: 0.0
    latch: relaxed
    pin: relaxed
  - id: PIN_ASSEMBLY_COMPRESSED
    what: >
      the declared compressed configuration of REG-P-SNAP-COMPLIANT, during pin
      insertion. Never an operating state.
    lid_angle_deg: 0.0
    latch: relaxed
    pin: compressed 1.05 mm per arm
  - id: PIN_ASSEMBLY_RECOVERED
    what: the arms released; the lugs stand behind the far knuckle face
    lid_angle_deg: 0.0
    latch: relaxed
    pin: relaxed

compliant_configurations:
  - id: REG-P-SNAP-COMPLIANT
    body: BODY-PIN
    members: [FEA-P-ARM-A, FEA-P-ARM-B, FEA-P-LUG-A, FEA-P-LUG-B]
    deflection_mm: 1.05
    direction: inward, toward the pin axis
    active_only_during: [ASM-03]
  - id: REG-CLOSURE-LATCH-COMPLIANT
    body: BODY-CLOSURE
    members: [FEA-C-LATCH-BEAM, FEA-C-LATCH-TOOTH, FEA-C-LATCH-RAMP,
              FEA-C-LATCH-SHOULDER, FEA-C-RELEASE-PAD]
    deflection_mm: 2.4
    direction: outward, -Y, away from the front face
    active_only_during: [release, the first 6.2 deg of opening, the closing lead-in]

modelling_statement: >
  Both compliant configurations are rigid translations of a declared region -
  DECLARED_KINEMATIC_APPROXIMATIONs. They conserve volume exactly and test
  geometric passage and engagement. They do not model continuum deformation and
  predict nothing about strain. LATCH DEFLECTION IS A PRESCRIBED GEOMETRIC
  STATE; FORCE, STRAIN AND MATERIAL ADEQUACY ARE NOT VERIFIED.

motion_segments:
  - id: M1_RELEASE
    from: CLOSED_LATCH_ENGAGED
    to: CLOSED_LATCH_RELEASED
    moving: [REG-CLOSURE-LATCH-COMPLIANT]
    kind: prescribed deflection of a declared compliant region
    note: the lid does not move; only the latch beam does
  - id: M2_OPEN
    from: CLOSED_LATCH_RELEASED
    to: OPEN
    moving: [BODY-CLOSURE]
    kind: rotation about AX-CLOSURE, 0 to 110 degrees
    note: >
      the beam is held out for the first 6.2 deg, until the tooth is above the
      keeper, and springs back after that without the user doing anything
  - id: M3_CLOSE_AND_REENGAGE
    from: OPEN
    to: CLOSED_REENGAGED
    moving: [BODY-CLOSURE]
    kind: rotation about AX-CLOSURE, 110 to 0 degrees
    note: >
      the lead-in ramp deflects the beam over the same 6.2 deg band on the way
      down and it recovers on its own once the tooth is past the keeper

removal_probes:
  - what: opening rotation attempted with the latch engaged
    expected: blocked; free play 0.25 to 0.30 deg, then solid keeper
  - what: opening rotation attempted with the latch released
    expected: free throughout 0 to 110 deg
