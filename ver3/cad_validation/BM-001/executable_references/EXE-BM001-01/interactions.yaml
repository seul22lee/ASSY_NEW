reference_id: EXE-BM001-01
schema_version: 0.1.0
units: mm

rule: >
  The prohibition is undeclared volumetric overlap, not positive clearance
  everywhere. Two bodies may touch wherever this file says they touch. Any pair
  whose boolean common volume exceeds overlap_tol_mm3 anywhere, in any state or
  at any sampled point of any motion, is a failure regardless of what is
  declared here.

evaluation_tolerance:
  contact_tol_mm: 0.02
  overlap_tol_mm3: 1.0e-6
  basis: >
    min(0.02, 1% of the smallest local feature dimension). The smallest feature
    at any declared contact is the 4 mm plate, whose 1% is 0.04, so 0.02
    governs. This is an evaluation tolerance and never a material allowance.

interactions:

  - id: INT-01
    bodies: [BODY-PIN, BODY-ENCLOSURE]
    features: [FEA-P-SHAFT, FEA-E-BORE]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.1
    active: ALL_STATES
    role: >
      Running fit realizing the rotation axis on the enclosure side. A clearance
      rather than an interference so that the joint does not depend on material
      behaviour.

  - id: INT-04
    bodies: [BODY-PIN, BODY-CLOSURE]
    features: [FEA-P-SHAFT, FEA-C-BORE]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.1
    active: ALL_STATES
    role: Running fit realizing the rotation axis on the closure side.

  - id: INT-06
    bodies: [BODY-PIN, BODY-ENCLOSURE]
    features: [FEA-P-SHOULDER, FEA-E-CBORE]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: ALL_STATES
    role: >
      Blocks pin travel toward the barb end. One half of the bilateral axial
      retention; the other half is INT-16.

  - id: INT-16
    bodies: [BODY-PIN, BODY-ENCLOSURE]
    features: [FEA-P-LUG-SHOULDER, FEA-E-FARFACE]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.4
    active: ALL_STATES
    role: >
      Blocks pin travel toward the head end. The recovered lug shoulders stand
      0.9 radially proud of the bore, so they cannot re-enter it; the 0.4 axial
      gap is the pin's permitted float, which is what keeps the shoulder clear of
      solid material rather than jammed against it.
      Whether the shoulder WITHSTANDS a pull-out load is a force question and is
      NOT_VERIFIED.
    determines: AXIAL_RETENTION_TOWARD_HEAD

  - id: INT-17
    bodies: [BODY-PIN, BODY-ENCLOSURE]
    features: [FEA-P-LEADIN, FEA-E-BORE]
    type: DECLARED_COMPLIANT_INTERACTION
    nominal_clearance_mm: 0.023
    active: [ASM-03]
    compliant_region: REG-P-SNAP-COMPLIANT
    deflection_mm: 0.9
    role: >
      The only declared compliant interaction in this reference, and it exists
      only during the insertion step. The lead-in taper deflects each arm inward
      by barb_deflection; the compressed envelope is then 4.154 across the arms
      against a 4.2 bore, a radial clearance of 0.023 per side.
      This is a DECLARED compliant passage, not undeclared rigid penetration: the
      arms are members of REG-P-SNAP-COMPLIANT, the deflection is stated, and
      validate.py measures the resulting envelope rather than assuming it fits.
    not_established: >
      that the material tolerates the deflection. Strain, insertion force,
      recovery force and fatigue are all NOT_VERIFIED.

  - id: INT-07
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-UNDERSIDE, FEA-E-RIM]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: [CLOSED_LATCH_ENGAGED, CLOSED_LATCH_RELEASED, CLOSING_LATCH_LEADIN,
             CLOSED_REENGAGED, PIN_ASSEMBLY_COMPRESSED, PIN_ASSEMBLY_RECOVERED]
    role: >
      The closure seats on the rim. This is the load path from closure to
      enclosure in the closed state and the reason the closed pose is definite
      rather than floating.
    separates_during: M2_OPEN

  - id: INT-08
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-KNUCKLE-1, FEA-E-KNUCKLE-1]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.4
    active: ALL_STATES
    role: >
      Axial clearance between interleaved knuckle segments. Present at every
      segment boundary; the pair is declared once because the geometry is
      identical at each.

  - id: INT-09
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-STOPFACE, FEA-E-REARFACE]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: [OPEN]
    role: >
      Terminal condition of the opening rotation. Planar face pair, a 6 mm band
      on each of two segments, so the contact is areal rather than a knife edge.
      This is the determinant of the discrete open pose.
    determines: DISCRETE_TERMINAL_POSE
    approaches_during: M2_OPEN

  # ------------------------------------------- integral exterior snap latch
  - id: INT-10
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-LATCH-SHOULDER, FEA-E-KEEPER]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.4
    active: [CLOSED_LATCH_ENGAGED, CLOSED_REENGAGED, PIN_ASSEMBLY_COMPRESSED,
             PIN_ASSEMBLY_RECOVERED]
    role: >
      the latch retaining shoulder stands 0.4 mm below the keeper's underside.
      That gap is the closed free play: the lid lifts through it and then the
      shoulder meets solid keeper. Declaring it a CONTACT would contradict the
      measurement. Whether the latch WITHSTANDS a pull is a force question and is
      NOT_VERIFIED.
    determines: CLOSED_STATE_ROTATION_BLOCK

  - id: INT-11
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-LATCH-BEAM, FEA-E-KEEPER]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.4
    active: [CLOSED_LATCH_ENGAGED, CLOSED_REENGAGED, PIN_ASSEMBLY_COMPRESSED,
             PIN_ASSEMBLY_RECOVERED]
    role: >
      running clearance between the beam and the keeper's front face. It is what
      decides how much of the tooth lies under the keeper: the tooth reaches
      2.6 mm inboard of the beam, 0.4 mm of that is this clearance, so 2.2 mm is
      engagement.

  - id: INT-12
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-LATCH-RAMP, FEA-E-KEEPER]
    type: DECLARED_COMPLIANT_INTERACTION
    active: [M1_RELEASE, M2_OPEN, M3_CLOSE_AND_REENGAGE]
    compliant_region: REG-CLOSURE-LATCH-COMPLIANT
    deflection_mm: 2.4
    role: >
      the declared compliant passage of the latch past the keeper. Closing drives
      the keeper's top corner along the tooth's lead-in ramp and deflects the beam
      outward on its own; opening needs the user to deflect it. Measured by the
      latch probe, not assumed.
    not_established: strain, release force, engagement force, holding capacity, fatigue

  - id: INT-14
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-PLATE-REAR, FEA-E-WEB]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.5
    active: [CLOSED_LATCH_ENGAGED, CLOSED_LATCH_RELEASED, CLOSING_LATCH_LEADIN,
             CLOSED_REENGAGED, PIN_ASSEMBLY_COMPRESSED, PIN_ASSEMBLY_RECOVERED]
    role: >
      Two planes of constant y, so this clearance is invariant under the
      straight-line insertion that installs the closure. It opens up under the
      rotation, because the plate rotates away from the webs.
    history: >
      This pair originally carried a cylindrical relief cut in the plate,
      concentric with the axis, at 0.2 clearance. Step 7 showed the resulting
      design could not be assembled: a concentric relief only aligns with the
      knuckle in the seated position, so no straight-line insertion existed. The
      axis was moved back to knuckle_r behind the rear face, which puts the
      knuckle envelope entirely behind that face and makes the relief
      unnecessary.

pairs_not_declared: []

undeclared_contact_policy: >
  validate.py scans all three body pairs in every state and at every sampled
  point of all three motion segments, so the declaration cannot be completed by
  omission.

no_separate_retention_part: >
  Every interaction above is between BODY-ENCLOSURE, BODY-CLOSURE and BODY-PIN.
  There is no fourth body. The pin is a hinge element - it realizes the axis and
  its own bilateral axial retention - and nothing in this reference is held shut
  by a separate part.
