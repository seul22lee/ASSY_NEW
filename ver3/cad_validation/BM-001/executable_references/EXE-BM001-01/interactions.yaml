reference_id: EXE-BM001-01
schema_version: 0.1.0
units: mm

rule: >
  The prohibition is undeclared volumetric overlap, not positive clearance
  everywhere. Two bodies may touch wherever this file says they touch. Any pair
  whose boolean common volume exceeds overlap_tol_mm3 anywhere, in any state or
  at any sampled point of any motion, is a failure regardless of what is
  declared here.

evaluation_tolerance:
  contact_tol_mm: 0.02
  overlap_tol_mm3: 1.0e-6
  basis: >
    min(0.02, 1% of the smallest local feature dimension). The smallest feature
    at any declared contact is the 4 mm plate, whose 1% is 0.04, so 0.02
    governs. This is an evaluation tolerance and never a material allowance.

interactions:

  - id: INT-01
    bodies: [BODY-PIN, BODY-ENCLOSURE]
    features: [FEA-P-SHAFT, FEA-E-BORE]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.1
    active: ALL_STATES
    role: >
      Running fit realizing the rotation axis on the enclosure side. A clearance
      rather than an interference so that the joint does not depend on material
      behaviour.

  - id: INT-04
    bodies: [BODY-PIN, BODY-CLOSURE]
    features: [FEA-P-SHAFT, FEA-C-BORE]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.1
    active: ALL_STATES
    role: Running fit realizing the rotation axis on the closure side.

  - id: INT-06
    bodies: [BODY-PIN, BODY-ENCLOSURE]
    features: [FEA-P-SHOULDER, FEA-E-CBORE]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: ALL_STATES
    role: >
      Locates the pin axially in one direction. See manifest.yaml LIM-01: the
      other direction is unretained and recorded as NOT_VERIFIED.

  - id: INT-07
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-UNDERSIDE, FEA-E-RIM]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: [S_CLOSED_RETAINED, S_CLOSED_RELEASED]
    role: >
      The closure seats on the rim. This is the load path from closure to
      enclosure in the closed state and the reason the closed pose is definite
      rather than floating.
    separates_during: M2_OPEN

  - id: INT-08
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-KNUCKLE-1, FEA-E-KNUCKLE-1]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.4
    active: ALL_STATES
    role: >
      Axial clearance between interleaved knuckle segments. Present at every
      segment boundary; the pair is declared once because the geometry is
      identical at each.

  - id: INT-09
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-STOPFACE, FEA-E-REARFACE]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: [S_OPEN]
    role: >
      Terminal condition of the opening rotation. Planar face pair, a 6 mm band
      on each of two segments, so the contact is areal rather than a knife edge.
      This is the determinant of the discrete open pose.
    determines: DISCRETE_TERMINAL_POSE
    approaches_during: M2_OPEN

  - id: INT-10
    bodies: [BODY-BOLT, BODY-CLOSURE]
    features: [FEA-B-SHAFT, FEA-C-GUIDE]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.1
    active: ALL_STATES
    role: >
      Guides the bolt along its release travel and keeps it aligned with the
      socket. Engaged over 12 mm even in the released state.

  - id: INT-11
    bodies: [BODY-BOLT, BODY-ENCLOSURE]
    features: [FEA-B-SHAFT, FEA-E-SOCKET]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.1
    active: [S_CLOSED_RETAINED]
    role: >
      The engagement that realizes retention. With the shaft spanning both the
      closure guide and the enclosure socket, the closure cannot rotate. Whether
      the engagement WITHSTANDS a given disturbance is a force question and is
      NOT_VERIFIED (UNR-BM-001-001).
    disengages_during: M1_RELEASE

  - id: INT-12
    bodies: [BODY-BOLT, BODY-ENCLOSURE]
    features: [FEA-B-END, FEA-E-SOCKET]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: [S_CLOSED_RETAINED]
    role: Seats the bolt at the bottom of its travel and defines the retained state.

  - id: INT-13
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-UNDERSIDE, FEA-E-BOLTBOSS-TOP]
    type: DECLARED_CONTACT
    nominal_clearance_mm: 0.0
    active: [S_CLOSED_RETAINED, S_CLOSED_RELEASED]
    role: >
      The retention boss is coplanar with the rim, so the closure seats on it
      too. Declared because a coplanar face pair that is not declared would be
      an undeclared contact.

  - id: INT-14
    bodies: [BODY-CLOSURE, BODY-ENCLOSURE]
    features: [FEA-C-PLATE-REAR, FEA-E-WEB]
    type: DECLARED_CLEARANCE
    nominal_clearance_mm: 0.5
    active: [S_CLOSED_RETAINED, S_CLOSED_RELEASED]
    role: >
      Two planes of constant y, so this clearance is invariant under the
      straight-line insertion that installs the closure. It opens up under the
      rotation, because the plate rotates away from the webs.
    history: >
      This pair originally carried a cylindrical relief cut in the plate,
      concentric with the axis, at 0.2 clearance. Step 7 showed the resulting
      design could not be assembled: a concentric relief only aligns with the
      knuckle in the seated position, so no straight-line insertion existed. The
      axis was moved back to knuckle_r behind the rear face, which puts the
      knuckle envelope entirely behind that face and makes the relief
      unnecessary.

  - id: INT-15
    bodies: [BODY-BOLT, BODY-CLOSURE]
    features: [FEA-B-KNOB, FEA-C-BOSS-TOP]
    type: NOT_INTENDED_TO_INTERACT
    nominal_clearance_mm: 4.0
    active: [S_CLOSED_RETAINED]
    role: >
      The gap under the knob in the retained state is finger access, not a
      bearing surface. Declared so that a reviewer can see it was considered
      rather than overlooked.

pairs_not_declared:
  - bodies: [BODY-PIN, BODY-BOLT]
    reason: >
      Geometrically remote in every state and at every sampled point of both
      motion segments. validate.py measures the pair anyway; it is listed here
      so that an unexpected approach shows up as an undeclared interaction
      rather than passing unremarked.
