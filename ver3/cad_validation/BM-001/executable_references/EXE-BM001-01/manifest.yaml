reference_id: EXE-BM001-01
schema_version: 0.1.0
title: rigid rotating closure on a realized knuckle-and-pin axis
kind: ADMISSIBLE_EXECUTABLE_REFERENCE
author_awareness: ORACLE_AWARE
is_not:
  - a source-only Demonstration
  - evidence that the source alone leads here
  - evidence that the design satisfies the rank-1 source
maps_to_semantic_fixture: ADM-BM-001-E
mapping_fidelity: CLOSE
units: mm

bodies:
  - id: BODY-ENCLOSURE
    name: enclosure
    material_class: GENERIC_RIGID_POLYMER
    installed_as: DISCRETE
    role: >
      Fixed reference body. Carries the cavity, the rim the closure seats on,
      three knuckle segments with their webs, and the retention socket.
    features:
      - {id: FEA-E-RIM, what: rim plane at z = box_z that the closure seats on}
      - {id: FEA-E-CAVITY, what: internal cavity opening upward through the rim plane}
      - {id: FEA-E-KNUCKLE-1, what: outermost knuckle segment, counterbored to seat the pin head}
      - {id: FEA-E-KNUCKLE-2, what: centre knuckle segment}
      - {id: FEA-E-KNUCKLE-3, what: far outermost knuckle segment}
      - {id: FEA-E-BORE, what: knuckle bore, diameter bore_d, coaxial with the closure axis}
      - {id: FEA-E-CBORE, what: counterbore in FEA-E-KNUCKLE-1 seating the pin head}
      - {id: FEA-E-FARFACE, what: far face of FEA-E-KNUCKLE-3; the recovered lug shoulders bear on it}
      - {id: FEA-E-REARFACE, what: rear outer face at y = box_y; the surface the stop block bears on}
      - {id: FEA-E-WEB, what: front faces of the knuckle webs, web_gap behind the rear outer face}
      - {id: FEA-E-SOCKET, what: blind retention socket, floor at socket_z}
      - {id: FEA-E-BOLTBOSS-TOP, what: top of the retention boss, coplanar with the rim}
  - id: BODY-CLOSURE
    name: closure
    material_class: GENERIC_RIGID_POLYMER
    installed_as: DISCRETE
    role: >
      Movable body. Plate covering the cavity, web joining plate to knuckles,
      two knuckle segments interleaved with the enclosure's three, a guide boss
      for the retention bolt, and the stop block that terminates opening.
    features:
      - {id: FEA-C-UNDERSIDE, what: plate underside at z = box_z; seats on FEA-E-RIM}
      - {id: FEA-C-KNUCKLE-1, what: first closure knuckle segment}
      - {id: FEA-C-KNUCKLE-2, what: second closure knuckle segment}
      - {id: FEA-C-BORE, what: knuckle bore, diameter bore_d, coaxial with the closure axis}
      - {id: FEA-C-PLATE-REAR, what: plate rear face, a plane of constant y at plate_rear_y}
      - {id: FEA-C-STOPFACE, what: planar stop face; coincident with FEA-E-REARFACE at the terminal open angle}
      - {id: FEA-C-GUIDE, what: through guide bore for the retention bolt}
      - {id: FEA-C-BOSS-TOP, what: top of the guide boss}
  - id: BODY-PIN
    name: axis pin
    material_class: GENERIC_COMPLIANT_POLYMER
    installed_as: DISCRETE_SNAP_IN
    role: >
      Realizes the rotation axis AND its own bilateral axial retention. Slip fit
      in every bore; the head seats in FEA-E-CBORE and blocks travel toward the
      barb end, and the recovered lug shoulders bear on FEA-E-FARFACE and block
      travel toward the head end.
    material_model:
      kinematically_rigid: [FEA-P-SHAFT, FEA-P-HEAD, FEA-P-SHOULDER]
      declared_compliant_region: REG-P-SNAP-COMPLIANT
      compliant_members: [FEA-P-ARM-A, FEA-P-ARM-B, FEA-P-LUG-A, FEA-P-LUG-B]
      statement: >
        The pin is compliant polymer, but only REG-P-SNAP-COMPLIANT is treated as
        deformable and only during ASM-03. Everywhere else, and in every operating
        state, the pin is used as a rigid guide. The whole pin is NOT claimed to
        undergo arbitrary deformation.
      why_not_rigid_metal: >
        A rigid metal pin cannot elastically snap. Declaring the pin metal while
        asking it to deflect past a bore would be a contradiction between the
        material model and the assembly process, so the material class follows the
        function.
    configurations:
      - {id: CFG-PIN-RELAXED, what: as-built; used in every operating state}
      - {id: CFG-PIN-COMPRESSED, what: arms deflected inward; ASSEMBLY ONLY, never exported}
    features:
      - {id: FEA-P-SHAFT, what: shaft, diameter pin_d; the kinematic guide}
      - {id: FEA-P-HEAD, what: head, diameter pin_head_d}
      - {id: FEA-P-SHOULDER, what: annular face between head and shaft; bears on the counterbore floor}
      - {id: FEA-P-ARM-A, what: first cantilever snap arm, barb_beam_t thick and barb_beam_w wide}
      - {id: FEA-P-ARM-B, what: second cantilever snap arm, diametrically opposite}
      - {id: FEA-P-LUG-A, what: retaining lug on FEA-P-ARM-A, spanning to barb_d}
      - {id: FEA-P-LUG-B, what: retaining lug on FEA-P-ARM-B}
      - {id: FEA-P-LUG-SHOULDER, what: rear faces of both lugs; bear on FEA-E-FARFACE and block reverse extraction}
      - {id: FEA-P-LEADIN, what: tapered lead-in on both lugs; deflects the arms on insertion}
    requested_id_mapping:
      note: >
        The review request named these FEATURE-PIN-*/REGION-PIN-*. This file keeps
        the repository's existing FEA-*/REG-* convention; the mapping is one to one.
      FEATURE-PIN-SHAFT: FEA-P-SHAFT
      FEATURE-PIN-HEAD: FEA-P-HEAD
      FEATURE-PIN-SNAP-ARM-A: FEA-P-ARM-A
      FEATURE-PIN-SNAP-ARM-B: FEA-P-ARM-B
      FEATURE-PIN-LUG-A: FEA-P-LUG-A
      FEATURE-PIN-LUG-B: FEA-P-LUG-B
      REGION-PIN-SNAP-COMPLIANT: REG-P-SNAP-COMPLIANT
  - id: BODY-BOLT
    name: retention bolt
    material_class: GENERIC_RIGID_POLYMER
    installed_as: DISCRETE
    role: >
      Realizes retention and its release action. In the retained state it spans
      the guide bore and the enclosure socket; lifting it clears the enclosure.
    features:
      - {id: FEA-B-SHAFT, what: shaft, diameter bolt_d}
      - {id: FEA-B-END, what: lower end face; seats on the socket floor when retained}
      - {id: FEA-B-KNOB, what: knob; the surface the user acts on}

known_limitations:
  - id: LIM-01
    what: The pin was located axially in one direction only.
    status: CORRECTED
    corrected_by: HCR-BM001-002
    how: >
      Two integral cantilever snap arms were added at the far end. FEA-P-SHOULDER
      still blocks travel toward the barb; FEA-P-LUG-SHOULDER now blocks travel
      toward the head. Retention is bilateral and both directions are geometric.
    what_this_cost: >
      The reference selection originally avoided compliant features so the model
      would not depend on material behaviour. That avoidance is now partly given
      up: the pin is compliant polymer and its assembly needs a real deflection.
      The consequence is recorded rather than hidden - every force, strain and
      life question about the snap is NOT_VERIFIED.
  - id: LIM-03
    what: >
      The compressed configuration is a kinematic approximation, not a continuum
      deformation, and it is 4.08 mm^3 (0.38%) smaller than the relaxed one.
    status: DECLARED_MODELLING_APPROXIMATION
    why: >
      The arms are rotated about their roots, which opens a small wedge. The
      compressed configuration exists to test geometric passage through the bore,
      not to predict strain or to conserve volume exactly. Exact volume
      conservation between the two configurations is NOT claimed.
  - id: LIM-02
    what: The retention bolt is fully removable upward.
    status: DECLARED_DESIGN_CHOICE
    why: >
      The source requires retention and a release action, not captivity. In the
      released state the shaft still spans 12 mm of the guide bore, so the
      operating motion is guided; complete removal is a further, permitted act.
