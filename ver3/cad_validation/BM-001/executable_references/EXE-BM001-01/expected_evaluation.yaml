revision:
  driver: HCR-BM001-002 (human review rejected the one-direction pin retention)
  what_changed: the hinge pin only
  previous_geometry_signature: 5586b96cc2e92e113a87ecb7180e8f8e2a3f820585c2a9d75fa6c8fdb13f2ee8
  revised_geometry_signature: f2bc9599cdd6832dcb52ea0f24645b6cf6c374308324320b08d93f7f6e8d8967
  change_reason: bilateral snap-barb axial retention
  what_did_not_change: >
    enclosure, closure, retention bolt, approved rear stop arm, open-state
    determinant and the 110 degree motion range are untouched. BODY-PIN's volume
    moved from 1050.234 to 1049.762, which is why the signature moved.
  errors_found_during_the_revision:
    - id: REV-01
      what: a full-diameter cone split by one slot was tried first
      measured: compressed extent 5.09 x 5.58 mm against a 4.2 mm bore
      why_it_failed: >
        splitting a cone compresses it only across the slot; perpendicular to the
        slot its extent is unchanged, so it cannot enter a round bore at all
    - id: REV-02
      what: the compressed envelope was first measured as a bounding box
      why_it_failed: >
        a bore is round, so what constrains passage is the greatest distance from
        the axis. The flat span fitted while the diagonal did not, and the check
        passed geometry that fouls. The measurement is now the circumscribed
        diameter.
    - id: REV-03
      what: the arms were first deflected by rotating them about their roots
      why_it_failed: >
        rotation swings the far end across the axis and out the other side, so the
        envelope GREW with deflection, and it did not conserve volume. A rigid
        inward translation does both correctly.
    - id: REV-04
      what: rectangular arm sections fouled the bore even after the lug was sized
      measured: beam corners at radius 2.33 against a 2.1 bore radius
      how_fixed: >
        the beam is now clipped to the shaft radius and only the lug reaches the
        retaining radius

status: >
  This file records what the reference EXPECTS the Oracle to conclude, written
  before the predicate evaluator ran and left unchanged afterwards where it was
  right. It exists so that a surprising result is visible as a surprise rather
  than being absorbed silently.

expectation_source: BM-001/reviews/REFERENCE_SELECTION.yaml, frozen before geometry

expected_and_observed:
  - invariant: NRM-BM-001-001
    expected: PASS
    observed: PASS
  - invariant: NRM-BM-001-002
    expected: PASS
    observed: PASS
    note: >
      Gained two clauses at this revision. The connection is now retained rather
      than merely assembled - axial travel is blocked in both directions by
      realized geometry - and the declared compliant passage is measured rather
      than assumed. Pull-out capacity remains NOT_VERIFIED.
  - invariant: NRM-BM-001-003
    expected: PASS
    observed: PASS
  - invariant: NRM-BM-001-004
    expected: PASS
    observed: PASS
  - invariant: NRM-BM-001-005
    expected: PASS
    observed: PASS
  - invariant: NRM-BM-001-006
    expected: PASS for engagement and release; holding force NOT_VERIFIED
    observed: NOT_EVALUABLE
    divergence: true
    reading: >
      The frozen selection expected the geometric clauses to carry the invariant.
      They do not. The first clause asks whether retention holds against the
      disturbance THE DESIGN DECLARES, and this design declares none, so the
      predicate has nothing to apply rather than something it cannot measure.
      That is NOT_EVALUABLE with reason REPRESENTATION_INCOMPLETE, not
      NOT_VERIFIED. The distinction matters: NOT_VERIFIED would say the evidence
      is missing, while what is actually missing is the declaration. Blocked on
      UNR-BM-001-001.
  - invariant: NRM-BM-001-007
    expected: PASS geometrically; durability NOT_VERIFIED
    observed: PASS with the durability clause NOT_VERIFIED
  - invariant: NRM-BM-001-008
    expected: PASS
    observed: PASS
  - invariant: NRM-BM-001-009
    expected: PASS
    observed: PASS
  - invariant: NRM-BM-001-010
    expected: PASS
    observed: PASS
    note: >
      Passed only after the axis was moved. As first parameterized the design
      could not be assembled at all; see interactions.yaml INT-14 history.
  - invariant: NRM-BM-001-011
    expected: PASS for existence; adequacy NOT_VERIFIED
    observed: PASS with the adequacy clause NOT_VERIFIED
  - invariant: NRM-BM-001-012
    expected: >
      PASS only if the determinant is shown to CAUSE the termination rather than
      merely to exist
    observed: PASS
    how: >
      HSD-006 branch A. Common volume is zero at every probed angle up to and
      including 110.00 deg and positive at every angle beyond it, so the stop
      face is what ends the rotation.
  - invariant: NRM-BM-001-013
    expected: PASS vacuously - no force window is cited
    observed: PASS
    how: keyword scan over the five authored contract files returned zero hits

oracle_counterexample_candidates: []

no_oracle_file_was_modified: true
weakening_check: >
  No CAD was weakened to obtain a PASS. One geometric change was made during
  validation - axis_y 84.0 to 86.0 - and it was made because step 7 proved the
  design could not be assembled, which is a defect in the CAD. The change made
  the model harder to satisfy, not easier: it removed a clearance feature and
  left the plate to clear the knuckle on its own.

# ---------------------------------------------- second revision: the snap latch
latch_revision:
  driver: [HCR-BM001-008, HCR-BM001-009, HCR-BM001-010]
  what_changed: >
    BODY-BOLT, its knob and shaft, the closure guide boss and the enclosure
    socket were removed. BODY-CLOSURE gained an integral exterior snap latch -
    release pad, compliant cantilever beam, lead-in ramp, tooth and retaining
    shoulder - and BODY-ENCLOSURE gained a keeper rib on its front face. The
    product went from four bodies to three.
  what_did_not_change: >
    BODY-PIN. Its sub-signature over volume, area, centre of mass and bounding
    box is identical before and after (f5c3ec81480611b3), so the accepted
    head-plus-snap-barb hinge is carried through untouched, not rebuilt.
  geometry_signature:
    before: f2bc9599cdd6832dcb52ea0f24645b6cf6c374308324320b08d93f7f6e8d8967
    after: 97613a0815b794fb14a92364a7f8d7ac70c4d4c34b10ace6eb26b1aba7aba109
  measured:
    engaged_free_play_deg: 0.2570
    engaged_free_play_source: the 0.4 mm gap between the shoulder and the keeper underside
    blocking_onset_method: coarse ladder then 14 bisections
    engagement_mm: 2.2
    release_deflection_mm: 2.4
    release_direction: -Y, the exterior beam pulled outward
    tooth_under_keeper_mm3: {engaged: 113.62, released: 0.0}
    released_opening: free at every probed angle to 110 deg
    reengages_unaided: true
    latch_hold_band_deg: 6.2374
  expected_and_observed:
    - invariant: NRM-BM-001-006
      expected: NOT_EVALUABLE on the holding clause; PASS on release and localization
      observed: NOT_EVALUABLE
      divergence: false
      reading: >
        Unchanged by the revision, and for the same reason as before: the source
        declares no disturbance magnitude. Replacing a bolt with a latch changes
        what does the holding, not whether anything says how hard it must hold.
    - invariant: NRM-BM-001-008
      expected: PASS
      observed: PASS
      note: >
        The actuation feature is now the closure's own release pad, standing at
        y = -5.6 outside the product's front face at y = 0, with a clear 22 mm
        corridor in front of it. No separate object is handled at all.
  what_is_not_claimed:
    - latch holding force, release force or engagement force
    - latch strain, root stress, creep, fatigue, wear or cycle life
    - impact capacity, tolerance robustness, moulding feasibility or cost
    - any keying, authorization or security function. It is a latch.
  weakening_check: >
    No check was relaxed to accommodate the latch. Two were added - a three-body
    topology check and a latch/keeper connectivity check - and the negative
    control set grew from 12 to 24. One stale claim was corrected on the way: the
    manifest still said the compressed pin configuration was 4.08 mm^3 smaller
    than the relaxed one, from a superseded build that rotated the arms. Measured
    now, both are 0.000 mm^3 apart.
