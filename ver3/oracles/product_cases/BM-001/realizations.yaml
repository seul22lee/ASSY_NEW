case_id: BM-001
schema_version: "0.3.0"
domain: physical_design
note: >
  PHYSICAL design fixtures only. Verification and evidence admissibility live in
  evidence_cases.yaml; pipeline behaviour lives in negative_cases.yaml. A
  physical realization must never become inadmissible because no test has yet
  been authored for it (finding SF-1.1).

physical_tag_vocabulary:
  no_undeclared_volumetric_overlap: "no two solids occupy the same space outside a declared contact, interference-fit or compliant-interaction region, under the declared tolerance"
  intended_interaction_physically_consistent: "each intended interaction is physically coherent: a compliant region can actually deflect, an interference fit is takeable up in strain, a contact face exists on both participating bodies"
  installation_process_physically_realizable: "a realizable installation process exists in which no part passes through undeclared rigid material; intended insertion contact is allowed; declared press/snap/interference/compliant insertion is physically coherent; co-formed or bonded regions declare that relation and owe no discrete insertion process"
  two_states: "a closed and an open state exist"
  continuous_transition: "a motion connects them, evaluable at intermediate values"
  connection_realized: "engagement geometry exists on both bodies where the concept needs contact"
  declared_usable_access_unobstructed: "at OPEN the closure does not obstruct the usable access the design declares"
  extent_conserved: "material content equal across states; deformation declared if present"
  open_state_admissible: "a declared discrete open pose is physically produced, OR a declared open configuration region is reachable and affords the declared access"
  retention_realized: "retention has participating geometry on both bodies"
  retention_release_action: "a deliberate user action releases it"
  retention_cycle_realizable: "a close-engage / release / close-engage-again cycle is realizable with no participating feature consumed"
  actuator_reachable: "an access path terminates at the actuation feature"
  cavity_access: "a path reaches the interior cavity at OPEN"
  loads_reacted: "each load-carrying interface has a reaction path"

admissible_realizations:
  - id: ADM-BM-001-A
    summary: "Rigid prismatic box, rotating lid on a lateral axis, compressive catch, moulded abutment fixes a discrete open pose."
    materially_differs_by: [motion_type, connection_persistence, boundary_form, open_state_form]
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-BM-001-A

  - id: ADM-BM-001-B
    summary: "Single-piece curved shell with a compliant flexing closure region and a magnetic catch; discrete open pose set by an over-centre condition in the compliant region."
    materially_differs_by: [compliance, part_count, retention_principle, boundary_form]
    note: "Deforms between states. Admissible only because NRM-BM-001-004 conserves material content rather than demanding rigid motion."
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-BM-001-B

  - id: ADM-BM-001-C
    summary: "Detachable cover, captive only through its travel, guided by mating features; withdrawn clear and set aside. Over-centre draw retention; open state is a rest condition off the product."
    materially_differs_by: [connection_persistence, motion_type, retention_principle]
    note: "The cover is UNCONNECTED in the open state. Admissible only because NRM-BM-001-002 requires engagement where the concept needs it, not a permanent connection."
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-BM-001-C

  - id: ADM-BM-001-D
    summary: >
      Friction-pivoted lid held by the user anywhere in a declared open
      configuration region. No discrete open pose and no open stop. At the
      declared working pose the lid still overhangs part of the aperture
      projection, while the declared usable access region in front of it is clear.
    materially_differs_by: [open_state_form, aperture_occupancy, determinant_presence]
    note: >
      THE FALSIFIABILITY FIXTURE for findings SF-2.1 and SF-2.2. Under the prior
      wording this design was rejected twice over: it does not vacate the
      aperture prism, and it has no open-pose determinant. Both rejections were
      stronger than DOS-BM-001, which states no aperture size and records that no
      source bounds the motion at the open extreme. If a corrected invariant
      still rejects ADM-BM-001-D, the correction did not take.
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-BM-001-D

  - id: ADM-BM-001-E
    summary: >
      Lid on a pin-and-knuckle joint. The pin/bore pair is a DECLARED CONTACT
      region with a running fit; the lid seats on the rim at CLOSED, a second
      declared contact; a moulded abutment is a declared terminal contact at the
      open pose. Everywhere else the lid and body carry declared clearance.
    gate: GATE-2
    interaction_regions:
      - {pair: "pin / knuckle bore", kind: declared_contact, note: "running fit, zero nominal clearance at the bearing surface"}
      - {pair: "lid rim / body rim", kind: declared_contact, note: "seat at CLOSED"}
      - {pair: "lid flange / body wall", kind: declared_contact, note: "terminal contact at the open pose"}
      - {pair: "lid skirt / body wall", kind: declared_clearance, note: "gap through the sweep"}
    materially_differs_by: [interaction_declaration_completeness]
    note: >
      THE INTENDED-CONTACT FIXTURE. Under the retired predicate
      "clearance(swept_volume, enclosure_solid) > 0" this design FAILED three
      times over - at the bearing, at the seat and at the stop - for doing exactly
      what it is designed to do. If it starts failing again, the blanket-clearance
      formulation has returned.
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-BM-001-E

  - id: ADM-BM-001-F
    summary: >
      Snap-fit lid catch. The hook beam is a DECLARED COMPLIANT INTERACTION
      region: during insertion it overlaps the lip envelope and takes the overlap
      up in elastic deflection, which is represented. The retained position is a
      declared contact.
    gate: GATE-2
    interaction_regions:
      - {pair: "snap beam / lip", kind: declared_compliant_interaction,
         deflection_represented: true,
         material_assumption: "a polymer whose elastic strain admits the stated deflection without yield",
         insertion_direction: "along the closure axis",
         process_assumption: "hand insertion"}
      - {pair: "hook face / lip underside", kind: declared_contact, note: "the retained position"}
    materially_differs_by: [insertion_mode, interaction_kind]
    note: >
      THE COMPLIANT-ASSEMBLY FIXTURE. Under the retired assembly predicate
      "collision-free installation path" a snap fit is unassemblable by
      definition. The overlap here is declared and its deformation represented,
      so it is admissible; the FORCE required is a separate question held at
      UNR-BM-001-009.
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-BM-001-F

  - id: ADM-BM-001-G
    summary: >
      Hinge pin retained in its knuckle by a DECLARED INTERFERENCE FIT at one
      end, free-running at the other. The interference is stated with its process
      and material assumptions.
    gate: GATE-2
    interaction_regions:
      - {pair: "pin / anchor knuckle", kind: declared_interference_fit,
         nominal_interference: "declared by the design, value unresolved",
         material_assumption: "pin stiffer than knuckle wall; knuckle admits the hoop strain",
         process_assumption: "arbor press, single insertion, not intended to be reversed"}
      - {pair: "pin / running knuckle", kind: declared_contact, note: "running fit"}
    materially_differs_by: [insertion_mode, retention_of_the_joint_pin]
    note: >
      THE INTERFERENCE-FIT FIXTURE. Admissible ONLY because the process and
      material assumptions are explicit. Strip them and it becomes INA-BM-001-J.
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]

    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-BM-001-G

inadmissible_realizations:

  - id: INA-BM-001-A
    summary: "A DISCRETE terminal open pose is declared, bounded only by a range value in the analysis model; nothing in the design produces it."
    from_negative_case: NEG-BM-001-001
    missing_tags: [open_state_admissible]
    note: "Rejected for declaring a discrete pose it cannot produce — not for lacking a stop. ADM-BM-001-D declares no discrete pose and is admitted."
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-A

  - id: INA-BM-001-B
    summary: "Joint type and axis recorded; neither body carries engagement geometry."
    from_negative_case: NEG-BM-001-002
    missing_tags: [connection_realized, intended_interaction_physically_consistent]
    tags: [two_states, continuous_transition, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-B

  - id: INA-BM-001-C
    summary: "At OPEN the closure lies across the region the design itself declares as its usable access, so nothing can be put in or taken out."
    from_negative_case: NEG-BM-001-003
    missing_tags: [declared_usable_access_unobstructed, cavity_access]
    tags: [two_states, continuous_transition, connection_realized, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-C

  - id: INA-BM-001-D
    summary: "Closure represented with a smaller extent at OPEN so it fits without interference."
    from_negative_case: NEG-BM-001-005
    missing_tags: [extent_conserved, no_undeclared_volumetric_overlap]
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-D

  - id: INA-BM-001-E
    summary: "Retention recorded as a relation between whole bodies; no participating geometry, no contact normal, no field region."
    from_negative_case: NEG-BM-001-006
    missing_tags: [retention_realized, intended_interaction_physically_consistent]
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-E

  - id: INA-BM-001-F
    summary: "Access path for release terminates on the enclosure exterior beside the catch, not at the actuator."
    from_negative_case: NEG-BM-001-007
    missing_tags: [actuator_reachable]
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-F

  - id: INA-BM-001-G
    summary: "Retention released by breaking a moulded tab; after release the tab is gone and the closed state cannot be re-engaged."
    from_negative_case: NEG-BM-001-013
    missing_tags: [retention_cycle_realizable]
    note: "Added at SF-2.4. The prior wording accepted this design: nothing was marked single-use and the transition was declared repeatable."
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-G

  - id: INA-BM-001-H
    summary: >
      The lid solid and the body wall occupy the same space over part of the
      sweep. Nothing declares the region; no contact, no clearance, no
      interference fit, no compliant deformation.
    from_negative_case: NEG-BM-001-016
    missing_tags: [no_undeclared_volumetric_overlap]
    gate: GATE-2
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-H

  - id: INA-BM-001-I
    summary: >
      A 3 mm mutual penetration between lid and rim is labelled "contact" with no
      contact surfaces, no declared tolerance and no deformation. The word is
      being used to hide volumetric overlap.
    from_negative_case: NEG-BM-001-017
    missing_tags: [no_undeclared_volumetric_overlap]
    gate: GATE-2
    note: "Declaring a region 'contact' does not make an arbitrary penetration admissible; the overlap must be at or below the declared numerical tolerance, or be an interference fit with its assumptions."
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-I

  - id: INA-BM-001-J
    summary: >
      A rigid hinge pin whose only installation route passes straight through an
      already-installed rigid wall. No aperture, no declared interference, no
      compliant region, no alternative order.
    from_negative_case: NEG-BM-001-018
    missing_tags: [installation_process_physically_realizable]
    gate: GATE-2
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-J

  - id: INA-BM-001-K
    summary: >
      A catch described as a snap fit, with a rigid hook and no compliant region
      anywhere - nothing can deflect, so nothing can snap.
    from_negative_case: NEG-BM-001-019
    missing_tags: [intended_interaction_physically_consistent]
    gate: GATE-2
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-K

  - id: INA-BM-001-L
    summary: >
      A press fit declared with an interference value but no material assumption,
      no insertion direction and no process - an overlap asserted to be fine.
    from_negative_case: NEG-BM-001-020
    missing_tags: [intended_interaction_physically_consistent]
    gate: GATE-2
    tags: [two_states, continuous_transition, connection_realized, declared_usable_access_unobstructed, extent_conserved, open_state_admissible, retention_realized, retention_release_action, retention_cycle_realizable, actuator_reachable, cavity_access, loads_reacted, no_undeclared_volumetric_overlap, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-BM-001-L

retired_contracts:
  note: >
    Historical only. Nothing here contributes to any PASS/FAIL decision. Listed so a
    reader recognises a retired contract if it reappears.
  entries:
    - tag: interaction_regions_declared
      why: >
        REPRESENTATION property; moved to stage_expectations evaluability_prerequisites at PCF-004
    - tag: assembly_paths_exist
      why: >
        RETIRED at PCF-006; it excluded every press fit and snap fit, and is replaced by
        installation_process_physically_realizable
    - tag: no_undeclared_overlap_on_transition
      why: >
        RENAMED at PCF-004 to the pack-wide no_undeclared_volumetric_overlap
    - tag: assembly_process_realizable
      why: >
        RENAMED at PCF-006 to installation_process_physically_realizable
    - tag: sweep_clears_enclosure
      why: >
        RETIRED at PCF-007; it meant that the swept region does not intersect the enclosure
        solid, which contradicts the intended-contact semantics, and is absorbed into
        no_undeclared_volumetric_overlap
