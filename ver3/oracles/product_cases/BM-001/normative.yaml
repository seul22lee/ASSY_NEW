  - id: UNR-BM-001-004
    decision: Manufacturing process and material.
    why_must_remain_open: "DOS-BM-001 S2: no process, material or cost model is stated."
    resolvable_when: "A process or material is user-stated or justified by a costed comparison."
    blocks: []
    source_locators: ["DOS-BM-001 S2"]
  - id: UNR-BM-001-005
    decision: Whether the closure connection and the retention share a body or an axis.
    why_must_remain_open: "DOS-BM-001 S2: unconstrained by any source."
    resolvable_when: "A packaging or access constraint forces one arrangement."
    blocks: []
    source_locators: ["DOS-BM-001 S2"]
