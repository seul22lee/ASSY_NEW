    decision: Disturbance magnitude for handling and transport.
    why_must_remain_open: "DOS-BM-001 S2: no load magnitude, direction, duration or acceleration is stated."
    resolvable_when: "A user-supplied load case, an applicable standard, or a declared analyst assumption enters the DesignState."
    blocks: [NRM-BM-001-006, NRM-BM-001-011]
    source_locators: ["DOS-BM-001 S2"]
  - id: UNR-BM-001-002
    decision: User actuation effort ceiling.
    why_must_remain_open: "DOS-BM-001 S2: no force, torque or effort limit is stated."
    resolvable_when: "An ergonomic standard or a user-stated ceiling is supplied."
    blocks: [NRM-BM-001-008]
    source_locators: ["DOS-BM-001 S2"]
  - id: UNR-BM-001-003
    decision: Absolute product dimensions.
    why_must_remain_open: "DOS-BM-001 S1 clause C-006 says only desktop-sized."
    resolvable_when: "A user-supplied envelope or a derived packaging constraint exists."
    blocks: []
