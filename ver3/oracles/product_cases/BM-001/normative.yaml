invariants:
  - id: NRM-BM-001-001
    statement: >
      The enclosure has a closed state and an open state, and a motion that
      connects them in both directions.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-001 S1 REQ-001"]
    current_authority: 'DOS-BM-001 S1 REQ-001 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    conclusion_scope: "The two states and their connecting motion only."
    exclusions: ["Does not constrain motion type, axis, or whether the closure stays attached."]
    verification_predicate: "exists(state CLOSED) and exists(state OPEN) and exists(transition CLOSED<->OPEN) evaluable at intermediate parameter values."
    requires_tags: [two_states, continuous_transition]
    related_freedoms: [FRE-BM-001-001, FRE-BM-001-004]
    related_unresolved: []

  - id: NRM-BM-001-002
    statement: >
      The connection between the closure and the enclosure is physically
      realized: each participating body carries engagement geometry, and the
      guidance or support that the chosen closure concept depends on is present
      wherever that concept depends on it. Every intended interaction the design
      declares - contact, interference fit or compliant interaction - is
      physically coherent.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001 S1 REQ-001"]
    current_authority: 'DOS-BM-001 S1 REQ-001 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "REQ-001 requires a mechanism that opens and closes repeatedly."
      - "Repeatable relative motion between two bodies is produced by material interaction between them."
      - "A type name or relationship record is not material and produces no interaction."
      - >
        An interaction that is DECLARED but cannot physically occur produces no
        motion either. A snap with no deflectable region cannot snap; an
        interference with no material relation is not shown to be takeable up in
        strain. Declaring such an interaction does not realize it.
    conclusion_scope: >
      Existence and locality of engagement geometry; presence of support where the
      concept needs it; and physical coherence of every intended interaction the
      design declares. Coherence only - not adequacy, not margin, not force.
    exclusions:
      - "Does NOT require a permanent connection: a closure detached in the open state satisfies this if engagement exists where the concept requires it."
      - "Does NOT name a mechanism."
      - "Does NOT require support beyond what the selected concept depends on. Support is conditional on the concept, not universal."
    verification_predicate: >
      for the closure connection: engagement geometry exists on both participating
      bodies at every state where the concept declares contact; AND for each
      declared intended interaction: a compliant region can actually deflect, an
      interference is takeable up in strain given its stated material relation,
      and a contact face exists on both participating bodies.
    requires_tags: [connection_realized, intended_interaction_physically_consistent]
    related_freedoms: [FRE-BM-001-001]
    related_unresolved: []
    closes_finding: [CLS-002, PCF-004]
    scope_extended_at: PCF-004
    scope_extension_note: >
      Extended at PCF-004 to own intended_interaction_physically_consistent. BM-001
      gained snap and interference fixtures at GATE 2 of the previous pass but no
      invariant required their interactions to be COHERENT, so INA-BM-001-K (a
      rigid snap that cannot deflect) and INA-BM-001-L (an interference with no
      material relation) passed every physical invariant. Found by pass 3B, not by
      inspection.

  - id: NRM-BM-001-003
    statement: >
      In the open state the closure does not obstruct the usable access the
      design declares for the storage interaction, and along the transition
      between states the closure and the enclosure share no volume outside the
      interaction regions the design declares.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001 S1 REQ-001", "DOS-BM-001 S1 product_intent"]
    current_authority: 'DOS-BM-001 S1 REQ-001, DOS-BM-001 S1 product_intent (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "REQ-001 requires the enclosure to open, and product_intent names it a storage box."
      - "An access region the closure still obstructs is not usable for storing into."
      - >
        Two solids cannot occupy the same space. They MAY touch: a hinge bore, a
        rim seat and a stop face are intended contacts, and a design in which the
        closure never approached the enclosure could not be hinged, latched or
        stopped at all.
    conclusion_scope: >
      Non-obstruction of the DECLARED usable access region at OPEN, and absence of
      UNDECLARED volumetric overlap along the transition. Nothing more.
    exclusions:
      - >
        Does NOT require positive clearance everywhere. Declared contact is admissible and zero clearance at a declared contact region is correct, not a defect. The rule is no UNDECLARED volumetric overlap (ORACLE_AUTHORING_POLICY §13).
      - >
        A declared interference fit is admissible where its process and material assumptions are explicit; a declared compliant interaction is admissible where the deformation is represented.
      - >
        Does NOT require the closure to vacate the whole aperture projection.
        DOS-BM-001 S2 states no aperture size and no access envelope, so a
        requirement to clear the entire aperture prism would be stronger than the
        source. A closure that remains partly across the aperture while leaving
        the declared usable access unobstructed satisfies this.
      - "Does not fix the usable access region; the design declares it (UNR-BM-001-006)."
      - "Does not constrain how far the closure travels."
      - >
        Does NOT require the closure and enclosure to stay apart. Declared
        contact, a declared interference fit and a declared compliant interaction
        are all admissible, and zero clearance at a declared contact is correct.
        The earlier wording "the region swept by the closure does not intersect
        the enclosure solid" is retired at PCF-007: it contradicted the intended-
        contact semantics its own predicate already used.
    verification_predicate: >
      at OPEN the closure does not overlap the declared usable access region; and along the CLOSED->OPEN transition there is no volumetric overlap between the closure and the enclosure solid outside declared contact, declared interference-fit and declared compliant-interaction regions, under the declared tolerance and at the declared fidelity.

    requires_tags: [declared_usable_access_unobstructed, no_undeclared_volumetric_overlap]
    related_freedoms: [FRE-BM-001-003, FRE-BM-001-004]
    related_unresolved: [UNR-BM-001-006]
    closes_finding: [SF-2.1]

  - id: NRM-BM-001-004
    statement: >
      The closure's material content is conserved across states. Any change of
      shape between states is an explicitly modelled deformation of a declared
      compliant region; a body's extent is not altered in order to achieve
      clearance.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001 S1 REQ-001"]
    current_authority: 'DOS-BM-001 S1 REQ-001 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "REQ-001 requires the same closure to open and close repeatedly."
      - "A body does not gain or lose material by changing state."
    conclusion_scope: "Conservation of material content between states."
    exclusions:
      - "Does NOT require rigid motion. A compliant closure is admissible provided its deformation is declared and modelled."
    verification_predicate: "material content of the closure is equal across states within tolerance; any shape change is attributed to a declared compliant region."
    requires_tags: [extent_conserved]
    related_freedoms: [FRE-BM-001-001]
    related_unresolved: []
    closes_finding: [CLS-004]

  - id: NRM-BM-001-005
    statement: >
      Where the design declares a discrete terminal open pose, that pose is
      produced by a realized physical condition rather than by a limit imposed
      only on the model. Where the design instead declares an open configuration
      region, that region is admissible and the declared usable access is
      available within it.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    applies_when: "the design declares either a discrete terminal open pose or an open configuration region"
    source_locators: ["DOS-BM-001 S1 REQ-001"]
    current_authority: 'DOS-BM-001 S1 REQ-001 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "REQ-001 requires an open state to be reached, so the design must say what the open state is."
      - "A discrete pose that nothing physical produces is a property of the model, not of the artifact."
      - "A configuration region needs no terminal determinant; it needs only to be reachable and to afford the declared access."
    conclusion_scope: >
      Physical origin of a declared discrete terminal open pose, OR admissibility
      of a declared open configuration region. Not both, and neither is required
      to be the design's choice.
    exclusions:
      - >
        Does NOT require a terminal contact feature, a discrete stop part, or a
        bounded open extreme. DOS-BM-001 S2 records that no source states the
        motion is bounded at the open extreme. A user-positioned opening state
        held anywhere in an admissible region satisfies this.
      - "Does NOT prefer one of the two forms over the other."
    verification_predicate: >
      if a discrete terminal open pose is declared: it references a realized
      determinant (contact, rest condition, over-centre, engagement run-out or
      equivalent); else if an open configuration region is declared: every pose
      in it is reachable along the transition and affords the declared usable
      access.
    requires_tags: [open_state_admissible]
    related_freedoms: [FRE-BM-001-009]
    related_unresolved: [UNR-BM-001-006]
    closes_finding: [CLS-005, SF-2.2]

  - id: NRM-BM-001-006
    statement: >
      A retention function holds the closure in the closed state against the
      disturbance the design declares, and is released by a deliberate user
      action. Its engagement is localized on both participating bodies.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-001 S1 REQ-002", "DOS-BM-001 S1 REQ-004", "DOS-BM-001 S1 REQ-008"]
    current_authority: 'DOS-BM-001 S1 REQ-002, DOS-BM-001 S1 REQ-004, DOS-BM-001 S1 REQ-008 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    conclusion_scope: "Existence, localization, holding and release of retention."
    exclusions:
      - "Does not name a retention mechanism."
      - "Does not supply a load magnitude; the design declares what it holds against."
      - "Localization means identified participating material regions; a field interaction with declared participating regions satisfies it."
    verification_predicate: "retention realization has participating geometry on both bodies, a holding condition at CLOSED under the declared disturbance, and a release condition reachable by a declared user action."
    requires_tags: [retention_realized, retention_release_action]
    related_freedoms: [FRE-BM-001-002, FRE-BM-001-010]
    related_unresolved: [UNR-BM-001-001]

  - id: NRM-BM-001-007
    statement: >
      The retention completes a close-engage, release, close-engage-again cycle
      in which every participating feature retains the geometry its retention
      role depends on, and the closed state is reachable again after release.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-001 S1 REQ-008", "DOS-BM-001 S1 REQ-001"]
    current_authority: 'DOS-BM-001 S1 REQ-008, DOS-BM-001 S1 REQ-001 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    conclusion_scope: >
      Physical repeatability of one full cycle. NOT a cycle count, NOT durability,
      NOT wear.
    exclusions:
      - >
        Does NOT supply a cycle count; DOS-BM-001 S2 records that none is stated.
        Cycle count and durability are evidence questions and are held at
        UNR-BM-001-007.
      - "Does not require zero wear; it requires that no participating feature is consumed or permanently disabled by one cycle."
    verification_predicate: >
      a sequence CLOSED-engaged -> released -> CLOSED-engaged is realizable, with
      each participating feature's retention-critical geometry present in the
      final state. A declaration that the transition is repeatable, or the mere
      absence of a single-use marking, does not satisfy this.
    requires_tags: [retention_cycle_realizable]
    related_freedoms: [FRE-BM-001-002]
    related_unresolved: [UNR-BM-001-007]
    closes_finding: [SF-2.4]

  - id: NRM-BM-001-008
    statement: >
      The user action that releases the retention is reachable along a realized
      access path that terminates at the actuation feature.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001 S1 REQ-003"]
    current_authority: 'DOS-BM-001 S1 REQ-003 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "REQ-003 requires the retention to be operable by a user."
      - "A feature a user cannot reach cannot be operated by that user."
    conclusion_scope: "Existence of an access path terminating at the actuator. Geometric reachability only."
    exclusions:
      - >
        Does NOT require positive clearance everywhere. Declared contact is admissible and zero clearance at a declared contact region is correct, not a defect. The rule is no UNDECLARED volumetric overlap (ORACLE_AUTHORING_POLICY 13).
      - >
        A declared interference fit is admissible where its process and material assumptions are explicit; a declared compliant interaction is admissible where the deformation is represented.
      - "Does NOT constrain the side, face or half-space the path originates from."
      - >
        Does not supply an effort ceiling, and is NOT blocked by its absence.
        Whether a user can reach the actuator is a geometric question; how hard
        the actuator is to work is a separate quantitative question held at
        UNR-BM-001-002.
    verification_predicate: >
      exists(access_path) whose endpoint is the retention actuation feature and which has no undeclared volumetric overlap with solid material along its length.
    requires_tags: [actuator_reachable]
    related_freedoms: [FRE-BM-001-003]
    related_unresolved: []
    closes_finding: [CLS-008, SF-2.3]

  - id: NRM-BM-001-009
    statement: >
      An interior cavity exists and is reachable through the aperture in the open
      state.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001 S1 product_intent", "DOS-BM-001 S1 REQ-006"]
    current_authority: 'DOS-BM-001 S1 product_intent, DOS-BM-001 S1 REQ-006 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "product_intent names the product a storage box."
      - "A storage volume that cannot be reached cannot be stored into."
    conclusion_scope: "Existence and reachability of the cavity at OPEN."
    exclusions: ["Does not constrain cavity shape, volume, or aperture size."]
    verification_predicate: "exists(access_path) origin exterior, endpoint inside the cavity, valid at OPEN, not intersecting the enclosure solid or the closure at OPEN."
    requires_tags: [cavity_access]
    related_freedoms: [FRE-BM-001-006]
    related_unresolved: []

  - id: NRM-BM-001-010
    statement: >
      Each part installed as a discrete operation can reach its assembled
      position without passing through already-placed material. Parts formed
      together or permanently joined declare that relationship instead.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001 S1 REQ-007"]
    current_authority: 'DOS-BM-001 S1 REQ-007 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "REQ-007 requires the product to be assemblable."
      - "A part cannot occupy space already occupied by placed material."
    conclusion_scope: >
      Existence of a realizable installation process per discretely-installed part. Geometric and declared-compliant feasibility only - not force adequacy, not process cost.
    exclusions:
      - >
        Does NOT require the deformation, material, insertion direction or process assumption to be RECORDED. Recording them is a DesignState completeness property and is owned by stage_expectations.evaluability_prerequisites.assembly_assumptions_recorded. A press fit that is physically coherent but whose assumptions are unrecorded is NOT_EVALUABLE with reason REPRESENTATION_INCOMPLETE - never physically inadmissible. Corrected at RR-H-01.
      - >
        Does NOT require a fully collision-free installation path. A press fit has no collision-free path and is still assemblable. The requirement is a realizable PROCESS that passes through no UNDECLARED rigid material (ORACLE_AUTHORING_POLICY 14).
      - >
        Intended contact during insertion is admissible. Snap, press and interference insertion are admissible ONLY where declared with their deformation, material, direction and process assumptions.
      - >
        Does NOT assess whether the insertion FORCE is achievable. That is quantitative and is held separately; see the pack's assembly-process unresolved decision.
      - "Does NOT require a path for co-formed or permanently joined parts."
      - "Does not constrain assembly order, tooling, or how the order is recorded."
    verification_predicate: >
      for each discretely-installed part: a realizable installation process exists in which the part passes through no UNDECLARED rigid material. Contact during insertion is admissible. Where insertion depends on a press fit, snap fit, interference fit or compliant deformation, that insertion is PHYSICALLY COHERENT - a compliant region can actually deflect by the amount insertion needs, and an interference is takeable up in strain given the material relation that applies. Co-formed, bonded or permanently joined regions owe no discrete insertion process.
    requires_tags: [installation_process_physically_realizable]
    related_freedoms: [FRE-BM-001-005]
    related_unresolved: [UNR-BM-001-009]
    closes_finding: [CLS-010]

  - id: NRM-BM-001-011
    statement: >
      Retention and closure-connection loads are reacted: for each interface that
      carries load, a path exists to a reaction site.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    applies_when: "an interface carries load in the declared scenario"
    source_locators: ["DOS-BM-001 S1 REQ-002", "DOS-BM-001 S1 REQ-007"]
    current_authority: 'DOS-BM-001 S1 REQ-002, DOS-BM-001 S1 REQ-007 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "REQ-002 requires the closure to be held against a disturbance."
      - "A force that is applied and not reacted accelerates the body."
      - "An interface that carries no load in the declared scenario needs no reaction for that scenario."
    conclusion_scope: >
      Existence of a reaction path for load-carrying interfaces. Existence only —
      not adequacy, not margin, not capacity.
    exclusions:
      - "Does NOT require the reaction site to be the enclosure; a mounting boundary or the user's grip are admissible sites."
      - >
        Does NOT require the path to be adequate for any particular magnitude,
        and is NOT blocked by the absence of a disturbance magnitude. Whether a
        load path exists is structural; whether it suffices is quantitative and
        is held at UNR-BM-001-001.
      - "Does not prescribe how the path is recorded."
    verification_predicate: "for each load-carrying interface in the declared scenario: exists(load_path) terminating at a reaction site."
    requires_tags: [loads_reacted]
    related_freedoms: []
    related_unresolved: []
    closes_finding: [CLS-011, SF-2.3]

  - id: NRM-BM-001-012
    statement: >
      A criterion offered as evidence that the open state determinant is physically produced must rest on either direct causal evidence or discriminating evidence.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    enables_claim: >
      NRM-BM-001-005 may be reported PASS. Without this minimum, a criterion that
      also passes on a design with no determinant would be counted as showing
      that a determinant is present.
      Satisfied by direct causal evidence OR by a discriminating control
      (HSD-006); the two are alternatives, not a sequence.
      Satisfied by branch A OR branch B under HSD-006; the two are ALTERNATIVES. Absence of a control is never a physical FAIL.
    source_locators: ["DOS-BM-001 S5 E1"]
    current_authority: 'DOS-BM-001 S5 E1 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "DOS-BM-001 S5 E1 records that in the m0 matched pair every seed-0 criterion passes in BOTH the limited and the unlimited member."
      - "A criterion that passes on the control as well as the specimen separates nothing."
      - "A criterion that separates nothing cannot be evidence of the feature that distinguishes them."
    conclusion_scope: "Admissibility of a criterion as evidence for NRM-BM-001-005. Says nothing about the design."
    exclusions:
      - >
        Corrected at GATE-2 / HSD-006. Either form of support is admissible:
        A. DIRECT CAUSAL evidence - the feature's geometry exists, contact or
        interaction occurs at the relevant configuration, and the observed
        behaviour is caused by it; or
        B. DISCRIMINATING evidence - a control, ablation or sensitivity result
        showing the criterion fails when the feature is removed.
        A control is no longer mandatory. Requiring one made ordinary direct
        causal evidence inadmissible, and forced a second model to be built for
        every feature claim.
      - "Does not require a physical control specimen; a demonstrated sensitivity of the criterion to the determinant's absence is sufficient."
      - "Does not invalidate the m0 pair as evidence of what DOS-BM-001 S5 E1 says it shows: seed-level instability without a limit."
    verification_predicate: >
      A claim about the open state's determinant is physically produced may be supported by EITHER (A) direct causal evidence - the realizing geometry or field exists, it is active at the relevant configuration, and the observed behaviour is causally attributable to it - OR (B) discriminating evidence: a control, ablation, sensitivity analysis or other comparison showing the claimed behaviour is lost or changed. A control is useful but is not mandatory when direct causal evidence is adequate.
    requires_evidence_tags: [determinant_criterion_discriminates]
    related_freedoms: []
    related_unresolved: [UNR-BM-001-008]
    evidence_branches:
      A_direct_causal: "realizing geometry or field exists; active at the relevant configuration; behaviour causally attributable to it"
      B_discriminating: "control, ablation, sensitivity analysis or other comparison showing the behaviour is lost or changed"
      relation: ALTERNATIVES
    corrected_at: FPC-006
  - id: NRM-BM-001-013
    statement: >
      A force window that is an input of a task or test definition may not be
      cited as an achieved retention property.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    enables_claim: >
      The holding clause of NRM-BM-001-006 may be reported PASS. Without this
      minimum, a value supplied to a run and read back from it would be reported
      as the retention the product achieves.
    source_locators: ["DOS-BM-001 S5 E2"]
    current_authority: 'DOS-BM-001 S5 E2 (original, unchanged)'
    authority_note: >
      No dossier amendment applies to this pack; its frozen dossier sections remain the current authority in full.
    derivation_premises:
      - "DOS-BM-001 S5 E2 records that the snap force window is an input parameter of the task, not a measured product property."
      - "A value supplied to a run and read back from it reports the input."
      - "Citing it as a result asserts as achieved what was assumed."
    conclusion_scope: "Admissibility of a stated force window as evidence. Says nothing about the design."
    exclusions:
      - "Does not forbid declaring a force window as a requirement or as a test condition; it forbids reporting one as an outcome."
    verification_predicate: "for every cited retention or release force: its provenance is recorded as either an input condition or a measurement, and only measurements are counted as results."
    requires_evidence_tags: [force_provenance_declared]
    related_freedoms: []
    related_unresolved: []

