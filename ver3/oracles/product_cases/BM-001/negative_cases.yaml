case_id: BM-001
schema_version: "0.2.0"
note: >
  Each case is a design a naive checker would accept. None is the bare inverse of
  a normative statement; each names the mechanism by which the wrongness is
  concealed. Cases whose defect is owned by a global architecture invariant cite
  violates_invariant and no product invariant.

negative_cases:
  - id: NEG-BM-001-001
    failure_class: determinant_only_in_analysis_model
    fixture: INA-BM-001-A
    description: "The open pose is declared and the analysis model halts the closure there via a joint range, but nothing in the design determines that pose."
    why_wrong: "The analysis model was authored with a range; the product has nothing producing it. The simulation confirms the model, not the design."
    concealment: "A passing kinematic result plus a populated limit field."
    detect_stage: s05
    detect_predicate: "the open pose must reference a realized determinant; a joint-range value alone fails."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-005]
    sources: ["DOS-BM-001 S5 m0 stop/nostop pair"]
  - id: NEG-BM-001-002
    failure_class: label_without_realization
    fixture: INA-BM-001-B
    description: "A joint type and axis connect closure and enclosure with per-state coordinates. Neither body carries engagement geometry."
    why_wrong: "A joint type classifies motion; it does not produce it."
    concealment: "Schema-valid joint, correct axis, plausible poses, clean render."
    detect_stage: s05
    detect_predicate: "engagement geometry must exist on both participating bodies where the concept declares contact."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-002]
    sources: ["DOS-BM-001 S7 RL-0012"]
  - id: NEG-BM-001-003
    failure_class: closure_obstructs_its_own_declared_access
    fixture: INA-BM-001-C
    description: "At the open pose the closure lies across the region the design itself declares as its usable access, so nothing can be put in or taken out."
    why_wrong: "The open state does not open. Note the defect is obstruction of the DECLARED access region, not mere presence within the aperture projection: a closure that overhangs part of the aperture while leaving the declared access clear is admissible (ADM-BM-001-D)."
    concealment: "Endpoint-only checking: both end poses clear the walls, so an endpoint bounding test passes."
    detect_stage: s04
    detect_predicate: "intersect(closure@OPEN, declared_usable_access_region) must be empty."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-003, NRM-BM-001-009]
    sources: ["DOS-BM-001 S5"]
  - id: NEG-BM-001-004
    failure_class: transition_passes_through_solid
    description: "The open pose lies inside the cavity, so the transition passes through the enclosure wall."
    why_wrong: "Solid bodies do not interpenetrate; the motion is unrealizable."
    concealment: "Only the two end states are stored and neither is tested against the wall solid."
    detect_stage: s04
    detect_predicate: "clearance(swept_volume(closure), enclosure_solid) > 0."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-003]
    sources: ["DOS-BM-001 S7 RL-0009"]
  - id: NEG-BM-001-005
    failure_class: extent_altered_to_achieve_clearance
    fixture: INA-BM-001-D
    description: "The closure is represented with a smaller extent at OPEN so it fits without interference."
    why_wrong: "Material content is being changed to satisfy a clearance predicate."
    concealment: "Each state is internally consistent; no per-state check compares extents across states."
    detect_stage: s04
    detect_predicate: "material content equal across states within tolerance; any shape change attributed to a declared compliant region."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-004]
    sources: ["DOS-BM-001 S7 RL-0006"]
  - id: NEG-BM-001-006
    failure_class: relationship_without_localized_engagement
    fixture: INA-BM-001-E
    description: "A retention relation links closure and enclosure with no engagement site, no overlapping feature pair and no contact normal."
    why_wrong: "Retention is produced by a localized interaction; a whole-body relation specifies no place where force is exchanged."
    concealment: "The relation is typed, directional and schema-valid."
    detect_stage: s05
    detect_predicate: "retention must reference an engagement site with geometry on both bodies and a contact normal."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-006]
    sources: ["DOS-BM-001 S7 RL-0010"]
  - id: NEG-BM-001-007
    failure_class: access_path_terminates_at_boundary
    fixture: INA-BM-001-F
    description: "The release access path reaches the enclosure exterior surface beside the actuator and is accepted as demonstrating operability."
    why_wrong: "Reaching the outside of the product is not reaching the feature the user must move."
    concealment: "A populated access path with a valid origin and a plausible endpoint."
    detect_stage: s03
    detect_predicate: "access_path.endpoint must equal the retention actuation feature id."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-008]
    sources: ["DOS-BM-001 S7 RL-0011"]
  - id: NEG-BM-001-008
    failure_class: invented_placement
    description: "A body has no derived placement and is given the world origin so the model is complete."
    why_wrong: "An invented placement is indistinguishable downstream from a derived one; every clearance result computed against it is meaningless."
    concealment: "The model is complete and every downstream stage runs successfully."
    detect_stage: s04
    detect_predicate: "every authoritative pose has non-empty derived_from terminating in metric quantities; otherwise UNRESOLVED."
    must_not_be_reported_as: [PASS, SPATIALLY_INSTANTIATED]
    expected_status: UNRESOLVED
    violates_invariant: [INV-003, INV-004]
    sources: ["DOS-BM-001 S7 RL-0011"]
  - id: NEG-BM-001-009
    failure_class: incomplete_candidate_wins_on_part_count
    description: "Candidate A realizes connection, open-pose determinant and retention; candidate B realizes only the connection. B ranks above A on element count and is selected."
    why_wrong: "B is not simpler, it is less finished. Ranking on element count rewards absent obligations."
    concealment: "A deterministic, reproducible ranking with a written rationale."
    detect_stage: s02
    detect_predicate: "candidates may be compared only at equal obligation coverage; unequal coverage yields INDETERMINATE and no SelectionDecision."
    must_not_be_reported_as: [PASS]
    expected_status: INDETERMINATE
    violates_invariant: [INV-007]
    sources: ["DOS-BM-001 S7 s02_mechanical.py:408", "RL-0013"]
  - id: NEG-BM-001-010
    failure_class: unit_proxy_evidence_match
    description: "REQ-003 is evaluated against a millimetre value produced for closure travel, because both are lengths, and reported PASS."
    why_wrong: "Dimensional compatibility is not semantic identity; closure travel bears on nothing about actuation effort."
    concealment: "A unit-consistent match and a populated evidence field."
    detect_stage: s11
    detect_predicate: "evidence matches on (requirement_id, criterion_id, scenario_id, observable_id); unit validated only after matching."
    must_not_be_reported_as: [PASS]
    expected_status: NOT_VERIFIED
    violates_invariant: [INV-012]
    sources: ["DOS-BM-001 S7 ERROR_TAXONOMY.md"]
  - id: NEG-BM-001-011
    fixture: INA-EV-BM-001-A
    failure_class: renderer_originated_commitment
    description: "The closure axis does not exist in the spatial model; the renderer places it to draw the open state and it is read back into embodiment."
    why_wrong: "An axis a renderer invents has no derivation from any constraint and is unfalsifiable."
    concealment: "A legible drawing that appears to answer what moves about which axis."
    detect_stage: s04
    detect_predicate: "DesignState must be byte-identical with rendering disabled."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates_invariant: [INV-005]
    sources: ["DOS-BM-001 S7 RL-0012", "RL-0005"]
  - id: NEG-BM-001-012
    fixture: INA-EV-BM-001-B
    failure_class: unsupported_reported_as_infeasible
    description: "No retention realization is available to the system and the case is reported as physically infeasible."
    why_wrong: "A reusable retention is trivially realizable; the system lacks a capability, physics does not forbid the product."
    concealment: "A terminal verdict with a code, reading as a definitive engineering finding."
    detect_stage: s02
    detect_predicate: "INFEASIBLE requires a physical_argument; a knowledge-absence branch may emit only UNSUPPORTED."
    must_not_be_reported_as: [INFEASIBLE]
    expected_status: UNSUPPORTED
    violates_invariant: [INV-011]
    sources: ["DOS-BM-001 S7 KG_NO_PERMITTED_REALIZER"]
  - id: NEG-BM-001-013
    failure_class: retention_consumed_by_its_own_release
    fixture: INA-BM-001-G
    description: "Retention is released by breaking a moulded tab. After release the tab is gone and the closed state cannot be re-engaged."
    why_wrong: >
      REQ-008 requires a reusable latch. The design satisfies every wording of
      the prior repeatability invariant — nothing is marked single-use and the
      transition is declared repeatable — while being physically single-use.
    concealment: "A `reusable: true` declaration and the absence of a single-use marking."
    detect_stage: s05
    detect_predicate: "a close-engage / release / close-engage-again sequence must be realizable with every participating feature's retention-critical geometry present in the final state."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-007]
    sources: ["DOS-BM-001 S1 REQ-008"]
    closes_finding: [SF-2.4]

  - id: NEG-BM-001-014
    failure_class: quantitative_unknown_blocks_structural_predicate
    description: >
      The pipeline reports the retention load path as underivable because no
      disturbance magnitude is stated, or the actuator reachability check as
      underivable because no effort ceiling is stated.
    why_wrong: >
      Whether a load path exists is a structural question answerable from the
      topology; whether it is adequate is quantitative. Whether a user can reach
      the actuator is geometric; how hard it is to work is quantitative.
      Conflating the two suppresses work that is fully derivable.
    concealment: "The report looks conservative, and the missing quantity is genuinely missing."
    detect_stage: s11
    detect_predicate: "an unresolved of kind `quantitative` may not carry block scope `blocks_structural_predicate`."
    must_not_be_reported_as: [UNRESOLVED, INDETERMINATE]
    expected_status: "structural predicate evaluated; quantitative acceptance INDETERMINATE"
    violates: [UNR-BM-001-001, UNR-BM-001-002]
    sources: ["DOS-BM-001 S2"]
    closes_finding: [SF-2.3]

  - id: NEG-BM-001-015
    failure_class: open_state_form_imposed
    description: >
      A design whose open state is a user-positioned configuration region rather
      than a discrete pose is rejected, or is required to add a stop feature.
    why_wrong: >
      DOS-BM-001 S2 records that no source states the motion is bounded at the
      open extreme. Requiring a terminal open pose imports a legacy realization
      decision (DOS-BM-001 S6, theta target 90 deg with a discrete stop) as a
      requirement.
    concealment: "Every legacy realization has an open stop, so its absence reads as an omission."
    detect_stage: s04
    detect_predicate: "NRM-BM-001-005 applies only where a discrete terminal open pose is declared."
    must_not_be_reported_as: [FAIL]
    expected_status: PASS
    violates: [FRE-BM-001-009]
    sources: ["DOS-BM-001 S2", "DOS-BM-001 S6"]
    closes_finding: [SF-2.2]
  - id: NEG-BM-001-016
    kind: design
    failure_class: undeclared_volumetric_overlap
    fixture: INA-BM-001-H
    description: "The lid solid and the body wall occupy the same space over part of the sweep, and nothing declares the region."
    why_wrong: "Undeclared penetration is always FAIL. It is the one interaction outcome the contact semantics never admit."
    detect_stage: s04
    detect_predicate: "no volumetric overlap outside declared contact, interference-fit and compliant-interaction regions, under the declared tolerance."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-003]
    gate: GATE-2

  - id: NEG-BM-001-017
    kind: design
    failure_class: contact_label_hiding_penetration
    fixture: INA-BM-001-I
    description: "A 3 mm mutual penetration is labelled 'contact' with no contact surfaces, no declared tolerance and no deformation."
    why_wrong: >
      The contact semantics exist so that INTENDED touching is not treated as
      collision. They do not make the word 'contact' a licence for arbitrary
      overlap. The overlap must be at or below the declared numerical tolerance,
      or be a declared interference fit with its assumptions.
    detect_stage: s04
    detect_predicate: "a declared contact region bounds penetration by the declared numerical tolerance; beyond it, the region must be a declared interference fit."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-003]
    gate: GATE-2

  - id: NEG-BM-001-018
    kind: design
    failure_class: rigid_part_through_rigid_wall
    fixture: INA-BM-001-J
    description: "A rigid hinge pin whose only installation route passes through an already-installed rigid wall."
    why_wrong: "No declared interference, no compliant region and no alternative order. The process is not realizable."
    detect_stage: s05
    detect_predicate: "each discretely-installed part has a realizable installation process passing through no UNDECLARED rigid material."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-010]
    gate: GATE-2

  - id: NEG-BM-001-019
    kind: design
    failure_class: snap_fit_without_compliant_region
    fixture: INA-BM-001-K
    description: "A catch described as a snap fit, with a rigid hook and no compliant region anywhere."
    why_wrong: "Nothing can deflect, so nothing can snap. The narrative asserts an insertion mode the geometry cannot perform."
    detect_stage: s05
    detect_predicate: "a declared compliant insertion must name the compliant region and represent its deformation."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-010]
    gate: GATE-2

  - id: NEG-BM-001-020
    kind: design
    failure_class: interference_fit_without_process_assumption
    fixture: INA-BM-001-L
    description: "A press fit declared with an interference value but no material assumption, no insertion direction and no process."
    why_wrong: >
      A declared interference fit is admissible ONLY with its process and
      material assumptions explicit. Without them it is an overlap asserted to be
      acceptable, which is the defect the declaration was supposed to prevent.
    detect_stage: s05
    detect_predicate: "a declared interference fit carries a material assumption, an insertion direction and a process assumption."
    must_not_be_reported_as: [PASS]
    expected_status: FAIL
    violates: [NRM-BM-001-010]
    gate: GATE-2

  - id: NEG-BM-001-021
    kind: process
    failure_class: intended_contact_reported_as_interference
    description: >
      A guide face, a pin/bore pair, a seat or a stop is reported as an
      interference failure because the two bodies touch there.
    reproduced_from: "GATE-2 intended-contact semantics"
    must_be_rejected_by: [NRM-BM-001-003]
    required_outcome: >
      Rejected. Declared contact is admissible and zero clearance at a declared
      contact is correct. ADM-BM-001-E has three declared contacts and is
      admissible; under the retired blanket-clearance predicate it failed at all
      three.
    gate: GATE-2

  - id: NEG-BM-001-022
    kind: process
    failure_class: declared_compliant_assembly_reported_as_impossible
    description: "A snap or press insertion is reported unassemblable because no collision-free path exists."
    reproduced_from: "GATE-2 assembly semantics"
    must_be_rejected_by: [NRM-BM-001-010]
    required_outcome: >
      Rejected. A press fit has no collision-free path and is still assemblable.
      The requirement is a realizable PROCESS through no UNDECLARED rigid
      material. Whether the insertion FORCE is achievable is quantitative and is
      held at UNR-BM-001-009.
    gate: GATE-2
