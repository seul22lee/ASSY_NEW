      - "Does not fix the curvature axis orientation."
    verification_predicate: "exists(boundary region with non-zero curvature on the underside) AND exists(planar boundary region containing the aperture) on opposite sides of the cavity."
    requires_tags: [curved_underside_region, planar_top_with_aperture]
    related_freedoms: [FRE-BM-001-3-001, FRE-BM-001-3-003]
    related_unresolved: [UNR-BM-001-3-001]

  - id: NRM-BM-001-3-002
    statement: >
      A resting configuration on a supporting surface exists and is derived from
      contact geometry rather than asserted by a role name.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001-3 S1 REQ-011", "HSD-005"]
    current_authority: 'DOS-BM-001-3 S1 REQ-011 + HSD-005 (adopted reading RDG-BM-001-3-01)'
    authority_note: >
      REQ-011 is rank-1 and unchanged. HSD-005 owns the ADOPTED READING that the LOAD-BEARING resting contact must lie on the curved region - a human-approved product reading, not a verbatim geometric definition in the source. The stability criterion remains a separate unresolved decision (UNR-BM-001-3-002) and is NOT settled by this reading.
    derivation_premises:
      - "REQ-011 states the enclosure rests on its curved underside."
      - "A resting orientation is produced by contact between the body and the supporting surface."
      - "A name does not produce contact."
    conclusion_scope: "Existence and derivation of the resting configuration."
    exclusions:
      - "Does NOT assert a stability criterion. None is stated in the source; see UNR-BM-001-3-002."
      - "Does not require any particular stabilising provision."
      - >
        Does NOT require the resting configuration to be STABLE, and is NOT
        blocked by the absence of a stability criterion. Whether a contact-derived
        resting configuration exists is a structural question answerable from
        geometry; whether it is adequately stable is a separate quantitative
        question. Corrected at SF-4.1.
      - "Per RDG-BM-001-3-01 the load-bearing resting contact must lie on the curved region."
    verification_predicate: "the resting configuration references a load-bearing contact region between the CURVED underside and the supporting surface, with derived_from terminating in metric geometry."
    requires_tags: [resting_configuration_derived]
    related_freedoms: [FRE-BM-001-3-002]
    related_unresolved: [UNR-BM-001-3-002]

  - id: NRM-BM-001-3-003
    statement: >
      Along the closure transition the closure and the enclosure share no volume
      outside the declared interaction regions, over the curved boundary region
      as well as the planar one.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001-3 S1 REQ-011"]
    current_authority: 'DOS-BM-001-3 S1 REQ-011 (original, unchanged)'
    authority_note: >
      No amendment or decision supersedes this statement; REQ-011 is its sole authority.
    derivation_premises:
      - "REQ-011 places the aperture in the planar top region while the underside is curved."
      - "Solid bodies do not interpenetrate."
      - "The parent already requires sweep clearance; the curved region is additional material to clear."
    conclusion_scope: >
      Absence of UNDECLARED volumetric overlap against the curved region as well
      as the planar one. Declared contact remains admissible, exactly as in the
      parent (PCF-007).
    exclusions:
      - "Does not constrain the closure's motion type or travel."
      - >
        Does NOT require positive clearance everywhere. Declared contact is admissible and zero clearance at a declared contact region is correct, not a defect. The rule is no UNDECLARED volumetric overlap (ORACLE_AUTHORING_POLICY §13).
      - >
        A declared interference fit is admissible where its process and material assumptions are explicit; a declared compliant interaction is admissible where the deformation is represented.
    verification_predicate: >
      along the closure transition there is no volumetric overlap between the closure and the enclosure solid including the curved region outside declared contact, declared interference-fit and declared compliant-interaction regions, under the declared tolerance and at the declared fidelity.

    requires_tags: [sweep_clears_curved_region, no_undeclared_volumetric_overlap]
    related_freedoms: [FRE-BM-001-3-003]
    related_unresolved: []

