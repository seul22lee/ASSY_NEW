    statement: >
      The enclosure boundary has a region of non-zero curvature on the underside
      and a planar region on the top containing the aperture.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-001-3 S1 REQ-011"]
    conclusion_scope: "Existence of a curved underside region and a planar top region containing the aperture."
    exclusions:
