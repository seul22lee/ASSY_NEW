    related_unresolved: [UNR-BM-001-3-001]

  - id: NRM-BM-001-3-002
    statement: >
      A resting configuration on a supporting surface exists and is derived from
      contact geometry rather than asserted by a role name.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001-3 S1 REQ-011"]
    derivation_premises:
      - "REQ-011 states the enclosure rests on its curved underside."
      - "A resting orientation is produced by contact between the body and the supporting surface."
      - "A name does not produce contact."
    conclusion_scope: "Existence and derivation of the resting configuration."
    exclusions:
      - "Does NOT assert a stability criterion. None is stated in the source; see UNR-BM-001-3-002."
      - "Does not require any particular stabilising provision."
      - >
        Does NOT require the resting configuration to be STABLE, and is NOT
        blocked by the absence of a stability criterion. Whether a contact-derived
        resting configuration exists is a structural question answerable from
        geometry; whether it is adequately stable is a separate quantitative
        question. Corrected at SF-4.1.
      - "Per RDG-BM-001-3-01 the load-bearing resting contact must lie on the curved region."
    verification_predicate: "the resting configuration references a load-bearing contact region between the CURVED underside and the supporting surface, with derived_from terminating in metric geometry."
    requires_tags: [resting_configuration_derived]
    related_freedoms: [FRE-BM-001-3-002]
    related_unresolved: [UNR-BM-001-3-002]

  - id: NRM-BM-001-3-003
    statement: >
      The region swept by the closure clears the curved boundary region as well
      as the planar one.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-001-3 S1 REQ-011"]
    derivation_premises:
      - "REQ-011 places the aperture in the planar top region while the underside is curved."
      - "Solid bodies do not interpenetrate."
      - "The parent already requires sweep clearance; the curved region is additional material to clear."
    conclusion_scope: "Sweep clearance against the curved region."
    exclusions: ["Does not constrain the closure's motion type or travel."]
    verification_predicate: "clearance(swept_volume(closure), enclosure_solid including the curved region) > 0, at a declared fidelity."
    requires_tags: [sweep_clears_curved_region]
    related_freedoms: [FRE-BM-001-3-003]
    related_unresolved: []

