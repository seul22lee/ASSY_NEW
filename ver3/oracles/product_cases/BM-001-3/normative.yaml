source_reading:
  id: RDG-BM-001-3-01
  question: 'What does "rests on a curved back" require of the resting contact?'
  reading_used: >
    The load-bearing resting contact lies ON the curved region. An interruption
    of the curve that carries no load is admissible; a design whose weight is
    carried by a flat land, with curvature only elsewhere, is not.
  alternative_not_used: >
    "The underside is curved and the body rests on that underside somewhere",
    which would admit a body carried entirely by a flat land set into a curved
    face. Rejected as too weak to give REQ-011 any content.
  why_recorded: >
    This is a reading, not a source statement. It is recorded here rather than
    buried in a fixture note so a reviewer can reject it in one place. It is not
    an ambiguity blocker: the conservative reading is derivable from the plain
    sense of "rests on", and the alternative would make the requirement vacuous.
  affects: [NRM-BM-001-3-002, ADM-BM-001-3-C]
  closes_finding: [SF-4.3]

invariants:
