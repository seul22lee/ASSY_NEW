  - id: UNR-BM-001-3-002
    decision: What stability on a curved underside requires, and how it is achieved.
    why_must_remain_open: "AMB-001-3-01. DOS-BM-001-3 S4: a curved underside may rock; no stability criterion, tipping case or support condition is stated."
    kind: quantitative
    resolvable_when: "A stability criterion or tipping load case is supplied."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS, blocks_evidence_interpretation]
    does_not_block:
      - >
        NRM-BM-001-3-002 — a resting configuration derived from contact geometry
        is a structural predicate. Contact between a curved underside and a plane
        is computable without any stability criterion. What the missing criterion
        blocks is a stability PASS, a tipping-margin claim, and any claim that the
        rest configuration is ADEQUATELY stable.
    blocked_claims:
