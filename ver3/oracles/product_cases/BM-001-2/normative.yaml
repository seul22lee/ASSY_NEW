case_id: BM-001-2
schema_version: "0.3.0"
tier: product_case
inherits: BM-001
dossier: ver3/oracles/_dossiers/DOS-BM-001-2.md
pack_status: BLOCKED_BY_SOURCE_AMBIGUITY
physical_validation: PENDING_CAD   # every admissible fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
baseline_note: >
  PRE_CAD_SEMANTIC_REVIEWED is a semantic status only. It is NOT lock-ready, NOT
  CAD-validated and NOT production authority. The next authorized phase is
  adversarial CAD validation.   # every admissible fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
semantic_review: PASSED   # entailment, fixture-plausibility, cross-pack and cross-file drift reviews clean
lock_blocker: AMB-001-2-01

correction_note: >
  Corrected at finding SF-3.1. The delta requirement no longer asserts geometric
  opposition between the seating region and the exposed boundary. AMB-001-2-01
  is preserved unresolved and the pack remains blocked for lock.

invariants:
  - id: NRM-BM-001-2-001
    statement: >
      One boundary region of the enclosure seats flat against a mounting surface,
      and the exposed exterior boundary presents no projecting corner.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-001-2 S1 REQ-009"]
    conclusion_scope: "Existence of a planar seating region and absence of projecting exposed corners."
    exclusions:
      - "Does NOT require a rounded profile. The source statement requires non-projection; 'rounded' is one observable of it. Chamfered and recessed edges are admissible."
      - "Does not fix which region seats."
      - >
        Does NOT assert that the exposed boundary is geometrically OPPOSITE the
        seating region. REQ-009 says "flush against a mounting panel on one side"
        and "no projecting corners on the exposed side"; it never relates the two
        sides geometrically. A body seated on one face whose exposed boundary
        wraps several adjoining faces satisfies this. Corrected at SF-3.1.
      - "Does not fix how much of the exterior counts as exposed; that follows from what the mounting occludes (UNR-BM-001-2-004)."
    verification_predicate: "exists(planar boundary region) AND for every edge of the exposed exterior boundary: the edge is non-projecting, evaluated on metric surface geometry."
    requires_tags: [planar_seating_region, exposed_edges_non_projecting, interaction_regions_declared]
    related_freedoms: [FRE-BM-001-2-001, FRE-BM-001-2-002]
    related_unresolved: [UNR-BM-001-2-001, UNR-BM-001-2-002]

  - id: NRM-BM-001-2-002
    statement: >
      The retention actuation feature is not reachable from the exposed side, and
      the release action is worked from inside the enclosure.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-001-2 S1 REQ-010"]
    conclusion_scope: "Reachability of the actuator, stated in the source's own terms."
    exclusions: ["Does not name a retention mechanism or an actuation geometry."]
    verification_predicate: >
      no access_path originating in the exposed half-space terminates at the
      retention actuation feature, AND the declared release action originates
      inside the enclosure.
    requires_tags: [actuator_not_reachable_from_exposed_side, release_worked_from_inside]
    related_freedoms: [FRE-BM-001-2-003]
    related_unresolved: [UNR-BM-001-2-003]
    acknowledges_ambiguity: AMB-001-2-01
    ambiguity_note: >
      Stated in the source's exact terms rather than broadened. Under
      AMB-001-2-01 the term "inside the enclosure" has three incompatible
      readings, so this predicate cannot yet separate compliant from
      non-compliant designs. Recorded, not resolved.

overrides:
  - overrides: NRM-BM-001-008
    relation: narrows
    rank1_support: "DOS-BM-001-2 S1 REQ-010"
    reason: >
      The parent requires an access path terminating at the actuator and
      explicitly does not constrain the originating side. REQ-010 constrains that
      side. This is a narrowing, not a contradiction, because the parent was
      corrected to drop "from outside".

required_unresolved:
  - id: UNR-BM-001-2-001
    decision: Which boundary region seats against the mounting surface.
    why_must_remain_open: "DOS-BM-001-2 S2: REQ-009 requires a flat seating region and does not say which."
    kind: structural_choice
    resolvable_when: "An access, load-path or packaging constraint selects it."
    block_scopes: []
    source_locators: ["DOS-BM-001-2 S2"]
  - id: UNR-BM-001-2-002
    decision: Non-projecting profile geometry and its magnitude.
    why_must_remain_open: "DOS-BM-001-2 S2: no radius, chamfer size or definition of projecting is stated."
    kind: quantitative
    resolvable_when: "A user-supplied profile, a standard, or a derived manufacturing constraint exists."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-BM-001-2-001 as a structural predicate — whether an edge projects is inspectable on the solid without a radius value."
    source_locators: ["DOS-BM-001-2 S2"]
  - id: UNR-BM-001-2-003
    decision: What "inside the enclosure" denotes, and how the enclosure is opened given REQ-010.
    why_must_remain_open: "AMB-001-2-01. Three incompatible readings, none selected by any rank-1 source."
    kind: interpretive
    resolvable_when: "A rank-1 clarification of 'inside the enclosure', or a statement of how the enclosure is opened."
    block_scopes: [blocks_structural_predicate, blocks_evidence_interpretation, blocks_PASS]
    structural_block_justification: >
      This is not a missing quantity. The predicate's DOMAIN is undefined: until
      "inside the enclosure" is fixed, there is no set of poses the predicate
      ranges over, so it cannot separate compliant from non-compliant designs at
      any fidelity. This is the one place in the corrected set where a structural
      predicate is legitimately blocked, and it is why BM-001-2 alone remains
      BLOCKED_BY_SOURCE_AMBIGUITY.
    source_locators: ["DOS-BM-001-2 S4"]
  - id: UNR-BM-001-2-004
    decision: Which portion of the exterior counts as "the exposed side".
    kind: interpretive
    why_must_remain_open: >
      DOS-BM-001-2 S2 records no statement of which face mounts. What is exposed
      follows from what the mounting occludes, which the source does not fix.
    resolvable_when: "The mounting face is selected, or a reach model defines exposure."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-BM-001-2-001 — the design declares its seating region and its exposed boundary; only the adequacy of that declaration is unresolved."
    source_locators: ["DOS-BM-001-2 S2"]
    closes_finding: [SF-3.1]
