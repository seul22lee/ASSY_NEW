case_id: BM-001-2
schema_version: "0.2.0"
note: >
  Delta fixtures. Each is evaluated on its own geometry; none is compared to a
  generated BM-001 design.

admissible_realizations:
  - id: ADM-BM-001-2-A
    summary: "Prismatic body with one flat seating region and all exposed arrises generously filleted; retention worked from the cavity interior."
    materially_differs_by: [boundary_form, retention_principle]
    tags: [planar_seating_region, exposed_edges_non_projecting,
           actuator_not_reachable_from_exposed_side, release_worked_from_inside]
  - id: ADM-BM-001-2-B
    summary: "Single-curvature exposed shell over a flat seating plate; retention worked from the cavity interior by a lever reachable only when open."
    materially_differs_by: [boundary_form, actuation_geometry]
    tags: [planar_seating_region, exposed_edges_non_projecting,
           actuator_not_reachable_from_exposed_side, release_worked_from_inside]
  - id: ADM-BM-001-2-C
    summary: "Flat seating region with the exposed boundary formed by chamfered, recessed arrises rather than curvature; interior-worked retention."
    materially_differs_by: [boundary_form]
    note: "Admits a non-rounded solution. Rejected by the pre-correction wording that demanded 'rounded'."
    tags: [planar_seating_region, exposed_edges_non_projecting,
           actuator_not_reachable_from_exposed_side, release_worked_from_inside]

inadmissible_realizations:
  - id: INA-BM-001-2-A
    summary: "Prismatic enclosure with sharp exposed arrises; REQ-009 recorded in the trace and reported satisfied."
    from_negative_case: NEG-BM-001-2-001
    missing_tags: [exposed_edges_non_projecting]
    tags: [planar_seating_region, actuator_not_reachable_from_exposed_side, release_worked_from_inside]
  - id: INA-BM-001-2-B
    summary: "Exposed side annotated with a curvature label while the underlying solid is prismatic."
    from_negative_case: NEG-BM-001-2-002
    missing_tags: [exposed_edges_non_projecting]
    tags: [planar_seating_region, actuator_not_reachable_from_exposed_side, release_worked_from_inside]
  - id: INA-BM-001-2-C
    summary: "Actuator placed on the exposed side; an access path exists and terminates at it."
    from_negative_case: NEG-BM-001-2-003
    missing_tags: [actuator_not_reachable_from_exposed_side, release_worked_from_inside]
    tags: [planar_seating_region, exposed_edges_non_projecting]
  - id: INA-BM-001-2-D
    summary: "Actuator recessed on a non-exposed EXTERIOR side, reported as compliant."
    from_negative_case: NEG-BM-001-2-004
    missing_tags: [release_worked_from_inside]
    note: "Admitted by the pre-correction broadened wording; rejected once REQ-010's exact terms were restored."
    tags: [planar_seating_region, exposed_edges_non_projecting, actuator_not_reachable_from_exposed_side]
