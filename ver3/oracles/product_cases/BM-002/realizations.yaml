case_id: BM-002
schema_version: "0.2.0"
note: >
  Three materially different conversion topologies, each satisfying every
  invariant. If any invariant rejected one of these it would be prescribing a
  mechanism.

admissible_realizations:
  - id: ADM-BM-002-A
    summary: "Helical thread pair: crank turns a threaded column; a follower on the platform translates. Platform guided by two parallel columns providing anti-rotation. Extremes set by an abutment at each end of the thread."
    materially_differs_by: [conversion_principle, guidance_count, extreme_determinant]
    tags: ['external_rotary_input', 'internal_platform', 'continuous_motion_chain', 'boundary_crossing_realized', 'crossing_element_supported', 'conversion_realized', 'conversion_engagement_localized', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'platform_guided', 'platform_anti_rotation', 'both_extremes_reachable', 'corridor_not_fully_occupied', 'two_extremes_distinctly_determined', 'payload_access_reaches_platform', 'platform_load_reacted', 'assembly_paths_exist', 'manually_driven_only']
  - id: ADM-BM-002-B
    summary: "Toothed linear member driven by a wheel on the crank shaft; platform runs on a single profiled guide whose non-circular section provides anti-rotation. Extremes set by a run-out of the toothed member at one end and an abutment at the other."
    materially_differs_by: [conversion_principle, guidance_count, extreme_determinant]
    tags: ['external_rotary_input', 'internal_platform', 'continuous_motion_chain', 'boundary_crossing_realized', 'crossing_element_supported', 'conversion_realized', 'conversion_engagement_localized', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'platform_guided', 'platform_anti_rotation', 'both_extremes_reachable', 'corridor_not_fully_occupied', 'two_extremes_distinctly_determined', 'payload_access_reaches_platform', 'platform_load_reacted', 'assembly_paths_exist', 'manually_driven_only']
  - id: ADM-BM-002-C
    summary: "Cable wound on a drum lifts a scissor linkage carrying the platform; the linkage geometry itself guides the platform and removes rotation. Extremes set by linkage geometry at full extension and by drum stall at full retraction."
    materially_differs_by: [conversion_principle, guidance_topology, extreme_determinant, load_path]
    note: "No sliding guide and no toothed engagement. Admitted only because guidance and anti-rotation are stated as functions, not as mechanisms."
    tags: ['external_rotary_input', 'internal_platform', 'continuous_motion_chain', 'boundary_crossing_realized', 'crossing_element_supported', 'conversion_realized', 'conversion_engagement_localized', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'platform_guided', 'platform_anti_rotation', 'both_extremes_reachable', 'corridor_not_fully_occupied', 'two_extremes_distinctly_determined', 'payload_access_reaches_platform', 'platform_load_reacted', 'assembly_paths_exist', 'manually_driven_only']

