    tags: ['external_rotary_input', 'internal_platform', 'continuous_motion_chain', 'boundary_crossing_realized', 'crossing_element_supported', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'platform_guided', 'platform_anti_rotation', 'both_extremes_reachable', 'corridor_not_fully_occupied', 'two_extremes_distinctly_determined', 'payload_access_reaches_platform', 'platform_load_reacted', 'assembly_paths_exist', 'manually_driven_only']
