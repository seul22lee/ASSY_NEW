    decision: Whether the boundary-crossing element counts as part of the enclosed mechanism.
    why_must_remain_open: "AMB-002-01. REQ-004 requires the mechanism enclosed while REQ-001 requires an external input; the source does not classify the crossing element."
    resolvable_when: "A rank-1 clarification of what REQ-004 encloses."
    blocks: []
    source_locators: ["DOS-BM-002 S4"]
  - id: UNR-BM-002-002
    decision: The compliance edge of "approximately 80-100 mm".
    why_must_remain_open: "AMB-002-02. The source gives a range qualified by 'approximately'; whether 78 or 104 mm complies is undetermined."
    resolvable_when: "A tolerance or a firm bound is supplied."
    blocks: []
    source_locators: ["DOS-BM-002 S4"]
  - id: UNR-BM-002-003
    decision: Crank effort, torque and mechanical advantage.
    why_must_remain_open: "DOS-BM-002 S3: no torque, effort or speed is stated."
    resolvable_when: "An ergonomic ceiling or a user-stated effort is supplied."
    blocks: []
    source_locators: ["DOS-BM-002 S3"]
  - id: UNR-BM-002-004
    decision: Whether the mechanism must hold position when the input is released.
    why_must_remain_open: >
      DOS-BM-002 S3: no source states a hold, self-locking or back-drive
      requirement. The legacy lift realization used a holding feature, but that
      is a rank-4 realization decision, not a requirement.
    resolvable_when: "A hold or back-drive requirement is stated."
    blocks: []
    source_locators: ["DOS-BM-002 S3", "DOS-BM-002 S6"]
  - id: UNR-BM-002-005
    decision: Definition of "safe to use" and of "obvious jamming".
    why_must_remain_open: "DOS-BM-002 S3: no criterion or standard is cited for either."
    resolvable_when: "A standard or an explicit criterion is supplied."
    blocks: []
    source_locators: ["DOS-BM-002 S3"]
  - id: UNR-BM-002-006
    decision: The numeric envelope implied by "desktop-sized".
    why_must_remain_open: "DOS-BM-002 S3: REQ-008 states no dimensions and cites no reference envelope."
    resolvable_when: "An envelope or a reference surface is supplied."
    blocks: []
    source_locators: ["DOS-BM-002 S1 REQ-008", "DOS-BM-002 S3"]
