baseline_note: >
  PRE_CAD_SEMANTIC_REVIEWED is a semantic status only. It is NOT lock-ready, NOT
  CAD-validated and NOT production authority. The next authorized phase is
  adversarial CAD validation.   # every admissible fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
semantic_review: PASSED   # entailment, fixture-plausibility, cross-pack and cross-file drift reviews clean

correction_note: >
  Full semantic rewrite at findings SF-5.1 through SF-5.8. DOS-BM-002 S1 was
  re-read first; the prior invariant wording was not used as the starting
  authority. Every derived statement was re-tested against five materially
  different conversion families (SF-5.8): direct screw drive, rotating nut with
  fixed screw, cable and drum, scissor linkage, and a non-geared crank-and-link
  arrangement. Statements that any of the five falsified were made conditional
  or removed.

invariants:
  - id: NRM-BM-002-001
    statement: >
      A user-operated rotary input outside the housing drives a platform inside
      the housing to rise and fall, through an uninterrupted chain of realized
      interactions.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-002 S1 REQ-001"]
    conclusion_scope: "Existence of an external rotary input, an internal platform, and a continuous interaction chain between them."
    exclusions:
      - "Does not name a conversion mechanism, a ratio, or a chain topology."
      - "Does not require direct engagement between the input body and the platform; intermediate bodies are admissible."
    verification_predicate: "exists(external rotary input) and exists(internal platform) and a connected chain of realized interactions between them, traversable in both directions, each link naming its participating bodies."
    requires_tags: [external_rotary_input, internal_platform, continuous_interaction_chain]
    related_freedoms: [FRE-BM-002-001, FRE-BM-002-002]
    related_unresolved: []

  - id: NRM-BM-002-002
    statement: >
      Where the chain crosses the housing boundary, the crossing is realized: the
      moving element passes without unintended interference, and whatever support
      or reaction the selected realization requires at or near the crossing is
      present.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-002 S1 REQ-001", "DOS-BM-002 S1 REQ-004"]
    derivation_premises:
      - "REQ-001 places the input outside; REQ-004 keeps the mechanism inside."
      - "A chain connecting an outside element to an inside element passes through the boundary."
      - "A moving element and the boundary it passes through must not occupy the same space."
    conclusion_scope: "Existence of the crossing and absence of unintended interference at it. Support only where the selected realization requires it."
    exclusions:
      - >
        Does NOT require the housing material at the crossing to be the support.
        A drive element may pass through clearance and be supported entirely
        elsewhere - a shaft carried on two internal bearings passing through an
        oversize hole, or a cable through a fairlead. Corrected at SF-5.2.
      - "Does NOT decide whether the crossing element counts as part of the enclosed mechanism; see AMB-002-01."
      - "Does not name a sealing method and does not require a seal."
    verification_predicate: "exists(boundary crossing) with no interference between the moving element and the housing at any point of operation, and every support the selected realization depends on is realized somewhere in the design."
    requires_tags: [boundary_crossing_realized, crossing_non_interfering]
    related_freedoms: [FRE-BM-002-004]
    related_unresolved: [UNR-BM-002-001]
    acknowledges_ambiguity: AMB-002-01
    closes_finding: [SF-5.2]

  - id: NRM-BM-002-003
    statement: >
      Rotary motion becomes platform translation through at least one realized
      interaction whose participating geometry is identified on each body it acts
      between.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-002 S1 REQ-001"]
    derivation_premises:
      - "REQ-001 requires rotary input and translating output."
      - "Rotation does not become translation without an interaction that constrains the two."
      - "An interaction occurs at material in contact, engagement or field coupling - not between whole bodies."
    conclusion_scope: "Existence and locality of the conversion interaction(s)."
    exclusions:
      - "Does not name a conversion mechanism, a ratio, or an engagement geometry."
      - "Does not require the conversion to occur at a single site or between the input and output bodies directly."
    verification_predicate: "at least one realized interaction in the chain converts rotation to translation, with participating geometry identified on both bodies it acts between."
    requires_tags: [conversion_engagement_localized]
    related_freedoms: [FRE-BM-002-002]
    related_unresolved: []

  - id: NRM-BM-002-004
    statement: >
      The platform moves approximately 80-100 mm during operation, observed as
      platform vertical displacement in millimetres.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    quantity_is_user_stated: true
    source_locators: ["DOS-BM-002 S1 REQ-002"]
    conclusion_scope: "The travel requirement in the source's own terms, including its qualifier."
    exclusions:
      - >
        The qualifier "approximately" is part of the requirement and is preserved,
        not discarded to produce a crisp bound. No tolerance is invented.
      - "Does not fix which value in the band the design targets."
    verification_predicate: >
      the design's declared platform travel is expressed in millimetres and lies
      within 80-100 mm as qualified by "approximately". A value at or near a band
      edge yields INDETERMINATE until UNR-BM-002-002 is resolved; it does not
      yield FAIL and does not yield PASS.
    requires_tags: [travel_within_source_band]
    related_freedoms: []
    related_unresolved: [UNR-BM-002-002]
    closes_finding: [SF-5.1]

  - id: NRM-BM-002-005
    statement: >
      The platform supports a payload of approximately 1 kg, observed as maximum
      supported payload.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    quantity_is_user_stated: true
    source_locators: ["DOS-BM-002 S1 REQ-003"]
    conclusion_scope: "The payload requirement in the source's own terms, including its qualifier."
    exclusions:
      - 'The qualifier "approximately" is preserved. No margin, factor or duty is invented; none is stated.'
      - >
        Requires the design to DECLARE a supported payload consistent with the
        source band. Whether the structure achieves it is an evidence question:
        DOS-BM-002 S5 records no strength evidence at any fidelity, so a capacity
        claim is NOT_VERIFIED or UNSUPPORTED, never PASS by assertion.
    verification_predicate: >
      the design declares a supported payload, with unit, consistent with
      approximately 1 kg, and the platform load path (NRM-BM-002-011) carries it.
      A capacity PASS additionally requires strength evidence that does not exist
      in the corpus.
    requires_tags: [payload_capacity_declared]
    related_freedoms: []
    related_unresolved: [UNR-BM-002-002, UNR-BM-002-007]
    closes_finding: [SF-5.1]

  - id: NRM-BM-002-006
    statement: >
      Every element that carries a transverse or radial load in the declared
      operating scenario has a realized radial reaction, and every element that
      carries an axial load has a realized axial reaction.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    applies_when: "an element carries the relevant load component in the declared operating scenario"
    source_locators: ["DOS-BM-002 S1 REQ-001", "DOS-BM-002 S1 REQ-003", "DOS-BM-002 S1 REQ-007"]
    derivation_premises:
      - "An unreacted force accelerates the body carrying it."
      - "REQ-003 places a payload on the platform, producing load in the chain that carries it."
      - "Which components a given element carries depends on the conversion family selected, not on the requirement."
    conclusion_scope: >
      Reaction of loads that are ACTUALLY produced by the selected realization.
      Existence of a reaction, not its adequacy.
    exclusions:
      - >
        Does NOT quantify over every rotating element. A cable drum carries no
        axial load; a rotating nut on a fixed screw reacts axially through the
        screw, not through a separate thrust feature. Universalizing either
        reaction across all conversion families would encode one family.
        Corrected at SF-5.3.
      - "Does not name a support type and does not require a separate part."
      - "Does not require the reaction to be adequate for any magnitude; that is quantitative and held at UNR-BM-002-007."
    verification_predicate: >
      for each element and each load component it carries in the declared
      scenario: exists(reaction path) for that component. Elements not carrying a
      component owe no reaction for it.
    requires_tags: [loaded_elements_reacted]
    related_freedoms: [FRE-BM-002-005]
    related_unresolved: [UNR-BM-002-007]
    closes_finding: [SF-5.3]

  - id: NRM-BM-002-007
    statement: >
      The platform's motion is guided sufficiently to preserve the travel and the
      orientation the product scenario requires of it.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-002 S1 REQ-001", "DOS-BM-002 S1 REQ-003", "DOS-BM-002 S1 REQ-007"]
    derivation_premises:
      - "REQ-001 requires the platform to rise and fall along a definite direction."
      - "REQ-003 requires it to carry a payload, which a platform must remain oriented to support."
      - "A body whose orientation or path is not constrained where the scenario depends on it does not perform the scenario."
    conclusion_scope: >
      Guidance sufficient for the REQUIRED behaviour. Not a fixed degree-of-freedom
      count and not a fixed guidance mechanism.
    exclusions:
      - >
        Does NOT require anti-rotation universally. Rotation about the travel
        direction must be restrained only where (a) rotation would violate the
        required platform behaviour, or (b) the selected conversion needs
        rotational restraint of the driven body in order to produce translation.
        A rotationally symmetric platform whose scenario is indifferent to its
        angular position is admissible. Corrected at SF-5.4.
      - >
        Does NOT assert that every rotary-to-linear conversion applies a moment
        about the platform travel direction. A symmetric multi-point cable lift
        and a centred scissor linkage do not. That premise, previously stated as
        universal, was falsified by two of the five families tested at SF-5.8.
      - "Does not name a guidance mechanism or a number of guides."
    verification_predicate: >
      the platform's path and orientation are constrained wherever the declared
      scenario depends on them; and where rotation about the travel direction
      would violate the scenario or defeat the selected conversion, a realized
      constraint removes it.
    requires_tags: [platform_motion_guided, required_orientation_preserved]
    related_freedoms: [FRE-BM-002-003]
    related_unresolved: []
    closes_finding: [SF-5.4]

  - id: NRM-BM-002-008
    statement: >
      At every pose the operation requires, the platform solid does not intersect
      housing material, and the required path between poses is traversable.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-002 S1 REQ-002", "DOS-BM-002 S1 REQ-007"]
    derivation_premises:
      - "REQ-002 requires the platform to move through a stated displacement."
      - "Material cannot pass through material."
      - "A path blocked at any interior point is not traversable, whatever its endpoints do."
    conclusion_scope: "Non-intersection at required poses and traversability of the required path."
    exclusions:
      - >
        Does NOT require positive clearance everywhere. Declared contact is admissible and zero clearance at a declared contact region is correct, not a defect. The rule is no UNDECLARED volumetric overlap (ORACLE_AUTHORING_POLICY 13).
      - >
        A declared interference fit is admissible where its process and material assumptions are explicit; a declared compliant interaction is admissible where the deformation is represented.
      - >
        Does NOT require the platform to occupy a proper subset of a travel
        corridor. The corridor is in general DEFINED by the swept volume, so
        demanding proper-subset containment is either vacuous or contradictory.
        Replaced with executable non-intersection and traversability predicates.
        Corrected at SF-5.5.
      - "Does not fix a clearance value. Required clearance is either solved or explicitly unresolved."
    verification_predicate: >
      for every required pose there is no volumetric overlap between the platform solid and housing material outside declared contact, declared interference-fit and declared compliant-interaction regions, under the declared tolerance and at the declared fidelity; the required path is traversable; and any required clearance is either solved or recorded as unresolved.
    requires_tags: [pose_clearances_satisfied, required_path_traversable, interaction_regions_declared]
    related_freedoms: []
    related_unresolved: []
    closes_finding: [SF-5.5]

  - id: NRM-BM-002-009
    statement: >
      Where the design declares a travel extreme as a physical end of travel,
      that extreme is produced by a realized condition evaluated at its own
      configuration.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    applies_when: "the design declares a terminal state as a physical end of travel"
    source_locators: ["DOS-BM-002 S1 REQ-002", "DOS-BM-002 S1 REQ-007"]
    derivation_premises:
      - "A declared physical end of travel is a claim about the artifact."
      - "An end of travel that nothing physical produces is a property of the model."
      - "Two distinct configurations cannot both be determined by one condition evaluated once."
    conclusion_scope: >
      Physical origin and independent evaluation of DECLARED terminal states. Not
      a requirement that terminal states exist.
    exclusions:
      - >
        Does NOT constrain FRE-BM-002-010, whether the design declares physical ends of travel at all. That choice stays free; this statement governs only what follows once the choice is made.
      - >
        Does NOT require two physical stops. REQ-002 states a displacement, not a
        bounded travel: a design may simply deliver the required displacement
        within a larger mechanically available range. Inferring stops from a
        measured stroke is the defect corrected at SF-5.6.
      - "Distinctness is required of the CONDITION or CONTACT FEATURE, not of the manufactured part."
      - "Does not require hard contact; any determined end condition is admissible."
    verification_predicate: >
      if a terminal state is declared as a physical end of travel: it references
      its own realized condition, evaluated at its own configuration, and no
      evaluation result is copied between extremes. Otherwise: the required
      displacement is verified within the mechanically available range.
    requires_tags: [declared_terminals_physically_produced]
    related_freedoms: [FRE-BM-002-006, FRE-BM-002-010]
    related_unresolved: []
    closes_finding: [SF-5.6]

  - id: NRM-BM-002-010
    statement: >
      A payload can be placed on and removed from the platform along an access
      path that terminates at the platform.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-002 S1 REQ-003"]
    derivation_premises:
      - "REQ-003 requires the platform to support a payload."
      - "A payload that cannot reach the platform cannot be supported by it."
    conclusion_scope: "Existence of a payload access path terminating at the platform."
    exclusions: ["Does not fix the access region, the opening, or the payload geometry."]
    verification_predicate: "exists(access_path) whose endpoint is the platform surface, not the housing boundary, at a declared state."
    requires_tags: [payload_access_reaches_platform]
    related_freedoms: [FRE-BM-002-007]
    related_unresolved: []

  - id: NRM-BM-002-011
    statement: >
      The platform load has a realized path to a reaction site.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-002 S1 REQ-003"]
    derivation_premises:
      - "REQ-003 places a payload on the platform."
      - "An unreacted load accelerates the body."
    conclusion_scope: "Existence of a load path from platform to a reaction site. Existence only."
    exclusions:
      - "Does not prescribe the site or the path topology."
      - "Does NOT require the path to be adequate for the payload, and is NOT blocked by the absence of a margin; adequacy is quantitative and held at UNR-BM-002-007."
    verification_predicate: "exists(load_path) from the platform to a reaction site."
    requires_tags: [platform_load_reacted]
    related_freedoms: []
    related_unresolved: [UNR-BM-002-007]

  - id: NRM-BM-002-012
    statement: >
      Each part installed as a discrete operation can reach its assembled
      position without passing through already-placed material.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-BM-002 S1 REQ-006"]
    derivation_premises:
      - "REQ-006 requires the product to be assemblable."
      - "A part cannot occupy space already occupied."
    conclusion_scope: >
      Existence of a realizable installation process per discretely-installed part. Geometric and declared-compliant feasibility only - not force adequacy, not process cost.
    exclusions:
      - >
        Does NOT require a fully collision-free installation path. A press fit has no collision-free path and is still assemblable. The requirement is a realizable PROCESS that passes through no UNDECLARED rigid material (ORACLE_AUTHORING_POLICY 14).
      - >
        Intended contact during insertion is admissible. Snap, press and interference insertion are admissible ONLY where declared with their deformation, material, direction and process assumptions.
      - >
        Does NOT assess whether the insertion FORCE is achievable. That is quantitative and is held separately; see the pack's assembly-process unresolved decision.
      - "Does not require a path for co-formed or permanently joined parts. Does not constrain assembly order."
    verification_predicate: >
      for each discretely-installed part: a realizable installation process exists in which the part passes through no UNDECLARED rigid material. Contact during insertion is admissible. Where insertion depends on a press fit, snap fit, interference fit or compliant deformation, that region is declared and its required deformation, material assumption, insertion direction and process assumption are represented. Co-formed, bonded or permanently joined regions declare that relationship instead of owing a process.
    requires_tags: [assembly_paths_exist, assembly_process_realizable]
    related_freedoms: []
    related_unresolved: [UNR-BM-002-008]

  - id: NRM-BM-002-013
    statement: >
      The product is driven only by the user's input; no stored or supplied
      energy source drives the motion.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-BM-002 S1 REQ-009"]
    conclusion_scope: "Absence of a non-user energy source in the drive chain."
    exclusions: ["Does not forbid springs or counterweights used for balance rather than as the driving source."]
    verification_predicate: "no element of the drive chain is declared as a powered or stored-energy driving source."
    requires_tags: [manually_driven_only]
    related_freedoms: []
    related_unresolved: []

  - id: NRM-BM-002-014
    statement: >
      Evidence obtained from a model that imposes the input/output relation by
      declaration may not be cited in support of the existence, engagement or
      contact behaviour of the conversion.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    enables_claim: >
      NRM-BM-002-003 may be reported PASS, and REQ-007 (avoid obvious jamming)
      may be evaluated at all. Without this minimum, agreement between commanded
      input and observed output under a declared pair would be counted as showing
      that an engagement exists and does not jam.
    source_locators: ["DOS-BM-002 S5 E1", "DOS-BM-002 S5 E2"]
    derivation_premises:
      - "DOS-BM-002 S5 E1 records that all lift kinematic evidence is V-A declared-pair."
      - "Under declared coupling the transmission relationship is exact by construction of the model."
      - "An observable determined by the declaration reports the declaration, not the artifact."
    conclusion_scope: "Admissibility of declared-pair results as engagement evidence. Says nothing about the design."
    exclusions:
      - "Does not forbid declared-pair models; it requires their results to be marked as structural artifacts for engagement criteria."
      - "Does not assert that no conversion can be verified; it states what this class of evidence cannot show."
    verification_predicate: "every evidence item mapped to NRM-BM-002-003 or to REQ-007 declares its contact resolution; declared-pair results are marked as structural artifacts for those criteria."
    requires_evidence_tags: [contact_resolution_declared, declared_pair_not_cited_for_engagement]
    related_freedoms: []
    related_unresolved: []

required_unresolved:
  - id: UNR-BM-002-001
    decision: Whether the boundary-crossing element counts as part of the enclosed mechanism.
    kind: interpretive
    why_must_remain_open: "AMB-002-01. REQ-004 requires the mechanism enclosed while REQ-001 requires an external input; the source does not classify the crossing element."
    resolvable_when: "A rank-1 clarification of what REQ-004 encloses."
    block_scopes: [blocks_evidence_interpretation, blocks_PASS]
    does_not_block:
      - "NRM-BM-002-002 — the existence and non-interference of the crossing are structural and do not depend on how the element is classified."
    source_locators: ["DOS-BM-002 S4"]
  - id: UNR-BM-002-002
    decision: The compliance edge of the source's "approximately" qualifier on travel and payload.
    kind: interpretive
    why_must_remain_open: "AMB-002-02. The source gives a band and a value, each qualified by 'approximately'; whether 78 mm or 104 mm complies is undetermined."
    resolvable_when: "A tolerance or a firm bound is supplied."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-BM-002-004 and NRM-BM-002-005 as structural predicates — the design must still declare a travel and a payload, with units, in the source's band. Only compliance AT THE EDGE is undetermined."
    source_locators: ["DOS-BM-002 S4"]
    closes_finding: [SF-5.1]
  - id: UNR-BM-002-003
    decision: Crank effort, torque and mechanical advantage.
    kind: quantitative
    why_must_remain_open: "DOS-BM-002 S3: no torque, effort or speed is stated."
    resolvable_when: "An ergonomic ceiling or a user-stated effort is supplied."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    source_locators: ["DOS-BM-002 S3"]
  - id: UNR-BM-002-004
    decision: Whether the mechanism must hold position when the input is released.
    kind: qualitative
    why_must_remain_open: >
      DOS-BM-002 S3: no source states a hold, self-locking or back-drive
      requirement. The legacy lift realization used a holding feature, but that is
      a rank-4 realization decision.
    resolvable_when: "A hold or back-drive requirement is stated."
    block_scopes: []
    source_locators: ["DOS-BM-002 S3", "DOS-BM-002 S6"]
  - id: UNR-BM-002-005
    decision: Definition of "safe to use" and of "obvious jamming".
    kind: qualitative
    why_must_remain_open: "DOS-BM-002 S3: no criterion or standard is cited for either."
    resolvable_when: "A standard or an explicit criterion is supplied."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS, blocks_evidence_interpretation]
    source_locators: ["DOS-BM-002 S3"]
  - id: UNR-BM-002-006
    decision: The numeric envelope implied by "desktop-sized".
    kind: quantitative
    why_must_remain_open: "DOS-BM-002 S3: REQ-008 states no dimensions and cites no reference envelope."
    resolvable_when: "An envelope or a reference surface is supplied."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    source_locators: ["DOS-BM-002 S1 REQ-008", "DOS-BM-002 S3"]
  - id: UNR-BM-002-007
    decision: Load margin, factor of safety and duty for the payload load path.
    kind: quantitative
    why_must_remain_open: "DOS-BM-002 S3: no margin, factor, duty or life is stated, and DOS-BM-002 S5 records no strength evidence at any fidelity."
    resolvable_when: "A margin and a duty are supplied, and strength evidence exists."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-BM-002-006 and NRM-BM-002-011 — the existence of a reaction path is structural."
    source_locators: ["DOS-BM-002 S3", "DOS-BM-002 S5"]
  - id: UNR-BM-002-008
    decision: Assembly insertion force, press/snap fit process parameters and tooling.
    kind: quantitative
    why_must_remain_open: >
      DOS-BM-002 S3 records no material and no process. Insertion force for any declared press or snap region is undetermined.
    resolvable_when: "An insertion force ceiling, a material and a process are supplied."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "The existence of a realizable installation process is structural and is derivable without a force."
    source_locators: ["ORACLE_AUTHORING_POLICY 14"]
    added_at: GATE-2
