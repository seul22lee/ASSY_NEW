case_id: BM-002
schema_version: "0.3.0"
note: >
  States only what the pipeline must represent, preserve, defer or report.
  Adds no product requirement. Stage-11 rules are conditional; no outcome is
  fixed by current tooling capability.

evaluability_prerequisites:
  added_at: PCF-004
  domain: REPRESENTATION
  note: >
    These are DesignState completeness properties, not physical properties. A
    design that fails one is NOT physically inadmissible: it is NOT_EVALUABLE
    with reason REPRESENTATION_INCOMPLETE. They were carried as physical tags
    until PCF-004 and are now owned here.
  prerequisites:
    interaction_regions_declared: >
      every region where two bodies meet is classified as declared contact,
      declared clearance, declared interference fit or declared compliant
      interaction
    interaction_kind_recorded: >
      each region records which of the four kinds it is
    numerical_tolerance_recorded: >
      the penetration depth below which the evaluation reports contact rather
      than overlap is declared, and is a property of the evaluation rather than
      of the design
    compliant_region_recorded: >
      where an interaction is declared compliant, the compliant region and its
      represented deformation are identified
    assembly_assumptions_recorded: >
      where insertion depends on a press, snap, interference or compliant
      region, its material assumption, insertion direction and process
      assumption are recorded
  outcome_when_unsatisfied:
    physical_predicate: NOT_EVALUABLE
    reason: REPRESENTATION_INCOMPLETE
    must_not_be_reported_as: [FAIL, physically_inadmissible]

stages:
  s01:
    must_exist: [requirements, scenarios, actors, system_boundary, observables, assumptions, unknowns]
    must_not_be_decided: [mechanism_family, product_layout, parts, geometry, dimensions, materials]
    may_remain_unresolved: [UNR-BM-002-001, UNR-BM-002-002, UNR-BM-002-003, UNR-BM-002-004, UNR-BM-002-005, UNR-BM-002-006, UNR-BM-002-007]
    provenance_required: ["requirement -> source clause id"]
    quantity_note: >
      REQ-002 and REQ-003 carry stated quantities with an "approximately"
      qualifier. The qualifier must be preserved as part of the requirement, not
      discarded to produce a crisp bound (AMB-002-02).
  s02:
    must_exist: [obligations, physical_interactions, body_hypotheses, states, transitions, candidates]
    must_not_be_decided: [selected_candidate, conversion_mechanism, product_faces, geometry]
    may_remain_unresolved: [candidate_ranking, UNR-BM-002-003, UNR-BM-002-004]
    provenance_required: ["obligation -> requirement id"]
    open_search_note: >
      Corrected at SF-8.3; the former fixed-plurality rule is withdrawn. One
      candidate may legitimately remain after source- and physics-based
      elimination. What must hold instead:
        - the solution space was not closed merely by current library availability;
        - each rejected candidate carries a source, physical or feasibility reason;
        - synthesis beyond the provider catalogue remained possible;
        - an absent implemented realizer yields UNSUPPORTED, never INFEASIBLE.
  s03:
    must_exist: [fixed_and_moving_bodies, enclosure_and_cavity_topology, boundary_crossing, payload_access_path, interface_ownership, load_path_ownership, assembly_dependency_graph]
    must_not_be_decided: [crossing_face_without_evidence, detailed_feature_geometry, selected_candidate]
    may_remain_unresolved: [crossing_region, access_region, UNR-BM-002-001]
    provenance_required: ["body -> obligation id", "access_path -> requirement id"]
  s04:
    must_exist: [world_and_body_frames, joint_frames, axes, required_poses, motion_paths, engagement_sites, swept_volumes_with_fidelity, spatial_feasibility_per_candidate, declared_terminal_states_if_any]
    must_not_be_decided: [final_dimensions, manufacturing_features, renderer_originated_values]
    may_remain_unresolved: [free_spatial_alternatives]
    provenance_required: ["pose -> constraint/contact ids", "swept_volume -> fidelity declaration", "declared terminal -> its own determinant id"]
    corridor_note: >
      Corrected at SF-5.5. There is no proper-subset corridor obligation. What s04
      owes is non-intersection at every required pose and traversability of the
      required path; the swept volume may itself define the corridor.
    selection_gate: "A SelectionDecision may be emitted only after every retained candidate carries s03 and s04 feasibility evidence at equal obligation coverage."
  s05:
    must_exist: [connection_realizations, conversion_engagement_features, guidance_realization, reaction_realizations_for_carried_loads, feature_graph, construction_program, solver_problem, load_path_records]
    must_not_be_decided: [new_independent_entities, duplicate_bodies, parameter_values]
    may_remain_unresolved: [embodiment_alternatives, UNR-BM-002-004]
    provenance_required: ["realization -> obligation ids it discharges", "reaction realization -> the load component it reacts"]
    conditional_realization_note: >
      Corrected at SF-5.3 and SF-5.4. A radial or axial reaction is owed only for
      a load component the selected realization actually produces on that element.
      An anti-rotation realization is owed only where the scenario or the
      conversion requires it.
  s06:
    must_exist: [solved_values_or_explicit_status, constraint_residuals, feasibility_report, active_constraints]
    must_not_be_decided: [default_units, deferred_constraints]
    may_remain_unresolved: [underdetermined_degrees_of_freedom]
    provenance_required: ["value -> constraint id", "value -> unit declared at its source"]
    unit_note: >
      REQ-002 states its unit (mm). No value may acquire a unit by default. A
      quantity whose unit is not carried from its source is a defect, not a
      formatting matter.
  s07:
    must_exist: [cad_manifest, geometry_build_report, model_hashes]
    must_not_be_decided: [form, placement, axis, interface, missing_dimensions]
    may_remain_unresolved: []
    provenance_required: ["cad_entity -> construction statement id"]
  s08:
    must_exist: [verification_plan, requirement_test_map, model_fidelity_report, observables_with_units]
    must_not_be_decided: [hidden_disturbance, hidden_effort, hidden_material]
    may_remain_unresolved: ["tests blocked by UNR-BM-002-002", "tests blocked by UNR-BM-002-005"]
    provenance_required: ["test -> requirement id + criterion id"]
    fidelity_note: >
      A test addressing REQ-007 must declare whether it resolves contact. A
      declared-pair (V-A) test may not be mapped to REQ-007 (EV-BM-002-001).
  s09:
    must_exist: [verification_results, raw_evidence, execution_environment]
    must_not_be_decided: [requirement_reinterpretation]
    may_remain_unresolved: []
    provenance_required: ["result -> plan item id"]
  s10:
    must_exist: ["exactly one outcome per planned observable"]
    must_not_be_decided: [which_requirement_passes]
    may_remain_unresolved: []
    provenance_required: ["evidence -> observable id"]
  s11:
    must_exist: [requirement_evaluation, evidence_coverage, acceptance_summary]
    unresolved_scope_rule: >
      An unresolved decision suppresses only the outcomes named in its
      `block_scopes`. A quantitative unknown may withhold PASS or make an
      acceptance INDETERMINATE; it may never make a structural predicate
      underivable.
    must_not_be_decided: [new_evidence]
    may_remain_unresolved: []
    provenance_required: ["evaluation -> evidence ids", "PASS -> declared scope"]
    outcome_rules:
      REQ-001:
        pass_requires: "kinematic evidence that the platform rises and falls in response to the external input, at a declared fidelity, with the chain traversable"
        fail_when: "the chain is broken or the platform does not respond to the input"
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      REQ-002:
        traces_to: NRM-BM-002-004
        pass_requires: "measured platform displacement, in millimetres, within 80-100 mm, with the compliance edge of 'approximately' resolved (UNR-BM-002-002)"
        fail_when: "measured displacement is clearly outside the band under any reading of the qualifier - for example 45 mm"
        if_near_band_edge: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      REQ-003:
        traces_to: [NRM-BM-002-005, NRM-BM-002-011]
        pass_requires: "a declared supported payload with unit, a complete load path, and strength evidence for approximately 1 kg with a declared margin (UNR-BM-002-007)"
        fail_when: "no payload is declared, the load path is incomplete, or evidence shows the payload is not carried"
        if_no_strength_evidence_exists: UNSUPPORTED
        if_near_qualifier_edge: INDETERMINATE
        note: "DOS-BM-002 S5 records no strength evidence at any fidelity, so today this resolves to UNSUPPORTED. That is a tooling and evidence state, not a product verdict."
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      REQ-004:
        pass_requires: "evidence the mechanism remains within the housing during operation, evaluated under a resolved reading of the boundary-crossing element (UNR-BM-002-001)"
        fail_when: "a mechanism element leaves the housing during operation under the resolved reading"
        if_unresolved: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      REQ-005:
        pass_requires: "a declared safety criterion (UNR-BM-002-005 resolved) plus evidence against it"
        fail_when: "the declared criterion is violated"
        if_unresolved: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      REQ-006:
        pass_requires: >
          a physically realizable installation process demonstrated for every discretely-installed part, in which no component passes through UNDECLARED rigid material, plus an acyclic assembly order, and a manufacturability model with a declared scope
        must_not_fail_when: >
          insertion involves intended contact; or a declared snap, press, interference or compliant insertion lacks a collision-free path but is physically coherent; or a co-formed, bonded or permanently joined region owes no discrete insertion path
        if_representation_incomplete: NOT_EVALUABLE
        representation_incomplete_reason: >
          REPRESENTATION_INCOMPLETE - interaction classification, compliant region identity, material, insertion direction or process assumption missing from DesignState. This is NOT a physical FAIL.
        fail_when: >
          a rigid part must pass through UNDECLARED rigid material; or a claimed snap process has no physically compliant region; or a claimed interference process is physically incoherent; or no realizable assembly process exists under the declared assumptions; or the order contains a cycle; or the manufacturability model reports the design outside its declared envelope
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
        force_adequacy_note: >
          Insertion FORCE and process adequacy are NOT covered by this rule and are NOT structurally proven by a PASS. They remain quantitative and unresolved at UNR-BM-002-008.
        corrected_at: FPC-001
        correction_note: >
          The retired requirement was "a part has no collision-free installation path". A press fit has no collision-free path and is still assemblable, so that rule could FAIL a physically valid design. Now projects the active contract NRM-BM-002-012 already carries: installation_process_physically_realizable.
      REQ-007:
        pass_requires: "a declared jamming and stability criterion (UNR-BM-002-005 resolved) plus contact-resolving evidence at the conversion and guidance engagements"
        fail_when: "the declared criterion is violated"
        if_evidence_is_declared_pair_only: NOT_VERIFIED
        if_unresolved: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      REQ-008:
        pass_requires: "a declared desktop envelope (UNR-BM-002-006 resolved) plus the produced product dimensions within it"
        fail_when: "the produced dimensions exceed the declared envelope"
        if_unresolved: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      REQ-009:
        pass_requires: "no element of the drive chain is declared as a powered or stored-energy driving source"
        fail_when: "such an element exists"
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
  s12:
    must_exist: [revision_plan, root_cause_candidates, rerun_closure, preserved_commitments]
    must_not_be_decided: [coarse_enum_to_stage_mapping]
    may_remain_unresolved: []
    provenance_required: ["root_cause -> owning decision id"]
    capability_gap_rule: >
      A revision triggered by UNSUPPORTED must name the absent capability. It may
      never be recorded as a physical infeasibility of the product
      (NEG-BM-002-009).
