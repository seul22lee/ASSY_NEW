case_id: C4-drawer
schema_version: "0.3.0"
domain: evidence_and_verification
note: >
  Evidence and verification-process admissibility, separated from physical design
  at finding SF-1.1. Tests NRM-C4-012 and NRM-C4-013 only.

evidence_tag_vocabulary:
  guidance_observable_can_fail: "every observable mapped to a guidance criterion can take a non-conforming value under its own model"
  reuse_origin_declared: "every cited result carries the case it was produced for; carried-over results are marked as reused"

admissible_evidence_cases:
  - id: ADM-EV-C4-A
    summary: "Contact-resolved travel in which the guide is modelled as engagement geometry, so off-axis deviation can exceed its threshold; results cited for C4-drawer and produced for it."
    tags: [guidance_observable_can_fail, reuse_origin_declared]
  - id: ADM-EV-C4-B
    summary: >
      The m13 lift-variant result cited explicitly as reused from that case, with
      guidance reported NOT_VERIFIED because the declared-pair model cannot
      produce a non-zero off-axis deviation.
    note: "Admitted although it verifies nothing. Declaring reuse and declaring what the model cannot show are both correct behaviour."
    tags: [guidance_observable_can_fail, reuse_origin_declared]

inadmissible_evidence_cases:
  - id: INA-EV-C4-A
    summary: "Guidance reported as demonstrated because off-axis deviation of 0.0 degrees was observed under a declared prismatic pair."
    from_negative_case: NEG-C4-010
    missing_tags: [guidance_observable_can_fail]
    tags: [reuse_origin_declared]
  - id: INA-EV-C4-B
    summary: "C4-drawer reported physics-verified on a result produced for the lift variant and carried across with nothing marking the reuse."
    from_negative_case: NEG-C4-011
    missing_tags: [reuse_origin_declared]
    tags: [guidance_observable_can_fail]
