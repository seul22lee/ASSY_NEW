case_id: C4-drawer
schema_version: "0.3.0"
domain: physical_design
note: >
  PHYSICAL design fixtures only (finding SF-1.1). ADM-C4-C and ADM-C4-D exist to
  falsify the retired universal premises about anti-rotation, axial load and
  terminal bounds.

physical_tag_vocabulary:
  no_undeclared_volumetric_overlap: "no two solids occupy the same space outside a declared contact, interference-fit or compliant-interaction region, under the declared tolerance"
  intended_interaction_physically_consistent: "each intended interaction is physically coherent: a compliant region can actually deflect, an interference fit is takeable up in strain, a contact face exists on both participating bodies"
  installation_process_physically_realizable: "a realizable installation process exists in which no part passes through undeclared rigid material; intended insertion contact is allowed; declared press/snap/interference/compliant insertion is physically coherent; co-formed or bonded regions declare that relation and owe no discrete insertion process"
  rotary_user_input: "a user-operated rotary input exists"
  translating_drawer: "a translating drawer exists"
  continuous_interaction_chain: "an uninterrupted chain of realized interactions connects them"
  travel_axis_horizontal: "the travel path is a straight line whose axis is perpendicular to gravity, by geometric relation (HSD-004)"
  retracted_state_inside: "a retracted configuration exists with the drawer inside the cabinet envelope"
  extended_state_projects_outside: "an extended configuration exists with part of the drawer outside it"
  transition_traversable: "a traversable path connects the two configurations"
  conversion_engagement_localized: "at least one interaction converts rotation to translation, with geometry on both bodies"
  drawer_motion_guided: "the drawer path is constrained where the required sliding behaviour depends on it"
  required_orientation_preserved: "orientation is constrained where the behaviour or the conversion requires it"
  drawer_weight_reacted_throughout_travel: "the drawer's own weight has a reaction path at every configuration"
  declared_ends_physically_produced: "any configuration declared a physical end of travel is produced by its own realized condition"
  knob_externally_reachable: "an access path from the user region reaches the knob in the retracted configuration"
  boundary_crossing_realized: "the chain crosses the cabinet boundary at a realized crossing"
  loaded_elements_reacted: "every element has a reaction for every load component it actually carries"
  required_path_traversable: "the path between configurations is traversable"

admissible_realizations:
  - id: ADM-C4-A
    summary: >
      Knob shaft carries a toothed wheel engaging a toothed member on the drawer
      underside; drawer runs on two side rails that also remove rotation. Both
      ends declared as physical ends of travel, set by an abutment at each end of
      one rail.
    family: toothed_wheel_and_linear_member
    load_profile: "shaft carries radial tooth load at two journals; no axial load; rails carry the drawer weight throughout travel"
    materially_differs_by: [conversion_principle, guidance_type, terminal_form]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-C4-A

  - id: ADM-C4-B
    summary: >
      Knob drives a threaded rod along the travel direction; a follower on the
      drawer translates. Drawer runs in a dovetailed channel formed in the cabinet
      shell, which guides it and removes rotation. Ends declared at thread run-out
      and at a shoulder.
    family: helical_thread_and_follower
    load_profile: "rod carries axial thrust reacted at an end seat and radial load at its journals; channel carries the drawer weight"
    materially_differs_by: [conversion_principle, guidance_type, part_count, terminal_form]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-C4-B

  - id: ADM-C4-C
    summary: >
      Knob turns a drum winding a band to each end of the drawer, pulling it out
      and back. Drawer is carried on rolling supports in a tray recess whose walls
      keep it square. NO configuration is declared a physical end of travel: the
      drawer simply reaches a retracted and a projected-out configuration, and the
      user stops turning.
    family: band_and_drum
    load_profile: "drum carries radial band tension at its journals; NO axial load anywhere; rollers carry the drawer weight throughout travel"
    materially_differs_by: [conversion_principle, guidance_type, support_principle, terminal_form]
    note: >
      FALSIFIES the retired universal axial-load premise (SF-6.5) - nothing here
      carries axial load - and the retired unconditional terminal requirement
      (SF-6.3) - DOS-C4-drawer S3 records that no travel limit is stated.
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-C4-C

  - id: ADM-C4-D
    summary: >
      Knob drives a centred crank and connecting link to a drawer carrier running
      in a single wide channel. The drawer is a shallow open tray whose angular
      position about the travel axis is immaterial to the required sliding
      behaviour; nothing restrains rotation about the travel direction beyond the
      channel walls' incidental contact, and the symmetric centred drive applies
      no net moment about that axis.
    family: crank_and_link
    load_profile: "crank pin carries radial load at its journal; the link carries axial load along itself reacted at both pins; the channel carries the drawer weight"
    materially_differs_by: [conversion_principle, relation_linearity, anti_rotation_source]
    note: >
      FALSIFIES the retired universal moment premise (SF-6.1). A centred symmetric
      drive applies no moment about the travel direction, so no dedicated
      anti-rotation provision is owed.
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-C4-D

inadmissible_realizations:
  - id: INA-C4-A
    summary: "Drawer translation related to knob angle by a declared ratio with no participating geometry anywhere in the chain."
    from_negative_case: NEG-C4-001
    missing_tags: [conversion_engagement_localized, intended_interaction_physically_consistent]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-A
  - id: INA-C4-B
    summary: "Drawer travel axis is vertical; the design lifts the drawer out of the cabinet top."
    from_negative_case: NEG-C4-002
    missing_tags: [travel_axis_horizontal]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-B
  - id: INA-C4-C
    summary: "Drawer translates along a horizontal axis but remains wholly within the cabinet envelope at its extended configuration; nothing slides out."
    from_negative_case: NEG-C4-003
    missing_tags: [extended_state_projects_outside]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-C
  - id: INA-C4-D
    summary: "Drawer is supported only at its retracted position; at full extension its weight has no reaction path and the drawer runs off the end of its supports."
    from_negative_case: NEG-C4-004
    missing_tags: [drawer_weight_reacted_throughout_travel]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-D
  - id: INA-C4-E
    summary: >
      Deep drawer driven by a single off-centre toothed engagement at one side,
      free to yaw in an oversize channel; at part travel it skews and jams,
      defeating the required sliding behaviour.
    from_negative_case: NEG-C4-005
    missing_tags: [required_orientation_preserved, no_undeclared_volumetric_overlap]
    note: "Rejected because the REQUIRED behaviour fails, not because anti-rotation is universally owed. ADM-C4-D has no dedicated anti-rotation and is admitted."
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-E
  - id: INA-C4-F
    summary: "Both configurations are DECLARED physical ends of travel; one condition is evaluated once and its result copied to both."
    from_negative_case: NEG-C4-006
    missing_tags: [declared_ends_physically_produced]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-F
  - id: INA-C4-G
    summary: "Knob placed inside the cabinet, reachable only after the drawer is already open."
    from_negative_case: NEG-C4-007
    missing_tags: [knob_externally_reachable]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-G
  - id: INA-C4-H
    summary: "Drawer's emergence path passes through the cabinet front panel, which has no opening."
    from_negative_case: NEG-C4-008
    missing_tags: [required_path_traversable, no_undeclared_volumetric_overlap]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-H
  - id: INA-C4-I
    summary: "Knob shaft demonstrably carries radial load from its conversion engagement, with no radial reaction anywhere in the design."
    from_negative_case: NEG-C4-009
    missing_tags: [loaded_elements_reacted]
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, required_path_traversable, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-I
  - id: INA-C4-J
    summary: "Knob shaft passes through a clearance hole and fouls the cabinet wall over part of its rotation; the interference is unmodelled."
    from_negative_case: NEG-C4-018
    missing_tags: [no_undeclared_volumetric_overlap]
    note: "Added at SF-6.4. Rejected for interference, not for lacking cabinet-local support."
    tags: [rotary_user_input, translating_drawer, continuous_interaction_chain, travel_axis_horizontal, retracted_state_inside, extended_state_projects_outside, transition_traversable, conversion_engagement_localized, drawer_motion_guided, required_orientation_preserved, drawer_weight_reacted_throughout_travel, declared_ends_physically_produced, knob_externally_reachable, boundary_crossing_realized, loaded_elements_reacted, required_path_traversable, intended_interaction_physically_consistent, installation_process_physically_realizable]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-C4-J

retired_contracts:
  note: >
    Historical only. Nothing here contributes to any PASS/FAIL decision. Listed so a
    reader recognises a retired contract if it reappears.
  entries:
    - tag: interaction_regions_declared
      why: >
        REPRESENTATION property; moved to stage_expectations evaluability_prerequisites at PCF-004
    - tag: assembly_paths_exist
      why: >
        RETIRED at PCF-006; it excluded every press fit and snap fit, and is replaced by installation_process_physically_realizable
    - tag: assembly_process_realizable
      why: >
        RENAMED at PCF-006 to installation_process_physically_realizable
    - tag: pose_clearances_satisfied
      why: >
        RETIRED at PCF-007; blanket non-intersection wording absorbed into no_undeclared_volumetric_overlap
    - tag: crossing_non_interfering
      why: >
        RETIRED at PCF-007; blanket non-interference wording absorbed into no_undeclared_volumetric_overlap
