case_id: C4-drawer
schema_version: "0.2.0"
note: >
  Three materially different designs, each satisfying every invariant. ADM-C
  uses neither a toothed transmission nor sliding rails; it is admitted to prove
  the pack has not absorbed the legacy rack-and-rail realization.

admissible_realizations:
  - id: ADM-C4-A
    summary: "Knob shaft carries a toothed wheel engaging a toothed member on the drawer underside; drawer runs on two side rails that also remove rotation; extremes set by an abutment at each end of one rail."
    materially_differs_by: [conversion_principle, guidance_type, extreme_determinant]
    tags: ['rotary_user_input', 'translating_drawer', 'continuous_motion_chain', 'travel_axis_horizontal', 'retracted_state_inside', 'extended_state_projects_outside', 'transition_traversable', 'conversion_realized', 'conversion_engagement_localized', 'drawer_guided', 'drawer_anti_rotation', 'weight_reacted_throughout_travel', 'two_extremes_distinctly_determined', 'knob_externally_reachable', 'boundary_crossing_realized', 'crossing_element_supported', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'corridor_not_fully_occupied', 'emergence_path_clear', 'assembly_paths_exist']
  - id: ADM-C4-B
    summary: "Knob drives a threaded rod along the travel direction; a follower on the drawer translates. Drawer runs in a dovetailed channel formed in the cabinet shell, which guides it and removes rotation. Extremes set by thread run-out at one end and a shoulder at the other."
    materially_differs_by: [conversion_principle, guidance_type, part_count, extreme_determinant]
    tags: ['rotary_user_input', 'translating_drawer', 'continuous_motion_chain', 'travel_axis_horizontal', 'retracted_state_inside', 'extended_state_projects_outside', 'transition_traversable', 'conversion_realized', 'conversion_engagement_localized', 'drawer_guided', 'drawer_anti_rotation', 'weight_reacted_throughout_travel', 'two_extremes_distinctly_determined', 'knob_externally_reachable', 'boundary_crossing_realized', 'crossing_element_supported', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'corridor_not_fully_occupied', 'emergence_path_clear', 'assembly_paths_exist']
  - id: ADM-C4-C
    summary: "Knob turns a drum winding a band to each end of the drawer, pulling it out and back. Drawer is carried on rolling supports in a tray recess whose walls remove rotation. Extremes set by band pay-out at full extension and by drawer face meeting the cabinet front at full retraction."
    materially_differs_by: [conversion_principle, guidance_type, support_principle, extreme_determinant]
    note: "No teeth and no sliding rail. Admitted because guidance, anti-rotation and conversion are stated as functions, not as mechanisms."
    tags: ['rotary_user_input', 'translating_drawer', 'continuous_motion_chain', 'travel_axis_horizontal', 'retracted_state_inside', 'extended_state_projects_outside', 'transition_traversable', 'conversion_realized', 'conversion_engagement_localized', 'drawer_guided', 'drawer_anti_rotation', 'weight_reacted_throughout_travel', 'two_extremes_distinctly_determined', 'knob_externally_reachable', 'boundary_crossing_realized', 'crossing_element_supported', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'corridor_not_fully_occupied', 'emergence_path_clear', 'assembly_paths_exist']

inadmissible_realizations:
  - id: INA-C4-A
    summary: "Drawer translation related to knob angle by a declared ratio with no engagement geometry between them."
    from_negative_case: NEG-C4-001
    missing_tags: [conversion_realized, conversion_engagement_localized]
    tags: ['rotary_user_input', 'translating_drawer', 'continuous_motion_chain', 'travel_axis_horizontal', 'retracted_state_inside', 'extended_state_projects_outside', 'transition_traversable', 'drawer_guided', 'drawer_anti_rotation', 'weight_reacted_throughout_travel', 'two_extremes_distinctly_determined', 'knob_externally_reachable', 'boundary_crossing_realized', 'crossing_element_supported', 'rotating_elements_radially_supported', 'axial_reaction_realized', 'corridor_not_fully_occupied', 'emergence_path_clear', 'assembly_paths_exist']
  - id: INA-C4-B
