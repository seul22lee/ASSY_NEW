correction_note: >
  Corrected at findings SF-6.1 through SF-6.6. The entire rank-1 request is one
  sentence, so every derived statement was re-tested for necessity against
  materially different realizations rather than retained because it is common in
  the legacy realization.

source_note: >
  The whole rank-1 source is: "Design a desktop cabinet whose drawer slides out
  horizontally when you turn a knob." Everything else in the legacy record is
  realization detail, scoring commentary or reused evidence.

