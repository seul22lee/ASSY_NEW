  source_derived_proposition: The same closure opens and closes repeatedly; a body does not gain or lose
    material by changing state.
  review_result: physically_necessary
  counterexample_considered: A compliant shell that visibly changes shape between states.
  counterexample_outcome: Admitted — shape change is attributed to a declared compliant region. Content,
    not extent, is conserved.
  predicate_scope_reviewed: true
  derivation_premises_reviewed: true
  note: null
