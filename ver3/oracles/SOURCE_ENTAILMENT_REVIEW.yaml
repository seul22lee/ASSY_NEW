schema_version: 0.3.0
purpose: 'Source-entailment review. Locator existence is not semantic entailment: this record asks, for
  every normative statement, what proposition the frozen source actually yields, whether the statement
  follows from it, and what counterexample was tried against it. It is a REVIEW RECORD, never Oracle evidence,
  and nothing in a pack may cite it.'
method: For each statement the frozen dossier was read first and the source-derived proposition written
  before the statement was compared to it. Every NECESSARY_PHYSICAL_CONSEQUENCE was given at least one
  materially different candidate realization chosen to satisfy the requirement while violating the proposed
  consequence. Where one was found the statement was weakened, conditioned or removed, and the outcome
  says so.
result_vocabulary:
  directly_entailed: the statement restates a fragment of the source and adds nothing
  physically_necessary: the statement does not appear in the source but no realization satisfying the
    source can violate it
  conditional: the statement holds only within a declared domain, recorded in applies_when or exclusions
  unsupported: no source and no physical argument sustains it - BLOCKING if present
summary:
  total_statements: 73
  directly_entailed: 20
  physically_necessary: 35
  conditional: 18
  unsupported: 0
  re_reviewed_this_pass: 10
reviews:
- statement_id: NRM-BM-001-001
  pack: BM-001
  source_locator: DOS-BM-001 S1 REQ-001
  source_derived_proposition: The product must provide a mechanism for repeatedly opening and closing
    the box; therefore an open state, a closed state, and a motion between them exist.
  review_result: directly_entailed
  counterexample_considered: 'A design with one state and a removable wall: is that "opening and closing"?'
  counterexample_outcome: It still has two states and a transition; removal IS the transition. No narrowing
    needed.
  predicate_scope_reviewed: true
  derivation_premises_reviewed: false
  note: Statement adds nothing to REQ-001 beyond naming its parts.
- statement_id: NRM-BM-001-002
  pack: BM-001
  source_locator: DOS-BM-001 S1 REQ-001
  source_derived_proposition: Repeated relative motion between two bodies is produced by material interaction
    between them.
  review_result: physically_necessary
  counterexample_considered: A rigid "snap" that cannot deflect, and a press fit with no material relation
    - do they realize their declared interaction?
  counterexample_outcome: Neither does. Scope extended at PCF-004 so the invariant owns interaction COHERENCE;
    INA-BM-001-K and INA-BM-001-L are now rejected by it. Before the extension they passed every BM-001
    physical invariant.
  predicate_scope_reviewed: true
  derivation_premises_reviewed: true
  note: null
  re_reviewed_at: PCF pre-CAD rebuild
- statement_id: NRM-BM-001-003
