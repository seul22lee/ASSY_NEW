  source_locator: DOS-BM-001 S1 REQ-001 + product_intent
  source_derived_proposition: The box must open, and it is a storage box; therefore at OPEN the declared
    usable access must not be obstructed by the closure.
  review_result: conditional
  counterexample_considered: A lid whose hinge bore, rim seat and stop face all TOUCH the body - does
    the statement reject it?
  counterexample_outcome: It did. The statement said the swept region "does not intersect the enclosure
    solid" while its own predicate already permitted declared contact. Re-authored at PCF-007 so statement
    and predicate agree; ADM-BM-001-E has three declared contacts and is admissible.
  predicate_scope_reviewed: true
  derivation_premises_reviewed: true
  note: Corrected at SF-2.1. Adequacy of the declared region is held at UNR-BM-001-006.
  re_reviewed_at: PCF pre-CAD rebuild
- statement_id: NRM-BM-001-004
