prior_context_disclosure:
  statement: >
    Stating this because an isolation claim that omits it would be false.
  detail: >
    This authoring session is a continuation of a longer working session that
    earlier produced CAD and simulation work for BM-002, and authored the BM-003
    SOURCE. The BM-002 realization was therefore known to the author before this
    task began. It was not consulted, and nothing in this Oracle derives from it:
    BM-002 is an enclosed crank-driven platform lift, sharing no mechanism,
    topology or state-maintenance principle with a folding three-leg stand.
  mitigation:
    - "No BM-002 or BM-001 file was opened during this task."
    - "No mechanism family in realizations.yaml resembles the BM-002 architecture."
    - "Every invariant traces to a BM-003 source clause; the auditor enforces it."
    - "Five state-maintenance principles are admitted, none preferred, so no single remembered design could be the target."
  residual_risk: >
    Having authored the BM-003 source, the author knew what the source says
    before reading it here. That is unavoidable in a single-agent session and is
    the reason ORACLE_METHOD prefers a different author for the Oracle than for
    the request. Recorded as a known limitation rather than claimed away, and it
    is the item a human reviewer should weigh first.
  recommended_human_action: >
    An independent reviewer should confirm that no invariant narrows the solution
    space beyond the source, and that the five admissible families are genuinely
    all admitted.

