    No source-only run of BM-003 has occurred - no stage is implemented - so this
    Oracle necessarily predates every run of the benchmark it judges. That
    ordering is what BENCHMARK_RESULT_CONTRACT requires, and it is satisfied here
    by construction rather than by discipline.

change_procedure:
  statement: "A frozen Oracle changes only through a recorded proposal, never as part of an implementation commit."
  required_of_a_proposal:
    - "The old statement and the proposed statement, verbatim."
    - "The new evidence, with its source rank."
    - "Why the old statement is DEFECTIVE, not merely inconvenient."
    - "Impact on every other statement in this pack."
    - "An explicit benchmark-overfitting risk assessment."
  never_permitted:
    - "Editing an Oracle statement to make a failing run pass."
    - "Adding a requirement after seeing what a run produced."
