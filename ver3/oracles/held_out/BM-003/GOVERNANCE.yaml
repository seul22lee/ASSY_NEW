integrity:
  hash_manifest: ver3/oracles/held_out/BM-003/ORACLE_HASHES.yaml
  auditor: ver3/oracle_tools/audit_bm003_oracle.py
  mutation_tests: ver3/tests/meta/test_bm003_oracle.py
  rule: "Any drift in a hashed file fails the suite."

placement_rationale:
  where: ver3/oracles/held_out/BM-003/
  why_not_product_cases: >
    The existing product_cases packs derive from frozen DOSSIERS with rank-1
    locators, and ver3/oracle_tools/audit_oracles.py enumerates and validates
    them on that basis. BM-003's authority is a frozen BENCHMARK SOURCE instead,
    so its provenance model differs and it carries its own auditor. Placing it
    under product_cases would either break that auditor's clean baseline or
    require editing frozen tooling to accommodate a different provenance model -
    both worse than a separate tree.
