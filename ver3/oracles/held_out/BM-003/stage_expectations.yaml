    - AMB-BM-003-008
    - AMB-BM-003-009
    - AMB-BM-003-010
    stage_relevant_unresolved:
    - AMB-BM-003-004
    - AMB-BM-003-005
  s05:
    role_as_evaluated: Attaches features and binds them into realizations discharging obligations.
    must_make_available:
    - The embodiment of the SELECTED candidate, whichever family it is.
    - For every declared joint and retention, the realizing feature on all participating bodies
      OR functional regions, appropriate to the declared realization class.
    - For every retention, the blocked escape direction.
    - The obligation to realization to verification-predicate chain.
    must_not_decide:
    - Any dimension the source or a constraint does not force.
    - Substituting a different mechanism family for the one already selected.
    - Re-opening the candidate selection that s02-s04 own.
    downstream_needs: s06 needs parameters with units; s07 needs a construction program.
    evidence_before_progression: No relationship exists only as a label.
    negative_cases_guarded:
    - NEG-BM-003-008
    - NEG-BM-003-009
    must_preserve_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
    - AMB-BM-003-005
    - AMB-BM-003-006
    - AMB-BM-003-007
    - AMB-BM-003-008
    - AMB-BM-003-009
    - AMB-BM-003-010
    stage_relevant_unresolved:
    - AMB-BM-003-006
    - AMB-BM-003-008
    must_embody_selected_candidate: true
    oracle_has_no_preferred_family: S05 is graded on embodying the candidate the run selected, never on
      matching any family this Oracle happens to list. realizations.yaml is a permissiveness fixture,
      not a menu.
  s06:
    role_as_evaluated: Resolves parameters against declared constraints.
    must_make_available:
    - Solved values with units, or a recorded reason the system is not solvable.
    - Any solution freedom where a family of solutions exists.
    must_not_decide:
    - A value for a quantity the source leaves open, presented as required.
    - Any threshold for compactness, footprint, effort or capacity.
    downstream_needs: s07 needs resolved parameters and nothing else.
    evidence_before_progression: No unit defaulted; no invented threshold.
    negative_case_guarded: NEG-BM-003-017
    must_preserve_unresolved:
    - AMB-BM-003-001
