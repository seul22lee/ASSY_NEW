  s09:
    role_as_evaluated: Executes the plan and records what was measured.
    must_make_available:
    - Outcomes with fidelity and contact resolution declared.
    - Coverage of ALL THREE legs, not one generalized.
    - Measured negative-control detection.
    must_not_decide:
