schema_version: 0.1.0
oracle_name: HELD_OUT_BENCHMARK_ORACLE
benchmark_id: BM-003
solution_neutrality_rule: 'No expectation below names a mechanism, a joint type, a body count or a dimension.
  An expectation that did would leak a preferred solution into the evaluation of every run, which is the
  failure a held-out Oracle exists to avoid. The auditor checks this file against the freedoms list.

  '
stages:
  s01:
    role_as_evaluated: Turns the frozen source into typed requirements and records what it leaves open.
    must_make_available:
    - Every source clause represented, verbatim, with a locator.
    - The three legs, the fold/deploy behaviour, the deliberate release, and the attachment requirements
      as separate requirements.
    - Every ambiguity in ambiguities.yaml recorded as open.
    - Every freedom in freedoms.yaml recorded as a freedom.
    must_not_decide:
    - Any mechanism, joint type, body count or dimension.
    - What 'compact', 'usable footprint' or 'small object' quantitatively mean.
    - What disturbance 'knocked it' represents.
    downstream_needs: s02 needs requirements with their qualifiers intact, and the open set explicit.
    evidence_before_progression: Every clause mapped; no numeric threshold introduced.
    must_preserve_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
    - AMB-BM-003-005
    - AMB-BM-003-006
    - AMB-BM-003-007
    - AMB-BM-003-008
    - AMB-BM-003-009
    - AMB-BM-003-010
    stage_relevant_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
    - AMB-BM-003-005
    - AMB-BM-003-006
    - AMB-BM-003-007
    - AMB-BM-003-008
    - AMB-BM-003-009
    - AMB-BM-003-010
  s02:
    role_as_evaluated: Derives physical obligations and forms candidate approaches.
    must_make_available:
    - 'An obligation for each of: three legs retained, stored connectedness, deployment path, footprint
      non-degeneracy, deployed state maintenance, deliberate release, return path, assembly coherence.'
    - Candidates spanning materially different state-maintenance principles.
    must_not_decide:
    - Which candidate wins.
    - That any mechanism family is required or excluded.
    downstream_needs: s03 needs obligations that constrain topology without naming it.
    evidence_before_progression: At least two materially different candidates persist.
    negative_case_guarded: NEG-BM-003-013
    must_preserve_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
    - AMB-BM-003-005
    - AMB-BM-003-006
    - AMB-BM-003-007
    - AMB-BM-003-008
    - AMB-BM-003-009
    - AMB-BM-003-010
    stage_relevant_unresolved:
    - AMB-BM-003-002
    - AMB-BM-003-006
  s03:
    role_as_evaluated: Establishes bodies, joints, interfaces and configurations.
    must_make_available:
    - Three identifiable legs and their connections.
    - The configurations of configurations.yaml, or an equivalent representation.
    - 'Per configuration: intended and forbidden gross mobility.'
    - An ordered assembly sequence with acyclic dependencies.
    - Every retention relationship, with the direction it blocks.
    must_not_decide:
    - The state-maintenance principle, if a candidate has not required one.
    - Any dimension not forced by a declared relationship.
    downstream_needs: s04 needs a declared forbidden mobility set; without it unintended-DOF checking
      cannot fail.
    evidence_before_progression: Assembly acyclic; every meeting region classified.
    negative_cases_guarded:
    - NEG-BM-003-002
    - NEG-BM-003-003
    - NEG-BM-003-012
    must_preserve_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
    - AMB-BM-003-005
    - AMB-BM-003-006
    - AMB-BM-003-007
    - AMB-BM-003-008
    - AMB-BM-003-009
    - AMB-BM-003-010
    stage_relevant_unresolved:
    - AMB-BM-003-003
    - AMB-BM-003-007
  s04:
    role_as_evaluated: Establishes states, transitions and motion witnesses.
    must_make_available:
    - Continuous sampled paths for deploy and fold, with declared sampling.
    - Evidence that DEPLOYED persists, appropriate to the declared state-maintenance class.
    - Evidence that after the deliberate action folding can proceed.
    - Interference results over the path interior, leg-leg included.
    - Retention active at every sampled configuration.
    - The declared state-maintenance class, and evidence from a route compatible with it.
    - 'For a class whose route is unavailable: persistence recorded NOT_VERIFIED, not FAIL.'
    must_not_decide:
    - That a property holds because the endpoints hold.
    - That an unmodelled constraint stands in for absent geometry.
    - That a design fails because a folding kinematic path exists - only SMC-KINEMATIC_BLOCK claims its
      absence.
    downstream_needs: s05 needs to know which interfaces the motion actually depends on.
    evidence_before_progression: Interior sampling present; endpoint-only evidence is insufficient.
    negative_cases_guarded:
    - NEG-BM-003-001
    - NEG-BM-003-004
    - NEG-BM-003-005
    - NEG-BM-003-006
    - NEG-BM-003-007
    - NEG-BM-003-011
    must_preserve_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
    - AMB-BM-003-005
    - AMB-BM-003-006
