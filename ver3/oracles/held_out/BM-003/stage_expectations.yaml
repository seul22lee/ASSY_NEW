    - AMB-BM-003-010
    stage_relevant_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-003
  s07:
    role_as_evaluated: Compiles geometry from the construction program.
    must_make_available:
    - Built geometry with a signature, per body.
    - Stored and deployed envelopes, so relational compactness is checkable.
    - The stored and deployed envelopes under a declared frame, so NRM-BM-003-018 is checkable.
    must_not_decide:
    - Anything about requirements; it receives the program and the parameters only.
    downstream_needs: s08 needs geometry it can plan measurements against.
    evidence_before_progression: Compilation succeeds or fails citing the originating statement.
    negative_case_guarded: NEG-BM-003-016
    must_preserve_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
    - AMB-BM-003-005
    - AMB-BM-003-006
    - AMB-BM-003-007
    - AMB-BM-003-008
    - AMB-BM-003-009
    - AMB-BM-003-010
    stage_relevant_unresolved: []
  s08:
    role_as_evaluated: Plans verification and designs the negative controls.
    must_make_available:
    - A plan item per requirement, naming criterion, scenario, observable and planned fidelity.
    - For each fidelity, what it cannot support.
    - Negative controls able to fail.
    must_not_decide:
    - That a property is verified.
    - That rigid-body evidence can support a structural claim.
    downstream_needs: s09 needs a plan fixed before execution, so the plan is a prediction.
    evidence_before_progression: Every mandatory obligation has a plan item; no plan claims structural
      evidence.
    must_preserve_unresolved:
    - AMB-BM-003-001
    - AMB-BM-003-002
    - AMB-BM-003-003
    - AMB-BM-003-004
