not_production_instructions: 'Nothing here tells a stage HOW to do anything. Each entry describes what
  an evaluator should find in a completed output, and each was derived from the frozen source and this
  Oracle''s own invariants - never from a stage implementation, which was not read.

  '
unresolved_preservation_rule:
  statement: Every source-derived unresolved item remains available at EVERY stage, S01 through S12, unless
    a source-authorized or evidence-authorized resolution is recorded.
  two_lists_why: 'must_preserve_unresolved is CUMULATIVE and identical at every stage: DesignState does
    not delete, so an item open at S01 is open at S07 unless something closed it. stage_relevant_unresolved
    is the subset this stage actively consumes or investigates, which is genuinely stage-specific.'
  defect_this_corrects: Previously each stage listed only its relevant subset under must_leave_unresolved.
    S07 listed none. An item open at S01, absent at S07 and back at S12 reads as resolved at S07 and unexplained
    at S12 - silent resolution made invisible by the schema itself.
  corrected_at: semantic review F-09
candidate_selection_ownership:
  s02: Proposes candidates spanning materially different physical principles. Selects none.
  s03_s04: Develop comparable architecture and spatial/motion evidence across candidates.
  selection_gate: A candidate may be selected once sufficient comparable evidence exists. The selection
    is a recorded decision with provenance, not a given.
  s05: MUST EMBODY the selected candidate. Must NOT substitute a different family, and must not re-open
    the selection s02-s04 own.
  defect_this_corrects: S05's must_not_decide previously read 'Which mechanism family is correct', which
    forbade the stage whose job is to realize the mechanism from committing to one. The prohibition belongs
    on SUBSTITUTION, not on embodiment.
  corrected_at: semantic review F-10
