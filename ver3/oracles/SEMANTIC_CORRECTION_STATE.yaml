  affected_statements:
  - ADM-BM-001-3-B
  source_passages:
  - physical review, no source change
  correction_status: CORRECTED
  semantic_rationale: A single spherical cap on a rigid plane produces ONE ideal point contact, not three
    patches. The fixture was retained by tag assertion alone. Revised to three raised spherical lobes
    with coplanar apexes, which makes three point contacts physically possible. Coplanarity is now an
    explicit assumption in the plausibility review, pending CAD.
  files_changed:
