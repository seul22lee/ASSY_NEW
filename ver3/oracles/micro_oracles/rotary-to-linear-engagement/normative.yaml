capability_id: rotary-to-linear-engagement
schema_version: "0.2.0"
tier: micro_oracle
inherits: null
dossier: ver3/oracles/_dossiers/DOS-rotary-to-linear-engagement.md
lock_status: SEMANTICALLY_AUDITED

capability_statement: >
  Conversion of rotary input motion into linear output motion through a localized
  engagement, with the reaction of the resulting loads.

naming_note: >
  This capability is deliberately named for what it does, not for how it is done.
  It replaces an earlier mechanism-named micro-oracle. Rack-and-pinion is
  preserved only as a cited reference realization and evidence source; it is one
  member of the family this capability admits, and it may never stand for the
  family.

basis_semantics: >
  A micro-oracle has no user. Its rank-1 source is the declared capability
  statement in DOS S1. DIRECT_USER_REQUIREMENT marks fragments of that statement;
  NECESSARY_PHYSICAL_CONSEQUENCE marks statements derived from it;
  VERIFICATION_MINIMUM marks statements about what evidence must be able to show.

scope_exclusions:
  - "Guidance of the output body along its line is NOT owned here; see the guided-slider micro-oracle. This pack requires only the specific restraint without which the output would rotate instead of translating."
  - "Bounding of the output travel is NOT part of this capability; see bounded-two-state-closure."
  - "Holding position when the input is released is NOT part of this capability; see latch-retention."

invariants:
  - id: NRM-RL-001
    statement: >
      A rotating input body, a translating output body, and a localized
      engagement between them with geometry on both bodies all exist.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    conclusion_scope: "Existence and locality of the conversion engagement and its two participants."
    exclusions:
      - "Does not name a conversion family, an engagement geometry, a ratio or a tooth or thread form."
      - "Does not require the engagement to be a single site; several sites acting together are admissible."
    verification_predicate: "exists(rotating body), exists(translating output body), and exists(engagement) with participating geometry on each."
    requires_tags: [rotating_body, translating_output_body, engagement_localized_both_bodies]
    related_freedoms: [FRE-RL-001, FRE-RL-002]
    related_unresolved: []

  - id: NRM-RL-002
    statement: >
      A relation between input rotation and output translation is declared, with
      its direction of causation.
    basis_type: DIRECT_USER_REQUIREMENT
    support_type: direct
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    conclusion_scope: "Existence of a declared input/output relation."
    exclusions:
      - "Does not fix a ratio, a linearity, a sign or a reversibility. None exists at capability level (DOS S4); see UNR-RL-001."
      - "Does not require the relation to be derivable from a model of any particular fidelity."
    verification_predicate: "exists(relation) mapping input rotation to output translation over the output range, with the driving body identified."
    requires_tags: [input_output_relation_declared]
    related_freedoms: [FRE-RL-003, FRE-RL-004]
    related_unresolved: [UNR-RL-001]

  - id: NRM-RL-003
    statement: >
      The engagement remains engaged over the whole declared output range.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    derivation_premises:
      - "The capability is conversion over a range of output motion, not at one output position."
      - "Once the engagement ends, rotation no longer produces translation."
    conclusion_scope: "Persistence of the engagement over the declared output range."
    exclusions:
      - "Does not fix an engagement length or an output range. The legacy relation L_rack >= stroke + pi*m*z/4 is a rack-and-pinion fact (DOS S6), not a capability fact."
    verification_predicate: "for the extremes and the interior of the declared output range: the participating geometries overlap."
    requires_tags: [engagement_persists_over_output_range]
    related_freedoms: [FRE-RL-005]
    related_unresolved: [UNR-RL-002]

  - id: NRM-RL-004
    statement: >
      The output body has a realized restraint against following the input's
      rotation.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    derivation_premises:
      - "The engagement transmits a force between the two bodies at a location offset from the input axis."
      - "That force applies a moment to the output body about the input axis."
      - "An output body free to rotate under that moment rotates rather than translating, so no conversion occurs."
    conclusion_scope: "Existence of a restraint on the output body's rotation about the input axis."
    exclusions:
      - "The restraint may be provided by the engagement geometry itself where that geometry removes the freedom; a separate feature is not required."
      - "Does not require, and does not supply, general guidance of the output body. Guidance is owned by the guided-slider micro-oracle."
    verification_predicate: "exists(realized constraint) removing the output body's rotation about the input axis, naming the interaction that provides it."
    requires_tags: [output_rotation_restrained]
    related_freedoms: [FRE-RL-006]
    related_unresolved: []

  - id: NRM-RL-005
    statement: >
      The rotating body is supported against the radial component of the
      engagement force.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    derivation_premises:
      - "The engagement applies a force to the rotating body at a location offset from its axis."
      - "A rotating body carrying a transverse force without a radial constraint displaces, and the engagement is lost."
    conclusion_scope: "Existence of radial support for the rotating body."
    exclusions: ["Does not name a support type or a support count, and does not require a separate part."]
    verification_predicate: "exists(radial support realization) for the rotating body, located so that it reacts the engagement force."
    requires_tags: [rotating_body_radially_supported]
    related_freedoms: [FRE-RL-007]
    related_unresolved: []

  - id: NRM-RL-006
    statement: >
      Every component of the engagement force on each participating body has a
      realized reaction path.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-rotary-to-linear-engagement S1", "DOS-rotary-to-linear-engagement S1 (\"with the reaction of the resulting loads\")"]
    derivation_premises:
      - "The engagement produces equal and opposite forces on the two bodies."
      - "A force component with no reaction path accelerates the body carrying it."
      - "Conversion geometries generally produce force components along the input axis as well as transverse to it."
    conclusion_scope: "Completeness of the reaction paths for the engagement force, on both bodies."
    exclusions:
      - "Does not state a load, a margin or a stiffness. None exists at capability level (DOS S4); see UNR-RL-003."
      - "Does not require the axial and radial reactions to be carried by different features."
    verification_predicate: "for each participating body and each component of the engagement force: exists(load_path) to a reaction site."
    requires_tags: [reaction_of_conversion_force_realized]
    related_freedoms: [FRE-RL-007]
    related_unresolved: [UNR-RL-003]

  - id: NRM-RL-007
    statement: >
      Agreement between commanded input and observed output under a model that
      imposes the input/output relation by declaration is not evidence that the
      engagement exists or transmits.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    source_locators: ["DOS-rotary-to-linear-engagement S5"]
    derivation_premises:
      - "DOS S5 records verbatim that the conversion card passes V-A 5/5 and that V-B is named-deferred."
      - "Under declared pairs the ratio is exact by construction of the coupling."
      - "An observable determined by the declaration reports the declaration, not the artifact."
    conclusion_scope: "Admissibility of ratio agreement as evidence of the engagement. Says nothing about the design."
    exclusions:
      - "Does not forbid declared-pair models. It requires that ratio agreement obtained from one be marked as a structural artifact rather than counted as engagement evidence."
      - "Does not assert that no conversion engagement can be verified; it states what this class of evidence cannot show."
    verification_predicate: "any evidence mapped to NRM-RL-001, NRM-RL-003, NRM-RL-005 or NRM-RL-006 declares whether it resolves contact; declared-pair results are marked as structural artifacts for those criteria."
    requires_tags: [ratio_evidence_not_structural_artifact]
    related_freedoms: []
    related_unresolved: []

required_unresolved:
  - id: UNR-RL-001
    decision: Ratio, linearity, reversibility and whether the conversion is self-locking.
    why_must_remain_open: >
      DOS S4: no capability-level ratio, torque or efficiency exists. The legacy
      values m=5, z=12 are rack-and-pinion realization facts (DOS S6).
    resolvable_when: "An instantiating case supplies an effort ceiling, a turns budget, or a back-drive requirement."
    blocks: []
    source_locators: ["DOS-rotary-to-linear-engagement S4", "DOS-rotary-to-linear-engagement S6"]
  - id: UNR-RL-002
    decision: Output range and engagement length.
    why_must_remain_open: "DOS S4: no capability-level engagement length or output range exists."
    resolvable_when: "An instantiating case supplies an output range."
    blocks: []
    source_locators: ["DOS-rotary-to-linear-engagement S4"]
  - id: UNR-RL-003
    decision: Transmitted load, backlash, friction, efficiency and life.
    why_must_remain_open: >
      DOS S4/S5: no capability-level load rating exists, and no contact-level
      evidence exists anywhere in the corpus for any rotary-to-linear conversion.
    resolvable_when: "An instantiating case supplies a load case, and contact-resolving capability exists."
    blocks: []
    source_locators: ["DOS-rotary-to-linear-engagement S4", "DOS-rotary-to-linear-engagement S5"]
