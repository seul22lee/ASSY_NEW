capability_id: rotary-to-linear-engagement
schema_version: "0.3.0"
tier: micro_oracle
inherits: null
dossier: ver3/oracles/_dossiers/DOS-rotary-to-linear-engagement.md
lock_status: SEMANTICALLY_AUDITED
physical_validation: PENDING   # every fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
semantic_review: PASSED_2026_08_02   # entailment, fixture-plausibility and cross-pack reviews all clean
historical_aliases:
  - rack-pinion-conversion

capability_statement: >
  Conversion of rotary input motion into linear output motion through an
  uninterrupted chain of realized localized interactions, with the reaction of
  the loads those interactions produce.

capability_statement_history:
  - version: "0.2"
    text: "Conversion of rotary input motion into linear output motion through a localized engagement, with the reaction of the resulting loads."
    retired_at: SF-8.1
    why: >
      "a localized engagement" was read as requiring DIRECT engagement between the
      rotating input body and the translating output body. Multi-stage conversions
      - crank/link/slider, cable/drum/output, cam/follower/output - have no such
      direct engagement, and would have been rejected. Replaced with an
      interaction-chain formulation.

basis_semantics: >
  A micro-oracle has no user. Its capability statement was PROJECT-AUTHORED and
  then frozen into dossier S1; it is not user language and it is not rank 1.
  Statements restating a fragment of it carry basis_type
  PROJECT_DEFINED_CAPABILITY, whose authority is explicitly human-reviewable.
  Corrected at SF-1.3.

naming_note: >
  This capability is named for what it does, not for how it is done. Rack-and-pinion
  is preserved only as a cited reference realization and evidence source.

scope_exclusions:
  - "Guidance of the output body along its line is NOT owned here; that is guided-slider. This pack requires only the restraint without which the output would rotate instead of translating."
  - "Bounding of the output travel is NOT part of this capability."
  - "Holding position when the input is released is NOT part of this capability."
  - >
    Representation obligations - that a relation is DECLARED, that a driving body
    is RECORDED - are DesignState requirements and were moved to
    stage_expectations at SF-8.2. They are not physical properties of a design.

invariants:
  - id: NRM-RL-001
    statement: >
      An uninterrupted chain of realized localized interactions connects a
      rotating input body to a translating output body, each interaction
      identifying the participating material on both bodies it acts between.
    basis_type: PROJECT_DEFINED_CAPABILITY
    support_type: direct
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    conclusion_scope: "Existence, continuity and locality of the interaction chain."
    exclusions:
      - >
        Does NOT require direct engagement between the input and output bodies.
        Intermediate bodies are admissible and the chain may have any number of
        stages. Corrected at SF-8.1.
      - "Does not name a conversion family, an engagement geometry, a ratio, or a tooth or thread form."
      - "Does not require contact; a field interaction with identified participating regions satisfies it."
    verification_predicate: >
      exists(rotating input body), exists(translating output body), and a
      connected sequence of realized interactions between them with no gap, each
      naming participating material on both of its bodies.
    requires_tags: [rotating_input_body, translating_output_body, uninterrupted_interaction_chain, interactions_localized]
    related_freedoms: [FRE-RL-001, FRE-RL-002]
    related_unresolved: []
    closes_finding: [SF-8.1]

  - id: NRM-RL-002
    statement: >
      Rotation of the input body causes translation of the output body over the
      declared operating range.
    basis_type: PROJECT_DEFINED_CAPABILITY
    support_type: direct
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    conclusion_scope: "The actual kinematic relation between input rotation and output translation."
    exclusions:
      - >
        Does NOT require the relation to be LINEAR, monotonic or constant-ratio. A
        crank-and-link conversion is sinusoidal in the input angle and is
        admissible.
      - "Does not fix a ratio, a sign or a reversibility; none exists at capability level. See UNR-RL-001."
      - >
        Does NOT require the relation to be "declared", nor the driving body to be
        "recorded". Those are representation obligations and were moved to
        stage_expectations at SF-8.2. A design in which rotation does produce
        translation satisfies this invariant whatever its DesignState records.
    verification_predicate: >
      over the declared operating range, a change in input rotation produces a
      change in output translation, evaluated on the realized kinematics.
    requires_tags: [rotation_causes_translation]
    related_freedoms: [FRE-RL-003, FRE-RL-004]
    related_unresolved: [UNR-RL-001]
    closes_finding: [SF-8.2]

  - id: NRM-RL-003
    statement: >
      Every interaction in the chain remains engaged over the whole declared
      output range.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    derivation_premises:
      - "The capability is conversion over a range of output motion, not at one output position."
      - "Once any link of the chain disengages, the chain is interrupted and rotation no longer produces translation."
    conclusion_scope: "Persistence of every link of the chain over the declared output range."
    exclusions:
      - "Does not fix an engagement length or an output range. The legacy relation L_rack >= stroke + pi*m*z/4 is a rack-and-pinion fact, not a capability fact."
    verification_predicate: "for the ends and the interior of the declared output range: every interaction in the chain remains engaged."
    requires_tags: [chain_persists_over_output_range]
    related_freedoms: [FRE-RL-005]
    related_unresolved: [UNR-RL-002]

  - id: NRM-RL-004
    statement: >
      Where the chain applies a moment to the output body about the input axis,
      a realized restraint prevents the output body from following that rotation
      instead of translating.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    applies_when: "the chain applies a net moment to the output body about the input axis"
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    derivation_premises:
      - "Where an interaction transmits force to the output body at a location offset from the input axis, it applies a moment about that axis."
      - "An output body free to rotate under that moment rotates rather than translating, so no conversion occurs."
      - "Not every chain produces such a moment: a symmetric multi-point drive and a centred linkage do not."
    conclusion_scope: "Existence of a rotational restraint WHERE the chain produces the moment."
    exclusions:
      - "The restraint may be provided by the interaction geometry itself; a separate feature is not required."
      - "Does NOT supply general guidance of the output body; that is guided-slider."
      - "Does NOT apply where the chain produces no such moment."
    verification_predicate: "where a net moment about the input axis acts on the output body: exists(realized constraint) removing that rotation, naming the interaction that provides it."
    requires_tags: [output_rotation_restrained_where_needed]
    related_freedoms: [FRE-RL-006]
    related_unresolved: []

  - id: NRM-RL-005
    statement: >
      Every body in the chain has a realized reaction for every load component it
      carries.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    applies_when: "a body carries the relevant load component in the declared scenario"
    source_locators: ["DOS-rotary-to-linear-engagement S1"]
    derivation_premises:
      - "Interactions produce equal and opposite forces on the bodies they act between."
      - "A force component with no reaction path accelerates the body carrying it."
      - "Which components a given body carries depends on the conversion family, not on the capability."
    conclusion_scope: "Completeness of reaction paths for loads ACTUALLY carried. Existence, not adequacy."
    exclusions:
      - >
        Does NOT assert that conversion geometries generally produce axial force
        on the rotating body. A toothed wheel driving a linear member produces
        none; a drum winding a band produces none. Universalizing it would encode
        the screw family.
      - "Does not state a load, a margin or a stiffness; none exists at capability level. See UNR-RL-003."
      - "Does not require radial and axial reactions to be carried by different features."
    verification_predicate: "for each body and each load component it carries in the declared scenario: exists(load_path) to a reaction site. Bodies not carrying a component owe no reaction for it."
    requires_tags: [carried_loads_reacted]
    related_freedoms: [FRE-RL-007]
    related_unresolved: [UNR-RL-003]

  - id: NRM-RL-006
    statement: >
      Agreement between commanded input and observed output under a model that
      imposes the input/output relation by declaration is not evidence that the
      chain's interactions exist or transmit.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    enables_claim: >
      NRM-RL-001, NRM-RL-003 and NRM-RL-005 may be reported PASS. Without this
      minimum, a declared-pair run's exact ratio agreement would be counted as
      showing that an engagement exists, persists and transmits.
    source_locators: ["DOS-rotary-to-linear-engagement S5"]
    derivation_premises:
      - "DOS-rotary-to-linear-engagement S5 records verbatim that the conversion card passes V-A 5/5 and that V-B is named-deferred."
      - "Under declared pairs the ratio is exact by construction of the coupling."
      - "An observable determined by the declaration reports the declaration, not the artifact."
    conclusion_scope: "Admissibility of ratio agreement as evidence of the chain. Says nothing about the design."
    exclusions:
      - "Does not forbid declared-pair models; it requires their ratio agreement to be marked as a structural artifact for chain criteria."
      - "Does not assert that no conversion can be verified; it states what this class of evidence cannot show."
    verification_predicate: "any evidence mapped to NRM-RL-001, NRM-RL-003 or NRM-RL-005 declares whether it resolves contact; declared-pair results are marked as structural artifacts for those criteria."
    requires_evidence_tags: [contact_resolution_declared, declared_pair_not_cited_for_chain]
    related_freedoms: []
    related_unresolved: []
    moved_at: SF-1.1

required_unresolved:
  - id: UNR-RL-001
    decision: Ratio, linearity, reversibility and whether the conversion is self-locking.
    kind: quantitative
    why_must_remain_open: "DOS-rotary-to-linear-engagement S4: no capability-level ratio, torque or efficiency exists. The legacy values m=5, z=12 are rack-and-pinion realization facts."
    resolvable_when: "An instantiating case supplies an effort ceiling, a turns budget, or a back-drive requirement."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-RL-002 — that rotation causes translation is structural and needs no ratio."
    source_locators: ["DOS-rotary-to-linear-engagement S4", "DOS-rotary-to-linear-engagement S6"]
  - id: UNR-RL-002
    decision: Output range and engagement length.
    kind: quantitative
    why_must_remain_open: "DOS-rotary-to-linear-engagement S4: no capability-level engagement length or output range exists."
    resolvable_when: "An instantiating case supplies an output range."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-RL-003 — persistence over whatever range the design declares is structural."
    source_locators: ["DOS-rotary-to-linear-engagement S4"]
  - id: UNR-RL-003
    decision: Transmitted load, backlash, friction, efficiency and life.
    kind: quantitative
    why_must_remain_open: >
      DOS-rotary-to-linear-engagement S4/S5: no capability-level load rating
      exists, and no contact-level evidence exists anywhere in the corpus for any
      rotary-to-linear conversion.
    resolvable_when: "An instantiating case supplies a load case, and contact-resolving capability exists."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS, blocks_evidence_interpretation]
    does_not_block:
      - "NRM-RL-005 — the existence of a reaction path is structural."
    source_locators: ["DOS-rotary-to-linear-engagement S4", "DOS-rotary-to-linear-engagement S5"]
