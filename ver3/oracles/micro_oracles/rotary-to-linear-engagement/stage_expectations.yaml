capability_id: rotary-to-linear-engagement
schema_version: "0.3.0"
applies_when: >
  A design instantiates conversion of rotary motion into linear motion. These
  expectations constrain how the pipeline must represent that capability wherever
  it appears. They add no product requirement.
note: >
  Stage-11 rules are conditional. No outcome is fixed by current tooling
  capability. In particular, the absence of a realizer in any library is a
  tooling state, never a property of the capability.

evaluability_prerequisites:
  added_at: PCF-004
  domain: REPRESENTATION
  note: >
    These are DesignState completeness properties, not physical properties. A
    design that fails one is NOT physically inadmissible: it is NOT_EVALUABLE
    with reason REPRESENTATION_INCOMPLETE. They were carried as physical tags
    until PCF-004 and are now owned here.
  prerequisites:
    interaction_regions_declared: >
      every region where two bodies meet is classified as declared contact,
      declared clearance, declared interference fit or declared compliant
      interaction
    interaction_kind_recorded: >
      each region records which of the four kinds it is
    numerical_tolerance_recorded: >
      the penetration depth below which the evaluation reports contact rather
      than overlap is declared, and is a property of the evaluation rather than
      of the design
    compliant_region_recorded: >
      where an interaction is declared compliant, the compliant region and its
      represented deformation are identified
  outcome_when_unsatisfied:
    physical_predicate: NOT_EVALUABLE
    reason: REPRESENTATION_INCOMPLETE
    must_not_be_reported_as: [FAIL, physically_inadmissible]

stages:
  s02:
    must_exist: [conversion_obligation, candidate_conversion_families, participating_body_hypotheses]
    must_not_be_decided: [conversion_family, ratio, engagement_geometry]
    may_remain_unresolved: [UNR-RL-001, UNR-RL-002]
    provenance_required: ["conversion obligation -> the requirement stating a rotary input and a linear output"]
    open_search_note: >
      Corrected at SF-8.3; the former fixed-plurality rule is withdrawn. One
      candidate may legitimately remain after source- and physics-based
      elimination. What must hold instead:
        - the solution space was not closed merely by current library availability;
        - each rejected candidate carries a source, physical or feasibility reason;
        - synthesis beyond the provider catalogue remained possible;
        - an absent implemented realizer yields UNSUPPORTED, never INFEASIBLE
          (NEG-RL-008).
  s04:
    must_exist: [input_axis, output_line, interaction_sites, output_range, relation_between_input_and_output, swept_volumes_with_fidelity]
    must_not_be_decided: [ratio_value, engagement_dimensions, final_dimensions]
    may_remain_unresolved: [output_range, UNR-RL-001]
    provenance_required: ["each entry of interaction_sites -> the two bodies it acts between", "relation -> the geometry it follows from"]
    chain_note: >
      interaction_sites is a LIST and the chain may have any number of stages
      (HSD-002). A single site between the input body and the output body is one
      admissible shape, not the required shape: a crank-link-slider has no
      interaction between those two bodies at all.
    representation_obligations:
      moved_at: SF-8.2
      note: >
        The following are DesignState REPRESENTATION obligations, moved here from
        the capability's normative content. They constrain the record, not the
        artifact, and a design does not become physically inadmissible by failing
        them:
          - the input/output relation is declared over the operating range;
          - the driving body is identified;
          - directionality and reversibility are represented explicitly;
          - each interaction in the chain names its participating bodies.
  s05:
    must_exist: [conversion_realization, interaction_features_on_participating_bodies, reaction_realizations_for_carried_loads, reaction_path_records]
    must_not_be_decided: [new_independent_entities, parameter_values]
    may_remain_unresolved: [embodiment_alternatives, UNR-RL-003]
    provenance_required: ["realization -> obligation ids it discharges"]
    double_discharge_rule: >
      The output-rotation restraint discharges NRM-RL-004 only. It may not also
      be recorded as discharging a general guidance obligation, and a guidance
      realization may not be recorded as discharging NRM-RL-004 unless it
      demonstrably removes rotation about the input axis (NEG-RL-012).
  s06:
    must_exist: [solved_values_or_explicit_status, active_constraints]
    must_not_be_decided: [default_units, ratio_defaults]
    may_remain_unresolved: [underdetermined_degrees_of_freedom]
    provenance_required: ["value -> constraint id", "value -> unit declared at its source"]
  s08:
    must_exist: [conversion_observables_with_units, model_fidelity_declaration, contact_resolution_declaration]
    must_not_be_decided: [hidden_friction, hidden_load, hidden_efficiency]
    may_remain_unresolved: ["tests blocked by UNR-RL-003"]
    provenance_required: ["observable -> the criterion it addresses"]
    fidelity_note: >
      Every test mapped to an engagement criterion must declare whether it
      resolves contact. A declared-pair test may not be mapped to NRM-RL-001,
      NRM-RL-003, NRM-RL-005 or NRM-RL-006.
  s09:
    must_exist: [results, raw_evidence, execution_environment]
    provenance_required: ["result -> plan item id"]
  s10:
    must_exist: ["exactly one outcome per planned observable"]
    must_not_be_decided: [which_criterion_passes]
    provenance_required: ["evidence -> observable id"]
    artifact_rule: >
      Ratio agreement obtained under a declared-pair model is marked as a
      structural artifact and carries no evidential weight for engagement
      criteria (NRM-RL-007).
  s11:
    must_exist: [criterion_evaluation, evidence_coverage]
    must_not_be_decided: [new_evidence]
    provenance_required: ["evaluation -> evidence ids"]
    outcome_rules:
      RL-C1_chain_exists:
        traces_to: NRM-RL-001
        human_decision_ref: HSD-002
        pass_requires: "contact-resolving evidence that every interaction in the chain exists and transmits between its participating bodies"
        fail_when: "the chain is interrupted, or an interaction does not transmit"
        must_not_fail_when: "the rotating input body and the translating output body have no interaction with each other, provided the chain between them is uninterrupted"
        if_evidence_is_declared_pair_only: NOT_VERIFIED
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      RL-C2_rotation_causes_translation:
        traces_to: NRM-RL-002
        human_decision_ref: HSD-002
        pass_requires: "evidence that a change in input rotation produces a change in output translation over the declared operating range, evaluated on the realized kinematics"
        fail_when: "input rotation produces no output translation over the declared range"
        must_not_fail_when: "the relation is nonlinear, non-monotonic in its derivative, or not a constant ratio"
        note: >
          Corrected at SF-8.2 and HSD-002. That the relation is DECLARED and the
          driving body RECORDED are representation obligations and are checked at
          s04 under representation_obligations - not here, and never as a
          physical failure.
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      RL-C3_engagement_persists:
        traces_to: NRM-RL-003
        pass_requires: "engagement overlap shown at both extremes and the interior of a declared output range"
        fail_when: "overlap is lost anywhere in the declared range"
        if_unresolved: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      RL-C4_output_rotation_restrained_where_needed:
        traces_to: NRM-RL-004
        human_decision_ref: HSD-002
        pass_requires: "where the chain applies a net moment to the output body about the input axis, a realized constraint shown to remove that rotation"
        fail_when: "such a moment acts and no realized constraint removes the rotation"
        if_no_such_moment_acts: NOT_APPLICABLE
        must_not_fail_when: "the chain produces no net moment about the input axis - a symmetric multi-point drive or a centred linkage"
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      RL-C5_carried_loads_reacted:
        traces_to: NRM-RL-005
        human_decision_ref: HSD-002
        pass_requires: "for each body and each load component it ACTUALLY carries in the declared scenario, a realized reaction path, against a declared load case"
        fail_when: "a body carries a load component with no reaction path for it"
        must_not_fail_when: "a body carries no radial load, or no axial load, and therefore has no corresponding reaction"
        if_unresolved: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      RL-C6_evidence_admissibility:
        traces_to: NRM-RL-007
        pass_requires: "every evidence item mapped to an engagement criterion declares its contact resolution, and declared-pair results are marked as structural artifacts"
        fail_when: "declared-pair ratio agreement is counted as engagement evidence"
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
  s12:
    must_exist: [root_cause_candidates, capability_gap_records]
    provenance_required: ["root_cause -> owning decision id"]
    capability_gap_rule: >
      A revision triggered by UNSUPPORTED must name the absent capability. Where
      the absence is a missing conversion realizer, the record must state that a
      realizer is missing from the library — never that the conversion is
      infeasible (NEG-RL-008).
