capability_id: rotary-to-linear-engagement
schema_version: "0.3.0"
domain: physical_design
note: >
  PHYSICAL design fixtures only (SF-1.1). ADM-RL-E and ADM-RL-F are multi-stage
  chains with NO direct engagement between input and output bodies; they falsify
  the retired direct-engagement reading (SF-8.1).

physical_tag_vocabulary:
  interaction_regions_declared: "every region where two bodies meet is classified as declared contact, declared clearance, declared interference fit or declared compliant interaction"
  rotating_input_body: "a rotating input body exists"
  translating_output_body: "a translating output body exists"
  uninterrupted_interaction_chain: "a connected sequence of realized interactions joins them with no gap"
  interactions_localized: "each interaction names participating material on both of its bodies"
  rotation_causes_translation: "input rotation produces output translation over the declared range"
  chain_persists_over_output_range: "every link stays engaged over the declared output range"
  output_rotation_restrained_where_needed: "where the chain applies a moment about the input axis, a realized restraint removes that rotation"
  carried_loads_reacted: "every body has a reaction for every load component it actually carries"

admissible_realizations:
  - id: ADM-RL-A
    summary: "Toothed wheel on the input shaft engaging a toothed linear member. Output restrained by the member running in a channel. One-stage chain, direct engagement."
    family: toothed_direct
    chain: "input shaft -> tooth engagement -> linear member"
    load_profile: "shaft carries radial tooth load; no axial load"
    materially_differs_by: [conversion_principle, chain_length]
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: ADM-RL-B
    summary: "Helical thread on the input shaft engaging a follower on the output body. Output restrained by the follower's non-circular section."
    family: helical_thread
    chain: "input shaft -> thread engagement -> follower/output"
    load_profile: "shaft carries axial thrust and radial load"
    materially_differs_by: [conversion_principle, dominant_force_direction]
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: ADM-RL-C
    summary: "Band wound on a drum on the input shaft, anchored to each end of the output body. Output rotation restrained by the pair of anchors acting at a separation."
    family: band_and_drum
    chain: "input shaft -> drum -> band -> output anchors"
    load_profile: "drum carries radial band tension; NO axial load anywhere"
    materially_differs_by: [conversion_principle, engagement_type, chain_length]
    note: "Falsifies any universal axial-load premise."
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: ADM-RL-D
    summary: "Rotating nut journalled in the frame driving a fixed non-rotating screw that carries the output. The output body itself never engages the input body."
    family: rotating_nut_fixed_screw
    chain: "input nut -> thread engagement -> screw -> output"
    load_profile: "axial load passes down the screw into the nut's journal seat"
    materially_differs_by: [which_body_rotates, axial_reaction_location, chain_length]
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: ADM-RL-E
    summary: >
      Crank disc on the input shaft, a connecting link pinned to the crank pin,
      and a slider carrying the output. The rotating input body and the
      translating output body NEVER touch: they are joined through two pin
      interactions and an intermediate link. The relation is sinusoidal.
    family: crank_link_slider
    chain: "input disc -> crank pin -> link -> wrist pin -> slider/output"
    load_profile: "crank pin carries radial load at its journal; the link carries axial load along itself reacted at both pins"
    materially_differs_by: [chain_length, relation_linearity, direct_engagement_absence]
    note: >
      THE FALSIFIABILITY FIXTURE for SF-8.1. There is no interaction between the
      input body and the output body. The retired wording required a localized
      engagement between them and rejected this design - which is the single most
      common rotary-to-linear mechanism in engineering.
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: ADM-RL-F
    summary: >
      Cam on the input shaft acting on a roller follower carried by a pushrod
      which drives the output. Three bodies between input and output; the relation
      is whatever the cam profile makes it.
    family: cam_and_follower
    chain: "input shaft -> cam -> roller -> pushrod -> output"
    load_profile: "cam and roller carry contact normal load; pushrod carries axial load reacted at the output guide"
    materially_differs_by: [chain_length, relation_arbitrariness, direct_engagement_absence]
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]

inadmissible_realizations:
  - id: INA-RL-A
    summary: "Input rotation and output translation related by a declared ratio, with no participating material anywhere in between."
    from_negative_case: NEG-RL-001
    missing_tags: [uninterrupted_interaction_chain, interactions_localized]
    tags: ['rotating_input_body', 'translating_output_body', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: INA-RL-B
    summary: >
      A chain of bodies exists and each interaction is localized, but at the
      declared operating range the geometry is such that input rotation produces
      no output translation at all - the link is at a dead point throughout.
    from_negative_case: NEG-RL-002
    missing_tags: [rotation_causes_translation]
    note: "Corrected at SF-8.2: the defect is kinematic, not a missing declaration."
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: INA-RL-C
    summary: "One link of the chain disengages partway through the declared output range."
    from_negative_case: NEG-RL-003
    missing_tags: [chain_persists_over_output_range]
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'output_rotation_restrained_where_needed', 'carried_loads_reacted', interaction_regions_declared]
  - id: INA-RL-D
    summary: "Follower on a threaded shaft with nothing restraining it about the shaft axis, where the thread demonstrably applies that moment; it turns with the shaft instead of translating."
    from_negative_case: NEG-RL-004
    missing_tags: [output_rotation_restrained_where_needed]
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'carried_loads_reacted', interaction_regions_declared]
  - id: INA-RL-E
    summary: "A body in the chain demonstrably carries a load component with no reaction path for it."
    from_negative_case: NEG-RL-005
    missing_tags: [carried_loads_reacted]
    tags: ['rotating_input_body', 'translating_output_body', 'uninterrupted_interaction_chain', 'interactions_localized', 'rotation_causes_translation', 'chain_persists_over_output_range', 'output_rotation_restrained_where_needed', interaction_regions_declared]
