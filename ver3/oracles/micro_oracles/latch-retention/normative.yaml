capability_id: latch-retention
schema_version: "0.3.0"
tier: micro_oracle
inherits: null
dossier: ver3/oracles/_dossiers/DOS-latch-retention.md
pack_status: PRE_CAD_SEMANTIC_REVIEWED
physical_validation: PENDING_CAD   # every admissible fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
baseline_note: >
  PRE_CAD_SEMANTIC_REVIEWED is a semantic status only. It is NOT lock-ready, NOT
  CAD-validated and NOT production authority. The next authorized phase is
  adversarial CAD validation.   # every admissible fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
semantic_review: PASSED   # entailment, fixture-plausibility, cross-pack and cross-file drift reviews clean

capability_statement: >
  Holding two bodies in a defined relative state against a disturbance, and
  releasing them by a deliberate action, repeatably.

basis_semantics: >
  A micro-oracle has no user. Its capability statement was PROJECT-AUTHORED and
  then frozen into dossier S1; it is not user language and it is not rank 1.
  Statements restating a fragment of it carry basis_type
  PROJECT_DEFINED_CAPABILITY, whose authority is explicitly human-reviewable.
  NECESSARY_PHYSICAL_CONSEQUENCE marks statements derived from it;
  VERIFICATION_MINIMUM marks statements about what evidence must be able to show.
  Corrected at SF-1.3.

scope_exclusions:
  - "How the two bodies reach the vicinity of the retained state is NOT owned here. Guidance is owned by guided-slider; bounded travel by bounded-two-state-closure."
  - "This capability does not require the retained state to be a closed or an assembled state. Retention at an intermediate position, or of an open state, is equally within scope."
  - "This capability does not require release to be tool-free or hand-operated. That is a property of particular instantiating cases."

invariants:
  - id: NRM-LR-001
    statement: >
      A retained state is defined as a relative configuration of the two bodies.
    basis_type: PROJECT_DEFINED_CAPABILITY
    support_type: direct
    source_locators: ["DOS-latch-retention S1"]
    conclusion_scope: "Existence of a defined retained state."
    exclusions:
      - "Does not fix which state, nor require it to be a closed state."
      - "Does not require the state to be a single pose; a bounded region of relative configuration is admissible."
    verification_predicate: "exists(retained state) given as a relative configuration of the two bodies, expressed geometrically."
    requires_tags: [retained_state_defined]
    related_freedoms: [FRE-LR-001]
    related_unresolved: []

  - id: NRM-LR-002
    statement: >
      A realized interaction between the two bodies opposes departure from the
      retained state, and the material regions through which it acts are
      identified on both bodies.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    reclassified_at: SF-9.1
    reclassification_note: >
      The capability statement says "holding two bodies in a defined relative
      state against a disturbance". That an interaction exists is a fragment of
      it; that PARTICIPATING MATERIAL EXISTS ON BOTH BODIES is not stated there -
      it is a physical consequence of the interaction being realized. Formerly
      carried as a direct capability fragment, which overstated its authority.
    derivation_premises:
      - "The capability requires an interaction that opposes departure from the retained state."
      - "An interaction between two bodies acts through material of both, whether by contact or by a field."
      - "An interaction asserted between whole bodies names no region where it acts and cannot be built."
    source_locators: ["DOS-latch-retention S1"]
    conclusion_scope: "Existence of the retention interaction and identification of the material it acts through."
    exclusions:
      - "Does not name a retention principle. DOS-latch-retention S7 records that the legacy corpus realized retention exclusively by snap features; that is a library state, not a requirement."
      - >
        Does NOT require contact. A field interaction is admissible provided the
        participating material regions - pole faces, keeper areas, the volumes the
        field acts between - are explicit. What is required is identified
        participating material, not touching surfaces. Broadened at SF-9.1.
    verification_predicate: "exists(retention interaction) opposing departure from the retained state, with the participating material region identified on each body."
    requires_tags: [retention_interaction_realized, interaction_regions_declared]
    related_freedoms: [FRE-LR-002]
    related_unresolved: []
    closes_finding: [SF-9.1]

  - id: NRM-LR-003
    statement: >
      The load applied by the disturbance has a realized reaction path through
      the retention to a reaction site.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-latch-retention S1"]
    derivation_premises:
      - "Holding against a disturbance means resisting the load the disturbance applies."
      - "A retention that carries no load resists nothing."
      - "An unreacted load accelerates the body carrying it."
    conclusion_scope: "Completeness of the reaction path for the disturbance load."
    exclusions:
      - "Does not state a retention load or a margin. None exists at capability level (DOS S4); see UNR-LR-002."
    verification_predicate: "exists(load_path) from the disturbed body through the retention interaction to a reaction site."
    requires_tags: [disturbance_opposed_with_reaction_path]
    related_freedoms: []
    related_unresolved: [UNR-LR-002]

  - id: NRM-LR-004
    statement: >
      The release action is distinguishable from the disturbance the retention
      opposes.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-latch-retention S1"]
    derivation_premises:
      - "The capability requires holding against the disturbance and releasing by a deliberate action."
      - "If the release action and the disturbance are indistinguishable to the retention, then whatever releases also occurs under disturbance."
      - "A retention released by its own disturbance case does not hold."
    conclusion_scope: "Discriminability between the release action and the disturbance."
    exclusions:
      - "Does not fix how the two are distinguished. Direction, magnitude, point of application, sequence, and a separate actuating element are all admissible discriminants."
      - "Does not require a release effort ceiling; none exists at capability level (UNR-LR-003)."
    verification_predicate: "the release action and the declared disturbance differ in at least one property the retention responds to, and that property is named."
    requires_tags: [release_action_distinct_from_disturbance, deliberate_release_path_exists]
    related_freedoms: [FRE-LR-003]
    related_unresolved: [UNR-LR-001, UNR-LR-003]

  - id: NRM-LR-005
    statement: >
      Both the path into the retained state and the path out of it are traversable
      by the participating geometry.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators: ["DOS-latch-retention S1"]
    derivation_premises:
      - "Bodies not already in the retained state must reach it for the retention to engage."
      - "The capability requires release, so the bodies must also be able to leave it."
      - "A path is traversable only if the participating geometry can pass, whether by clearance or by declared deflection."
    conclusion_scope: "Existence of an engagement path and a release path."
    exclusions:
      - "Does not require the two paths to be the same, nor the release path to reverse the engagement path."
      - "Does not fix a deflection, an interference or a clearance value."
    verification_predicate: "exists(engagement path) and exists(release path), each with the interference along it either cleared or accounted for by a declared deflection."
    requires_tags: [engagement_path_exists]
    related_freedoms: [FRE-LR-004]
    related_unresolved: []

  - id: NRM-LR-006
    statement: >
      Engaging and releasing consumes no participating feature, so the retained
      state is reachable again.
    basis_type: PROJECT_DEFINED_CAPABILITY
    support_type: direct
    source_locators: ["DOS-latch-retention S1 (\"repeatably\")"]
    conclusion_scope: "Non-consumption of participating features across an engage-release cycle."
    exclusions:
      - "Does not state a cycle count, a degradation limit or a life. None exists at capability level (DOS S4); see UNR-LR-004."
      - "Does not require zero wear; it requires that no participating feature is destroyed or permanently deformed out of function by a single cycle."
    verification_predicate: "after an engage-release cycle, every participating feature retains the geometry its retention role depends on, and the retained state is reachable again."
    requires_tags: [repeatable_no_feature_consumed]
    related_freedoms: []
    related_unresolved: [UNR-LR-004]

  - id: NRM-LR-007
    statement: >
      A retention claim names the disturbance it holds against.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    enables_claim: >
      NRM-LR-002 and NRM-LR-003 may be reported PASS. Without this minimum, a
      retention could be reported as holding with no disturbance named, which
      states no proposition that could be false.
    source_locators: ["DOS-latch-retention S1", "DOS-latch-retention S4"]
    derivation_premises:
      - "The capability is defined as holding against a disturbance."
      - "DOS S4 records that no capability-level retention load exists."
      - "A claim to hold, with no disturbance named, states no proposition that could be false."
    conclusion_scope: "Admissibility of a retention claim. Says nothing about the design."
    exclusions:
      - "Does not prescribe the disturbance. It requires that whichever is used be declared with the claim."
    verification_predicate: "every retention result carries the disturbance case it was evaluated against."
    requires_evidence_tags: [retention_claim_names_its_disturbance]
    moved_at: SF-1.1
    related_freedoms: []
    related_unresolved: [UNR-LR-001]

  - id: NRM-LR-008
    statement: >
      A force window that is an input of a task definition may not be cited as an
      achieved retention property.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    enables_claim: >
      Any quantitative retention or release claim may be reported PASS. Without
      this minimum, a force window supplied to a run and read back from it would
      be reported as the retention the product achieves.
    source_locators: ["DOS-latch-retention S3", "DOS-latch-retention S5"]
    derivation_premises:
      - "DOS S5 records that the force windows in the task definitions are input parameters, not measured properties."
      - "A value supplied to a run and read back from it reports the input."
      - "Citing it as a result asserts as achieved what was assumed."
    conclusion_scope: "Admissibility of a stated force window as evidence. Says nothing about the design."
    exclusions:
      - "Does not forbid declaring a force window as a requirement or as a test condition. It forbids reporting it as an outcome."
    verification_predicate: "for every cited retention or release force: its provenance is recorded as either an input condition or a measurement, and only measurements are counted as results."
    requires_evidence_tags: [force_window_not_cited_as_result]
    moved_at: SF-1.1
    related_freedoms: []
    related_unresolved: []

required_unresolved:
  - id: UNR-LR-001
    decision: The disturbance case the retention holds against.
    kind: interpretive
    why_must_remain_open: >
      DOS S4: no capability-level disturbance exists. It is a property of each
      instantiating case, and NRM-LR-007 requires it to be named there rather
      than assumed here.
    resolvable_when: "An instantiating case declares a disturbance."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS, blocks_evidence_interpretation]
    does_not_block:
      - "NRM-LR-002 and NRM-LR-005 — the existence of a retention interaction and of engagement and release paths is structural."
    source_locators: ["DOS-latch-retention S4"]
  - id: UNR-LR-002
    decision: Retention load and margin.
    kind: quantitative
    why_must_remain_open: >
      DOS S4/S5: no capability-level retention load exists, and the force windows
      in the fixtures are inputs, not measured properties.
    resolvable_when: "An instantiating case supplies a load case and a margin."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-LR-003 — the existence of a reaction path is structural."
    source_locators: ["DOS-latch-retention S4", "DOS-latch-retention S5"]
  - id: UNR-LR-003
    decision: Release effort ceiling and whether release must be tool-free.
    kind: quantitative
    why_must_remain_open: >
      DOS S4: no capability-level release effort exists. "Removable by hand" is a
      property of the snap-panel fixture, not of the capability.
    resolvable_when: "An instantiating case states a release effort ceiling or a tool policy."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-LR-004 — that the release action differs from the disturbance in some property the retention responds to is structural."
    source_locators: ["DOS-latch-retention S2", "DOS-latch-retention S4"]
  - id: UNR-LR-004
    decision: Cycle count, degradation limit, creep and temperature conditions.
    kind: quantitative
    why_must_remain_open: "DOS S4: none exists at capability level."
    resolvable_when: "An instantiating case supplies a duty and an environment."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-LR-006 — one realizable engage/release cycle with no feature consumed is structural."
    source_locators: ["DOS-latch-retention S4"]
