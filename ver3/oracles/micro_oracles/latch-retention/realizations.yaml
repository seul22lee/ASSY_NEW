capability_id: latch-retention
schema_version: "0.3.0"
domain: physical_design
note: >
  PHYSICAL design fixtures only (SF-1.1, SF-9.2). The three evidence-only tags -
  retention_claim_names_its_disturbance, force_window_not_cited_as_result and
  evidence provenance - have been moved to evidence_cases.yaml. A physical latch
  is no longer inadmissible because no test has been authored for it.
  Only ADM-LR-A is a snap; the corpus contained nothing else.

physical_tag_vocabulary:
  no_undeclared_volumetric_overlap: "no two solids occupy the same space outside a declared contact, interference-fit or compliant-interaction region, under the declared tolerance"
  intended_interaction_physically_consistent: "each intended interaction is physically coherent: a compliant region can actually deflect, an interference fit is takeable up in strain, a contact face exists on both participating bodies"
  retained_state_defined: "the retained state is given as a relative configuration of the two bodies"
  retention_interaction_realized: "a realized interaction opposes departure, with participating material identified on both bodies"
  disturbance_opposed_with_reaction_path: "the disturbance load has a reaction path through the retention"
  release_action_distinct_from_disturbance: "the release action differs from the declared disturbance in a property the retention responds to"
  deliberate_release_path_exists: "a deliberate release action is available"
  engagement_path_exists: "paths into and out of the retained state are traversable"
  repeatable_no_feature_consumed: "an engage/release cycle consumes no participating feature"

admissible_realizations:
  - id: ADM-LR-A
    summary: "Cantilever snap hook on one body engaging a lip on the other. Engaged by insertion with a declared beam deflection; released by pressing the beam clear, which the disturbance direction does not do."
    principle: contact_snap
    release_discriminant: direction
    materially_differs_by: [retention_principle, release_discriminant]
    tags: [retained_state_defined, retention_interaction_realized, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-LR-A
  - id: ADM-LR-B
    summary: >
      Magnetic pair, one element on each body, with a keeper face locating the
      retained state. Participating material is explicit on both bodies: the pole
      face on one, the keeper area on the other. Released by a peeling motion
      applied at an offset, which the straight-pull disturbance does not produce.
    principle: field_interaction
    release_discriminant: point_of_application
    materially_differs_by: [retention_principle, interaction_type, release_discriminant]
    note: >
      Not a contact-engaged retention. Admissible under the SF-9.1 wording, which
      requires identified participating MATERIAL rather than touching surfaces.
    tags: [retained_state_defined, retention_interaction_realized, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-LR-B
  - id: ADM-LR-C
    summary: "Over-centre link holding the two bodies past its dead point. The disturbance loads the link along the direction that drives it further over centre; release requires lifting the handle."
    principle: over_centre
    release_discriminant: sequence
    materially_differs_by: [retention_principle, release_discriminant, load_path]
    tags: [retained_state_defined, retention_interaction_realized, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-LR-C
  - id: ADM-LR-D
    summary: "Spring-loaded detent ball seating in a recess. Engagement and release share a path; the discriminant is force magnitude, with the release threshold above the declared disturbance."
    principle: detent
    release_discriminant: magnitude
    materially_differs_by: [retention_principle, path_symmetry, release_discriminant]
    tags: [retained_state_defined, retention_interaction_realized, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#ADM-LR-D

inadmissible_realizations:
  - id: INA-LR-A
    summary: "Two bodies asserted to be retained, with no relative configuration given for the retained state."
    from_negative_case: NEG-LR-001
    missing_tags: [retained_state_defined, installation_process_physically_realizable]
    tags: [retention_interaction_realized, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-LR-A
  - id: INA-LR-B
    summary: "Retention asserted between whole bodies with no participating material identified on either - neither contact regions nor field regions."
    from_negative_case: NEG-LR-002
    missing_tags: [retention_interaction_realized, installation_process_physically_realizable, intended_interaction_physically_consistent]
    tags: [retained_state_defined, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-LR-B
  - id: INA-LR-C
    summary: "Retention feature present but the disturbance load passes through it to nothing; the feature is unsupported."
    from_negative_case: NEG-LR-003
    missing_tags: [disturbance_opposed_with_reaction_path, installation_process_physically_realizable]
    tags: [retained_state_defined, retention_interaction_realized, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-LR-C
  - id: INA-LR-D
    summary: "Retention released by a straight pull, and the declared disturbance is a straight pull of the same magnitude and direction."
    from_negative_case: NEG-LR-004
    missing_tags: [release_action_distinct_from_disturbance, deliberate_release_path_exists, installation_process_physically_realizable]
    tags: [retained_state_defined, retention_interaction_realized, disturbance_opposed_with_reaction_path, engagement_path_exists, repeatable_no_feature_consumed, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-LR-D
  - id: INA-LR-E
    summary: "Retention geometry interferes on the way in with no clearance and no declared deflection; the retained state cannot be reached."
    from_negative_case: NEG-LR-005
    missing_tags: [engagement_path_exists, installation_process_physically_realizable, no_undeclared_volumetric_overlap]
    tags: [retained_state_defined, retention_interaction_realized, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, repeatable_no_feature_consumed, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-LR-E
  - id: INA-LR-F
    summary: "Retention that must be broken to release, so a participating feature is destroyed and the retained state is unreachable afterwards."
    from_negative_case: NEG-LR-006
    missing_tags: [repeatable_no_feature_consumed, installation_process_physically_realizable]
    tags: [retained_state_defined, retention_interaction_realized, disturbance_opposed_with_reaction_path, release_action_distinct_from_disturbance, deliberate_release_path_exists, engagement_path_exists, no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    physical_review: PHYSICAL_FIXTURE_REVIEW.yaml#INA-LR-F

retired_contracts:
  note: >
    Historical only. Nothing here contributes to any PASS/FAIL decision. Listed so a
    reader recognises a retired contract if it reappears.
  entries:
    - tag: interaction_regions_declared
      why: >
        REPRESENTATION property; moved to stage_expectations evaluability_prerequisites at PCF-004
