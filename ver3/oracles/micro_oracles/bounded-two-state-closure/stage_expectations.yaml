capability_id: bounded-two-state-closure
schema_version: "0.3.0"
applies_when: >
  A design instantiates a bounded closure motion between two states. These
  expectations constrain how the pipeline must represent that capability wherever
  it appears. They add no product requirement.
note: >
  Stage-11 rules are conditional. No outcome is fixed by current tooling
  capability.

evaluability_prerequisites:
  added_at: PCF-004
  domain: REPRESENTATION
  note: >
    These are DesignState completeness properties, not physical properties. A
    design that fails one is NOT physically inadmissible: it is NOT_EVALUABLE
    with reason REPRESENTATION_INCOMPLETE. They were carried as physical tags
    until PCF-004 and are now owned here.
  prerequisites:
    interaction_regions_declared: >
      every region where two bodies meet is classified as declared contact,
      declared clearance, declared interference fit or declared compliant
      interaction
    interaction_kind_recorded: >
      each region records which of the four kinds it is
    numerical_tolerance_recorded: >
      the penetration depth below which the evaluation reports contact rather
      than overlap is declared, and is a property of the evaluation rather than
      of the design
    compliant_region_recorded: >
      where an interaction is declared compliant, the compliant region and its
      represented deformation are identified
  outcome_when_unsatisfied:
    physical_predicate: NOT_EVALUABLE
    reason: REPRESENTATION_INCOMPLETE
    must_not_be_reported_as: [FAIL, physically_inadmissible]

stages:
  s01:
    must_exist: [state_pair_requirement, bounding_requirement]
    must_not_be_decided: [joint_type, bounding_principle, open_angle]
    may_remain_unresolved: [UNR-HS-001, UNR-HS-002, UNR-HS-003]
    provenance_required: ["state pair -> source clause id"]
  s02:
    must_exist: [closure_obligation, bounding_obligation, candidate_bounding_principles, candidate_motion_types]
    must_not_be_decided: [bounding_principle, joint_type]
    may_remain_unresolved: [candidate_ranking]
    provenance_required: ["obligation -> the requirement demanding it"]
    open_search_note: >
      Corrected at SF-8.3; the former fixed-plurality rule is withdrawn. One
      candidate may legitimately remain after source- and physics-based
      elimination. What must hold instead: the space was not closed by library
      availability - and DOS-bounded-two-state-closure S7 records that the corpus
      bounds motion ONLY by a discrete stop, so that risk is live here; each
      rejection names a source, physical or feasibility reason; synthesis beyond
      the catalogue remained possible; and an absent realizer yields UNSUPPORTED.
  s04:
    must_exist: [state_configurations, motion_path, constraint_engagement_along_path, extreme_determinants, swept_volumes_with_fidelity, interference_along_path]
    must_not_be_decided: [angle_values_without_a_stated_requirement, feature_dimensions]
    may_remain_unresolved: [state_separation, UNR-HS-001]
    provenance_required: ["each extreme -> its own determinant id", "determinant -> the participating geometry realizing it"]
    bound_representation_note: >
      A numeric joint range may be used in a model, but the design must record
      which realized condition that range stands for (NRM-HS-004). A range with
      no such record is a model artifact standing in for a design decision.
  s05:
    must_exist: [joint_realization, bounding_realizations, participating_features, load_path_records]
    must_not_be_decided: [new_independent_entities, parameter_values, stop_feature_by_default]
    may_remain_unresolved: [embodiment_alternatives, UNR-HS-003]
    provenance_required: ["realization -> obligation ids it discharges"]
    double_discharge_rule: >
      A bounding realization discharges NRM-HS-004 only. It may not also be
      recorded as discharging a holding obligation (NEG-HS-011).
  s06:
    must_exist: [solved_values_or_explicit_status, active_constraints]
    must_not_be_decided: [default_units, angle_defaults]
    may_remain_unresolved: [underdetermined_degrees_of_freedom]
    provenance_required: ["value -> constraint id", "value -> unit declared at its source"]
  s08:
    must_exist: [closure_observables_with_units, model_fidelity_declaration, criterion_discrimination_declaration, seed_protocol_declaration]
    must_not_be_decided: [hidden_load, hidden_friction]
    may_remain_unresolved: ["tests blocked by UNR-HS-001", "tests blocked by UNR-HS-004"]
    provenance_required: ["test -> the criterion it addresses"]
    discrimination_note: >
      Each criterion mapped to NRM-HS-004 must declare the configuration in which
      it fails when the bound is removed. A criterion with no such configuration
      is recorded as non-discriminating (NRM-HS-007).
    seed_note: >
      Where a result is produced by a seed sweep, the sweep size and the
      aggregation rule are declared with the plan, not attached afterwards.
  s09:
    must_exist: [results, raw_evidence, execution_environment, seed_records]
    provenance_required: ["result -> plan item id", "aggregated result -> its per-seed records"]
  s10:
    must_exist: ["exactly one outcome per planned observable"]
    must_not_be_decided: [which_criterion_passes]
    provenance_required: ["evidence -> observable id"]
    discrimination_rule: >
      A criterion recorded as non-discriminating carries no evidential weight for
      the presence of a bound (NEG-HS-008).
  s11:
    must_exist: [criterion_evaluation, evidence_coverage]
    must_not_be_decided: [new_evidence]
    provenance_required: ["evaluation -> evidence ids", "aggregated verdict -> its aggregation rule"]
    outcome_rules:
      HS-C1_two_states:
        traces_to: NRM-HS-001
        pass_requires: "both states given as relative configurations and both shown reached"
        fail_when: "a state has no configuration or is unreachable"
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      HS-C2_continuous_motion:
        traces_to: NRM-HS-002
        pass_requires: "a continuous path shown between the two states"
        fail_when: "no continuous path exists"
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
      HS-C3_constraint_coverage_continuous:
        traces_to: NRM-HS-003
        human_decision_ref: HSD-003
        pass_requires: >
          at every intermediate configuration of the declared bounded path, at least one realized constraint or interaction keeps the two bodies within the allowed motion manifold
        must_not_fail_when: >
          the ACTIVE constraint changes along the path; or one constraint hands off to another; or an interval is covered by two constraints simultaneously
        fail_when: >
          an interval of the declared path has NO active constraint coverage; or the closure enters unconstrained free flight within the declared capability
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
        corrected_at: FPC-003
        correction_note: >
          The retired rule required "THE relative constraint shown engaged at the extremes and the interior" and failed when "the constraint lapses anywhere". That rejects a flexure handing off to a moulded rib - the ADM-HS-E semantics AMD-HS-001 and HSD-003 explicitly admit. Coverage must be continuous; the constraint need not be the same one.
      HS-C4_bounds_physically_realized:
        traces_to: NRM-HS-004
        human_decision_ref: HSD-006
        pass_requires: >
          each extreme shown produced by a realized physical condition, evidenced by EITHER branch A (direct causal: the bounding geometry or field exists, is active at that configuration, and the motion terminates because of it) OR branch B (a discriminating control, ablation or sensitivity result)
        must_not_fail_when: >
          no ablated control model exists, provided branch A is adequately supported
        fail_when: >
          an extreme is produced only by a limit imposed on the model; or the realized condition is not reached; or evidence contradicts the claimed bound
        otherwise: NOT_VERIFIED
        if_unresolved: INDETERMINATE
        if_capability_absent: UNSUPPORTED
        note: >
          UNR-HS-004 records that the corpus supplies no discriminating single-run criterion. Under HSD-006 that no longer blocks a PASS, because branch A is an alternative route.
        corrected_at: FPC-006
        correction_note: >
          The retired rule required a criterion "demonstrated to discriminate against the bound absence" - branch B only - and carried if_criterion_does_not_discriminate: NOT_VERIFIED, which made a control mandatory.
      HS-C5_bounds_independently_evaluated:
        traces_to: NRM-HS-005
        human_decision_ref: HSD-003
        pass_requires: >
          each terminal configuration carries its own evaluation result and its own causal account, obtained at its own configuration
        must_not_fail_when: >
          one continuous feature, one physical field or one mechanism contributes to BOTH bounds; or the active mechanism is shared between the two extremes
        fail_when: >
          the evaluation result for one endpoint is merely copied to the other; or an endpoint has no physically supported bound
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
        corrected_at: FPC-004
        correction_note: >
          The retired rule required each extreme "determined by its OWN condition" and failed when "one condition is credited to both extremes". That rejects ADM-HS-D (one continuous slot arresting the pin at both ends) and ADM-HS-F (one magnetic field with two stable seats), both admitted under HSD-003. What is forbidden is copying an evaluation RESULT, not sharing a mechanism.
      HS-C6_no_undeclared_overlap:
        traces_to: NRM-HS-006
        pass_requires: >
          along the required motion there is no UNDECLARED volumetric overlap between the two bodies - no shared volume outside declared contact, declared interference-fit and declared compliant-interaction regions - under the declared tolerance
        must_not_fail_when: >
          the two bodies touch at an intended bounding or constraining interaction, whatever its kind; or zero clearance exists at a declared contact
        if_representation_incomplete: NOT_EVALUABLE
        representation_incomplete_reason: >
          REPRESENTATION_INCOMPLETE - interaction-region classification or numerical tolerance absent from DesignState. This is NOT a physical FAIL.
        fail_when: >
          undeclared volumetric overlap occurs at any configuration of the required motion; or macroscopic penetration is presented as contact beyond the declared numerical tolerance
        if_capability_absent: UNSUPPORTED
        otherwise: NOT_VERIFIED
        corrected_at: FPC-005
        correction_note: >
          Renamed from HS-C6_no_interference and re-authored. The retired rule spoke of "swept volumes shown non-intersecting", which reads as blanket separation, and it projected a statement that asserted exactly two bounding contacts.
      HS-C7_evidence_admissibility:
        traces_to: NRM-HS-007
        human_decision_ref: HSD-006
        pass_requires: >
          the claim about the presence of a bound is supported by EITHER branch A (direct causal evidence: the realizing geometry or field exists, is active at the relevant configuration, and the observed behaviour is causally attributable to it) OR branch B (discriminating evidence: a control, ablation, sensitivity analysis or other comparison showing the behaviour is lost or changed)
        must_not_fail_when: >
          no control or ablation model exists, provided branch A is adequately supported
        fail_when: >
          the available evidence CONTRADICTS the claimed feature or behaviour
        otherwise: NOT_VERIFIED
        not_verified_reason: >
          neither branch is adequately supported. Absence of a control is NOT_VERIFIED at worst, never a physical design FAIL.
        if_capability_absent: UNSUPPORTED
        corrected_at: FPC-006
        correction_note: >
          The retired rule required every criterion to carry "a configuration in which it fails without the bound" - branch B only.
