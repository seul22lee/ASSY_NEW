capability_id: bounded-two-state-closure
schema_version: "0.3.0"
tier: micro_oracle
inherits: null
dossier: ver3/oracles/_dossiers/DOS-bounded-two-state-closure.md
pack_status: PRE_CAD_SEMANTIC_REVIEWED
physical_validation: PENDING_CAD   # every admissible fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
baseline_note: >
  PRE_CAD_SEMANTIC_REVIEWED is a semantic status only. It is NOT lock-ready, NOT
  CAD-validated and NOT production authority. The next authorized phase is
  adversarial CAD validation.   # every admissible fixture is NEEDS_GEOMETRY_VALIDATION; no CAD or physics run exists
semantic_review: PASSED   # entailment, fixture-plausibility, cross-pack and cross-file drift reviews clean

capability_statement: >
  A closure that reaches two defined states by a bounded motion, where the bound
  at each extreme is physically produced.

naming_note: >
  Renamed from `hinge-and-stop` at correction F-3C-001. The former name put a
  joint type and a feature type in the identifier of a capability that requires
  neither, which is the same defect that produced the earlier rename of the
  rotary-to-linear micro-oracle. A pin hinge with a discrete stop flange is one
  realization of this capability, cited as a reference realization and an
  evidence source only. The frozen dossier was renamed with it; its evidence
  sections are unchanged.

dossier_amendment:
  amendment_id: AMD-HS-001
  file: ver3/oracles/_dossier_amendments/AMENDMENTS.yaml
  supersedes: "DOS-bounded-two-state-closure.md#S1"
  scope: >
    the constraint-persistence and bound-distinctness clauses only. The
    "bound at each extreme is physically produced" clause of the original S1 is
    UNCHANGED and remains the grounding for source_declares_terminal_states.
  human_decision_ref: HSD-003

basis_semantics: >
  A micro-oracle has no user. Its capability statement was PROJECT-AUTHORED and
  then frozen into dossier S1; it is not user language and it is not rank 1.
  Statements restating a fragment of it carry basis_type
  PROJECT_DEFINED_CAPABILITY, whose authority is explicitly human-reviewable.
  Corrected at SF-1.3.

source_declares_terminal_states:
  value: true
  locator: "DOS-bounded-two-state-closure S1"
  verbatim_fragment: "the bound at each extreme is physically produced"
  why: >
    Bounds are DEFINITIONAL for this capability - they are the thing it names.
    The UNCONDITIONAL_TERMINAL_BOUND check exists to stop a terminal determinant
    being demanded where the source declares no travel limit, which is the case
    for BM-002 and C4-drawer. Here the capability statement declares it. The
    auditor verifies this fragment against the frozen dossier rather than taking
    the declaration on trust.

scope_exclusions:
  - "Holding either state is NOT part of this capability; see the latch-retention micro-oracle. A bound determines where the motion ends, not that the closure stays there."
  - "The motion is not required to be rotary. 'Closure' names the function, not a joint type; a translating closure with two bounded extremes instantiates this capability."
  - "What drives the motion is NOT owned here."

invariants:
  - id: NRM-HS-001
    statement: >
      Two states are defined as relative configurations of the two bodies, and
      both are reachable.
    basis_type: PROJECT_DEFINED_CAPABILITY
    support_type: direct
    source_locators:
      - 'DOS-bounded-two-state-closure S1 (original, clause: reaches two defined states)'
    current_authority: 'DOS-bounded-two-state-closure S1 (original, unchanged clause)'
    authority_note: >
      DOS-bounded-two-state-closure S1 remains CURRENT authority for this clause. AMD-HS-001 declares a
      PARTIAL scope - the constraint-persistence and bound-distinctness clauses only - so applying it here
      would exceed its declared supersession scope.
    conclusion_scope: "Existence and reachability of the two states."
    exclusions:
      - "Does not name the states, fix an angle or a displacement between them, or say which is the rest state. No capability-level open angle exists (DOS S4); see UNR-HS-001."
    verification_predicate: "exists(state A) and exists(state B) as relative configurations, each reachable along the motion."
    requires_tags: [two_states_defined, both_states_reachable]
    related_freedoms: [FRE-HS-001, FRE-HS-002]
    related_unresolved: [UNR-HS-001]

  - id: NRM-HS-002
    statement: >
      A continuous motion connects the two states.
    basis_type: PROJECT_DEFINED_CAPABILITY
    support_type: direct
    source_locators:
      - 'DOS-bounded-two-state-closure S1 (original, clause: by a bounded motion)'
    current_authority: 'DOS-bounded-two-state-closure S1 (original, unchanged clause)'
    authority_note: >
      DOS-bounded-two-state-closure S1 remains CURRENT authority for this clause. AMD-HS-001 declares a PARTIAL scope - the constraint-persistence and bound-distinctness clauses only - so applying it here would exceed its declared supersession scope.

    conclusion_scope: "Existence of a continuous path between the two states."
    exclusions:
      - "Does not fix a path shape, a joint type or a degree of freedom count. A rotary path, a translating path and a compound path are equally admissible."
    verification_predicate: "exists(path) from state A to state B along which the relative configuration varies continuously."
    requires_tags: [motion_continuous_between_states]
    related_freedoms: [FRE-HS-002]
    related_unresolved: []

  - id: NRM-HS-003
    statement: >
      At every configuration along the declared bounded path, at least one
      realized constraint or interaction keeps the configuration within the
      allowed motion manifold.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators:
      - 'AMD-HS-001 (supersedes the constraint-persistence clause of DOS-bounded-two-state-closure S1)'
      - 'HSD-003'
    current_authority: 'AMD-HS-001 / HSD-003'
    authority_note: >
      The constraint-persistence clause IS within AMD-HS-001 declared scope. The original read as requiring ONE identical constraint throughout; the amendment requires continuous COVERAGE with hand-off permitted.

    derivation_premises:
      - "A bounded motion is a motion whose configuration space is limited."
      - "Where nothing constrains the configuration, it is not limited there, so the motion is not bounded at that configuration."
      - "What limits it may differ from one part of the path to another without the motion ceasing to be bounded."
    conclusion_scope: >
      Continuity of CONSTRAINT COVERAGE along the bounded path. Not the identity
      or persistence of any one constraint.
    exclusions:
      - >
        Does NOT require ONE identical relative constraint to persist through the
        whole motion. The constraint MODE may change, and the path may use
        several features or interaction regimes in succession - a pin taking over
        from a cam, a flexure handing off to a contact face. What must not occur
        is a stretch of path where nothing constrains the configuration.
        Corrected at SF-10.1.
      - "Says nothing about configurations outside the bounded motion."
      - "Does not name the constraint and does not require it to be a joint."
    verification_predicate: >
      for every configuration along the declared bounded path: at least one
      realized constraint or interaction is active and keeps the configuration
      within the allowed manifold. Hand-offs between constraints are admissible
      provided coverage is continuous.
    requires_tags: [constraint_coverage_continuous]
    related_freedoms: [FRE-HS-003]
    related_unresolved: []
    closes_finding: [SF-10.1]

  - id: NRM-HS-004
    statement: >
      The bound at each extreme is produced by a realized physical condition, not
      by a limit imposed on the model.
    basis_type: PROJECT_DEFINED_CAPABILITY
    support_type: direct
    source_locators:
      - 'DOS-bounded-two-state-closure S1 (original, clause: the bound at each extreme is physically produced)'
    current_authority: 'DOS-bounded-two-state-closure S1 (original, UNCHANGED clause)'
    authority_note: >
      This clause is EXPLICITLY excluded from AMD-HS-001 scope and is unchanged. It also grounds source_declares_terminal_states, so its authority must remain the original section.

    conclusion_scope: "Physical origin of each bound."
    exclusions:
      - "Does not name a bounding principle. DOS S7 records that the corpus bounds motion only by a discrete stop feature, and that gravity rest, over-centre, detent, friction and geometric run-out are absent from the library. That is a library state, not a requirement."
      - "Does not forbid representing a bound as a joint limit in a model. It requires that the design record which realized condition the limit stands for."
    verification_predicate: "each extreme references a realized condition — contact, geometric run-out, force balance, or an engagement ending — with participating geometry, not a numeric range on a joint alone."
    requires_tags: [each_bound_physically_realized]
    related_freedoms: [FRE-HS-004]
    related_unresolved: []

  - id: NRM-HS-005
    statement: >
      Each extreme is physically determined and is evaluated independently at its
      own configuration.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators:
      - 'AMD-HS-001 (supersedes the bound-distinctness clause of DOS-bounded-two-state-closure S1)'
      - 'HSD-003'
    current_authority: 'AMD-HS-001 / HSD-003'
    authority_note: >
      The bound-distinctness clause IS within AMD-HS-001 declared scope. The original read as requiring a distinct determining FEATURE per extreme; the amendment requires independent EVALUATION per extreme, permitting one continuous geometry or one field to produce both.

    derivation_premises:
      - "The capability names two extremes, at two different configurations."
      - "A result obtained at one configuration is a fact about that configuration."
      - "Copying it to the other asserts something no evaluation established."
    conclusion_scope: "Independent evaluation of each extreme, and physical determination of each."
    exclusions:
      - >
        Does NOT require each extreme to have a completely different determining
        feature. ONE continuous geometry or ONE physical field may produce both
        bounds at different configurations - a single curved slot whose two ends
        arrest the pin, a single magnetic field with two stable seats. What is
        forbidden is copying one evaluation RESULT to both. Corrected at SF-10.2.
      - "The same manufactured part may participate in both bounds."
      - "The two extremes need not use the same bounding principle."
    verification_predicate: >
      each extreme references a realized physical condition, and each is evaluated
      at its own configuration; no evaluation result is reused across extremes.
      A single continuous feature or field participating in both is admissible.
    requires_tags: [each_extreme_independently_evaluated]
    related_freedoms: [FRE-HS-004, FRE-HS-007]
    related_unresolved: []
    closes_finding: [SF-10.2]

  - id: NRM-HS-006
    statement: >
      Along the required motion the two bodies have no undeclared volumetric
      overlap. Intended bounding and constraining interactions are admissible and
      are not treated as interference.
    basis_type: NECESSARY_PHYSICAL_CONSEQUENCE
    support_type: derived
    source_locators:
      - 'DOS-bounded-two-state-closure S1 (original, clause: reaches two defined states by a bounded motion)'
    current_authority: 'DOS-bounded-two-state-closure S1 (original, unchanged clause)'
    authority_note: >
      DOS-bounded-two-state-closure S1 remains CURRENT authority for this clause. AMD-HS-001 declares a
      PARTIAL scope - the constraint-persistence and bound-distinctness clauses only - so applying it here
      would exceed its declared supersession scope.
    derivation_premises:
      - "The capability requires both states to be reached by the motion."
      - "Two solids cannot occupy the same space."
      - >
        They MAY touch, and in a bounded closure they must: whatever produces a
        bound acts at the extreme. Treating that as interference would reject the
        capability's own defining feature.
    conclusion_scope: >
      Absence of UNDECLARED volumetric overlap along the required motion. Nothing
      about how many interactions there are, of what kind, or where.
    exclusions:
      - >
        Does NOT state how many bounding interactions exist, nor that they are
        contacts. A bound may arise from contact, from geometric run-out, from an
        engagement ending, from force or field equilibrium, or from ONE physical
        field participating at both endpoints. The retired wording "of which the
        bounding contacts are two" asserted both a count and a kind, and would
        have rejected ADM-HS-D and ADM-HS-F, which the pack admits. Corrected at
        FPC-005.
      - "Contact at a bounding or constraining interaction is intended and is not interference."
      - "Does not fix a clearance value; none exists at capability level."
    verification_predicate: >
      for every configuration of the required motion: the two bodies share no
      volume outside declared contact, declared interference-fit and declared
      compliant-interaction regions, under the declared tolerance.
    requires_tags: [no_undeclared_volumetric_overlap, intended_interaction_physically_consistent]
    evaluability_prerequisites: [interaction_regions_declared, interaction_kind_recorded, numerical_tolerance_recorded]
    related_freedoms: []
    related_unresolved: []
    closes_finding: [FPC-005]

  - id: NRM-HS-007
    statement: >
      Evidence offered that a bound is present must rest on either direct causal evidence
      or discriminating evidence.
    basis_type: VERIFICATION_MINIMUM
    support_type: derived
    enables_claim: >
      NRM-HS-004 may be reported PASS. Without this minimum, a criterion that also
      passes on an otherwise identical UNBOUNDED closure would be counted as
      showing that a bound is present - which is exactly what the corpus's matched
      pair does.
      Satisfied by direct causal evidence OR by a discriminating control
      (HSD-006); the two are alternatives, not a sequence.
      Satisfied by branch A OR branch B under HSD-006; the two are ALTERNATIVES. Absence of a
      control is never a physical FAIL.
    source_locators:
      - 'DOS-bounded-two-state-closure S5'
      - 'DOS-bounded-two-state-closure S3'
      - 'HSD-006'
    current_authority: 'DOS-bounded-two-state-closure S5 + HSD-006'
    authority_note: >
      S5 records the matched-pair non-discrimination finding and is unchanged. HSD-006 governs the admissible EVIDENCE FORMS (direct causal OR discriminating control), not the finding itself.

    derivation_premises:
      - "DOS S5 records a matched pair differing in exactly one feature: the presence of the limit."
      - "Every seed-0 criterion in that pair passes in BOTH members, including the angle criterion, since 115.37 and 219.65 both exceed the 90 degree threshold."
      - "A criterion that passes on the unbounded member as well as the bounded one separates nothing, so it is not evidence that a bound is present."
    conclusion_scope: "Admissibility of a criterion as evidence for NRM-HS-004. Says nothing about the design."
    exclusions:
      - >
        Corrected at GATE-2 / HSD-006. Either form of support is admissible:
        A. DIRECT CAUSAL evidence - the feature's geometry exists, contact or
        interaction occurs at the relevant configuration, and the observed
        behaviour is caused by it; or
        B. DISCRIMINATING evidence - a control, ablation or sensitivity result
        showing the criterion fails when the feature is removed.
        A control is no longer mandatory. Requiring one made ordinary direct
        causal evidence inadmissible, and forced a second model to be built for
        every feature claim.
      - "Does not invalidate the matched pair as evidence of something else. DOS S5 records what it does support: removing the limit produced seed-level instability across a five-seed sweep."
      - "Does not require a physical control specimen. A demonstrated sensitivity of the criterion to the bound's absence is sufficient."
    verification_predicate: >
      A claim about the bound at an extreme may be supported by EITHER (A) direct causal evidence - the realizing geometry or field exists, it is active at the relevant configuration, and the observed behaviour is causally attributable to it - OR (B) discriminating evidence: a control, ablation, sensitivity analysis or other comparison showing the claimed behaviour is lost or changed. A control is useful but is not mandatory when direct causal evidence is adequate.
    requires_evidence_tags: [bound_criterion_discriminates]
    moved_at: SF-1.1
    move_note: "Whether a test distinguishes a bounded from an unbounded control is an evidence property, not a property of the physical closure (SF-10.4)."
    related_freedoms: []
    related_unresolved: []
    evidence_branches:
      A_direct_causal: "realizing geometry or field exists; active at the relevant configuration; behaviour causally attributable to it"
      B_discriminating: "control, ablation, sensitivity analysis or other comparison showing the behaviour is lost or changed"
      relation: ALTERNATIVES
    corrected_at: FPC-006

required_unresolved:
  - id: UNR-HS-001
    decision: The angular or linear separation between the two states.
    kind: quantitative
    why_must_remain_open: >
      DOS S4: no capability-level open angle exists. The 90 degree threshold is
      the m0 fixture's own, and the realization targeted 90 degrees (DOS S6).
    resolvable_when: "An instantiating case supplies a required separation."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-HS-001 — reachability of two declared states is structural."
    source_locators: ["DOS-bounded-two-state-closure S4", "DOS-bounded-two-state-closure S6"]
  - id: UNR-HS-002
    decision: Whether either state is held, and against what.
    kind: qualitative
    why_must_remain_open: >
      Outside this capability's scope. A bound says where the motion ends, not
      that the closure remains there. Holding is owned by latch-retention.
    resolvable_when: "An instantiating case states a holding requirement."
    block_scopes: []
    source_locators: ["DOS-bounded-two-state-closure S4"]
  - id: UNR-HS-003
    decision: Load carried at the bound, life, and duty.
    kind: quantitative
    why_must_remain_open: "DOS S4: no capability-level load or life exists."
    resolvable_when: "An instantiating case supplies a load case and a duty."
    block_scopes: [blocks_quantitative_acceptance, blocks_PASS]
    does_not_block:
      - "NRM-HS-004 — that a bound is physically produced is structural."
    source_locators: ["DOS-bounded-two-state-closure S4"]
  - id: UNR-HS-004
    decision: A single-run criterion that distinguishes a bounded from an unbounded closure.
    kind: interpretive
    why_must_remain_open: >
      DOS S5: the corpus's matched pair does not supply one. Every seed-0
      criterion passes in both members; the verdicts differ only through seed
      aggregation, 5/5 against 1/5. Adopting any of those criteria as the
      discriminator would assert a discrimination the evidence does not show.
    resolvable_when: >
      A criterion is demonstrated to fail when the bound is removed, at a stated
      fidelity — or a seed-sweep protocol is declared as the discriminator, with
      its aggregation rule.
    block_scopes: [blocks_evidence_interpretation, blocks_PASS]
    does_not_block:
      - "NRM-HS-004 as a structural predicate — whether the design declares a realized bounding condition is inspectable without any test."
    source_locators: ["DOS-bounded-two-state-closure S5", "DOS-bounded-two-state-closure S3"]
