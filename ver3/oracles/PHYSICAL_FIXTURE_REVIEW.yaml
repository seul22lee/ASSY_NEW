  - intended_interaction_physically_consistent
  - installation_process_physically_realizable
  narrative_support: A detachable cover withdrawn along mating guide features. The guide features are
    intended sliding contacts; withdrawal is along their axis, so no overlap is implied.
  representation_prerequisites:
  - interaction_regions_declared
  - interaction_kind_recorded
  - numerical_tolerance_recorded
  - assembly_assumptions_recorded
  assumptions:
  - the guide features disengage without interference at the withdrawal limit
  - the over-centre draw latch has a deflectable or pivoting element - the narrative says "over-centre",
    which requires a member that can pass its dead point
  unresolved_physical_questions:
  - whether the guides run out before the cover clears the aperture is geometry-dependent
  reviewer_status: NEEDS_GEOMETRY_VALIDATION
  changed_during_this_pass: false
  note: IIPC rests on the over-centre latch being physically coherent. An over-centre mechanism inherently
    needs a member that travels past a dead point, which the narrative implies but does not dimension.
- fixture_id: ADM-BM-001-D
  pack: BM-001
  fixture_kind: admissible
  physical_tags_assigned:
  - no_undeclared_volumetric_overlap
  - intended_interaction_physically_consistent
  - installation_process_physically_realizable
  narrative_support: 'A friction-pivoted lid positioned anywhere in a declared open region, overhanging
    part of the aperture. Overhang is NOT overlap: the lid projects over the opening without sharing space
    with the body solid.'
  representation_prerequisites:
  - interaction_regions_declared
  - interaction_kind_recorded
  - numerical_tolerance_recorded
  - assembly_assumptions_recorded
  assumptions:
  - pivot friction exceeds the lid gravity moment throughout the declared region
  - the lid does not foul the body anywhere in the declared region
  - the friction pivot is an intended contact whose normal force is what generates the holding torque
  unresolved_physical_questions:
  - the friction margin is unverified and is the fixture’s load-bearing assumption
  - whether the declared usable access is genuinely reachable past the overhanging lid
  reviewer_status: NEEDS_GEOMETRY_VALIDATION
  changed_during_this_pass: false
  note: This fixture is the SF-2.1/SF-2.2 falsifier and its overhang is exactly the case a blanket-clearance
    predicate would misread. It carries NUVO precisely because overhang and overlap are different things.
