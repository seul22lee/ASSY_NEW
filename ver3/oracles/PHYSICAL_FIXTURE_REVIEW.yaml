schema_version: 0.1.0
purpose: Individual physical review of EVERY fixture in all nine packs. Created at PCF-005, which found
  that the previous pass had appended new physical tags to ~100 fixtures by script without reading a single
  narrative.
the_tag_is_not_evidence: A tag records a REVIEW CONCLUSION. It is authored by the same hand as the invariant
  it satisfies and is not independent physical evidence. This record exists so that each conclusion can
  be checked against the narrative that is supposed to support it, one fixture at a time.
method: 'For each fixture: re-read its narrative; identify its actual interaction regions; decide whether
  each canonical physical property is supported BY THAT NARRATIVE; add an explicit assumption only where
  one is necessary and justifiable; withhold a tag where the fixture is meant to violate that property;
  and record the unresolved physical questions honestly.'
canonical_physical_tags:
  no_undeclared_volumetric_overlap: no two solids share space outside a declared contact, interference-fit
    or compliant-interaction region
  intended_interaction_physically_consistent: each intended interaction is physically coherent
  installation_process_physically_realizable: a realizable installation process exists (product cases
    with an assembly obligation only)
scope_note: The five micro-oracles and BM-001-2 declare no assembly obligation, so installation_process_physically_realizable
  is not in scope for them and is not assigned. BM-001-2 additionally declares no motion path, so it carries
  only intended_interaction_physically_consistent.
status_vocabulary:
  NEEDS_GEOMETRY_VALIDATION: narrative coherent, assumptions explicit, CAD or physics required to confirm
  NEEDS_NARRATIVE_CORRECTION: the narrative as written does not support the tags the fixture needs
  NOT_EVALUABLE_FROM_CURRENT_FIXTURE_DESCRIPTION: the narrative is silent on the property
summary:
  total_fixtures: 108
  admissible: 44
  inadmissible: 64
  NEEDS_GEOMETRY_VALIDATION: 108
  NEEDS_NARRATIVE_CORRECTION: 0
  NOT_EVALUABLE: 0
reviews:
- fixture_id: ADM-BM-001-A
  pack: BM-001
  fixture_kind: admissible
  physical_tags_assigned:
  - no_undeclared_volumetric_overlap
  - intended_interaction_physically_consistent
  - installation_process_physically_realizable
  narrative_support: A rotating lid on a lateral axis with a compressive catch and a moulded abutment.
    The narrative names three interactions - the pivot, the catch and the abutment - all of which are
    intended contacts. It describes no region where lid and body would occupy the same space.
  representation_prerequisites:
  - interaction_regions_declared
  - interaction_kind_recorded
  - numerical_tolerance_recorded
  - assembly_assumptions_recorded
  assumptions:
  - the pivot bore/pin pair is dimensioned as a running fit, so its contact is bounded by the declared
    tolerance
  - the abutment lies outside the lid sweep until the open pose, so it does not foul the lid earlier
  - the lid and body are dimensioned so the catch deflection region can flex without the two solids overlapping
  unresolved_physical_questions:
  - whether the abutment position actually clears the sweep is geometry-dependent and unverified
  reviewer_status: NEEDS_GEOMETRY_VALIDATION
  changed_during_this_pass: false
  note: 'IIPC is supportable: a compressive catch needs a deflectable region and the narrative implies
    a moulded one, but the deflection is not quantified. IPPR is supportable: nothing in the narrative
    requires a part to pass through installed rigid material, and lid/pin/body admit an ordinary insertion
    order.'
- fixture_id: ADM-BM-001-B
  pack: BM-001
  fixture_kind: admissible
  physical_tags_assigned:
  - no_undeclared_volumetric_overlap
  - intended_interaction_physically_consistent
  - installation_process_physically_realizable
  narrative_support: A single moulded shell whose closure region is a thinned compliant band, with a magnetic
    catch. The compliant band IS a declared compliant region, so IIPC has direct narrative support - this
    is the one BM-001 admissible fixture whose interaction consistency is stated rather than assumed.
  representation_prerequisites:
  - interaction_regions_declared
  - interaction_kind_recorded
  - numerical_tolerance_recorded
  - assembly_assumptions_recorded
  assumptions:
  - the band material admits the strain of full opening without yielding
  - the magnet pair is recessed so the two pole regions meet at a declared contact rather than overlapping
  - a single moulding has no discrete insertion for the shell itself
  unresolved_physical_questions:
  - whether a band stiff enough to hold the over-centre pose survives the opening strain is a material
    question with no source data
  reviewer_status: NEEDS_GEOMETRY_VALIDATION
  changed_during_this_pass: false
  note: 'IPPR is nearly trivial here: a single-piece moulding owes no discrete insertion process for its
    own body, and the magnet is the only inserted part.'
- fixture_id: ADM-BM-001-C
