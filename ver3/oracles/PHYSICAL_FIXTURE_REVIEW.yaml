    snap trade, with no material data in any source
  reviewer_status: NEEDS_GEOMETRY_VALIDATION
  changed_during_this_pass: false
  note: THE compliant-assembly fixture. Under the retired assembly_paths_exist contract this design was
    unassemblable by definition.
