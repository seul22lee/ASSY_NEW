schema_version: 0.3.0
purpose: Pass E cross-pack ownership review. A review record, never Oracle evidence.
note: Recorded before the arbitration conclusions of earlier passes were re-read.
checks:
- question: Is guidance silently discharged by conversion?
  verdict: 'no'
  evidence: rotary-to-linear NRM-RL-004 excludes general guidance explicitly and stage_expectations.s05
    carries a double_discharge_rule; NEG-RL-012 makes the conflation a defect. BM-002 and C4-drawer keep
    guidance (NRM-BM-002-007 / NRM-C4-005) separate from conversion (NRM-BM-002-003 / NRM-C4-004).
- question: Is bounding silently discharged by retention, or retention by a stop?
  verdict: 'no'
  evidence: bounded-two-state-closure UNR-HS-002 holds the holding question open and NEG-HS-011 forbids
    crediting a bound as holding; latch-retention scope_exclusions disclaim how bodies reach the retained
    state. BM-001 keeps NRM-BM-001-005 (open state) separate from NRM-BM-001-006 (retention).
- question: Is load support conditional on actual loads?
  verdict: 'yes'
  evidence: NRM-BM-001-011, NRM-BM-002-006, NRM-C4-009, NRM-GS-005 and NRM-RL-005 all carry applies_when
    and load-qualified predicates. The auditor enforces this as CONDITIONAL_LOAD_DOMAIN_VIOLATION.
- question: Are product requirements copied into capability definitions?
  verdict: 'no'
  evidence: No micro-oracle statement cites a product dossier. Every PROJECT_DEFINED_CAPABILITY statement
    is grounded in its own S1, enforced as CAPABILITY_NOT_FROM_CAPABILITY_STATEMENT. guided-slider UNR-GS-003
    and UNR-GS-004 explicitly defer instantiating-case questions rather than answering them.
- question: Do micro-oracles redefine product sources?
  verdict: 'no'
  evidence: Micro-oracles declare capabilities and defer instantiating detail to UNR entries; no product
    REQ id appears in any micro-oracle locator.
- question: Do BM-002 and C4-drawer double-count one realization across guidance and conversion?
  verdict: 'no'
  evidence: Their conversion invariants require an interaction with participating geometry; their guidance
    invariants require the required behaviour to be preserved. A single realization may satisfy both,
    but each obligation is evaluated on its own predicate.
result: clean - no obligation is discharged by a neighbouring capability
