- finding_id: RR-H-01
  pass_: H
  checked: no architecture or representation rule sits in a product physical invariant
  verdict: CLEAN
  detail: 'after correction: no physical predicate requires anything to be RECORDED. The three assembly
    predicates now require the insertion to be physically COHERENT; recording its assumptions is owned
    by evaluability_prerequisites.'
  action: 'CORRECTED: NRM-BM-001-010, NRM-BM-002-012 and NRM-C4-011 each embedded "...and its required
    deformation, material assumption, insertion direction and process assumption are represented" inside
    a PHYSICAL predicate. A press fit that is physically coherent but whose assumptions are unrecorded
    would have failed a physical invariant. This is the PCF-004 defect class surviving inside the assembly
    contract, and the auditor did not catch it - the independent review did.'
  check_correction: 'The first run of this check searched the WHOLE invariant and flagged NRM-RL-002,
    whose exclusion says "Does NOT require the relation to be declared... those are representation obligations".
    The exclusion is correct content - it disclaims exactly the coupling this pass exists to prevent -
    and the CHECK was wrong to read a disclaimer as an assertion. The check now searches only the asserting
    fields: statement, verification_predicate and conclusion_scope.'
- finding_id: RR-H-02
  pass_: H
  checked: no product obligation is discharged by pointing at a micro-oracle
  verdict: CLEAN
  detail: 'HSD-003 records the scope limit explicitly: not every product closure instantiates bounded-two-state-closure,
    and BM-001 ADM-C/ADM-D are the cases in point.'
  action: none
