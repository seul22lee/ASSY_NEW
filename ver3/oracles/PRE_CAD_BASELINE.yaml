revision_procedure_after_a_cad_counterexample:
- '1. Record the counterexample: the fixture or design, the geometry, and which statement it contradicts.'
- '2. Classify it: (a) the STATEMENT is wrong; (b) the FIXTURE narrative is wrong; (c) a human DECISION
  (HSD-nnn) is wrong; (d) the SOURCE READING is wrong.'
- '3. Class (a)/(b): correct the pack, add the counterexample as a fixture, and re-run the full audit
  sequence. The clean-audit count resets.'
- '4. Class (c): revise the decision in HUMAN_SEMANTIC_DECISIONS.yaml FIRST, then every artifact citing
  it. A decision is never revised implicitly by editing a pack.'
- '5. Class (d): a reading change needs a new dossier amendment; the frozen dossier is never edited.'
- 6. SOURCE_FREEZE.yaml is NOT revised by a CAD result. The source is not challengeable by CAD; only conclusions
  drawn from it are.
- 7. Re-issue this baseline with a new baseline_manifest_hash and record the superseded hash.
