cad_counterexample_procedure:
- 1. Record the counterexample against a specific statement, fixture, amendment or decision.
- 2. PRESERVE SOURCE_FREEZE.yaml unchanged. The source bytes were not what was wrong, and CAD cannot rewrite
  what a source says.
- '3. Classify: (a) the STATEMENT is wrong; (b) the FIXTURE narrative is wrong; (c) an AMENDMENT is wrong;
  (d) a DECISION (HSD-nnn) is wrong.'
- '4. (c)/(d): revise SEMANTIC_AUTHORITY.yaml and issue authority version v(n+1), recording the superseded
  manifest hash. The original dossier section an amendment superseded is still in the freeze and can be
  re-adopted with no edit to any frozen file.'
- '5. (a)/(b): correct the pack, add the counterexample as a fixture, re-review it individually in PHYSICAL_FIXTURE_REVIEW.yaml.'
- 6. Re-run every semantic review pass and the full audit sequence from the canonical audit. The clean
  count resets.
- 7. Issue a new PRE_CAD_BASELINE version referencing the new semantic-authority version and a new baseline_manifest_hash.
why_this_procedure_is_executable: Because SOURCE_FREEZE holds only source bytes and SEMANTIC_AUTHORITY
  holds the challengeable readings. The previous baseline required a CAD result to revise HUMAN_SEMANTIC_DECISIONS.yaml
  while the freeze holding that file declared it immutable and not challengeable - step 4 contradicted
  step 6 (PCF-009). No file in this baseline is described as immutable and revisable at once.
