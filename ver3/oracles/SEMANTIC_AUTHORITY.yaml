created_at: PCF-002 / PCF-009
purpose: 'The CURRENT, CHALLENGEABLE interpretation layer. It sits between immutable source provenance
  (SOURCE_FREEZE.yaml) and the Oracle conclusions that rest on it (the packs). Separating it makes the
  CAD revision procedure possible: source bytes never change, this layer is versioned, and the packs follow
  it.'
three_layer_model:
  A_immutable_source_and_provenance:
    manifest: ver3/oracles/SOURCE_FREEZE.yaml
    contains: rank-1 user extracts, original frozen dossiers (product and micro-oracle), ambiguity records,
      the source precedence policy
    cad_may_change_it: false
    why: CAD cannot alter what a source says
  B_challengeable_semantic_authority:
    manifest: ver3/oracles/SEMANTIC_AUTHORITY.yaml
    contains: human semantic decisions, dossier amendments, supersession relations
    cad_may_change_it: true
    why: these are readings and definitions; geometry can show a reading admits an unbuildable design
      or rejects a buildable one
  C_current_oracle_conclusions:
    manifest: ver3/oracles/PRE_CAD_BASELINE.yaml
    contains: normative, freedoms, physical realizations, evidence cases, negative cases, stage expectations,
      source maps, reviews
    cad_may_change_it: true
    why: these are the conclusions under adversarial test
semantic_authority_manifest_hash: 9d447f0092defe22c92f7fe2dda7cd93af4168a3f9ac0ebbef43b352a6d0c600
manifest_hash_exclusion_rule: sha256 over the newline-joined, path-sorted "<path>  <sha256>" lines of
  the artifacts list. SEMANTIC_AUTHORITY.yaml itself is EXCLUDED - a manifest cannot hash the file carrying
  it.
