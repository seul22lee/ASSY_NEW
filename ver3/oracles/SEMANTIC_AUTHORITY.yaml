revision_procedure:
- 1. A CAD counterexample is recorded against a specific statement, fixture, amendment or decision.
- 2. SOURCE_FREEZE.yaml is PRESERVED UNCHANGED. The source bytes are not what was wrong.
- '3. If a DECISION was wrong: revise it in HUMAN_SEMANTIC_DECISIONS.yaml, stating the old reading, the
  new reading and why. A decision is never revised implicitly by editing a pack.'
- '4. If an AMENDMENT was wrong: revise or withdraw it. The original dossier section it superseded is
  still in SOURCE_FREEZE and can be re-adopted without any edit to a frozen file.'
- 5. Issue a NEW SEMANTIC_AUTHORITY version with a new manifest hash, recording the superseded one.
- 6. Propagate to every pack citing the changed authority; re-run every semantic review.
- 7. Re-run the full audit sequence from the canonical audit. The clean count resets.
- 8. Issue a new PRE_CAD_BASELINE version referencing the new semantic-authority version.
paradox_resolved: 'The previous baseline said a CAD result revises HUMAN_SEMANTIC_DECISIONS.yaml (step
  4) while the freeze holding that file said it was neither revisable by CAD nor challengeable. The procedure
  required changing a hash it forbade changing. Resolved by moving the file to this layer: source bytes
  immutable, semantic authority versioned.'
