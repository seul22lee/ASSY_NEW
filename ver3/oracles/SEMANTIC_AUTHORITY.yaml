  - LEGACY-CONFLICT-C4-01
  - NRM-BM-002-003
  - NRM-BM-002-006
  challengeable_by_cad: true
  status: CURRENT
- decision_id: HSD-003
  title: bounded-two-state-closure capability scope
  kind: PROJECT_DEFINED_CAPABILITY
  accepted_readings:
  - the capability represents a physically constrained bounded motion between two states
  - at every intermediate configuration at least one realized interaction keeps the configuration in the
    allowed motion manifold
  - the active constraint MAY CHANGE along the path
  - one identical persistent constraint is NOT required
  - two endpoint bounds alone, with an unconstrained free-flight region between them, do NOT instantiate
    this micro-oracle
  rejected_readings:
  - A - one identical persistent constraint
  - C - endpoint bounds with an unconstrained interior
  affected_statement_ids:
  - NRM-HS-003
  - NRM-HS-005
  - UNR-HS-002
  challengeable_by_cad: true
  status: CURRENT
- decision_id: HSD-004
  title: C4-drawer horizontal motion reading
  kind: PRODUCT_LANGUAGE_INTERPRETATION
  accepted_readings:
  - '"drawer slides out horizontally" is represented as straight translation along one horizontal axis
    perpendicular to the gravity direction'
  rejected_readings:
  - B - a curved path described only as "generally horizontal", rejected FOR THIS BASELINE
  - C - horizontality of net displacement only
  affected_statement_ids:
  - NRM-C4-002
  - NRM-C4-003
  - NEG-C4-023
  challengeable_by_cad: true
  status: CURRENT
- decision_id: HSD-005
  title: BM-001-3 curved-back reading
  kind: PRODUCT_LANGUAGE_INTERPRETATION
  accepted_readings:
  - for "rests on a curved back", the LOAD-BEARING resting contact must lie on the curved region
  - curvature elsewhere, on a non-load-bearing decorative region, is insufficient
  - a flat land carrying all the weight does NOT satisfy this reading
  rejected_readings:
  - B - resting anywhere on a curved underside, which would admit a body carried entirely by a flat land
  affected_statement_ids:
  - NRM-BM-001-3-002
  - ADM-BM-001-3-C
  - INA-BM-001-3-D
  - NEG-BM-001-3-005
  - UNR-BM-001-3-002
  challengeable_by_cad: true
  status: CURRENT
- decision_id: HSD-006
  title: causal verification minimum
  kind: VERIFICATION_METHODOLOGY
  accepted_readings:
  - a physical feature claim may be supported by EITHER direct causal geometry/contact evidence OR a discriminating
    control, ablation or sensitivity result
  - a control is NOT mandatory when direct causal evidence is available
  - a realized stop may be evidenced by explicit stop faces, contact at the terminal configuration, and
    kinematic termination caused by that contact - without a second model with the stop removed
  rejected_readings:
  - A - a control is the only admissible proof
  - C - direct evidence always suffices, with no discrimination requirement at all
  affected_statement_ids:
