decisions:
- decision_id: HSD-001
  title: guided-slider capability scope
  kind: PROJECT_DEFINED_CAPABILITY
  accepted_readings:
  - guidance is along a declared line or path
  - only freedoms that would violate the instantiating requirement must be constrained
  - residual axial rotation or another freedom may remain when permitted, and must be DECLARED
  - the capability is NOT synonymous with a strict 1-DOF prismatic joint
  rejected_readings:
  - A - all five non-translational freedoms must always be removed
  - 'C - rejected separately: a freedom neither constrained nor declared is a silent account, which is
    the defect NRM-GS-002 exists to catch'
  affected_statement_ids:
  - NRM-GS-001
  - NRM-GS-002
  - NRM-GS-003
  - NRM-GS-004
  - NRM-GS-005
  - NRM-GS-006
  - FRE-GS-008
  - UNR-GS-004
  challengeable_by_cad: true
  status: CURRENT
- decision_id: HSD-002
  title: rotary-to-linear-engagement capability scope
  kind: PROJECT_DEFINED_CAPABILITY
  accepted_readings:
  - an uninterrupted chain of localized physical interactions connects rotary input to translating output
  - multi-stage interaction chains are admissible
  - direct input-output engagement is NOT required
  - reaction requirements apply only to load components actually carried
  rejected_readings:
  - A - one direct engagement between the input and output bodies
  - A - universal radial and axial support requirements
  - 'C - rejected: a relation with no participating material names no place where the conversion acts
    and cannot be built'
  affected_statement_ids:
  - NRM-RL-001
  - NRM-RL-002
  - NRM-RL-003
  - NRM-RL-004
  - NRM-RL-005
  - NRM-C4-004
