schema_version: 0.1.0
purpose: Approved human semantic and capability decisions. This is a DECISION RECORD. It is not physical
  evidence, it is not a rank-1 user source, and no normative statement may cite it as if it were either.
  It exists so that interpretations are explicit and rejectable in one place rather than silently embedded
  in wording across nine packs.
authority: A decision of kind PROJECT_DEFINED_CAPABILITY defines a capability this project chose. A decision
  of kind PRODUCT_LANGUAGE_INTERPRETATION reads user language that does not settle the question by itself,
  and is distinguishable from verbatim source on that basis. A decision of kind VERIFICATION_METHODOLOGY
  governs what evidence is admissible and makes no claim about any design. None of the three is a user
  requirement.
challengeability: Every decision here is CHALLENGEABLE BY CAD. If geometry or physics shows an approved
  interpretation admits an unbuildable design, or rejects a buildable one, the decision is revised and
  the packs follow it. The SOURCE is not challengeable; the reading of it is.
decision_kinds:
  PROJECT_DEFINED_CAPABILITY: defines the scope of a project-authored capability
  PRODUCT_LANGUAGE_INTERPRETATION: reads user language the source does not settle
  VERIFICATION_METHODOLOGY: governs admissible evidence, not design
summary:
  total: 6
  PROJECT_DEFINED_CAPABILITY: 3
  PRODUCT_LANGUAGE_INTERPRETATION: 2
  VERIFICATION_METHODOLOGY: 1
  all_challengeable_by_cad: true
decisions:
- decision_id: HSD-001
  title: guided-slider capability scope
  decision_kind: PROJECT_DEFINED_CAPABILITY
  decision: What does "guided translation" require of the non-translational freedoms?
  alternatives_considered:
  - 'A: all five non-translational freedoms are always removed (a strict 1-DOF prismatic joint)'
  - 'B: only the freedoms the instantiating requirement depends on are constrained; the rest are declared'
  - 'C: no freedom requirement at all - guidance means only that a path exists'
  approved_interpretation:
  - guidance is along a declared line or path
  - only freedoms that would violate the instantiating requirement must be constrained
  - residual axial rotation or another freedom may remain when permitted, and must be DECLARED
  - the capability is NOT synonymous with a strict 1-DOF prismatic joint
  rejected:
  - A - all five non-translational freedoms must always be removed
  - 'C - rejected separately: a freedom neither constrained nor declared is a silent account, which is
    the defect NRM-GS-002 exists to catch'
  rationale: 'Reading A rejected a cylindrical rod in a plain round bore, which is about as ordinary a
    guided slider as exists. Nothing in any project source requires a prismatic joint, and the capability
    statement that implied one was project-authored, so correcting it corrects a project definition rather
    than reinterpreting a user. Reading C was rejected because an unaccounted-for freedom is exactly the
    silent-omission defect the capability exists to prevent: the correction is to require DECLARATION,
    not to drop the accounting.'
  affected_files:
  - _dossier_amendments/AMENDMENTS.yaml (AMD-GS-001)
  - micro_oracles/guided-slider/normative.yaml
  - micro_oracles/guided-slider/stage_expectations.yaml
  - micro_oracles/guided-slider/realizations.yaml
  - micro_oracles/guided-slider/README.md
  - micro_oracles/guided-slider/source_map.md
  - ORACLE_METHOD.md 13.7
  affected_statement_ids:
