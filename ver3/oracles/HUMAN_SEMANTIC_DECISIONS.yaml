  - NRM-GS-003
  - NRM-GS-004
  - NRM-GS-005
  - NRM-GS-006
  - FRE-GS-008
  - UNR-GS-004
  challengeable_by_cad: true
  approval_status: APPROVED
  note: If strict single-degree-of-freedom guidance is later required by a project source, that is a DIFFERENT
    capability and belongs in a separate pack named single-dof-linear-guidance. It is not this one.
- decision_id: HSD-002
  title: rotary-to-linear-engagement capability scope
  decision_kind: PROJECT_DEFINED_CAPABILITY
  decision: What connects the rotary input to the linear output, and what reactions does the conversion
    owe?
  alternatives_considered:
  - 'A: one localized engagement directly between the rotating input body and the translating output body,
    with radial AND axial reaction on rotating elements'
  - 'B: an uninterrupted chain of localized interactions, with reaction only for load components actually
    carried'
  - 'C: any declared kinematic relation, with no locality requirement at all'
  approved_interpretation:
  - an uninterrupted chain of localized physical interactions connects rotary input to translating output
  - multi-stage interaction chains are admissible
  - direct input-output engagement is NOT required
  - reaction requirements apply only to load components actually carried
  rejected:
  - A - one direct engagement between the input and output bodies
  - A - universal radial and axial support requirements
  - 'C - rejected: a relation with no participating material names no place where the conversion acts
    and cannot be built'
  rationale: 'Reading A rejected the crank-link-slider, in which the input body and the output body never
    touch - the most common rotary-to-linear mechanism in engineering - and also the cable/drum and cam/follower
    families. Its reaction clause was falsified twice: a cable drum carries no axial load, and a rotating
    nut on a fixed screw reacts axially through the screw rather than through a thrust feature on a rotating
    element. Reading C was rejected because locality is what distinguishes a design from a declaration.
    The same decision reclassifies AMB-C4-01: rank precedence already disposes of the gear/no-gear disagreement,
    so no human ruling on a transmission family is called for.'
  affected_files:
  - _dossier_amendments/AMENDMENTS.yaml (AMD-RL-001, AMD-C4-001)
  - micro_oracles/rotary-to-linear-engagement/normative.yaml
  - micro_oracles/rotary-to-linear-engagement/stage_expectations.yaml
  - product_cases/C4-drawer/normative.yaml (LEGACY-CONFLICT-C4-01)
