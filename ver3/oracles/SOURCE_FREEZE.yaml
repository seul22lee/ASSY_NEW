challengeability_note: The SOURCE is not challengeable by CAD. A frozen dossier records what the source
  says; geometry cannot change that. What CAD CAN challenge is every semantic conclusion derived from
  it - the normative statements, the fixtures, and the readings recorded in HUMAN_SEMANTIC_DECISIONS.yaml.
  Those live in PRE_CAD_BASELINE.yaml, which is explicitly challengeable.
what_is_frozen:
- rank-1 product source extracts as they appear in the frozen dossiers
- the original frozen dossiers, byte-for-byte
- approved additive dossier amendments
- the source precedence / rank model
- recorded source ambiguities
- the human semantic decisions that define approved capability authority
- the sha256 of every artifact above
what_is_NOT_frozen:
- normative conclusions as physically final
- physical realization fixtures
- evidence fixtures
- stage expectations
- CAD predicates
- evaluator outputs
- future CAD challenge results
- pack status beyond PRE_CAD_SEMANTIC_REVIEWED
