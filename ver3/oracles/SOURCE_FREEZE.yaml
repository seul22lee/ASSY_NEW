    ambiguity_id: AMB-001-2-01
    level: SOURCE_LEVEL
    statement: 'REQ-010 "the latch can only be worked from inside the enclosure" has three incompatible
      readings and no rank-1 source distinguishes them. This is a SOURCE-level blocker: not a missing
      quantity but an undefined predicate DOMAIN, so no fidelity of evaluation can separate compliant
      from non-compliant designs.'
    consequence: BM-001-2 retains BLOCKED_BY_SOURCE_AMBIGUITY through this freeze and is not lock-ready.
    resolvable_only_by: new rank-1 source material, or an explicit human selection among the three recorded
      readings
