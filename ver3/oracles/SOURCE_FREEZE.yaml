schema_version: 0.2.0
freeze_scope: SOURCE_AND_HISTORICAL_PROVENANCE_ONLY
source_bytes_immutable: true
current_semantic_authority_frozen: false
semantic_lock: false
cad_validated: false
rebuilt_at: PCF-001, PCF-002, PCF-009
rebuild_note: 'Re-authored from the underlying files, not patched. The previous manifest labelled all
  nine dossiers "rank_1_for_S1_product_extracts", which is false for the four micro-oracle dossiers, and
  listed HUMAN_SEMANTIC_DECISIONS.yaml and AMENDMENTS.yaml as frozen while declaring itself not challengeable
  - a contradiction with those artifacts own challengeable_by_cad: true.'
what_this_manifest_is: Immutable source and historical provenance. It fixes WHAT WAS WRITTEN and WHEN,
  and nothing about what those writings currently mean.
what_this_manifest_is_not:
- a semantic lock
- a statement that any capability definition is still current
- a home for HUMAN_SEMANTIC_DECISIONS.yaml (challengeable; see SEMANTIC_AUTHORITY.yaml)
- a home for _dossier_amendments/AMENDMENTS.yaml (challengeable; see SEMANTIC_AUTHORITY.yaml)
- a home for normative.yaml, freedoms.yaml, realizations.yaml, evidence_cases.yaml, stage_expectations.yaml
  or evaluator results
cad_relationship:
  cad_may_not: rewrite the historical source. The bytes recorded here are what the source says; geometry
    cannot change that.
  cad_may: challenge a semantic interpretation, an amendment, or an HSD decision. Those live in SEMANTIC_AUTHORITY.yaml
    and are explicitly challengeable.
authority_types:
  RANK_1_USER_SOURCE: explicit product intent or benchmark requirement stated by the user
  FROZEN_PRODUCT_DOSSIER: a frozen dossier whose S1 contains rank-1 user extracts
  PROJECT_CAPABILITY_ORIGINAL: a frozen dossier whose S1 is an ORIGINAL project-authored capability definition
    - never rank-1, never user language, and semantically supersedable
  FROZEN_AMBIGUITY_RECORD: a recorded ambiguity in a rank-1 source; not itself a source
  SOURCE_PRECEDENCE_POLICY: the definition of the rank scale itself
manifest_hash_exclusion_rule: 'source_manifest_hash is sha256 over the newline-joined, path-sorted "<path>  <sha256>"
  lines of the artifacts list below. SOURCE_FREEZE.yaml itself is EXCLUDED: a manifest cannot contain
  the hash of the file that carries it without being self-referential. No other exclusion applies.'
