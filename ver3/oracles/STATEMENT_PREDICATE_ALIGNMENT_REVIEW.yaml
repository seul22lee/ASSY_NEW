schema_version: 0.1.0
purpose: Statement/predicate/tag/stage alignment review. EVERY invariant is reviewed, not only the ones
  changed, because PCF-007 was a case where a predicate had been corrected and its statement and tag had
  not.
method: 'For each invariant: compare the statement, the verification predicate, the physical tags, the
  representation prerequisites and the stage-11 outcome rule. A MISMATCH is recorded when the statement
  asserts blanket non-intersection while the predicate admits declared contact - the exact PCF-007 shape.'
