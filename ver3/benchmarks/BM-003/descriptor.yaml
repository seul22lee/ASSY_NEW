    The descriptor must not claim more independence than GOVERNANCE.yaml
    supports. The same agent authored the BM-003 source and this Oracle in
    separate tasks. What protects the benchmark is production isolation - no
    stage can read the Oracle - not author independence, which is absent.
  frozen_before_source_only_runs: true
  authority_status: FROZEN
  semantic_review_status: SELF_REVIEW_COMPLETE
  human_semantic_approval: PENDING
