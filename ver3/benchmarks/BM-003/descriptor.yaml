# Benchmark descriptor — identity and locations only.
#
# This file is read by the harness and the evaluator. It is NOT read by any
# stage: production code may not branch on benchmark identity (FP-02, INV-015,
# retirement row R-14). The only thing a run consumes from this tree is
# source/request.txt, and only Stage 01 consumes it (INV-002).

schema_version: "0.1.0"
benchmark_id: BM-003
title: "Compact folding three-leg desktop stand"
status: ORACLE_READY

source:
  request_path: ver3/benchmarks/BM-003/source/request.txt
  present: true
  frozen: true
  read_by: s01
  manifest: ver3/benchmarks/BM-003/source/source_manifest.yaml
  human_review: HUMAN_REVIEW_COMPLETE
  authority_status: FROZEN
  revision: R3
  amendment_id: BM003-SOURCE-AMENDMENT-R3
  request_sha256: ffb7f5f9feb8e38d6ee56dbce91529f817aebbd2f7180d7dedce65da0c94929d
  origin: AUTHORED
  note: >
    The only raw text input to a run. Every later stage reads DesignState.

oracle:
  # Deliberately OUTSIDE this tree. ver3/oracles/ is a BLOCKING forbidden path
  # root for assy_v3, and keeping the Oracle there is what lets the request text
  # stay readable without the answer key becoming readable with it.
  location: ver3/oracles/held_out/BM-003/
  oracle_name: HELD_OUT_BENCHMARK_ORACLE
  authored_independently: true
  frozen_before_source_only_runs: true
  authority_status: FROZEN
  auditor: ver3/oracle_tools/audit_bm003_oracle.py
  hash_manifest: ver3/oracles/held_out/BM-003/ORACLE_HASHES.yaml
  visible_to: [evaluator, human_reviewers]
  never_visible_to: [production_stages, generation_models, prompts, retrieval]

positive_executable_reference:
  location: NOT_BUILT
  role: >
    Development and evaluator-validation fixture. Proves the problem is solvable
    and that the evaluator can recognise a solution. NEVER a production input,
    retrieval source, template or golden geometry (rebuild policy rule 4).
  scoring: >
    Similarity to it is never a scoring input (BENCHMARK_RESULT_CONTRACT SC-01).
    It is one valid design; scoring against it would penalise every other correct
    answer.

output:
  runs: ver3/benchmarks/BM-003/runs/
  evaluations: ver3/benchmarks/BM-003/evaluations/
  layout: "see BENCHMARK_RESULT_CONTRACT run_output_layout"

oracle_ready_notice:
  state: >
    BM-003's source is HUMAN-APPROVED and FROZEN, and its held-out Oracle is
    authored and FROZEN. The benchmark is now SCORABLE: an evaluator has both the
    source a run consumes and the acceptance specification to judge it against.
    No positive executable reference exists, and none is required - a positive
    reference validates the evaluator, it does not define success.
  blocks:
    - "Nothing further from BM-003's side. FSF-02 hidden-Oracle readiness is now satisfied for this benchmark."
  still_outstanding_elsewhere: >
    No stage contract may freeze, because FSF-03 through FSF-07 remain
    unsatisfied: no stage is implemented, so no source-only run has occurred and
    no downstream sufficiency has been demonstrated.
  selection_criteria: ver3/benchmarks/BM-003/BM-003_SELECTION_CRITERIA.md
  benchmark_subject: "BM-003 - COMPACT FOLDING THREE-LEG DESKTOP STAND"
  subject_status: FIXED_BY_INSTRUCTION
  subject_chosen_by_pipeline_or_author: false
  candidate_briefs_superseded: >
    The three briefs in BM-003_SELECTION_CRITERIA.md were not chosen among.
    The subject was fixed by decision, which settles that document's
    HUMAN_DECISION_REQUIRED without selecting a brief.
  required_before_use:
    - "DONE - human review of the authored source, then freezing it (2026-08-05)."
    - "DONE - an independently authored Oracle, frozen before any source-only run (2026-08-05)."
    - "OPTIONAL, not present - a positive executable reference, for evaluator validation."
  ordering_rule: >
    The Oracle must be frozen before the first run, not merely before the
    evaluation. An Oracle written after seeing a run is a description of that
    run (BENCHMARK_RESULT_CONTRACT oracle_frozen_before_run, which invalidates
    the result outright when false).
  subject_provenance: >
    The subject was FIXED BY INSTRUCTION, not selected by analysis and not
    chosen by the pipeline or by the source's author. That is what keeps BM-003
    usable as the third independent witness in the freeze gate.
