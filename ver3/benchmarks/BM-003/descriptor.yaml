positive_executable_reference:
  location: NOT_BUILT
  role: >
    Development and evaluator-validation fixture. Proves the problem is solvable
    and that the evaluator can recognise a solution. NEVER a production input,
    retrieval source, template or golden geometry (rebuild policy rule 4).
  scoring: >
    Similarity to it is never a scoring input (BENCHMARK_RESULT_CONTRACT SC-01).
    It is one valid design; scoring against it would penalise every other correct
    answer.

output:
  runs: ver3/benchmarks/BM-003/runs/
  evaluations: ver3/benchmarks/BM-003/evaluations/
  layout: "see BENCHMARK_RESULT_CONTRACT run_output_layout"

oracle_status_notice:
  state: >
    BM-003's source is HUMAN-APPROVED and FROZEN. Its held-out Oracle is authored,
    semantically self-reviewed and corrected, cryptographically frozen, and
    STRUCTURALLY SCORABLE. Production visibility remains false.

    What is NOT true: the Oracle has not been independently approved. The same
    agent authored the source, the Oracle and the semantic review, so the review
    is self-review however thorough it was. Independent human semantic approval
    is PENDING, and the status name says so rather than rounding it up to READY.

    No positive executable reference exists and none is required - a positive
    reference validates the evaluator, it does not define success.
  blocks:
    - "Nothing further from BM-003's side. FSF-02 hidden-Oracle readiness is now satisfied for this benchmark."
  still_outstanding_elsewhere: >
    No stage contract may freeze, because FSF-03 through FSF-07 remain
    unsatisfied: no stage is implemented, so no source-only run has occurred and
    no downstream sufficiency has been demonstrated.
  selection_criteria: ver3/benchmarks/BM-003/BM-003_SELECTION_CRITERIA.md
  benchmark_subject: "BM-003 - COMPACT FOLDING THREE-LEG DESKTOP STAND"
  subject_status: FIXED_BY_INSTRUCTION
  subject_chosen_by_pipeline_or_author: false
  candidate_briefs_superseded: >
    The three briefs in BM-003_SELECTION_CRITERIA.md were not chosen among.
    The subject was fixed by decision, which settles that document's
    HUMAN_DECISION_REQUIRED without selecting a brief.
  required_before_use:
    - "DONE - human review of the authored source, then freezing it (2026-08-05)."
    - "DONE - an independently authored Oracle, frozen before any source-only run (2026-08-05)."
    - "OPTIONAL, not present - a positive executable reference, for evaluator validation."
  ordering_rule: >
    The Oracle must be frozen before the first run, not merely before the
