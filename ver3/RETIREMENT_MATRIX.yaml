  - path: BM-001_GOLDEN_STAGE_OUTPUTS.md
    disposition: REFERENCE_ONLY
    reason: "Golden outputs are one sample from an allowed set, produced by the system under audit."
    retirement_rows: [R-31]
    hard_prohibition: true
    note: "Never an assertion target. Rank-5 historical example only."
  - path: BM-002_GOLDEN_STAGE_OUTPUTS.md
    disposition: REFERENCE_ONLY
    retirement_rows: [R-31]
    hard_prohibition: true
    reason: "Same as BM-001 goldens."
  - path: benchmarks/
    disposition: REFERENCE_ONLY
    reason: "Ver2's benchmark definitions are rank-1 source material for the dossiers, read by humans."
