    disposition: REIMPLEMENT
    reason: "A physics boundary is needed; the Ver2 harness is not imported."
  - path: tests/
    disposition: RETIRE
    reason: "Field-presence and render-coverage acceptance."
    retirement_rows: [R-28, R-29, R-30]
  - path: out/
    disposition: REFERENCE_ONLY
    reason: "Historical run output."
  - path: "*.md (STAGE_0x_*.md, SYSTEM_ARCHITECTURE.md, DOMAIN_SPECIFICATION.md)"
    disposition: REFERENCE_ONLY
    reason: >
      Ver2's own documentation, including its RL-#### retrospective entries,
      is the best available evidence of why Ver2 failed. Read, never executed.

# =====================================================================
# 3. Ver1
# =====================================================================
ver1:
  - path: knowledge/cards/, knowledge/templates/
    disposition: REFERENCE_ONLY
    hard_prohibition: true
    reason: "A card is a pre-solved sub-design. Never imported, never a knowledge source."
    retirement_rows: [R-09]
  - path: tasks/benchmark/benchmark.py
    disposition: RETIRE
    reason: >
      KG_NO_PERMITTED_REALIZER reported missing knowledge as INFEASIBLE
      (lines 145-150), including for a mechanism whose card existed.
    retirement_rows: [R-27]
    guarded_by: [INV-011]
  - path: tasks/benchmark/goldens/
    disposition: REFERENCE_ONLY
    hard_prohibition: true
    retirement_rows: [R-31]
    reason: "Legacy golden equality."
  - path: "m0..m27 milestone directories"
    disposition: REFERENCE_ONLY
    reason: >
      Evidence of what was attempted and what the results actually were,
      including the V-A structural artifacts. Cited by the dossiers at rank 5.
  - path: "V-01..V-17 deterministic validators"
    disposition: REFERENCE_ONLY
    reason: "Read for WHAT they checked. Ver3 validators are contract-derived, not ported."

# =====================================================================
# 4. This repository's root tree — the KG / ontology project
#    INV-016 forbids any Ver3 runtime dependency on these.
# =====================================================================
this_repo_root:
  - path: ontology/
    disposition: KEEP_NON_PIPELINE
    reason: >
      A machine-design knowledge graph built from textbooks. It is a different
      project sharing this repository. INV-016 makes a Ver3 runtime read of it a
      BLOCKING violation, and the absence_run test renames it to prove Ver3 does
      not need it.
    guarded_by: [INV-016]
  - path: data/
    disposition: KEEP_NON_PIPELINE
    reason: "Claims, evidence spans and alignments for the KG project."
    guarded_by: [INV-016]
  - path: rules/
    disposition: KEEP_NON_PIPELINE
    reason: >
      selection_rules.yaml / substitution_rules.yaml are KG-project rules. A
      Ver3 stage reading them would be importing an outside decision policy.
    guarded_by: [INV-016]
  - path: shapes/
    disposition: KEEP_NON_PIPELINE
    reason: "SHACL shapes for the KG."
  - path: scripts/
    disposition: KEEP_NON_PIPELINE
    reason: "KG build scripts. Not a Ver3 dependency."
  - path: build/, outputs/
    disposition: KEEP_NON_PIPELINE
    reason: "KG extraction artifacts and visualizations."
  - path: tests/ (root)
    disposition: KEEP_NON_PIPELINE
    reason: "Tests for the KG project. Ver3 tests live under ver3/tests."
  - path: vendor/
    disposition: KEEP_NON_PIPELINE
    reason: "Vendored cytoscape for the KG visualization."
  - path: config/config.yaml
    disposition: KEEP_NON_PIPELINE
    reason: "KG project configuration."
  - path: docs/
    disposition: KEEP_NON_PIPELINE
    reason: "KG project documentation."
  - path: "*.pdf (root)"
    disposition: KEEP_NON_PIPELINE
    reason: "Source textbooks for the KG project."

# =====================================================================
# 5. Existing ver3/ work
# =====================================================================
ver3_existing:
  - path: ver3/oracles/
    disposition: EVALUATION_ARTIFACT
    reason: >
      Oracle packs state what must be true and what must remain unresolved. They
      judge a run; they are never an input to one. A stage that reads an Oracle
      is reading its own answer key.
    hard_prohibition: true
    prohibition: "assy_v3 must not import or read ver3/oracles at runtime."
  - path: ver3/oracle_tools/
    disposition: EVALUATION_ARTIFACT
    reason: "Auditing tooling for the Oracle packs."
  - path: ver3/cad_validation/
    disposition: EVALUATION_ARTIFACT
    reason: >
      Positive executable CAD references (EXE-BM001-*, EXE-BM002-01) demonstrate
      that a design satisfying the source is buildable and measurable. They are
      evidence ABOUT the problem, not a production input, and not a target for a
      stage to reproduce. Reproducing one would be R-30/R-31 with new packaging.
    hard_prohibition: true
    prohibition: "assy_v3 must not import or read ver3/cad_validation at runtime."
    retirement_rows: [R-30, R-31]
  - path: ver3/cad_validation/tools/
    disposition: EVALUATION_ARTIFACT
    reason: >
      cadval.py / valcore.py / cadvideo.py are the evaluation CAD toolchain.
      Some of their primitives (exact B-rep measurement, z-buffered review
      rendering) may later be REIMPLEMENTED for production, but the modules
      themselves stay on the evaluation side of the boundary.
  - path: ver3/phase0/
    disposition: EVALUATION_ARTIFACT
    reason: >
      ARCHITECTURE_INVARIANTS.yaml and VER2_RETIREMENT_MATRIX.md are the
      governing contracts for this rebuild. Frozen; changes need a proposal.
    frozen: true

# =====================================================================
# 6. Uncertain dispositions, carried forward from phase0 §8
# =====================================================================
undecided:
  - id: U-01
    concept: MuJoCo as Ver3's kinematic evidence engine
    provisional: "one capability with mandatory fidelity + structural_artifacts"
    blocks: "Stage 08/09 contract"
  - id: U-02
    concept: HostTemplate / named attachment site
    provisional: "REIMPLEMENT as a pure topological anchor with no geometry or parameter bounds"
    blocks: "Stage 05 contract"
  - id: U-03
    concept: UnresolvedLayoutChoice / LayoutConflict
    provisional: "lean subsume into the general UNRESOLVED type"
    resolved_by: >
      DESIGN_STATE_CONTRACT in this task subsumes them: openness is recorded as
      an UnresolvedDecision with alternatives, not as a layout-specific type.
    status: RESOLVED_BY_THIS_TASK
  - id: U-04
    concept: Ver1 carve composition semantics
    provisional: "defer to Stage 05 contract; do not import"
    blocks: "Stage 05 contract"
  - id: U-05
    concept: where mechanism knowledge comes from at all
    provisional: >
      KnowledgeProvider is a boundary, deliberately unimplemented. It must not be
      closed by importing Ver1 cards or the root ontology.
    blocks: "Stage 02 implementation"
    note: >
      LOAD-BEARING. This is exactly where Ver3 could silently become Ver1. This
      task defines the interface and implements no provider, which is the whole
      point of deliverable M.

# =====================================================================
# 7. Audit completeness
# =====================================================================
completeness:
  ver2_python_modules_found: 57
  ver2_python_modules_classified: 57
  repo_root_top_level_dirs_found: 11
  repo_root_top_level_dirs_classified: 11
  ver3_existing_trees_classified: 5
  phase0_rows_covered: "R-01..R-32 (authority: ver3/phase0/VER2_RETIREMENT_MATRIX.md)"
  method: >
    Every .py under ASSY_Ver2.0/assy was enumerated by find and assigned a
    disposition. Directories are classified as units where their contents share
    one disposition. No component was left unclassified, and no component was
    preserved on diff-size grounds.
