# STAGE_RESPONSIBILITY_CONTRACT - what each stage is for, and what it must be given
#
# U-2B (S-2). Source of truth for stage responsibility and the reasoning-premise
# half of Consumer Sufficiency. NO PROMPT TEXT. No benchmark entities.

schema_version: 0.1.0
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml
purpose: 'SOURCE OF TRUTH for stage responsibility, engineering questions, and the

  REASONING-PREMISE half of Consumer Sufficiency (freeze §4 source B).

  Added by U-2B/S-2 as the substrate S-3 will consume.

  '
why_not_a_whitelist: 'A premise class is declared as a SEMANTIC CLASS and must cite the engineering

  question that makes the stage need it. That is what stops S-3''s Consumer

  Sufficiency from becoming another hand-written family list: a class with no

  question behind it is a defect, and a question that plainly depends on

  upstream evidence with no class behind it is also a defect. Both are checked.

  '
not_the_other_half: 'Representational dependencies - what a value needs to MEAN something - are

  declared per field in DESIGN_STATE_CONTRACT.field_semantics. The two sources

  are deliberately separate constructs and neither implies the other. S-3

  unions them; S-2 must not, and does not.

  '
s2_scope_note: 'DECLARATION ONLY. No required-minimum derivation, no view construction, no

  sufficiency assessment and no ConsumerView artifact exists yet - those are

  S-3/U-3. S03_OWNED is untouched.

  '
# ---------------------------------------------------------------- S7-F
# LIFECYCLE. What a responsibility declares is what it needs to answer ONCE; this
# says what happens when the design moves after it has.
#
#   A NAMED PREMISE IS REVISED    the premise graph is walked transitively and
#                                 every dependent, and every dependent of those,
#                                 loses unqualified authority. Nothing is
#                                 recomputed by the state engine: it says what is
#                                 no longer current, and says nothing about what
#                                 the new answer is.
#
#   EVIDENCE APPEARS WHERE THERE  no id could have been named, because the fact
#   WAS NONE                      depended on was an ABSENCE. The deterministic
#                                 responsibilities are asked again through the
#                                 SAME entry points a first run uses, and their
#                                 answers replace what stands only where the two
#                                 differ.
#
# Both mechanisms are outside the responsibility declarations below because
# neither changes what any responsibility may see or decide. A re-evaluation is
# an ordinary invocation of an ordinary consumer view: same premises, same
# populations, same prohibitions. What lifecycle adds is WHEN it happens and what
# becomes of the answer that was there before - never a second opinion about what
# the answer is.
instance_selection_vocabulary:
  purpose: >
    A premise says WHAT kind of information a reasoning step needs (its semantic
    roles). That alone does not say WHICH instances. These terms say where the
    instances are drawn from and how complete the selection must be, so the
    answer is declared next to the engineering question instead of being decided
    by a resolver reading family names.
  why_not_families: >
    No term here names an entity family. A population says where to look; the
    semantic role says what qualifies. Adding a family changes the family's own
    declared roles and nothing else.
  population:
    DESIGN_WIDE: >
      Every STANDING instance carrying a required role, whatever branch it is in
      and whether or not any alternative refers to it. This is the population for
      demands on the design: a requirement no candidate addresses is still a
      requirement, and its absence from an alternative is itself the finding.
    INVOCATION_BRANCH: >
      Instances in scope for the branch this invocation is working on - the
      candidate it was called to embody, or the committed one when no target is
      given. Scope is the existing lineage relation: built on that candidate, or
      material that branch rests on.
    COMMITTED_BRANCH: >
      Instances in scope for the branch named by the standing SelectionDecision.
      When no selection has been recorded there is no such branch, the expected
      population is empty, and that is reported rather than substituted.
    ALL_RETAINED_BRANCHES: >
      Instances in scope for ANY standing candidate - every branch still under
      consideration, plus what they share. Retained means the candidate is
      STANDING; a superseded or invalidated one is not. Comparison across
      alternatives cannot be done from one alternative.
  coverage:
    ALL_APPLICABLE: >
      Every applicable member of the population must be selected. Selecting a
      subset does not satisfy the premise, because a judgement read off part of a
      population is not the judgement the question asked for.
    AT_LEAST_ONE: >
      One applicable member is enough. This is what a representational dependency
      means: a value that points at something needs the something to exist, not
      all of them.
  existence:
    purpose: >
      Coverage says how completely to select from the applicable population. It
      does not say whether that population is allowed to be empty. "Every recorded
      ambiguity" is fully satisfied by a design that recorded none; "the full
      requirement set" is not. Those are different statements and one term cannot
      carry both.
    MAY_BE_EMPTY: >
      An empty applicable population is a valid design state, not a gap. Selecting
      all of nothing satisfies the premise. Used where the frozen meaning is
      "every RECORDED x": the record is complete, and it happens to be empty.
    REQUIRED_NONEMPTY: >
      The reasoning step cannot proceed without at least one applicable instance.
      An empty population is upstream insufficiency and is reported as such,
      before coverage is considered at all.
  applicability:
    ALL_MEMBERS: >
      Every member of the population applies. This is the default and the only
      rule currently declared. It is named rather than implied so that a premise
      which later applies conditionally declares its condition HERE, next to the
      engineering question, instead of anywhere else.
    MATCHES_INVOCATION_ANCHORS: >
      An instance applies when every canonical reference it declares to an
      anchored family holds that invocation's anchor. An instance that declares no
      such reference, or leaves it unset, applies everywhere - it is not scoped to
      one scenario or configuration, so no anchor excludes it. One rule covers
      scenario, configuration, actor and any future anchor, because it compares
      DECLARED RELATIONS against DECLARED ANCHORS and names neither.
    invocation_anchors: >
      An anchor is a canonical entity id together with the family it belongs to:
      what THIS reasoning invocation is about. It guides selection and is not
      itself engineering content - it carries identity, never facts. Anchors are
      validated against standing state, so an anchor that names nothing fails
      rather than silently selecting nothing.
    extension: >
      A new rule is a new named entry resolved at one point in the resolver. It
      must be derivable from canonical structured relations - never from text in
      a field, never from a stage id, never from a model's opinion.

stages:
  s01:
    name: problem interpretation
    responsibility: Convert a request into typed statements of what is required, what is free,
      what is ambiguous, and what lies outside the product.
    engineering_questions:
    - What does the source oblige?
    - What does it leave open?
    - What is genuinely undetermined?
    - Who acts, and what must each actor reach?
    - Where is the system boundary in each scenario?
    required_reasoning_premise_classes: []
    permitted_output_semantics:
    # S-9. `SourceClause` was missing while s01 has authored it since the stage
    # existed, and DESIGN_STATE_CONTRACT names s01 its `owned_by`. The omission
    # was invisible because nothing compared this list against the code - the
    # same gap that let s02 author `Assumption` undeclared. Both are repaired
    # here, and tests/meta/test_output_semantics_drift.py now derives the answer
    # from the source so neither can drift again.
    - SourceClause
    - Requirement
    - Ambiguity
    - Freedom
    - Actor
    - Scenario
    - Assumption
    - DesignConstraint
    # DECLARED AND NOT PRODUCED, legitimately. `UnresolvedDecision` is
    # `universally_ownable`: any stage may discover something is open. A standing
    # permission is not a claim that this stage exercises it, which is why the
    # drift guard admits an unproduced entry only when the matrix makes it
    # universal - and would reject one that named a stage-specific family.
    - UnresolvedDecision
    prohibited_decisions:
    - INVENTING a mechanism, material or dimension the source did not state
    - Resolving an ambiguity silently
    - Sharpening a source qualifier
    carrying_versus_inventing: >
      "Naming any mechanism, material or dimension" read as a blanket ban, which
      would have forbidden s01 to record a user who SAID "all parts must be
      plastic". Two different acts: INVENTING a material the source never stated
      is prohibited and always was; CARRYING one the source states, with its
      provenance, is required - refusing to record it would lose a hard
      requirement the design must satisfy.
      The test is the source, not the vocabulary. s01 may not infer PLASTIC_ONLY
      from a request that never says it, and may not sharpen "should be light"
      into a mass limit.
    no_premises_because: None. s01 is the only stage that may read raw source (INV-002), so it
      has no upstream engineering evidence to require.
  s02:
    name: physical obligation, demand and principle
    responsibility: Establish what must physically be true, what the world does to the product,
      and which principle families could serve.
    engineering_questions:
    - What must hold regardless of mechanism?
    - What physical effects must occur between which roles?
    - What loads act, and where may each be reacted?
    - Which principle families could serve, and which of their claims can this toolchain evidence?
    required_reasoning_premise_classes:
    - class: requirement_set
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a design with no requirement has nothing to be derived from
      what: the FULL requirement set
      justified_by_question: What must hold regardless of mechanism?
      why: An obligation set derived from part of the requirements is unsound; coverage cannot
        be read from a subset.
      requires_semantics:
      - source_requirement
    - class: recorded_ambiguity
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a request that left nothing ambiguous recorded no ambiguity
      what: every recorded ambiguity
      justified_by_question: What must hold regardless of mechanism?
      why: An obligation resting on a silently resolved ambiguity is an unrecorded commitment.
      requires_semantics:
      - open_question
    - class: scenario_boundary
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a load with no declared boundary has nowhere to be reacted
      what: the system boundary declared per scenario
      justified_by_question: What loads act, and where may each be reacted?
      why: A reaction site cannot be typed external without a boundary that says what is outside.
      requires_semantics:
      - scenario_context
    - class: actor_and_reach_intent
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: an effect between roles needs the roles to exist
      what: actors and what they must reach
      justified_by_question: What physical effects must occur between which roles?
      why: An effect between roles needs the roles to exist.
      requires_semantics:
      - actor_role
    permitted_output_semantics:
    - Obligation
    - LoadCase
    - PhysicalEffectObligation
    - ReactionSiteRequirement
    - Candidate
    - AcceptanceContract
    - UnresolvedDecision
    # S-9 / D-2. THE OMISSION THAT BLOCKED REGENERATION.
    #
    # s02 has authored `Assumption` since S-2 - the response envelope carries an
    # `assumptions` collection and `to_operations` emits the CREATE - and the
    # write boundary has always permitted it, because STAGE_OWNERSHIP_MATRIX
    # makes the family `universally_ownable`: "Any stage may need to assume.
    # Every stage must SAY so." This list was the one place that did not say so.
    #
    # The cost was not cosmetic. `derive_source_a` reads this list to decide
    # which families are CO-PRODUCED, and a family absent from it is a family the
    # consumer view has no reason to carry. So s02 was asked to author into a
    # namespace it could not see: s01 commits ASM-0001 and ASM-0002, the schema
    # example shows ASM-0001, and three independent live attempts were rejected
    # with the identical DUPLICATE_ID: ASM-0001.
    #
    # Declaring it is the repair. The family is co-produced now, so occupancy -
    # not semantic content - is what reaches the prompt.
    - Assumption
    prohibited_decisions:
    - Naming a body, joint, interface, count or dimension
    - Selecting a candidate (INV-007)
  s03a:
    name: mechanism topology
    responsibility: State what things exist, what each does, and how they connect - with no magnitude,
      position or axis placement.
    engineering_questions:
    - What bodies and rigid groups exist?
    - What joins what, of what type, leaving which DOF?
    - What configurations exist and what distinguishes them?
    - Which sites must be distinct for a mechanical relationship to exist?
    required_reasoning_premise_classes:
    - class: physical_effect_obligation
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a topology synthesised without knowing what must be transmitted is invented
      what: what must be transmitted, at role level
      justified_by_question: What bodies and rigid groups exist?
      why: A topology synthesised without knowing what must be transmitted is invented rather
        than derived.
      requires_semantics:
      - physical_effect_obligation
    - class: load_case
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: without them no connection is known to carry force
      what: the candidate-independent load cases
      justified_by_question: What joins what, of what type, leaving which DOF?
      why: They determine which connections must carry force.
      requires_semantics:
      - load_case
    - class: candidate_principle
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: this invocation exists to embody a candidate
      what: the candidate's principle assignment and its claim dependencies
      justified_by_question: What bodies and rigid groups exist?
      why: The principle constrains which topologies are even admissible.
      requires_semantics:
      - candidate
    - class: topology_constraining_quantity
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may bound no count, range or travel yet
      what: quantities that bound counts, ranges and travel
      justified_by_question: Which sites must be distinct for a mechanical relationship to exist?
      why: Required distinctness follows from what the mechanism must achieve.
      requires_semantics:
      - quantity_constraint
    permitted_output_semantics:
    - Body
    - RigidGroup
    - Joint
    - Interface
    - Configuration
    - FunctionalRegion
    - UnresolvedDecision
    prohibited_decisions:
    - Any magnitude, position or axis placement
    - Selecting a candidate
  s03b:
    name: interaction and constraint
    responsibility: State what physically transmits each required effect, what constrains what,
      and how load reaches the world.
    engineering_questions:
    - What realizes each required effect?
    - What holds each body where it is put, against what, in which configurations, and how would
      a test defeat it?
    - How does each load reach an external site?
    - In what order does it assemble, and what retains each part?
    required_reasoning_premise_classes:
    - class: topology
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: there is nothing to hold if nothing was built
      what: the full s03a topology
      justified_by_question: What realizes each required effect?
      why: An interaction names the groups it acts between.
      requires_semantics:
      - topology_element
      - topology_relation
    - class: load_case
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a load path needs a load
      what: load cases and their reaction-site requirements
      justified_by_question: How does each load reach an external site?
      why: A path has no terminus without a declared site.
      requires_semantics:
      - load_case
    - class: physical_effect_obligation
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: discharge is checkable only against an obligation
      what: the effects to discharge
      justified_by_question: What realizes each required effect?
      why: Discharge is only checkable against the obligation it discharges.
      requires_semantics:
      - physical_effect_obligation
    - class: retention_obligation
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may record no disturbance to retain against
      what: disturbance and retention obligations
      justified_by_question: What holds each body where it is put, against what, in which configurations,
        and how would a test defeat it?
      why: A constraint with no driver is unmotivated and untestable.
      requires_semantics:
      - physical_obligation
    - class: configuration_basis
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a mechanism is in some configuration
      what: what distinguishes each configuration
      justified_by_question: What holds each body where it is put, against what, in which configurations,
        and how would a test defeat it?
      why: A constraint's configuration set is meaningless without them.
      requires_semantics:
      - configuration_state
    permitted_output_semantics:
    - PhysicalInteraction
    - ConstraintRelation
    # S-5 correction. s03b DERIVES this from the relations it authors, and that
    # is now the only live route into the family - but no responsibility declared
    # it as an output of anything. s03a produced it from two undocumented
    # response keys while its own list omitted it, so the family with two
    # producers was declared to have none, and Source A never derived what a
    # disposition has to be able to name.
    - MobilityExpectation
    - LoadPath
    - AssemblyStep
    - UnresolvedDecision
    prohibited_decisions:
    - Position, dimension or axis placement
    - Selecting a candidate
    - Authoring a DOF disposition directly; it is derived from cited premises
  s04a:
    name: coarse spatial realization and comparability
    responsibility: Give each retained candidate a provisional arrangement sufficient to decide
      fit, reach and assemblability, and to make candidates comparable.
    engineering_questions:
    - Can this candidate fit at all?
    - Can each actor reach what it must?
    - Can it be assembled?
    - On what geometric ground would it be eliminated?
    required_reasoning_premise_classes:
    - class: topology_and_interaction
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: extents attach to bodies and their connections
      what: the full topology and its interactions
      justified_by_question: Can this candidate fit at all?
      why: Extents attach to bodies and their connections.
      requires_semantics:
      - topology_element
      - topology_relation
      - physical_interaction
    - class: extent_bounding_quantity
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: its own why says a scale-dependent judgement without the scale
          is not a judgement, so the judgement cannot be made from an empty set
      what: quantities bounding extent, travel and clearance
      justified_by_question: Can this candidate fit at all?
      why: A scale-dependent judgement without the scale is not a judgement.
      requires_semantics:
      - quantity_constraint
    - class: reach_requirement
      instance_selection:
        by_role:
        - role: actor_role
          population: DESIGN_WIDE
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a mechanism with no actor has no reach to evaluate
          why: an actor is a demand on the design, not a product of any alternative
        - role: functional_region
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: reach with no declared target is vacuous, not missing
          why: a region is authored by s03a while embodying one candidate
      what: actors and their reach targets
      justified_by_question: Can each actor reach what it must?
      why: Reach cannot be evaluated without a target.
      requires_semantics:
      - actor_role
      - functional_region
    - class: region_and_envelope_constraint
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may declare no region or allowance
      what: declared regions and envelope constraints
      justified_by_question: Can this candidate fit at all?
      why: Fit is relative to a declared allowance.
      requires_semantics:
      - functional_region
      - spatial_commitment
    - class: assembly_order_constraint
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: assemblability is an ordering property and needs an order
      what: assembly order and access constraints
      justified_by_question: Can it be assembled?
      why: Assemblability is an ordering property, not only a geometric one.
      requires_semantics:
      - assembly_order
    permitted_output_semantics:
    - Envelope
    - FunctionalRegion.volume
    - AssemblyStep.insertion_direction
    - ReachResult
    - EliminationRecord
    - ReferenceScale
    prohibited_decisions:
    - Selecting a candidate
    - Any authoritative dimension
  feasibility:
    name: mechanical feasibility
    # S-7 / U-8. SPLIT OUT OF `gate`, which asked two questions and answered them
    # in one act: whether a candidate could work, and which candidate was wanted.
    # A preference could therefore reach a feasibility judgement, and nothing in
    # that shape could say that a four-bar which works is not less feasible than
    # a hinge which works. This half asks only the first question.
    responsibility: State whether one candidate is mechanically eligible for selection on the
      engineering evidence established so far.
    engineering_questions:
    - Does the established evidence contain anything that stops this candidate working?
    - Which mechanical domains has the design actually established for it, and which has it not?
    - Is each hard design requirement satisfied, violated, or not yet evaluable for it?
    required_reasoning_premise_classes:
    - class: candidate_engineering_evidence
      # S7-B FINAL CORRECTION. ONE EXISTENCE RULE FOR SEVEN ROLES, and for three
      # of them it said the wrong thing - the same defect `realized_motion` had.
      # An absence this responsibility exists to REPORT was being turned into a
      # refusal to look: a candidate that routes no load has LOAD_PATH_MISSING to
      # answer for, and REQUIRED_NONEMPTY made its whole view
      # UPSTREAM_INSUFFICIENCY, so nine domains went unanswered to hide one
      # finding. Same for an effect discharged by nothing, and for a mechanism
      # that blocks nothing - which is an ordinary mechanism.
      #
      # The four that stay REQUIRED_NONEMPTY are the ones whose absence means
      # there is no candidate to judge rather than a candidate with a gap.
      instance_selection:
        by_role:
        - role: topology_element
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: a mechanism with no bodies is not a mechanism
          why: s03a authors them while embodying one candidate
        - role: topology_relation
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: bodies with nothing between them are not an arrangement
          why: s03a authors them while embodying one candidate
        - role: mobility_disposition
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: the DOF grid is derived for every candidate, so its
            absence is a producer failure rather than a design fact
          why: s03b derives it from this candidate's own topology
        - role: spatial_commitment
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: a feasibility statement about an arrangement that does
            not exist is not a statement
          why: s04 authors the arrangement of one candidate
        - role: physical_interaction
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a candidate that discharges no effect has
            EFFECT_NOT_DISCHARGED to answer for, and that is a finding this
            responsibility makes rather than a reason it cannot be made
          why: s03b authors them while embodying one candidate
        - role: constraint_relation
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a mechanism that blocks nothing is an ordinary
            mechanism, not an unready context
          why: s03b authors them while embodying one candidate
        - role: load_route
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a candidate that routes no load has LOAD_PATH_MISSING
            to answer for; demanding a route before the question may be asked
            hides exactly the answer
          why: a route belongs to the branch whose interfaces carry it
      what: this candidate's physical, mobility, topological and spatial evidence,
        and how each load is routed through it
      justified_by_question: Does the established evidence contain anything that stops this candidate
        working?
      why: >
        Feasibility is read off what was established, never generated here.

        S7-B ADDED topology_element, topology_relation AND load_route, for the
        same reason `realized_motion` was added: the declared domains could not
        be decided from the declared inputs. Whether connected bodies actually
        touch is asked of the joint graph and the CONTACT interfaces, and
        Source A reached neither - an interface arrived only when an assembly
        step happened to activate it, so a body pair the topology connects could
        go unchecked while the view looked complete. A load route is
        candidate-specific in a way its load case is not: two candidates carry
        the same load through different interfaces, so the route belongs to the
        branch and the demand does not.
      requires_semantics:
      - physical_interaction
      - constraint_relation
      - mobility_disposition
      - spatial_commitment
      - topology_element
      - topology_relation
      - load_route
    - class: realized_motion
      # S7-B. ONE EXISTENCE RULE FOR FOUR ROLES SAID THE WRONG THING ABOUT TWO OF
      # THEM. "A mechanism with no realized motion has no motion to judge" is the
      # reason a motion domain reports NOT_APPLICABLE - and it was written as
      # REQUIRED_NONEMPTY, which says the opposite: a static candidate became an
      # UNREADY CONTEXT and got no assessment at all. Having nothing to judge is
      # an answer; being unable to judge is not, and one field cannot carry both.
      #
      # The split is by role because the roles differ in kind. A configuration
      # that no state realizes is missing evidence. A path that does not exist,
      # and an occupancy for a motion nobody declared, are absences the design
      # meant.
      instance_selection:
        by_role:
        - role: realized_configuration
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: a configuration no state realizes is a question this
            responsibility cannot answer, not one it need not ask
          why: s04b authors the coordinates while embodying one candidate
        - role: motion_path
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a mechanism that is required to hold still declares no
            path, and that is an answer rather than a gap
          why: a transition belongs to the candidate whose coordinates it moves
        - role: motion_occupancy
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: no motion, no volume swept; demanding one would demand a
            computation of nothing
          why: an occupancy is computed from one candidate's arrangement
        - role: kinematic_axis
          population: INVOCATION_BRANCH
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: a mechanism is its bodies and the joints between them; with
            no joint there is no mechanism to judge
          why: joints are authored by s03a while embodying one candidate
      what: the coordinates that realize each configuration, the paths between them,
        and the occupancy each moving group sweeps
      justified_by_question: Does the established evidence contain anything that stops this candidate
        working?
      why: >
        Four of the declared feasibility domains - required configurations, motion
        and transitions, gross interference, spatial realization - are decided on
        exactly these facts. Declaring a domain whose evidence the view cannot
        contain is a contract that cannot be satisfied, which is what this class
        was added to fix.
      requires_semantics:
      - realized_configuration
      - motion_path
      - motion_occupancy
      - kinematic_axis
    - class: candidate_local_geometric_finding
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a candidate may have no reach result and no elimination finding
      what: the reach results and elimination findings s04 computed for this candidate
      justified_by_question: Does the established evidence contain anything that stops this candidate
        working?
      why: >
        A local geometric finding is INPUT to eligibility and not a verdict on it.
        s04 reports what it computed; this responsibility decides what that means
        for whether the candidate may be chosen from.
      requires_semantics:
      - reach_evidence
      - elimination_evidence
      - assembly_order
    - class: declared_physical_demand
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may demand no physical effect and state no load
      what: the effects the product must produce, the loads the world applies, the
        sites where a reaction must ultimately be available, and the actors that
        must reach into it
      justified_by_question: Does the established evidence contain anything that stops this candidate
        working?
      why: >
        TWO OF THE NINE DOMAINS ARE ABOUT DEMANDS, NOT ABOUT MECHANISMS. Physical
        realization asks whether every required effect is discharged by an
        interaction, and load reaction closure asks whether every load reaches the
        site its own load case names - and neither can be asked of the mechanism
        alone. Source A reached a PhysicalEffectObligation only through the
        interaction that discharges it, so exactly the undischarged obligations -
        the ones the domain exists to find - were the ones the view could not
        contain, and the domain would have reported PASS by seeing nothing.

        DESIGN_WIDE because a demand is candidate-independent: the world applies
        the same load to every alternative, and a candidate that does not carry
        it has a finding rather than an exemption. Its absence from a branch is
        what makes the branch answerable, not what makes the question skippable.

        THE S7-B CORRECTION ADDED actor_role for the same reason, one domain
        later. `Actor.must_reach` is where a reach requirement comes from, and
        the class did not carry it - so an actor arrived only when some
        candidate happened to declare a region that referenced it, and a
        candidate that ignored the actor entirely presented a view with no
        reach demand in it. Applicability was being read off the answer.
      requires_semantics:
      - physical_effect_obligation
      - load_case
      - reaction_site
      - actor_role
    - class: hard_design_constraint
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may state no hard requirement beyond its source requirements
      what: the hard requirements the design must satisfy
      justified_by_question: Is each hard design requirement satisfied, violated, or not yet evaluable
        for it?
      why: A requirement is a demand on the design and applies to every alternative, so it is
        DESIGN_WIDE - its absence from one candidate is the finding, not the reason to skip it.
      requires_semantics:
      - design_constraint
    permitted_output_semantics:
    - FeasibilityDomainAssessment
    - MechanicalFeasibilityAssessment
    - HardRequirementCompliance
    - UnresolvedDecision
    conditional_outputs:
      HardRequirementCompliance:
        produced_per: DesignConstraint
        why: >
          ONE PER HARD REQUIREMENT. A design that states none produces none, and
          that is a complete answer rather than a gap. Source A derives what an
          OUTPUT needs in order to mean something, and correctly says a
          compliance record needs a constraint to be about - but it then made
          that referent REQUIRED_NONEMPTY for the stage's readiness, so the
          feasibility view was UPSTREAM_INSUFFICIENCY on every design without a
          profile. An output that need not be produced was blocking the stage
          that need not produce it. Declaring the condition makes the referent
          MAY_BE_EMPTY for readiness and changes nothing about the record: a
          compliance record still cannot exist without its constraint, and the
          write boundary still says so.
    prohibited_decisions:
    - Comparing candidates, or reading another candidate's evidence at all
    - Preferring a simpler mechanism; complexity is not infeasibility
    - Receiving or consulting any selection preference
    - Authoring a SelectionDecision
    - Letting a model declare a mechanism feasible
    - Turning missing evidence into feasibility
    prohibited_inputs:
    - Any selection preference or SelectionProfile
    input_isolation_rule: >
      PREFERENCE BLINDNESS IS AN INPUT-BOUNDARY PROPERTY, not a prompt
      instruction. Nothing here declares `selection_preference`, so the consumer
      view cannot contain one; a SelectionProfile appearing in this
      responsibility's view is a contract failure and is tested as one. A stage
      told to ignore a preference has already seen it.
  selection:
    name: candidate selection
    # The other half of `gate`. It runs on ELIGIBLE candidates only, and it is
    # the first responsibility in the whole pipeline permitted to know what the
    # user prefers.
    responsibility: Choose among the mechanically eligible candidates under the user's stated
      preferences, with a human deciding.
    engineering_questions:
    - Which candidates are eligible, and on what established evidence?
    - How do they compare on metrics the design can actually compute?
    - What does the user prefer, and does one candidate dominate under it?
    - What decision-critical concern do the metrics and the preferences not represent?
    required_reasoning_premise_classes:
    - class: eligibility_evidence
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a choice among nothing established is not a choice
      what: every retained candidate's feasibility and hard-requirement results
      justified_by_question: Which candidates are eligible, and on what established evidence?
      why: Eligibility is the population this responsibility may act on, and it is decided elsewhere.
      requires_semantics:
      - eligibility_evidence
    - class: candidate_spatial_evidence
      # S7-C. ONE EXISTENCE RULE FOR THREE ROLES, and for two of them it said the
      # wrong thing - the fourth time this shape has appeared in S-7. A design
      # with no actor produces no ReachResult and a candidate nobody eliminated
      # produces no EliminationRecord; demanding either made the selection view
      # UPSTREAM_INSUFFICIENCY on an ordinary design, so the comparison could not
      # be asked at all. Neither is read by any metric. The arrangement is
      # different: with no spatial commitment anywhere there is no design to
      # compare.
      instance_selection:
        by_role:
        - role: spatial_commitment
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: a comparison of alternatives none of which has been given
            an arrangement is not a comparison
          why: s04 authors the arrangement of each candidate
        - role: reach_evidence
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a design whose actors reach for nothing produces no reach
            result, and that is an answer rather than a gap
          why: s04a records it while embodying one candidate
        - role: elimination_evidence
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a candidate nobody eliminated has no elimination record
          why: s04a records it while embodying one candidate
      what: every retained candidate's spatial evidence
      justified_by_question: How do they compare on metrics the design can actually compute?
      why: A metric with no state behind it is not a metric, and the comparison must say so.
      requires_semantics:
      - spatial_commitment
      - reach_evidence
      - elimination_evidence
    - class: candidate_topology_evidence
      # S7-C. WHAT THE COUNTING METRICS ARE COUNTS OF. `rigid_body_count` and
      # `joint_count` are counts of canonical entities, so the entities have to be
      # in the view - and they are asked for by the ENGINEERING role they carry,
      # not by a family list written for this consumer's convenience.
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a candidate with no bodies and no relations is not an alternative
      what: every retained candidate's bodies and the relations between them
      justified_by_question: How do they compare on metrics the design can actually compute?
      why: A count with nothing to count is not a measurement, and a count taken over
        entities the consumer cannot see would be a number with no provenance.
      requires_semantics:
      - topology_element
      - topology_relation
    - class: hard_design_constraint
      # S7-C. THE FULL DESIGN-WIDE SET, not the subset some compliance record
      # happens to reference. A blocking constraint with NO HardRequirementCompliance
      # for a mechanically feasible candidate is precisely what makes that
      # candidate's eligibility unestablished - and reaching constraints only
      # through the compliance records that cite them would make exactly that case
      # invisible: the missing record would hide the requirement it is missing for.
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may state no hard requirement, and none is not a gap
      what: every hard requirement the design states, and whether each blocks a choice
      justified_by_question: Which candidates are eligible, and on what established evidence?
      why: Eligibility is feasibility AND every blocking requirement satisfied, so the set
        of blocking requirements is half the question. DESIGN_WIDE because a requirement
        applies to every alternative; its absence from one candidate's evidence is the
        finding, not an exemption.
      requires_semantics:
      - design_constraint
    - class: selection_preference
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: choosing without knowing what is wanted is picking
      what: the user's ranked selection preferences, as a versioned profile
      justified_by_question: What does the user prefer, and does one candidate dominate under it?
      why: This is the ONLY responsibility that may see one, and the first point at which the
        question "which working design do we want" can be asked at all.
      requires_semantics:
      - selection_preference
    - class: unresolved_blocking_scope
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: nothing unresolved is the desired state, not a gap
      what: all unresolved items and what each blocks
      justified_by_question: Which candidates are eligible, and on what established evidence?
      why: Blocking is defined by what the decision requires.
      requires_semantics:
      - open_item
    permitted_output_semantics:
    - SelectionProfile
    - CandidateComparison
    - SelectionAdvisory
    - SelectionConcern
    - HumanDecisionInput
    - SelectionDecision
    - UnresolvedDecision
    prohibited_decisions:
    - Breaking a tie silently
    - Authoring the verdict on its own preconditions
    - Acting on a candidate that is not eligible, whatever it scores
    - Letting a model or a screen author the decision
    - Committing against premises the human was not shown
  selection_advisory:
    # S7-D. A SECOND CONSUMER PASS OF ONE OWNER, exactly as s03a/s03b and
    # s04a/s04b are - `authority_stage` says so, and everything it writes is
    # written as `selection`. It is a separate PASS because the deterministic
    # comparison is its INPUT: making CandidateComparison a required premise of
    # the `selection` view would have demanded the entity before the pass that
    # creates it could run.
    name: selection engineering review
    authority_stage: selection
    responsibility: Say what engineering trade-off or decision-critical concern the
      deterministic comparison and the explicit preferences do not represent.
    engineering_questions:
    - What does the deterministic comparison not represent about these candidates?
    - Which concern would a reviewer raise that no registered metric can express?
    - Under what change of priority would the comparison's answer flip?
    required_reasoning_premise_classes:
    - class: deterministic_comparison
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a review of a comparison that does not exist is not a review;
          with none the provider is not called at all
      what: the current deterministic comparison of the eligible candidates
      justified_by_question: What does the deterministic comparison not represent about
        these candidates?
      why: The reviewer's whole question is what this does NOT say, so it must see
        exactly what it does say - and the population it may speak about is this
        record's, never one of its own choosing.
      requires_semantics:
      - selection_evidence
    - class: selection_preference
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a reviewer who does not know what was wanted cannot say what
          the comparison under it failed to represent
      what: the exact versioned profile the comparison was made under
      justified_by_question: Under what change of priority would the comparison's answer
        flip?
      why: Sensitivity to a preference change is a statement about a specific profile.
        Without the profile a reviewer would be inventing the preference it reasons
        about, which is the one thing an advisory may never do.
      requires_semantics:
      - selection_preference
    - class: eligibility_evidence
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a review of an unestablished population is a review of nothing
      what: why each retained candidate is or is not eligible
      justified_by_question: What does the deterministic comparison not represent about
        these candidates?
      why: The reviewer may not change eligibility and must understand it - a concern
        about a candidate already excluded is noise, and a recommendation of one is
        malformed.
      requires_semantics:
      - eligibility_evidence
    - class: reviewable_engineering_evidence
      # BY ROLE, because the absences are legitimate. A static mechanism has no
      # transition, a design with no actor has no reach result, a candidate with
      # no load case has no route - and S-7 has already made the mistake of
      # demanding each of those and rendering the whole view unready for a
      # question it could have answered.
      instance_selection:
        by_role:
        - role: topology_element
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: a candidate with no bodies is not an alternative to review
          why: s03a authors them while embodying one candidate
        - role: topology_relation
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: bodies with nothing between them are not an arrangement
          why: s03a authors them while embodying one candidate
        - role: spatial_commitment
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: a reviewer comparing arrangements needs the arrangements
          why: s04 authors the arrangement of each candidate
        - role: mobility_disposition
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: REQUIRED_NONEMPTY
          existence_why: the DOF grid is derived for every candidate, so its absence
            is a producer failure rather than a design fact
          why: s03b derives it from each candidate's own topology
        - role: motion_path
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a mechanism required to hold still declares no path
          why: a transition belongs to the candidate whose coordinates it moves
        - role: motion_occupancy
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: no motion, no volume swept
          why: an occupancy is computed from one candidate's arrangement
        - role: physical_interaction
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a candidate that discharges no effect has a finding, not a
            reason the review cannot happen
          why: s03b authors them while embodying one candidate
        - role: load_route
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a design with no load case routes nothing
          why: a route belongs to the branch whose interfaces carry it
        - role: assembly_order
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a candidate whose assembly is not yet ordered has no step
          why: s03b authors the order while embodying one candidate
        - role: reach_evidence
          population: ALL_RETAINED_BRANCHES
          coverage: ALL_APPLICABLE
          existence: MAY_BE_EMPTY
          existence_why: a design whose actors reach for nothing produces no result
          why: s04a records it while embodying one candidate
      what: the current engineering evidence for every reviewable candidate
      justified_by_question: Which concern would a reviewer raise that no registered
        metric can express?
      why: A concern the metric registry cannot express has to come from somewhere,
        and the only honest somewhere is the engineering state itself. A reviewer shown
        only the metrics could only restate them.
      requires_semantics:
      - topology_element
      - topology_relation
      - spatial_commitment
      - mobility_disposition
      - motion_path
      - motion_occupancy
      - physical_interaction
      - load_route
      - assembly_order
      - reach_evidence
    - class: hard_design_constraint
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may state no hard requirement, and none is not a gap
      what: every hard requirement the design states
      justified_by_question: Which concern would a reviewer raise that no registered
        metric can express?
      why: A requirement the design must satisfy is context for a concern about whether
        it comfortably does. The reviewer may not decide compliance - that is decided
        upstream - and may say a candidate looks close to a limit.
      requires_semantics:
      - design_constraint
    - class: unresolved_blocking_scope
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: nothing unresolved is the desired state, not a gap
      what: all unresolved items and what each blocks
      justified_by_question: Which concern would a reviewer raise that no registered
        metric can express?
      why: What the design has already recorded as open is exactly what a reviewer
        should not raise again as if it were new.
      requires_semantics:
      - open_item
    permitted_output_semantics:
    - SelectionAdvisory
    - SelectionConcern
    prohibited_decisions:
    - Deciding feasibility, compliance or eligibility
    - Changing the population it was given
    - Recomputing or overwriting the deterministic comparison
    - Inventing a metric value, a measurement or a user preference
    - Authoring a decision, or a human's input to one
    - Resolving a deterministic tie
    authority_rule: >
      A REVIEWER, NOT AN AUTHORITY. Everything this pass writes is ASSURANCE: it is
      CONSIDERED by a later decision and is never a premise of one. A deterministic
      function writing `evidence_status: SUPPORTED_BY_STATE` does not make the
      sentence beside it engineering truth - the status describes how well the
      concern is supported, and nothing more. No stage after this one may treat an
      advisory's reasoning or a concern's issue as an engineering premise merely
      because the record exists.

  selection_human_review:
    # S7-E. THE THIRD CONSUMER PASS OF ONE OWNER. It calls no provider and it
    # writes nothing by itself: what it produces is the EXACT material a human is
    # shown, and the only thing that may be written afterwards is what that human
    # submitted. Declared as a pass rather than folded into `selection` for the
    # same reason `selection_advisory` is: the deterministic comparison is its
    # INPUT, and requiring CandidateComparison inside the `selection` view would
    # demand the entity before the pass that creates it could run.
    name: human selection review
    authority_stage: selection
    responsibility: Assemble exactly what a human may review before committing to one
      candidate, and record what they submitted after seeing it.
    engineering_questions:
    - What is the human being asked to choose between, and on what established evidence?
    - What did the deterministic comparison and the stated preferences actually say?
    - What did a reviewer draw attention to, if anything?
    - What exactly was on the screen when the person submitted?
    required_reasoning_premise_classes:
    - class: deterministic_comparison
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a decision screen with no comparison behind it is asking a
          person to choose from nothing established
      what: the current deterministic comparison of the eligible candidates
      justified_by_question: What did the deterministic comparison and the stated
        preferences actually say?
      why: The comparison is the population the human may choose from and the evidence
        they are choosing on. Exactly one must be current; two is a question about
        which review is in force, and answering it here would be this code deciding it.
      requires_semantics:
      - selection_evidence
    - class: selection_preference
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a person cannot see what the comparison was made under if the
          profile it names is not there
      what: the exact versioned profile the comparison was made under
      justified_by_question: What did the deterministic comparison and the stated
        preferences actually say?
      why: A screen that showed a comparison without the preferences it was computed
        under would let a reader assume a default nobody stated. An explicitly empty
        profile is a real answer and is shown as one.
      requires_semantics:
      - selection_preference
    - class: eligibility_evidence
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a choice among candidates whose eligibility is not established
          is not a choice
      what: every retained candidate's feasibility and hard-requirement results
      justified_by_question: What is the human being asked to choose between, and on
        what established evidence?
      why: The screen must be able to say WHY the population it offers is the eligible
        one, and the writer must be able to establish that again at submit time from
        the same canonical semantics rather than from the comparison's own list.
      requires_semantics:
      - eligibility_evidence
    - class: reviewable_candidate_population
      # THE FULL RETAINED SET, not the comparison's list. A candidate with no
      # feasibility assessment is exactly what makes the population unestablished,
      # and reaching candidates only through the assessments that mention them
      # would hide the one case that matters: the missing record would hide the
      # candidate it is missing for.
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a decision among no alternatives is not a decision
      what: every alternative the design still holds
      justified_by_question: What is the human being asked to choose between, and on
        what established evidence?
      why: Eligibility is computed over the retained population, so the population is
        half the question. Deriving it from the comparison would make the comparison
        the authority on its own correctness.
      requires_semantics:
      - candidate
    - class: hard_design_constraint
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may state no hard requirement, and none is not a gap
      what: every hard requirement the design states, and whether each blocks a choice
      justified_by_question: What is the human being asked to choose between, and on
        what established evidence?
      why: Which requirements block a selection is half of what makes a candidate
        eligible, so the same design-wide set the eligibility semantics read must be
        visible to the screen that claims the population is eligible.
      requires_semantics:
      - design_constraint
    - class: advisory_material
      # MAY_BE_EMPTY, AND THAT IS THE POINT. A provider failure must not acquire
      # veto authority over a human decision: the advisory is ASSURANCE, and a
      # screen that refused to appear without one would make an LLM outage the
      # reason a person could not choose.
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: no reviewer was asked, or the reviewer was asked and failed,
          and neither is a reason a human may not decide
      what: the current review of these candidates and the concerns it raised
      justified_by_question: What did a reviewer draw attention to, if anything?
      why: A human deciding against a reviewer's opinion is the reason a human is in
        the loop, and they can only do that if they are shown it. Its absence is
        represented as absence rather than filled in.
      requires_semantics:
      - advisory
    permitted_output_semantics:
    - HumanDecisionInput
    prohibited_decisions:
    - Authoring a commitment, or any operation on SelectionDecision
    - Choosing a candidate on the human's behalf, from the frontier or from anywhere
    - Deciding eligibility, feasibility, compliance or the comparison
    - Presenting material the submission was not made against
    - Refusing a human decision because no advisory exists
    authority_rule: >
      ONE SNAPSHOT, ONE SUBMISSION. What the human is shown is assembled once, and
      the submission carries the digest of exactly that material. A screen that
      re-read state between rendering and submitting could commit against premises
      nobody saw, which is the difference between an approval and a signature on a
      blank page.

  selection_decision:
    # S7-E. THE DETERMINISTIC COMMITMENT WRITER. No provider, no prompt, no screen
    # logic: it resolves a submitted HumanDecisionInput, rebuilds the review from
    # CURRENT state, and refuses to write anything if the person was looking at
    # something else. It is the only producer of SelectionDecision.
    name: selection commitment
    authority_stage: selection
    responsibility: Commit the candidate a human selected, if and only if what they were
      shown is still what the design currently says.
    engineering_questions:
    - What did the human submit, and against which review?
    - Is that review still the current one?
    - Is the selected candidate still in the currently eligible population?
    required_reasoning_premise_classes:
    - class: human_decision
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: there is nothing to commit until a human has submitted something
      what: the submitted human decisions
      justified_by_question: What did the human submit, and against which review?
      why: A commitment exists only because a person asked for one. This is the whole
        of the writer's authority to act, and it is read rather than inferred - no
        frontier, no recommendation and no sole eligible candidate substitutes for it.
      requires_semantics:
      - human_decision
    - class: deterministic_comparison
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a commitment against a comparison that is no longer current is
          a commitment against premises nobody saw
      what: the current deterministic comparison of the eligible candidates
      justified_by_question: Is that review still the current one?
      why: The submission names the comparison it was made against, and the writer
        compares that to what is current now rather than trusting the submission.
      requires_semantics:
      - selection_evidence
    - class: selection_preference
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: the profile the decision is recorded under has to exist for the
          record to mean anything
      what: the exact versioned profile the comparison was made under
      justified_by_question: Is that review still the current one?
      why: Changing what you want reopens the choice. A decision naming a superseded
        profile would claim a person judged under preferences that are no longer the
        design's.
      requires_semantics:
      - selection_preference
    - class: eligibility_evidence
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: nothing may be committed on an unestablished population
      what: every retained candidate's feasibility and hard-requirement results
      justified_by_question: Is the selected candidate still in the currently eligible
        population?
      why: Eligibility is re-established at submit time from the same canonical
        semantics the comparison used. The comparison's own candidate list is evidence
        to cross-check and never a substitute for the check.
      requires_semantics:
      - eligibility_evidence
    - class: reviewable_candidate_population
      instance_selection:
        population: ALL_RETAINED_BRANCHES
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a commitment among no alternatives is not a commitment
      what: every alternative the design still holds
      justified_by_question: Is the selected candidate still in the currently eligible
        population?
      why: The population eligibility is computed over, so that a candidate which has
        appeared or been retired since the screen was rendered changes the answer
        rather than being invisible to it.
      requires_semantics:
      - candidate
    - class: hard_design_constraint
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may state no hard requirement, and none is not a gap
      what: every hard requirement the design states, and whether each blocks a choice
      justified_by_question: Is the selected candidate still in the currently eligible
        population?
      why: A requirement that became blocking, or a compliance record that became
        VIOLATED, is exactly the change that must stop a commitment the human asked
        for before it happened.
      requires_semantics:
      - design_constraint
    permitted_output_semantics:
    - SelectionDecision
    prohibited_decisions:
    - Selecting a candidate the human did not name
    - Committing on a digest the writer did not recompute from current state
    - Trusting the comparison's candidate list in place of re-establishing eligibility
    - Treating advisory material as a premise of the commitment
    - Replacing, superseding or withdrawing a standing commitment
    - Creating a commitment from a non-select action
    authority_rule: >
      THE HUMAN IS THE ONLY CHOOSER AND THE PREMISES ARE RE-READ. Everything this
      pass writes rests on two independent facts: a person submitted a SELECT, and
      the material they saw is still current. Neither implies the other, and
      neither is taken on trust from the client that submitted it. Advisory
      material the human considered is RECORDED and is never a premise, so
      rewording a review after the fact cannot disturb a commitment the wording
      was never the ground of.

  s04b:
    name: spatial and kinematic realization
    # S-6 / U-7 SEQUENCING CORRECTION. This responsibility encoded the runtime
    # state that will exist AFTER the selection gate: every branch-scoped premise
    # resolved against COMMITTED_BRANCH and a SelectionDecision was REQUIRED.
    # The gate is U-8 and the plan places it at S-7, AFTER S-6 - "does
    # selection/gating wait for the semantics it evaluates? Yes" - so s04b could
    # not be invoked at all: committed_branch() returns None before a selection
    # stands, COMMITTED_BRANCH therefore selects nothing, and the ConsumerView
    # was UPSTREAM_INSUFFICIENCY on every call. The stage the step exists to
    # migrate was unreachable.
    #
    # The premises resolve against the branch THIS INVOCATION names. Nothing is
    # fabricated: no SelectionDecision is invented and no declaration order
    # decides anything.
    #
    # S7-A CORRECTION: S-6 expected S-7 to restore COMMITTED_BRANCH and move the
    # pending class back. It does not, and cannot - see `retired_premise_classes`
    # below. s04b stays candidate-local.
    responsibility: Place the mechanism of ONE candidate and describe its motion so that clearance,
      incidence and distinctness can be computed.
    engineering_questions:
    - Where is each joint, in which frame, and on which axis?
    - What coordinate values realize each configuration?
    - Which coordinates change in each transition, and along what path?
    retired_premise_classes:
    - class: selection_decision
      retired_by: "S7-A"
      was:
        population: COMMITTED_BRANCH
        existence: REQUIRED_NONEMPTY
        activated_by: "S-7 / U-8"
        what: the selection decision
      why_retired: >
        IT IS CIRCULAR UNDER THE SPLIT, and S7-A is the step that would have
        activated it. Requiring a SelectionDecision before s04b means
        SelectionDecision -> s04b. But `selection` authors that decision from
        eligibility, `feasibility` establishes eligibility from the engineering
        evidence, and s04b is where the motion evidence comes from - so the real
        order is s04b -> feasibility -> selection -> SelectionDecision. Restoring
        the premise would close the loop.
        It is retired rather than deferred: nothing later reactivates it. s04b
        runs CANDIDATE-LOCALLY, on the branch its invocation names, before any
        choice exists. No provisional decision is invented and no candidate is
        selected in order to run it.
    required_reasoning_premise_classes:
    - class: prior_spatial_commitment
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: placement must extend the arrangement it was told to work in
      what: the selected candidate's s04a arrangement and its commitment classes
      justified_by_question: Where is each joint, in which frame, and on which axis?
      why: A placement that does not extend the arrangement it was told to work in is a fresh
        guess. This is the premise the audited pipeline omitted in every case.
      requires_semantics:
      - spatial_commitment
    - class: topology_with_axes
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: an origin without an axis supports no incidence claim
      what: the full topology including axes and link relationships
      justified_by_question: Where is each joint, in which frame, and on which axis?
      why: An origin without an axis supports no incidence claim.
      requires_semantics:
      - topology_element
      - topology_relation
      - kinematic_axis
    - class: required_distinctness
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a mechanism may declare no required distinctness
      what: declared required-distinctness
      justified_by_question: Where is each joint, in which frame, and on which axis?
      why: Realization must be checkable against the premise that two sites must differ.
      requires_semantics:
      - topology_relation
    - class: configuration_basis
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: coordinates realize a configuration, so one must exist
      what: each configuration's distinguishing basis
      justified_by_question: What coordinate values realize each configuration?
      why: Otherwise a name is the only thing distinguishing two states.
      requires_semantics:
      - configuration_state
    - class: constraint_relation
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may record no constraint relation to release
      what: constraint relations and the interactions maintaining them
      justified_by_question: Which coordinates change in each transition, and along what path?
      why: A release must alter what maintains it.
      requires_semantics:
      - constraint_relation
      - physical_interaction
    - class: travel_bounding_quantity
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a design may bound no travel yet
      what: quantities bounding travel and clearance
      justified_by_question: Which coordinates change in each transition, and along what path?
      why: Motion extent is a quantity.
      requires_semantics:
      - quantity_constraint
    permitted_output_semantics:
    - Joint.frame_origin
    - State
    - Transition
    - SweptVolume
    prohibited_decisions:
    - Contradicting an s04a commitment without an explicit supersession
  s05:
    name: physical embodiment
    # THE CANONICAL DECLARATION, added because the runtime needs one.
    #
    # ver3/contracts/stages/S05_CONTRACT.yaml has described this stage in detail
    # for a long time and classifies itself OPERATIONAL - it explains, it does not
    # define canonical semantics. Nothing here contradicts it; this is the entry
    # `consumer_view_for`, `derive_source_a` and the write boundary actually read,
    # and without it s05 could not be given a view at all: an undeclared
    # responsibility fails closed, which is correct and is why it had to be
    # declared rather than special-cased.
    responsibility: Realize every declared relation as named geometry, and surface the constraints
      that geometry imposes back onto the layout.
    engineering_questions:
    - What actual geometry on which body makes each declared relation real?
    - Which feature realizes each side of each interaction?
    - What does that geometry demand of the layout, as a constraint?
    - In what order is each body constructed, in its own frame?
    required_reasoning_premise_classes:
    - class: interaction_to_realize
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a stage that realizes interactions as geometry has nothing to realize
          without them
      what: the physical interactions this branch declared
      justified_by_question: Which feature realizes each side of each interaction?
      why: A feature pair exists because an interaction demanded it; without the interaction
        the geometry is invented.
      requires_semantics:
      - physical_interaction
    - class: topology_with_axes
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: a feature is geometry ON a body, and it needs the body to be on
      what: the bodies, groups and joints this branch committed
      justified_by_question: What actual geometry on which body makes each declared relation
        real?
      why: s05 may not create a Body, RigidGroup or Joint (INV-001); it extends s03's by
        id, so it must be able to see them.
      requires_semantics:
      - topology_element
      - topology_relation
      - kinematic_axis
    - class: spatial_commitment
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: an envelope constraint binds a layout parameter, and there is no
          layout to bind without the spatial commitments
      what: the located arrangement this branch committed
      justified_by_question: What does that geometry demand of the layout, as a constraint?
      why: The envelope constraint rule is a statement about layout; a feature that implies
        a minimum envelope must emit it against something.
      requires_semantics:
      - spatial_commitment
    - class: obligation_to_discharge
      instance_selection:
        population: DESIGN_WIDE
        coverage: ALL_APPLICABLE
        existence: REQUIRED_NONEMPTY
        existence_why: S05-C4 requires every obligation to be cited by some realization,
          which cannot be checked against obligations the stage never saw
      what: the full obligation set
      justified_by_question: What actual geometry on which body makes each declared relation
        real?
      why: A Realization must cite the obligation ids it discharges (INV-008), and coverage
        cannot be read from a subset.
      requires_semantics:
      - physical_obligation
    - class: declared_clearance_relation
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a branch may declare no clearance or interference-free pair yet
      what: the constraint relations this branch declared
      justified_by_question: What does that geometry demand of the layout, as a constraint?
      why: S05-C9 turns every declared clearance and interference-free pair into a Constraint;
        the convergence block can only converge on constraints it was given.
      requires_semantics:
      - constraint_relation
    - class: limit_to_produce
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a branch may declare no blocked degree of freedom
      what: the mobility dispositions this branch declared
      justified_by_question: What actual geometry on which body makes each declared relation
        real?
      why: >-
        S05-C3 asks whether a feature pair can PRODUCE a travel limit that a
        MobilityExpectation dispositions as BLOCKED_BY. Without this premise the
        stage could not see the disposition, the check read a family the view
        never granted, and the empty read passed as compliance - the check could
        not fail, on any input. A stage cannot be asked to satisfy a demand it
        was never shown.
      requires_semantics:
      - mobility_disposition
    - class: occupancy_to_avoid
      instance_selection:
        population: INVOCATION_BRANCH
        coverage: ALL_APPLICABLE
        existence: MAY_BE_EMPTY
        existence_why: a branch may declare no functional region
      what: the regions this branch reserved
      justified_by_question: What actual geometry on which body makes each declared relation
        real?
      why: S05-C8 re-runs occupancy against the new geometry, so the regions a feature may
        not intrude into have to be visible.
      requires_semantics:
      - functional_region
    permitted_output_semantics:
    # CANONICAL NAMES ONLY. S05_CONTRACT.structured_outputs is classified
    # LEGACY_PRODUCER and still spells these `Feature.rigid_group`,
    # `Realization.discharges_obligations` and `ROI`. DESIGN_STATE_CONTRACT is the
    # authority: a Feature is on a `body`, a Realization `addresses_obligations`,
    # and there is no ROI family. Writing both spellings would be two truths.
    - Feature
    - Realization
    - Parameter
    - Constraint
    - ConstructionStatement
    - UnresolvedDecision
    prohibited_decisions:
    - Creating a Body, RigidGroup or Joint; s05 extends s03's by id (INV-001, R-19)
    - Discharging an obligation with a label, a field or a relationship rather than a
      Realization carrying a verification predicate (INV-008)
    - Emitting a Parameter with a null unit (INV-004, R-21)
    - Setting a Parameter VALUE except by citing a solver artifact; this is what makes the
      s05/s06 loop safe without a sequential barrier (R-23)
    - Changing topology, DOF disposition, interaction kinds, load paths or assembly order;
      those escalate to s03
    - Expressing a ConstructionStatement in any frame but the owning body's own
premise_binding_rule: 'Every required_reasoning_premise_class declares `requires_semantics`: the
  SEMANTIC

  ROLES an upstream entity must carry to satisfy it. It never names families.


  This replaces the `satisfied_by.canonical_families` binding introduced at 6ef6dac.

  That binding was machine-readable and still wrong: it made a stage contract hold an

  inventory of the current ontology, so a new family could satisfy a premise and be

  invisible until someone edited every stage that needed it. The implementation plan

  records exactly that failure mode as R-2, whose own falsifier is ''premise declarations

  start naming families directly''.


  The division of labour: DESIGN_STATE_CONTRACT says what a family IS (semantic_roles);

  this file says what a stage NEEDS (requires_semantics); a generic resolver matches

  them. A new family participates by declaring its own roles - no stage contract and no

  resolver code changes.


  A premise requiring ONE role is not a special case and gets no separate mechanism: it

  is simply a premise whose semantics happen to be carried by one family today. If a

  second family later declares that role, the premise picks it up automatically - which

  is precisely what a 1:1 family binding would have prevented.

  '
