stage_id: s05
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml
derived_from: docs/PIPELINE_IMPLEMENTATION_PROPOSAL.md

engineering_question: >
  What actual geometry on which rigid group makes each declared relation real,
  and what does that geometry demand of the layout?

engineering_responsibility: >
  Realize every declared relation as named geometry, and surface the constraints
  that geometry imposes back onto the layout.

required_inputs:
  # Unit E. THE COMMITTED DESIGN, and nothing a caller names. Canonically
  # declared as the s05 required_reasoning_premise_classes; listed here by
  # family for a reader.
  from_selection: [SelectionDecision - the standing human commitment; its selected_candidate names the branch]
  from_s02: [Candidate (the selected one, with its principle), Obligation (applicable to it), AcceptanceContract (its own), PhysicalEffectObligation]
  from_s01: [DesignConstraint (every hard requirement the design states)]
  from_feasibility: [HardRequirementCompliance - only the records NOT_YET_EVALUABLE at a DOWNSTREAM point that name s05 as evidence owner]
  from_s03: [Body, RigidGroup, Joint (compliant ones included), Interface, PhysicalInteraction, ConstraintRelation, MobilityExpectation, LoadPath, AssemblyStep, FunctionalRegion, Configuration]
  from_s04: [ReferenceScale, Envelope, FunctionalRegion.volume, State, Transition, SweptVolume, Interface.mating_geometry]

required_discoveries:
  - "the feature that realizes EACH SIDE of each interaction"
  - "the feature pair that produces each declared limit"
  - "the geometry of each compliant joint, and its required_travel"
  - "the region of interest in which each interaction is to be measured"
  - "the ENVELOPE CONSTRAINTS features impose on layout parameters"

envelope_constraint_rule:
  principle: >
    A feature that implies a minimum envelope must emit it as a Constraint
    binding a layout parameter.
  worked_example: >
    A pin of radius r needing a wall w gives a boss radius r+w, which gives an
    arm outer radius R+r+w, which constrains the axis height. BM-002 CHG-01 and
    CHG-03 and BM-003 R3 and R6 are all the absence of this.

clearance_constraint_rule:
  principle: >
    EVERY declared clearance and EVERY declared interference-free pair emits a
    corresponding Constraint - not only envelope constraints.
  why: >
    The convergence block can only converge on constraints it has been given. In
    BM-003 the arm-to-clevis clearance was never declared, so shortening the
    clevis produced a BUILD FAILURE patched by hand rather than an INFEASIBILITY
    that triggered a re-solve, and the lift-only regression rode along undetected
    for three revisions.
  cost: "thirty-four interactions become thirty-four constraints; trivial"
  discharges: >
    The pre-selection deferral. Feasibility records every mating interface
    whose relation s04a established as SIZING_DEFERRED_TO_EMBODIMENT - the
    representative sizes decide no fit - and THIS rule is the owner of that
    obligation: the Constraint that `governs_interface` carries the fit, and
    s06's settlement against it is what makes the fit established or not.

owned_decisions:
  creates: [Feature, Realization, Constraint, Parameter, UnresolvedDecision]
  # Unit G: construction is Feature.construction; no separate family is created.
  # Unit E. Nothing today. Body, Joint and Interface list s05 among their
  # extendable_by, and none declares an s05-writable field in
  # extendable_fields, which is what the write boundary enforces; the producer
  # emits no EXTEND. A future extension is a DESIGN_STATE_CONTRACT change first.
  extends: []
  also_owns: ["feature-level defeat specifications", "embodiment alternatives"]

prohibited_decisions:
  - what: "create a Body, RigidGroup or Joint"
    instead: "extend s03's, by ID"
    invariant: INV-001
    retirement_row: R-19
  - what: "discharge an obligation with a label, a field or a relationship"
    invariant: INV-008
  - what: "emit a Parameter with a null unit"
    invariant: INV-004
  - what: "set a Parameter VALUE except by citing a solver artifact"
    rationale: >
      This is what guards R-23 without needing a sequential barrier, and it is
      what makes the s05/s06 loop safe.
  - what: "change topology, DOF disposition, interaction kinds, load paths or assembly order"
    instead: "escalate to s03"

construction_frame_rule:
  principle: >
    Every construction step is expressed in ITS FEATURE'S OWN FRAME, and the
    feature is placed relative to an s04 datum. No absolute position appears
    anywhere in an embodiment (Unit G).
  why: >
    s04's arrangement frame is the one spatial authority: joint frames,
    envelopes and regions are committed there, and every body frame coincides
    with it at zero joint coordinates. A feature that named a position of its
    own would be a second truth about where things are; a feature placed
    against a datum inherits s04's, and s07 derives every transform - and
    every pose, from located joint frames and joint coordinates - from that
    one authority and the settled scale.

construction_polarity_rule:
  principle: >
    A feature's construction builds ITS OWN POSITIVE SOLID; its KIND decides
    whether that solid is added to the body or removed from it. The composition
    is the body's, performed after every feature is built, and is never written
    as a step (Unit G).
  csg_is_feature_local: >
    CUT, UNION and INTERSECT shape a feature's own solid out of two or more of
    its OWN earlier steps - a bore with a relief, a boss with a flat - and each
    therefore requires at least two operands. A SUBTRACTIVE feature that writes
    a one-operand CUT is asking a feature-local operation to reach the body: the
    body is not an operand, no step may name it, and its kind has already said
    it is removed. The arity is not relaxed for it; such a step is refused at
    the write boundary, which is where a live round lost a whole embodiment to
    one malformed step.
  one_statement: >
    `downstream.ir.CONSTRUCTION_SEMANTICS` is the text; the s05 language renders
    it and `downstream.compiler` executes it. Nothing restates it in prose.

structured_outputs:
  # Canonical names (DESIGN_STATE_CONTRACT). `interface` is the typed trace to
  # the s03 Interface a feature realizes; `placement` is relative to an s04
  # datum (a joint datum on the joint's axis IS the realization); `construction` is
  # the feature's own (Unit G).
  Feature: [entity_id, body, feature_kind, geometry, interface, placement, construction]
  Realization: [entity_id, addresses_obligations, participating_features, verification_predicate]
  Constraint: [entity_id, expression, parameters, kind, governs_interface]
  Parameter: [entity_id, symbol, unit, status]
  UnresolvedDecision: [entity_id, decision, why_open, alternatives, alternatives_kind, kept_open_by, blocks]

roi_rule: >
  RETIRED (Unit E). No ROI family exists and none is produced. The region an
  interaction is measured in is the Interface's own mating geometry and the
  s04 regions and sweeps the branch committed.

post_selection_handoff:
  branch_authority: >
    The branch s05 embodies is the standing SelectionDecision's
    `selected_candidate`, read by the generic view builder because the
    responsibility declares `branch_authority: SELECTION_DECISION`. Every
    branch-local premise of s05 is declared COMMITTED_BRANCH; a caller cannot
    name a branch, and an invocation naming a candidate other than the
    committed one is recorded as a contradiction that leaves the view
    UPSTREAM_INSUFFICIENT, so the provider is never called for it. With no
    standing decision there is no branch and s05 does not run.
  currentness_premises: >
    Every fact s05 authors carries the selected Candidate and the standing
    SelectionDecision as premises (`invocation_premises`), unioned with its
    local premises. A reopened or revised selection invalidates the decision
    record, and ordinary propagation withdraws standing from every s05 fact
    that rested on it; nothing is deleted and no special case exists.
  obligation_duties: >
    Applicability - whose an obligation is - is `Obligation.scope` with the
    selected candidate's AcceptanceContract (`applicable_obligation_ids`).
    Duty - what kind - is `Obligation.satisfiable_at` (`obligation_duties`):
    DISCHARGE where the obligation becomes satisfiable at s05, and a
    Realization with a predicate must cite it (S05-C4); PRESERVE where it was
    satisfiable at s02, s03 or s04 and the selected branch's own records
    discharged it - embodiment realizes those records and may not cite the
    obligation as its own discharge. An obligation the candidate does not owe
    is refused whether or not it is visible.
  interaction_trace: >
    A Feature names in `interface` the s03 Interface whose side it realizes;
    S05-C1 demands, per interface per participating body, a feature naming
    that interface, refuses an interface the selected branch does not carry
    or that does not involve the feature's body, and the interface is a
    premise of the feature. The effect the interaction transmits reaches s05
    with it (PhysicalInteraction.discharges_effect, a typed reference), and
    a Realization cites the Obligation it discharges by typed reference. No
    prose, no CAD id, and no second source of interaction truth.
  spatial_bridge: >
    WHAT STAYS s04's: the ReferenceScale basis; the Envelopes (a provisional
    extent per body, in that basis), the FunctionalRegion volumes, the States,
    Transitions and SweptVolumes, the Interface mating geometry with its
    REPRESENTATIVE sizes. They say where things sit relative to each other and
    what is reserved; none is an authoritative dimension, and s05 never copies
    one into a constant. WHAT IS s05's: feature identity and kind, the
    construction program in each body's own frame, symbolic Parameter
    declarations with no value, and symbolic Constraints. A Feature's envelope
    is an expression over declared parameters and unit-bearing constants,
    never a bare number (S05-C8 refuses one); occupancy against a reserved
    region is evaluated only where the envelope resolves to constants in the
    region's ABSOLUTE basis, and is otherwise re-evaluated after settlement
    (a later unit). WHAT IS s06's: every number. A RELATIVE s04 basis stays
    relative; nothing here scales it.
  hard_requirement_debt: >
    s05 receives every DesignConstraint the design states (`hard_requirement_
    to_honour`) and, from the selected candidate's compliance records, exactly
    those NOT_YET_EVALUABLE at a DOWNSTREAM evaluation point whose evidence
    owner is s05 (`hard_requirement_debt_to_carry`, applicability
    DEFERRED_TO_INVOKING_RESPONSIBILITY - typed fields, never a kind or a
    sentence). It may not write, assert or imply their compliance; each stays a
    standing NOT_YET_EVALUABLE record until the evidence exists. A VIOLATED
    record is not deferred and never reaches s05 as debt.
  provider_projection: >
    The recorded view holds the declared premises and their representational
    closure - everything the SelectionDecision cites as evidence of the
    decision included - so the record is auditable and currentness walks it.
    The provider is rendered the declared minimum only (`provider_projection:
    DECLARED_ONLY`): the closure stays on the record as audit_only. Other
    alternatives, their assessments, comparisons, preferences and a person's
    rationale are lineage of the decision, not context for embodying it.

ir_authority:
  grammar: >
    One grammar, s06's and s07's: a constraint relation is ==, <= or >=; an
    expression node is exactly one of {ref}, {const, unit} or {op, args} with
    op in + - * /; a construction statement is an opcode from the closed
    vocabulary with its required parameters as such expressions; a feature
    envelope's components are such expressions. s05 authors in it and the
    write boundary reads it (`ir_validation`) before anything becomes
    standing state, so a record the solver or the compiler cannot read is
    never committed for them to refuse.
  zero: >
    A coordinate at the body frame origin is the typed zero of the frame's
    unit - {"const": 0, "unit": "mm"} - a coordinate definition, not an
    invented dimension. A bare number is refused wherever it appears.
    A dimensionless factor carries unit "1".
  premises: >
    The parameters a feature envelope or a construction statement references
    are premises of that record: a revised declaration stales what named it;
    the settlement of a value does not (the boundary's owner rule).

placement_rule:
  placement: >
    A feature carries `placement` RELATIVE TO AN S04 COMMITMENT: a `datum` - a
    Joint (its located frame), the body's Envelope (its centre), a
    FunctionalRegion (its centre) or another feature of the same body - an
    `offset` of three expressions in the kernel length unit along the
    arrangement axes, and, unless the datum is a joint, its own `axis` as a
    signed arrangement axis. s04's arrangement frame is the one spatial
    authority; every body frame coincides with it at zero joint coordinates;
    no absolute position is ever stated and no pose is ever authored. The
    feature frame has Z along its axis, origin at datum x scale + offset, X
    along the canonical perpendicular; s07 builds the feature's construction in
    that frame.
  construction: >
    A feature OWNS its construction - ordered steps in its own frame, one
    unconsumed step being its solid - and a body is its ADDITIVE features fused
    with its SUBTRACTIVE features removed, by the polarity the design-state
    contract declares per kind. No construction exists that a feature does not
    own; placement, role, dimensions and construction trace to one record.
  joint_realization: >
    Every axis-bearing joint is realized on EACH body it relates by at least
    one feature placed AT that joint AND LYING ON ITS AXIS - the joint is the
    feature's datum and the placement is the realization; no second field
    restates it. A slide may be carried by rails, guides and stops: several
    features at one joint on one body are several realizations. ON ITS AXIS is
    load-bearing: a joint datum locates without orienting, so a feature may sit
    at the joint with an axis of its own, and such a feature is positioned by
    the joint without embodying it. Counting it would let a branch report a
    hinge realized while the bore that makes it a hinge is missing. Poses are derived from the located
    joint frames and s04's joint coordinates (`downstream/kinematics`), which
    is the derivation the S04 and S07 contracts always said existed; the
    realizing features say what geometry carries the joint, never where it is.
  scale: >
    In a RELATIVE basis the design has no absolute size until something states
    one. s05 may declare ONE Parameter with `role: SCALE` (kernel length units
    per basis unit); s06 settles it only from constraints that rest on a stated
    bound. s04's ReferenceScale is never written for it. Without an ABSOLUTE
    scale or a settled SCALE parameter, nothing in kernel units can be placed
    against the arrangement and s07 refuses.
  complete_means_constructible: >
    An embodiment is complete when CAD can be built from it: every feature
    reads (placement against a committed datum, construction with one
    terminal, every symbol declared); every body has material (an additive
    feature); every axis-bearing joint is realized on both sides; every mating
    side s04 stated is of the stated kind. S05-C5, C11, C12 and C14 ask this
    of the response; s06's entry gate asks the same of what stands. Neither
    names a mechanism class.

allowed_unresolved:
  - "embodiment alternatives"
  - "every dimension, until s06 solves it"
  - "underdetermined parameter directions, recorded as UnresolvedDecision"
  - "allowable_travel on every compliant joint"
  - "the occupancy of a symbolic envelope, until settlement resolves it (Unit E)"
  - "every hard-requirement compliance record owed to s05, until its evidence exists (Unit E)"

maturity_expectations:
  geometry: [FEATURE_LEVEL_EMBODIMENT, PARAMETERIZED_CONSTRUCTION_INTENT]
  authority: "shape AUTHORITATIVE, size UNSOLVED"

deterministic_exit_checks:
  - id: S05-C1
    check: "every Interface has, on EACH participating body, a Feature naming it in `interface`; a feature may not name an interface the branch does not carry or that does not involve its body; a COMPLIANT joint spanning two bodies is malformed and excuses nothing"
  - id: S05-C2
    check: "every blocking relation has a feature pair"
  - id: S05-C3
    check: "every declared limit has a PRODUCING feature pair"
  - id: S05-C4
    check: "every applicable obligation satisfiable at s05 (DISCHARGE) is cited by a Realization carrying a verification predicate; a preserved obligation (satisfiable upstream) or a non-applicable one may not be cited"
  - id: S05-C5
    check: "construction program totality: every referenced symbol is declared"
  - id: S05-C6
    check: "no Parameter has a null unit"
  - id: S05-C7
    check: "no parameter dependency cycle"
  - id: S05-C8
    check: "every Feature envelope is symbolic - expressions over declared parameters and unit-bearing constants, never a bare number; where an envelope resolves to constants in the region's ABSOLUTE basis, no Feature occupies a FunctionalRegion whose role_policy excludes occupancy (the same arithmetic as s04b); a symbolic or non-comparable envelope is re-evaluated after settlement, and is neither a finding nor a pass"
  - id: S05-C9
    check: "every declared clearance and interference-free pair has a Constraint"
  - id: S05-C10
    check: "no Parameter value is set without a cited solver artifact"
  - id: S05-C11
    check: "every axis-bearing joint is realized on EACH body it relates by at least one feature whose placement datum is that joint"
  - id: S05-C12
    check: "every body of the branch has material - at least one ADDITIVE feature"
  - id: S05-C14
    check: "a mating side s04 stated is realized by a feature of the stated kind"

mandatory_prerequisites_shared_with_s06: >
  Unit G. S05-C1, C9, C11, C12 and C14 are not this stage's private exit
  criteria: they are the mandatory prerequisites of ANY embodiment, and s06's
  entry gate asks the identical questions of what stands. There is one
  implementation - `downstream.embodiment.structural_problems`, over canonical
  rows - and both surfaces call it, so a duty cannot be enforced here and absent
  there. It was: these checks ran only over this stage's response, an
  incomplete embodiment was written anyway (declared incompleteness is recorded
  as a contract failure, not a refusal to write), and the downstream gate found
  the branch ready and settled numbers for an interface no feature realized.

settlement_revision:
  the_branch_embodiment: >
    Unit G. THE EMBODIMENT OF A BRANCH is one set, in EVERY family this stage
    authors - Constraint, Feature, Parameter and Realization, which it owns, and
    the universally ownable families (UnresolvedDecision, Assumption,
    RejectedAlternative) for the records whose provenance is s05's. The set is
    derived from `owned_by` in DESIGN_STATE_CONTRACT plus `universally_ownable`,
    never hand-listed, and ONE function produces it for all three uses: what the
    repair prompt shows by id, what a withdrawal may name, and what the loop's
    repeated-state identity is taken over. A hand-kept list is how Realization
    and UnresolvedDecision came to be authored by the stage yet governed by
    neither rule, leaving a branch holding a mix of two embodiments. Every
    record of it carries the selected candidate and the SelectionDecision as
    premises, stamped on every CREATE by `carry_invocation_premises`, which is
    what makes branch membership readable at all.
  restatement: >
    A restated id revises by SUPERSEDE of the fields that differ; a new id
    creates; AN ID THE RESPONSE DOES NOT MENTION KEEPS STANDING, unchanged. A
    revision may therefore answer with only the part it is changing.
  withdrawal: >
    RETRACTION IS AN ACT AND IT IS DECLARED. A repair response may carry
    `withdrawals: [{entity, cause, reason}]`, and only that retires a record -
    by INVALIDATE, under the round's reason together with the stated one.
    Omission never retires anything: reading silence as withdrawal made an
    engineering decision out of a model's forgetfulness, where a response that
    simply did not mention a feature demolished it. Each withdrawal is checked
    before it becomes an operation - the entity belongs to THIS branch's
    embodiment in a family this stage authors, the stated family is the one it
    has, the cause is a finding OF THIS ROUND, the report named the entity or
    something it rests on (the authorized repair scope), and no id is both
    restated and withdrawn. A withdrawal failing any of these REFUSES THE
    RESPONSE; a repair reaching outside its mandate is not accepted in part.
    Withdrawal is what lets an infeasibility converge - a revision able only to
    change or add left the conflicting constraint standing, the solver read the
    same conflicting set, and the loop halted having changed nothing. Nothing is
    deleted; the withdrawn record stays as history.
  two_repairs: >
    A STRUCTURAL repair and a NUMERICAL one are distinct and never mixed. A
    structural round carries typed prerequisite findings (cause
    EMBODIMENT_PREREQUISITES) - the design commits to geometry the embodiment
    does not contain, the solver was not run, and the answer is the missing
    feature or constraint, never an adjusted dimension. A numerical round
    carries the solver's own report (cause FINDINGS) - the geometry exists and
    the numbers do not hold. A prerequisite finding owned by another stage (a
    malformed Joint is s03's record) is not routed here at all; it escalates.

next_stage_consumer_requirement:
  consumer: s06
  needs: [closed constraint system, every symbol declared and united, envelope constraints, clearance constraints]

llm_role: >
  High for feature proposal and program shape. NONE for completeness, which is
  enumeration over s03's relation set.
knowledge_base_role: >
  Highest of any stage. Feature patterns per capability - clevis+pin+head+captor,
  rail+lip+tab, heel+arm - each carrying its envelope constraints and assembly
  implications.
