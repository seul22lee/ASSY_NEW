stage_id: s01
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml
derived_from: docs/PIPELINE_IMPLEMENTATION_PROPOSAL.md

engineering_question: >
  What did the user actually say, and what did they leave open?

engineering_responsibility: >
  Convert prose into typed statements without sharpening, and make silence
  explicit.

required_inputs:
  - raw source request text
  # S7-B. THE SECOND INPUT, and it is not read the same way. The user design
  # profile is already structured - a section that says PLASTIC_ONLY says it in
  # a field - so it is ingested deterministically and never handed to a model.
  # Optional: a design that ships no profile states no hard requirement THROUGH
  # THIS CHANNEL, which is a different fact from stating none, and the honest
  # consequence is that no DesignConstraint exists rather than one inferred from
  # the prose.
  - "user design profile (optional): its `design_constraints` section only"
input_exclusivity: >
  s01 is the ONLY stage that may read raw source text (INV-002, R-13). Every
  later stage reads DesignState.
constraint_ingress:
  # TWO CHANNELS, NEITHER GATING THE OTHER. Reading only the profile lost a hard
  # requirement the user had typed into the request, on every design that shipped
  # without a structured file - the family declared authoritative, owned here,
  # and unreachable from the only input most designs have.
  producers:
    - "`ingest_design_constraints`: the structured profile section"
    - "`capture_design_constraints`: what the request itself explicitly states"
  producer: "`ingest_design_constraints`, called from s01's own to_operations"
  reads: "design_profile.design_constraints"
  reads_from_source: "the response's `hard_constraints`, each naming the Requirement it comes from"
  shared_gate: >
    BOTH CHANNELS CONSULT THE SAME TABLE. `kind` must be one
    DESIGN_STATE_CONTRACT.DesignConstraint.kinds declares, whether the entry came
    from the profile or from the request - a second list would drift the first
    time a kind is added, and the two doors would then disagree about what a hard
    requirement is.
  source_gate: >
    THE MODEL TRANSCRIBES; CODE DECIDES. Classifying a sentence the user wrote as
    a material requirement is reading, which is what this stage asks a model to
    do everywhere. Turning it into a constraint is not, and every gate is a typed
    fact rather than a judgement: the kind must be one the canonical vocabulary
    declares; the entry must name a Requirement from this same response; and a
    QUANTITATIVE kind needs that Requirement's own quantity_class to be MAGNITUDE
    with a numeric value in the kind's own parameter.

    That last gate is the one that matters. "Keep it reasonably compact" arrives
    as a requirement whose quantity_class is NONE, and no amount of a model
    wanting to call it MAX_OVERALL_DIMENSION gets it past - while "no wider than
    100 mm" arrives as MAGNITUDE and passes. Neither outcome required a line of
    code to look at a word.
  identity_note: >
    Separate id sequences - DSC-Pnnn for the profile, DSC-Snnn for the source -
    so adding a profile entry cannot renumber a source-captured constraint out
    from under a premise that names it.
  never_reads: >
    design_profile.selection_preferences. NOT FILTERED AFTERWARDS - the ingester
    names one key. A wish that became a DesignConstraint could make a candidate
    ineligible for being the kind somebody likes less, and the way that is
    prevented is that no code before `selection` looks at the other section.
  normalization: >
    kind, statement and parameters are carried across verbatim. Nothing is
    completed: a limit with no unit stays a limit with no unit, and the
    consequence downstream is NOT_YET_EVALUABLE - the design not yet having
    said, rather than this stage guessing what it meant. An entry with no kind
    is not a constraint anyone can act on and is not ingested; naming a kind for
    it would be inventing the requirement.
  evaluability_rule: >
    Says WHO the requirement is addressed to, not whether the answer will
    succeed: an entry carrying structured parameters is for a check, an entry
    carrying only a sentence is for a person. Deciding it from whether some
    registry currently holds an evaluator would make an s01 fact depend on what
    a later stage happens to implement.
  identity: "DSC-%04d in the profile's own order, so the same profile always ingests to the same ids."

required_discoveries:
  - "per requirement: whether the source supplies a magnitude, a band, a comparative, or nothing"
  - "the kind of every scenario: OPERATION | SERVICE | ASSEMBLY | TRANSPORT"
  - "which actors exist and what each must reach or operate"
  - "the observable behind each requirement"

owned_decisions:
  # CANONICAL PROJECTION of DESIGN_STATE_CONTRACT `owned_by`. SystemBoundary was
  # listed here and is a family nowhere: the boundary is a REQUIRED FIELD of
  # Scenario (`system_boundary`). The canonical source is right and this
  # projection was stale - the same defect class as the retired hypothesis
  # families, found by the corpus-wide check rather than by name.
  # DesignConstraint added at S-7 / U-8: a HARD requirement on the design enters
  # the authoritative problem here, alongside the requirements it may derive
  # from, and is ingested deterministically from structured profile data rather
  # than reinterpreted by a model.
  creates: [Actor, Ambiguity, DesignConstraint, Freedom, Requirement, Scenario, SourceClause]
  also_owns:
    - "the quantity inventory"
    - "the classification of a source statement as verbatim clause versus derived requirement"

prohibited_decisions:
  - what: "invent a requirement the source does not state"
    instead: "that is an Assumption, and it is not s01's to make"
  - what: "invent a material, dimension or mechanism the source does not state"
    instead: >
      S7-A: carrying a user's EXPLICIT hard requirement - "all parts must be
      plastic" - is required and is a DesignConstraint with its provenance.
      Inferring one the source never stated is this prohibition. The test is the
      source, not the vocabulary.
  - what: "sharpen a source qualifier"
    example: "'approximately 300 mm' stays approximate"
  - what: "resolve an Ambiguity"
    instead: "recording it is the deliverable"
  # RETIRED at the S7-A sweep. It read as a blanket ban and therefore forbade
  # s01 to record a user who SAID "all parts must be plastic" - a hard
  # requirement the design must satisfy, lost because of a word. The prohibition
  # that was always meant is INVENTION, stated above; carrying an explicit
  # user-stated requirement is a DesignConstraint with its provenance, and the
  # test is the source rather than the vocabulary.
  - what: "name a mechanism, material, part or dimension THE SOURCE DID NOT STATE"
    superseded: "the blanket form of this rule, retired at the S7-A sweep"

structured_outputs:
  # S7-A: a hard requirement the user STATED is an s01 output. Its absence here
  # made this projection and `owned_decisions.creates` disagree about the same
  # family - the canonical contract said s01 owns it and the shape list did not
  # mention it.
  DesignConstraint: [entity_id, kind, statement, source, evaluability]
  Requirement: [entity_id, statement_verbatim, kind, verification_kind, observable_verbatim, source_locator, quantity_class]
  SourceClause: [entity_id, verbatim, locator, quantity_kinds, directionality]
  Scenario: [entity_id, name, kind, system_boundary, actors, environment]
  Actor: [entity_id, name, must_reach]
  Freedom: [entity_id, decision, why_free]
  Ambiguity: [entity_id, statement, conflicting_clauses, resolvable_when, block_scopes]
  quantity_inventory:
    per_requirement: "MAGNITUDE | BAND | COMPARATIVE | NONE"
    why: >
      Downstream stages must know that the source gave no number as a FACT, not
      discover it by finding nothing. BM-002 supplies two magnitudes; BM-001 and
      BM-003 supply none.

allowed_unresolved:
  - "every Ambiguity"
  - "every Freedom"
  - "every quantity the source does not give"

maturity_expectations:
  geometry: NONE
  note: "No frames, no bodies, no positions exist at this stage."

deterministic_exit_checks:
  - id: S01-C1
    check: "every Requirement resolves to an existing SourceClause locator"
  - id: S01-C2
    check: "no numeral appears in a Requirement that is absent from its cited clause"
    rationale: "the sharpening check"
  - id: S01-C3
    check: "every Scenario has a kind"
  - id: S01-C4
    check: "every Requirement has a quantity_class"
  - id: S01-C5
    check: "re-running on identical text produces byte-identical output"

next_stage_consumer_requirement:
  consumer: s02
  needs: [requirements, observables, scenarios_by_kind, actors, quantity_inventory, ambiguities_with_block_scopes]
  must_not_need: [raw source text]

llm_role: >
  High FOR THE REQUEST TEXT. Extraction and classification; the failure mode is
  sharpening, which S01-C2 checks mechanically.

  NONE FOR THE DESIGN PROFILE. It arrives structured, and handing a stated
  requirement to a model to reinterpret would turn it into an inference - the
  one thing this stage exists to prevent. Two inputs, two paths, and only one of
  them goes near a model.
knowledge_base_role: >
  None. A knowledge base at s01 would import assumptions the source did not make.
