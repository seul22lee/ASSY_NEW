# STAGE 04 CONTRACT — placement, motion and spatial feasibility
#
# ONE numbered stage, TWO declared passes at different fidelities, and NOTHING
# between them. "The selection gate sits between them" was retired at S7-A: the
# order is s04a -> s04b -> feasibility -> selection, and the claim was the one
# that made s04b unreachable. Numbering is preserved because the frozen Oracle
# stage_expectations reference s04 by name.

schema_version: "0.1.0"
# ---------------------------------------------------------------- S-2 closure
# AUTHORITY STATUS of each semantic section. See CONTRACT_AUTHORITY.yaml.
# A *_CONTRACT.yaml file is not a semantic authority by default.
authority_status:
  s04a:
    class: OPERATIONAL
    note: >
      Stage-local prose or detail. It EXPLAINS; it does not define. Not a
      projection: a paraphrase of a canonical list is not equality, and
      treating it as one would make this file a second semantic authority
      by resemblance rather than by declaration.
    authoritative_for_canonical_semantics: false
    see_canonical:
      file: ver3/contracts/STAGE_RESPONSIBILITY_CONTRACT.yaml
      path: "stages.s04a and s04b"
      binding: false
      why: >
        A non-authoritative pointer for readers. The canonical value
        lives there, not here.
  selection_gate:
    class: OPERATIONAL
    note: >
      Stage-local prose or detail. It EXPLAINS; it does not define. Not a
      projection: a paraphrase of a canonical list is not equality, and
      treating it as one would make this file a second semantic authority
      by resemblance rather than by declaration.
    authoritative_for_canonical_semantics: false
    see_canonical:
      file: ver3/contracts/STAGE_RESPONSIBILITY_CONTRACT.yaml
      path: "stages.s04a and s04b"
      binding: false
      why: >
        A non-authoritative pointer for readers. The canonical value
        lives there, not here.
  s04b:
    class: OPERATIONAL
    note: >
      Stage-local prose or detail. It EXPLAINS; it does not define. Not a
      projection: a paraphrase of a canonical list is not equality, and
      treating it as one would make this file a second semantic authority
      by resemblance rather than by declaration.
    authoritative_for_canonical_semantics: false
    see_canonical:
      file: ver3/contracts/STAGE_RESPONSIBILITY_CONTRACT.yaml
      path: "stages.s04a and s04b"
      binding: false
      why: >
        A non-authoritative pointer for readers. The canonical value
        lives there, not here.
  why_two_passes:
    class: "OPERATIONAL"
    note: "non-semantic detail; defines no canonical meaning"
    authoritative_for_canonical_semantics: false
  llm_role:
    class: "OPERATIONAL"
    note: "non-semantic detail; defines no canonical meaning"
    authoritative_for_canonical_semantics: false
  knowledge_base_role:
    class: "OPERATIONAL"
    note: "non-semantic detail; defines no canonical meaning"
    authoritative_for_canonical_semantics: false
  repair_lifecycle:
    class: "OPERATIONAL"
    note: >
      How the two passes revise what they produced. The classes it acts on,
      the ownership of every value it revises and the controlled operations
      it uses are canonical elsewhere; this section says how the loop runs.
    authoritative_for_canonical_semantics: false
stage_id: s04
passes: [s04a, s04b]
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml
derived_from: docs/PIPELINE_IMPLEMENTATION_PROPOSAL.md

why_two_passes: >
  INV-007 forbids selection before feasibility evidence at equal obligation
  coverage, and that principle is right. But full swept feasibility per candidate
  is unaffordable: the Oracle packs list seven and five admissible fixtures, and
  the manual process carried two, one and one. Splitting the fidelity keeps the
  principle and pays for it.

# =====================================================================
s04a:
  name: envelope and reach feasibility
  engineering_question: >
    Can any of these candidates fit, reach and be approached at all?
  engineering_responsibility: >
    Give every retained candidate a provisional arrangement it can be judged
    on, and report each geometric finding against that arrangement with its
    reason. REALIZE AND REPORT, NEVER ELIMINATE: a finding here is a finding
    about the current arrangement, which s04 may revise; the feasibility
    responsibility classifies what it means for the candidate (Unit A), and no
    reason s04a can state makes a mechanism infeasible by itself.
  runs_on: "EVERY retained candidate"

  required_inputs:
    from_s03: [Body, RigidGroup, Joint, Configuration, FunctionalRegion, AssemblyStep, actor_reach_requirements]

  required_discoveries:
    - "a provisional extent for every body"
    - "whether the declared functional regions can coexist"
    - "whether every actor can reach what it must operate"
    - "whether each assembly step's access side is geometrically available"

  owned_decisions:
    # S-6 / U-7: s04a creates NO State. It sizes bodies; s04b realizes
    # configurations in coordinates. The claim described a producer that never
    # existed, and `State.configuration` now makes the real relation typed.
    creates: [Envelope, ReferenceScale, ReachResult, EliminationRecord]
    # AssemblyStep insertion_direction is DERIVED from s03's access_side, not
    # asked of the model: one statement of arrival, the side, and its vector.
    extends: [FunctionalRegion volume, AssemblyStep insertion_direction, Interface mating_geometry]
    also_owns: ["a recorded geometric finding against the arrangement it produced (EliminationRecord) - repair feedback about the realization, never a verdict on the candidate"]

  absolute_scale_rule: >
    Where the source states no size - the common case - overall scale is a
    DECLARED FREE PARAMETER with a representative value, recorded as BOUNDED
    with the Freedom it derives from. Never a silent choice, and never
    authoritative here.

  prohibited_decisions:
    - "any authoritative dimension"
    - "any feature"
    # S7-A: "before the gate" implied s04 may decide a winner afterwards. It may
    # not, at any point: choosing is the `selection` responsibility's and s04
    # authors spatial evidence.
    - "which candidate wins, at any point - s04 produces evidence and never chooses"

  allowed_unresolved: ["every internal dimension", "all feature detail",
                       "the FIT of every mating interface - its sizes here are representative and decide none"]

  maturity_expectations:
    # ENDPOINT_POSES removed at S-6 / U-7: s04a sizes bodies and authors no
    # State. Coordinates that realize a configuration are s04b's, and
    # `State.configuration` now makes that relation typed.
    geometry: [ENVELOPES]
    authority: PROVISIONAL
    note: "AABB interference is CONSERVATIVE: no-overlap is a proof, overlap is not."

  deterministic_exit_checks:
    - id: S04A-C1
      check: "every body has an extent with maturity PROVISIONAL"
    - id: S04A-C2
      check: "every FunctionalRegion has a volume"
    - id: S04A-C3
      check: "every Actor has a reach result"
    - id: S04A-C4
      check: "AABB interference computed per configuration"
    - id: S04A-C5
      check: "every eliminated candidate carries a geometric reason"
    - id: S04A-C6
      check: "absolute scale, where free, is recorded BOUNDED with its Freedom reference"

selection_gate:
  # LATER-OWNED. The lifecycle is s04a -> s04b -> feasibility -> selection.
  # S-6 read s04b's selection premise as STAGED behind S-7; S7-A RETIRED it
  # instead, because activating it would have meant SelectionDecision -> s04b
  # against that order. "Between s04a and s04b" described a runtime that never
  # existed and was the claim that made s04b unreachable.
  position: >
    after s04b, and after the `feasibility` responsibility that reads s04's
    evidence. It is not a gate between the passes and no current S04 behaviour
    depends on it; choosing belongs to the `selection` responsibility (S7-C
    onward).
  precondition: >
    Every retained candidate carries s03 completeness and s04a feasibility at
    equal obligation coverage.
  tie_rule: >
    If more than one candidate survives with no discriminating evidence, that is
    an UnresolvedDecision naming what would discriminate. Never an arbitrary
    pick (R-17), never a score (R-16).

# =====================================================================
s04b:
  name: placement, motion and spatial proof
  engineering_question: >
    Where is everything in each state, what path connects the states, and is that
    path - and every assembly path - actually clear?
  engineering_responsibility: >
    Prove spatial feasibility over PATHS, not over endpoints.
  runs_on: >
    ONE CANDIDATE PER INVOCATION, named by the caller. "The selected candidate
    only" described the state after the S-7 gate, which does not exist: the
    responsibility resolved every premise against COMMITTED_BRANCH, so before a
    selection stands the population was empty and s04b could not be invoked at
    all. It runs on the branch the invocation names; S-7 restores the committed
    reading without changing anything below it.

  required_inputs:
    # S-6 / U-7. `blocking_relations` is RETIRED - it was retired from the
    # producer at S-4/U-5 and its last reader went at the S-5 correction, so a
    # consumer contract still requiring it described a fact that no longer
    # exists. The canonical constraint truth is ConstraintRelation, and the
    # mobility a placer needs is MobilityExpectation. SelectionDecision is not
    # required here for the same reason `runs_on` no longer says "selected".
    from_s03: [Joint, MobilityExpectation, ConstraintRelation, AssemblyStep, LoadPath, Configuration]
    from_s04a: [Envelope, ReferenceScale, FunctionalRegion volumes]

  required_discoveries:
    - "the metric placement of every joint frame"
    - "the pose of every rigid group in every state"
    - "the path between states, and WHICH COORDINATES it changes"
    - "the swept volume of every moving group"
    - "whether each provisional load path's reaction region is unoccupied throughout the motion"
    - "whether each assembly step has a clear insertion path IN THE CONFIGURATION PRODUCED BY THE PRECEDING STEPS"

  owned_decisions:
    # CURRENT, and matched against STAGE_RESPONSIBILITY_CONTRACT.s04b's
    # permitted_output_semantics rather than against ambition. The three claims
    # below were in `creates`/`extends` and are owned by neither the
    # responsibility contract nor any producer, so they are recorded as what they
    # are instead of being implemented to make prose true.
    creates: [State, Transition, SweptVolume]
    extends: [Joint frame_origin]
    not_owned_here:
      - what: "Witness declarations"
        owner: "later stages (DESIGN_STATE_CONTRACT.Witness.owned_by is [s04, s09])"
        status: "no producer; frozen U-7 does not require one"
      - what: "Interface engagement_site"
        owner: "later stages"
        status: "no field, no producer, not part of U-7"
      - what: "LoadPath maturity to SPATIALLY_INSTANTIATED"
        owner: "the maturity progression in S03_CONTRACT.load_path_rule (s04b, later)"
        status: "not produced; U-7 covers placement and motion evidence, not maturity promotion"
    supersedes: >
      An s04a Envelope, with a GEOMETRIC REASON. The arrangement is a COMMITMENT
      carrying a class; a refinement extends it by default, and contradicting one
      is a supersession that keeps both values and costs every value resting on
      the old one its unqualified authority (FA-5). A revision with no reason is
      refused, which is what makes "may not silently contradict" a behaviour.
    refinement_lifecycle: >
      REFINEMENT, REFRESHED PREMISE, RECOMPUTATION - in that order, and the order
      is the point. Every stage hook reasons from the ConsumerView built when the
      invocation started, so an invocation that both REVISES a commitment and
      reasons from it produces evidence for an arrangement it is replacing in the
      same patch. It does not even go stale: a value created after the
      supersession was never a dependent of it.
      An s04b response carrying a justified envelope revision is therefore a
      BARRIER. That invocation commits the revision ALONE - no joint placement,
      no State, no Transition, no swept occupancy - and reports
      `refinement_only`, a field rather than prose. The caller refreshes the view
      and invokes again; the second invocation reasons from the revised
      arrangement and computes the occupancy from it. The refresh is BOUNDED: a
      stage still revising after it is reported, and no realization is committed
      from an arrangement that never settled.
    written_by: >
      THE STAGE, in the stage's own patch. Until S-6 the runner read the raw s04
      response after the stage returned and wrote the reference scale, the reach
      results, the elimination record, the region volumes, the insertion
      directions and the joint origins - so a caller that did not run that second
      step got a DesignState missing s04's conclusions with nothing saying so.

  pose_law_rule: >
    The pose law is NOT authored. With located joint frames and joint
    coordinates, every pose is DERIVABLE. Nothing downstream needs a hand-written
    pose function - which is exactly what hid inside build.py in all three
    references and produced the s07 input contradiction.

  prohibited_decisions:
    - "feature shape"
    - "final dimensions"
    - "a functionally-named state (waypoint states for a path are permitted)"
    - "a render as an authoritative artifact"
      # R-01, INV-005
    - "a constant offset presented as a motion model"
      # R-07
    # Still current, and it is about the COMPUTATION rather than about a
    # declaration a model makes: the sweep is non-adaptive and records the poses
    # it evaluated, so an adaptive density that left no record is prohibited.
    - "adaptive sampling that leaves no record of what was evaluated"

  allowed_unresolved:
    - "all feature detail and all dimensions"
    - "any frame placement that depends on a feature envelope - these stay PROVISIONAL and settle in the convergence block"

  maturity_expectations:
    geometry: [POSES, MOTION_PATHS, SWEPT_OCCUPANCY]
    authority: >
      AUTHORITATIVE except for placements marked PROVISIONAL pending feature
      envelopes. Per-value maturity is what makes this expressible.

  deterministic_exit_checks:
    - id: S04B-C1
      claim_class: PROVENANCE_INTEGRITY
      check: "the recorded motion evidence level is the one the sampling record supports, and the computation is non-adaptive"
      never_a_declaration: >
        S-6 / U-7. This used to read "sampling is declared and non-adaptive"
        against a declaration the parser wrote from a module constant before any
        sweep ran - it validated the property the constant guaranteed and could
        not fail. The level is now an OUTPUT of the sweep, recorded on the
        SweptVolume the sweep produced, and this check recomputes it from that
        record. A level the method cannot support - it unions discrete poses, so
        never SWEPT or CONTINUOUS - may not be claimed by declaring it.
    - id: S04B-C2
      claim_class: BOOKKEEPING
      check: "the sampling record states how many poses were evaluated and how many were interior"
      not_a_refusal: >
        S-6 / U-7. This read "endpoint-only sampling is REFUSED". Endpoint-only
        is a LEVEL - ENDPOINTS_ONLY - and refusing it categorically was a rule
        about density pretending to be a rule about truth, sitting beside a
        declaration written from a constant. Whether that level suffices belongs
        to the claim being made; assurance owns that question (S-8 / U-9).
    - id: S04B-C12
      claim_class: ENGINEERING_CONSEQUENCE
      check: "every configuration that DECLARES a distinguishing basis realizes it in coordinates that differ from the siblings it names"
      conditional_on_a_premise: >
        Never "all configurations must differ", which would be a rule about
        products. The premise is Configuration.distinguishing_basis, authored by
        s03; a mechanism that declares none is not asked to satisfy anything.
    - id: S04B-C13
      claim_class: ENGINEERING_CONSEQUENCE
      check: "a transition's declared changed coordinates are exactly the ones its endpoint states differ on"
    - id: S04B-C14
      claim_class: PROVENANCE_INTEGRITY
      check: "a placed joint declares an axis that names a coordinate; an origin without a usable axis supports no motion claim and no default is supplied"
      rationale: >
        A rotation about a fabricated axis produces a hull, and the hull produces
        a clearance verdict, with nothing in the record saying the axis was
        invented. (The sampling rationale that sat here belonged to the retired
        endpoint-only refusal and was left behind when the checks were
        renumbered.)
    - id: S04B-C3
      check: "every FunctionalRegion has an occupancy result in every state and along every path"
    - id: S04B-C4
      check: "every AssemblyStep has a swept-path result computed against the preceding configuration"
    - id: S04B-C5
      check: "every provisional LoadPath is confirmed or refuted"
    # RETIRED at S-6 / U-7. The check named `blocking_relations`, a shape whose
    # producer went at S-4 / U-5 and whose last reader went at the S-5
    # correction. What a placer can actually confirm is the canonical relation
    # the mobility grid cites, so the check is stated over that.
    - id: S04B-C6
      check: "every BLOCKED_BY cell cites a ConstraintRelation, and the motion computed for its configuration does not contradict it"
    - id: S04B-C7
      check: "every compliant joint coordinate is ZERO in every state outside its activation set"
      rationale: "without this, activation_window is an unchecked list of names"
    - id: S04B-C8
      check: "every check declares its input value set"
    # RETIRED at S-6 / U-7: S04B-C9 required "every Interface has a metric
    # engagement_site". S04 owns no such field - `not_owned_here` above records
    # it as later-owned and no producer exists - so the check demanded a fact
    # from a stage that cannot author it. Its id is not reused; C12-C14 are the
    # checks this step added.
      rationale: "the invalidation cone is computed from these declarations"

  next_stage_consumer_requirement:
    consumer: s05
    # S-6 / U-7. Three of these named things S04 does not produce.
  # `paths_with_declared_sampling` described sampling as a declaration on a path,
  # which it is not - the evidence is SweptVolume.fidelity, recorded by the
  # computation. `engagement_sites` is later-owned. `confirmed_load_paths`
  # overstated what the spatial check does: it reports a path whose interfaces
  # cannot carry the load, and reporting nothing is not confirmation.
  needs: [located_joint_frames, states_with_joint_coordinates, swept_volumes_with_recorded_fidelity, metric_functional_regions, spatially_evaluated_load_paths]
  later_owned:
    - what: engagement_sites
      owner: "later stages; see DESIGN_STATE_CONTRACT.Interface.engagement_site_status"

# =====================================================================
repair_lifecycle:
  # UNIT B. S04 REALIZES AND REPAIRS; IT NEVER ELIMINATES. A finding about the
  # arrangement or the realization is a finding about a value one of these
  # two passes produced, and the pass that produced it is asked to revise it.
  principle: >
    realize -> check -> diagnose -> repair -> re-check, bounded. The check is
    the feasibility responsibility answering again over current state; the
    diagnosis is the REPAIRABLE_S04 class its domain records carry (Unit A);
    the repair is the owning pass revising values it owns; the re-check is the
    same evaluator again. Nothing in the loop decides anything about the
    candidate: it applies the owner's patches and records what happened.
  trigger: >
    ONLY findings of class REPAIRABLE_S04 on the branch's current
    FeasibilityDomainAssessments. A MechanicalFeasibilityAssessment status is
    never a trigger, nor is prose, nor a hard requirement. OWNER_REVISION
    belongs to the upstream owner (Unit C), DEFERRED_DOWNSTREAM to s05/s06,
    UNSUPPORTED to nobody - a capability limit is recorded, not retried - and
    REQUIRED_MINIMUM_ABSENT names a fact no repair may invent.
  deterministic_first: >
    A finding a pass can repair by derivation is repaired by derivation and
    never asked of a model: s04a re-derives an insertion vector from the side
    s03 stated (INSERTION_DIRECTION_MISSING, INSERTION_DIRECTION_CONTRADICTS_
    ACCESS_SIDE); s04b recomputes an occupancy the method can compute and did
    not deliver (OCCUPANCY_NOT_COMPUTED). A group two joints carry is left as
    it is - OCCUPANCY_UNSUPPORTED_COMPOSITE_MOTION is UNSUPPORTED, and no
    repair may pretend to sweep what this method cannot compose.
  owner_reinvocation: >
    What remains is put to the owning pass as REPAIR CONTEXT: the findings,
    with the domain's note, and the values the pass produced before. The pass
    restates its whole answer in its ordinary schema; what differs is recorded
    as a revision and what does not is recorded as nothing. s04a may revise
    extents and centres, region volumes, mating geometry, reach conclusions
    and the elimination statement; s04b may revise joint origins, state
    coordinates, transitions, and - with a geometric reason - extents. Neither
    may add, remove, rename or retype any body, rigid group, joint, interface,
    configuration, assembly step, functional region, requirement, load case or
    principle, and neither may change the scale basis: those are earlier
    stages' facts, and a repair that touched them would be a new candidate
    wearing a repair's reason.
  how_a_revision_is_recorded: >
    Through the boundary's own operations and no others. An s04a value that
    changed is SUPERSEDED with the round as its reason and the previous value
    kept; an unchanged value writes nothing. An s04b realization is ONE
    COHERENT SET - every state, path and occupancy of one answer - so the
    standing set is INVALIDATED whole and the new set CREATED whole under ids
    that name the branch's next realization GENERATION - not the round, since
    a loop nested in another numbers its rounds from one again; a joint
    origin that changed is superseded in place.
    Everything premised on a revised value loses unqualified authority by
    ordinary propagation - the occupancies, the domain records, the
    candidate-level answer, and anything selection wrote over them - and the
    re-check writes the new answers beside the old ones. Nothing is deleted;
    nothing is overwritten out of existence.
  re_realization_after_upstream_revision: >
    When an upstream owner revises a fact the realization was reasoned from
    (the S03 owner-revision lifecycle, Unit C), both passes are re-invoked,
    s04a then s04b, with RE-REALIZATION CONTEXT - the upstream findings for
    orientation and their own previous values - and realize the mechanism
    AS IT NOW STANDS. A standing realization is never reused merely because
    its ids exist. The answers are recorded exactly as a repair's are:
    changed values superseded, unchanged ones nothing, the s04b set retired
    whole and re-created whole under the branch's next generation.
  bound: >
    At most N rounds per candidate (2 to begin with). A round whose findings
    are the findings of an earlier round OVER THE SAME BASIS - the same
    (domain, code, owner) over the same current revisions of the premises
    each was found on, never a free-text summary - is a CYCLE and ends the
    loop; the same code over a basis a repair changed is a different finding
    and counts against the budget instead. One invocation per pass per
    round, taken whatever it says: NO FAVOURABLE
    RETRY - nothing asks twice and keeps the better answer, and nothing picks
    among answers. A repair invocation that does not land ends the loop; a
    loop offered no provider makes its derivation repairs and ends.
  ending: >
    Every ending is evidence and none is a verdict. What is still repairable
    when the loop ends stays on the record as open obligations of a candidate
    that is exactly as feasible as its required minimum and its arguments say
    (Unit A) - never INFEASIBLE by exhaustion, never NOT_ESTABLISHED for a
    finding outside the minimum, and never repaired by a hand that was not
    the owner's.

llm_role: >
  Low. This is computation. The LLM proposes candidate placements for a solver
  to check.
knowledge_base_role: >
  Standard probe sets - escape probes, rotation probes, captivity probes. NOT
  sampling policies: the density is a parameter of the computation and the
  evidence level is its output, so a policy that fixed one from outside would put
  the claim back in front of the work it is supposed to describe.
