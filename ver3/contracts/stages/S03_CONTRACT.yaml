  # The retired relation names live HERE, inside an explicitly legacy section,
  # and not inside the canonical ownership projection. Structure rather than a
  # note: a reader and a test both see the classification without reading prose.
  relates: []
  emits: [ConstraintRelation, PhysicalInteraction, MobilityExpectation, TransitionRequirement]
  does_not_yet_emit: []
  retired_shapes: [blocked_by, retained_by, blocking_relations, mobility, dof_dispositions]
  migration_status: >
    RETIRED, not merely superseded. s03b authors ConstraintRelation and
    PhysicalInteraction and DERIVES MobilityExpectation from them; s02 authors
    PhysicalEffectObligation and ReactionSiteRequirement. Nothing in this stage
    reads `blocking_relations`, `mobility` or `dof_dispositions` any more: the
    alias table, the canonicaliser and the per-DOF relation reconstructor are
    gone, and s03a's two undocumented parses of `mobility` and `dof_dispositions`
