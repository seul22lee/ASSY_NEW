    audited defect forward under a new name.

stage_id: s03
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml
derived_from: docs/PIPELINE_IMPLEMENTATION_PROPOSAL.md

engineering_question: >
  What things are there, how are they connected, what may move, what must not,
  what reacts what, and in what order does it go together?

engineering_responsibility: >
  Turn a candidate family into a specific mechanism topology, state what holds
  it and how load leaves it, and account for EVERY degree of freedom in it - by
  citing the premise that disposes each one, or by saying there is none.

required_inputs:
  # Corrected in Window 2 by the producer/consumer audit. The previous list
  # named PhysicalEffectObligation and PhysicalInteraction, which no stage
  # produces and DESIGN_STATE_CONTRACT does not define. s03 OWNS Body and
  # Interface creation, so it cannot also consume them: the bodies are derived
  # here from the selected candidate's principle families.
  from_s02: [Obligation, Candidate, LoadCase, AcceptanceContract, UnresolvedDecision]
  from_s01_via_state: [Requirement, Scenario, Actor, Freedom, Ambiguity]
prohibited_inputs: [raw source text, benchmark documentation]

required_discoveries:
  - "the bodies; and where a body is not rigid, its rigid groups and the compliant joints between them"
  - "every joint: type, participants, DOF, axis DIRECTION"
  - "every region where two bodies meet, and its interaction kind"
  - "every constraint relation: what it retains, which DOFs it removes, in which configurations, what drives it, and what PROVIDES it"
  - "for each constraint relation: in which direction, and how a test would defeat it"
  - "where a DOF is unloaded and unactuated: the scenario in which that holds"
  - "for each load case: the ordered path from the load to a reaction site, through THIS candidate"
  - "the assembly partial order, the access side per step, and the retention-termination strategy per retained body"
  - "the functional regions the design promises: access, support, keep-out, aperture"

owned_decisions:
  # CANONICAL PROJECTION of DESIGN_STATE_CONTRACT `owned_by`. This is what s03
  # OWNS, not what it currently emits - the two differ during the migration and
  # the difference is stated in `current_producer` below rather than hidden by
  # trimming this list.
  creates: [AssemblyStep, Body, Configuration, ConstraintRelation, FunctionalRegion,
            Interface, Joint, LoadPath, MobilityExpectation, PhysicalInteraction,
            RigidGroup, TransitionRequirement]
  note: "This stage owns the MECHANISM."

dof_disposition_rule:
  domain: >
    DETERMINISTIC AND TOTAL WITHIN ONE BRANCH, and therefore BOOKKEEPING. Every
    rigid group x configuration x rigid-body DOF cell OF THAT BRANCH exists
    because the enumerator makes it exist. Across accumulated state the domain is
    the union of the branches': a mechanism is a branch's, and one alternative's
    group in another's configuration is a pair no mechanism contains. Its
    totality is guaranteed by the code that produces it and may never be counted
    as engineering assurance.
    IT IS NOT STORED. One function computes it - current_dof_domain - from
    STANDING topology, on every read; no MobilityExpectation and no other record
    is consulted about whether a cell exists. A disposition's rigid group,
    configuration and DOF identify WHICH cell it is about, and assert nothing
    about that cell being there.
  disposition: >
    From a PRESENT, TYPED, REFERENCEABLE PREMISE and from nothing else, and that
    premise is also a DEPENDENCY: it is carried on the creating operation, so
    superseding or invalidating it costs the mobility its unqualified authority
    (FA-5). A citation that is not a dependency lets the design go on claiming a
    DOF is held by something it has withdrawn.
  dependency: >
    TWO HALVES with different consequences. The DOMAIN-DEFINING premises - the
    candidate, the configuration, and every rigid group whose cells the record
    contains - decide whether those cells are still in the current domain at all.
    The DISPOSITION premises decide whether the claim about them still stands.
    Withdraw a rigid group and the cells go with it; withdraw a cited relation
    and the cells remain while the conclusion loses authority.
    BLOCKED_BY citing a ConstraintRelation, INTENDED citing the Joint whose class
    leaves the DOF free, IRRELEVANT_BECAUSE citing the Scenario in which it is
    unloaded and unactuated. Which field carries which disposition's premise, and
    what family it must resolve to, is declared in
    DESIGN_STATE_CONTRACT.MobilityExpectation.field_semantics.dispositions and
    enforced at the write boundary.
  undispositioned: >
    The value for a cell no premise covers, naming what is missing. It is not an
    error to be repaired; it is the honest state, and a low disposition
    completeness is a measurement rather than a regression.
  applicability: >
    A premise disposes the cells it DECLARES. A ConstraintRelation expands over
    its own retained_group, blocked_dofs and configurations; one declaring no
    configuration holds in none. A Joint declares no configuration set at all and
    is unconditioned by construction.
  retired_disposition: >
    MAINTAINED_BY_CLASS is retired. Its evidence was a class STRING, which names
    no entity and can never be a resolvable premise. See
    DESIGN_STATE_CONTRACT.MobilityExpectation.retired_disposition_values.
  why_totality: >
    A declared set that omits a DOF cannot fail. All three BM-001 human-review
    rejections and BM-003 R2 were omissions from declared sets. Totality is
    mechanically checkable; declaration is not. What it is NOT is evidence - see
    `domain` above.
  irrelevant_because_rule: >
    IRRELEVANT_BECAUSE must name a Scenario BY ID, and it must resolve. The
    bounded check available here is scenario-level: a scenario carrying any load
    case is not one in which a DOF is unloaded (S03-C3). Per-DOF load and
    actuation resolution is the ENGINEERING CONSEQUENCE check the implementation
    plan assigns to U-9, and nothing in this stage claims to perform it.

constraint_relation_rule:
  # The blocking_relation_rule this replaced modelled a non-addressable
  # `blocked_by` nested structure with a `blocker_body`. It was RETIRED at S-4 /
  # U-5 and the last reader of its shape went at the S-5 correction; the
  # canonical fields are below and in DESIGN_STATE_CONTRACT.ConstraintRelation.
  required_fields: [retained_group, blocked_dofs, configurations, driver]
  provider_rule: >
    AT LEAST ONE of provider_body (a body of this mechanism) or
    provider_reaction_site (a declared EXTERNAL site) must identify what provides
    the constraint. provider_site says where it acts and does not answer that.
  # `release_transition` was RETIRED: an s03 restraint pointing at an s04
  # Transition is upstream semantics naming a downstream realization, and it
  # had no writer, no reader and no standing instance. What it reached for is
  # TransitionRequirement.released_constraints, which points the other way.
  optional_fields: [blocked_direction, provider_body, provider_reaction_site,
                    provider_site, maintaining_interaction, defeat_specification,
                    blocked_relative_motions]
  driver: [LOAD, KINEMATIC_NECESSITY, DECLARED_SCENARIO]
  driver_rationale: >
    A constraint may be required because a load must be reacted, OR because the
    selected conversion cannot function without it (NRM-BM-002-007 exclusion b:
    a lead-screw nut is anti-rotated for the second reason and no load case will
    ever justify it).
  defeat_specification_rationale: >
    Authored here, with the relation, and not reconstructed from geometry at s08.
    A control written from geometry defeats what the geometry suggests rather
    than what the design claims - which is DEF-01, DEF-02 and NC-17.
  compliant_recovery_rationale: >
    A relation whose validity requires a compliant joint to have returned to zero
    names that joint. HCR-BM001-002 directs that the RECOVERED snap-barb shoulder
    blocks removal; without the field the model shows it as unconditional.

compliance_rule:
  granularity: >
    ONE RigidGroup and ONE compliant Joint PER COMPLIANT MEMBER. Four independent
    tabs are four groups and four joints, not one region. A "region" is not an
    entity; it is a set of compliant joints co-actuated by one Transition.
  required_fields: [mode, direction, required_travel, allowable_travel, actuation, compliant_element, root_interface, activation_window]
  travel_rule: >
    required_travel is kinematic and authoritative. allowable_travel is a
    material fact with status UNSUPPORTED, naming the route that would establish
    it. They are never one number.
  actuation: PRESCRIBED_KINEMATIC
  actuation_rationale: >
    In the real mechanism a contact drives the deflection; in this model the
    coordinate is imposed. The field says so, so the structure cannot be read as
    evidence that the mechanism self-deflects.

load_path_rule:
  ownership: "candidate-specific, owned here"
  maturity_progression: [HYPOTHESIS, SPATIALLY_INSTANTIATED, AUTHORITATIVE]
  maturity_owners: {HYPOTHESIS: s03, SPATIALLY_INSTANTIATED: s04b, AUTHORITATIVE: s06}
  derived_not_stored: >
    Per-element load components are DERIVED from the path and are NEVER stored.
    Storing them reintroduces SF-5.3 at the data level: a
    candidate-independent-looking field about a candidate-dependent fact.
  no_role_patterns: >
    No element acquires a reaction obligation from its type. "Shaft -> bearing"
    is unreachable by construction: an element carries a component only by
    appearing in a path traced from a declared applied load through THIS
    mechanism.

prohibited_decisions:
  - what: "any qualitative region used as a position"
    retirement_rows: [R-02, R-03, R-04]
  - what: "any metric magnitude"
  - what: "any axis PLACEMENT"
    rationale: "placement depends on feature envelopes that do not exist yet; BM-002 CHG-01"
  - what: "any feature shape or dimension"
  - what: "select a candidate"
    invariant: INV-007
  - what: "leave a body-pair meeting region unclassified"
  - what: "emit a generic block as an embodiment"
    retirement_row: R-09
  - what: "store a per-element load component"

structured_outputs:
  Body: [entity_id, instance_identity, role, created_by_stage]
  RigidGroup: [entity_id, body, members, is_default]
  Joint: [entity_id, joint_type, parent_group, child_group, dof, axis_direction, frame_ids]
  Interface: [entity_id, bodies, interaction_kind, nominal_status]
  MobilityExpectation: [entity_id, configuration, dispositions]
  # S-4: ordered_hops are Interface ids, and terminates_at names the external
  # ReactionSiteRequirement the load case is reacted at. A path that does not
  # close is OPEN and is recorded as such, never silently.
  LoadPath: [entity_id, load_case, candidate, ordered_hops, maturity, terminates_at]
  PhysicalInteraction: [entity_id, groups, effect, discharges_effect, at_interface, configurations]
  ConstraintRelation: [entity_id, retained_group, blocked_dofs, configurations, driver,
                       blocked_direction, provider_body, provider_reaction_site,
                       provider_site, maintaining_interaction, defeat_specification]
  AssemblyStep: [entity_id, order_index, body, access_side, activates, termination_strategy, path_kind, depends_on]
  FunctionalRegion: [entity_id, role, owning_bodies]
  Configuration: [entity_id, name, kind, bodies_present, expected_mobility]

assembly_step_rule:
  path_kind: [RIGID, DEFORMATION_RESOLVED]
  deformation_resolved_consequence: >
    A DEFORMATION_RESOLVED step forces NOT_VERIFIED, never PASS
    (ASM-BM-003-002). Rigid geometry cannot observe the deflection the path
    depends on.
  termination_strategy: [LATER_BODY_COVER, ROTATION, ELASTICITY]
  termination_rationale: >
    A rigid part installed by one straight translation always leaves the reverse
    direction open. Retention therefore needs one of exactly these three. BM-003
    burned three hinge topologies discovering this.
  direction_scope: >
    s03 fixes the ORDER and the ACCESS SIDE. Direction FEASIBILITY belongs to
    s04 (BM-002's forced +X insertion was an envelope comparison).

allowed_unresolved:
  - "every magnitude"
  - "axis placements"
  - "assembly direction feasibility"
  - "which of several admissible retention strategies is used, if more than one survives"
  - "allowable_travel on every compliant joint"

maturity_expectations:
  geometry: [TOPOLOGY, SYMBOLIC_SPATIAL_RELATIONS, FRAMES_AND_AXIS_DIRECTIONS]
  authority: "authoritative for topology and direction; nothing metric exists"

deterministic_exit_checks:
  - id: S03-C1
    claim_class: BOOKKEEPING
    check: "DOF totality: every STANDING rigid group, in every STANDING configuration OF ITS OWN BRANCH, has every DOF dispositioned exactly once by a STANDING MobilityExpectation"
    currentness: >
      Both sides are current. Withdrawn topology does not enlarge the domain, and
      a grid that lost standing does not satisfy it - a design may not keep
      credit for the mobility of a group it dropped.
    never_assurance: >
      The enumerator guarantees this. Passing it establishes nothing about the
      design and it contributes to no establishment claim. The engineering
      quantity is disposition completeness, which is REPORTED and not checked.
  - id: S03-C2
    claim_class: PROVENANCE_INTEGRITY
    check: "every BLOCKED_BY cell cites a ConstraintRelation that exists, carrying a direction, a provider, a defeat specification and a driver"
  - id: S03-C3
    claim_class: PROVENANCE_INTEGRITY
    check: "every IRRELEVANT_BECAUSE names a Scenario that resolves and that carries no load case"
    bounded: "scenario-level. Per-DOF load and actuation resolution is U-9's ENGINEERING CONSEQUENCE check"
  - id: S03-C4
    check: "the assembly precedence relation is acyclic"
  - id: S03-C5
    check: "every LoadCase has at least one LoadPath terminating at a declared reaction site"
  - id: S03-C6
    check: "every Interface has an interaction_kind"
  - id: S03-C7
    check: "every Obligation is owned by some body pair or compliant joint"
  - id: S03-C8
    check: "every retained body has a termination_strategy"
  - id: S03-C9
    check: "every compliant Joint declares mode, direction, required_travel, allowable_travel status, actuation, compliant_element, root_interface and activation_window"
  - id: S03-C10
    check: "the joint graph is simulation-complete: it can be projected into a multibody model without re-derivation"
  - id: S03-C11
    check: "no per-element load component is stored"
  - id: S03-C12
    check: "every FunctionalRegion has a role and at least one owning body"

next_stage_consumer_requirement:
  consumer: s04a
  needs: [joint_graph, configurations, body_roles, functional_region_roles, packaging_obligations, actor_reach_requirements]
  consumer_b: s04b
  needs_b: [total_dof_disposition_with_cited_premises, constraint_relations,
            assembly_steps_with_order_and_access_side, load_paths_as_hypotheses]

owner_revision_lifecycle:
  # UNIT C. AN UPSTREAM AUTHORING DEFECT IS REPAIRED BY ITS OWNER, and every
  # downstream realization and assessment that depended on the old fact is
  # rebuilt from current premises. Owner-revision exhaustion is not mechanism
  # infeasibility.
  principle: >
    check -> route -> revise -> rebuild -> re-check, bounded. The check is the
    feasibility responsibility answering again over current state; the
    routing is the OWNER the contract's finding classification names for
    each OWNER_REVISION code - s03a for topology and ownership, s03b for
    mobility, assembly, load and release; the revision is that pass revising
    the fact it authored; the rebuild is everything downstream of the revised
    fact realized again from current premises; the re-check is the same
    evaluator again. Nothing in the loop decides anything about the
    candidate: it applies the owners' patches and records what happened.
  trigger: >
    ONLY findings of class OWNER_REVISION on the branch's current
    FeasibilityDomainAssessments whose owner is s03a or s03b. A
    MechanicalFeasibilityAssessment status is never a trigger, nor is prose,
    nor a candidate's or a benchmark's identity. REPAIRABLE_S04 belongs to
    the s04 repair loop, DEFERRED_DOWNSTREAM to s05/s06, UNSUPPORTED to nobody
    - a capability limit is recorded, not retried - and REQUIRED_MINIMUM_ABSENT
    names a fact no revision may invent. An OWNER_REVISION finding owned by a
    later stage is reported unrouted and left as found.
  owner_reinvocation: >
    Each owner with a finding is put its OWNER REVISION CONTEXT: the typed
    findings - domain, code, the domain's note, and the records each was
    found on - the standing records of those premises the pass does not own,
    and the pass's own standing records for the branch. The pass restates its
    whole answer in its ordinary schema under the same ids; what differs is
    recorded as a revision and what does not is recorded as nothing. ONE
    INVOCATION PER OWNER PER ROUND, s03a before s03b; where s03a revised,
    s03b's single invocation also carries what changed above it.
  legal_revision_scope: >
    The owner may revise only facts it owns, and only where that preserves
    the candidate's architecture and the mechanism principle. s03a may revise
    a joint's free DOF, axis direction and frame, an interface's kind and
    feature, a configuration's basis, a functional region's role and owning
    bodies, and the open decisions; it may NOT add or remove a body, rigid
    group or joint, change what a body is, which bodies a group holds, a
    joint's type or which groups it connects, and a revision that would is
    refused whole as an ARCHITECTURE_ESCALATION. s03b may revise every fact
    of its relations, interactions, load paths, assembly steps and transition
    requirements, and the DOF disposition is re-derived from them. Neither
    may change the S02 principle or the candidate: a finding that cannot be
    resolved without that is declared ESCALATED by the owner and left open.
  how_a_revision_is_recorded: >
    Through the boundary's own operations and no others. A restated value
    that changed is SUPERSEDED with the round as its reason and the previous
    value kept; an unchanged value writes nothing; a restated record that had
    lost standing is INVALIDATED and re-created under a fresh revision id,
    because a supersession does not restore standing. Everything premised on
    a revised fact loses unqualified authority by ordinary propagation.
    Nothing is deleted; nothing is overwritten out of existence.
  what_a_revision_causes: >
    Where any revision landed, the branch downstream of it is REBUILT from
    current premises before it is checked again: s03b is re-authored where
    s03a revised; s04a and s04b are re-realized from the mechanism as it now
    stands - s04a's changed values superseded, s04b's realization retired
    whole and re-created whole under the branch's next generation - and the
    bounded s04 repair loop runs over that realization. A standing S04
    realization is never reused merely because its ids exist: it was reasoned
    from the mechanism as it stood before. A rebuild step that does not land
    ends the loop with no feasibility offered.
  bound: >
    At most N rounds per candidate (2 to begin with). A round whose findings
    are the findings of an earlier round OVER THE SAME BASIS - the same
    (domain, code, owner) over the same current revisions of the premises
    each was found on, never a free-text summary - is a CYCLE and ends the
    loop; the same code over a basis a revision changed is a different
    finding, and counts against the budget instead. One invocation per owner
    per round, taken whatever it says: NO FAVOURABLE RETRY - nothing asks
    twice and keeps the better answer, and nothing picks among answers.
  ending: >
    Every ending is evidence and none is a verdict. What is still owner-
    revisable when the loop ends - by cycle, by budget, by a refused or
    escalated revision, by an invocation that did not land, or with no
    provider offered - stays on the record as open obligations of a candidate
    that is exactly as feasible as its required minimum and its arguments say
    (Unit A): never INFEASIBLE by exhaustion, and never resolved by a hand
    that was not the owner's.

llm_role: >
  High for topology and strategy proposal. NONE for the DOF grid, in either half
  of it: the domain is enumerated mechanically from the joint graph, and each
  disposition is derived from a relation, a joint or an authored irrelevance the
  model wrote. The model is not asked to disposition cells and no response field
  accepts one - a per-cell answer cannot carry the premise the disposition needs.
knowledge_base_role: >
  Per capability: the standard constraint relations and the retention
  trichotomy. This is the checklist BM-001's human reviewer supplied by hand
  three times. The DOF disposition template is gone from this list because the
  disposition is no longer authored from a template.
