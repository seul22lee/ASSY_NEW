# STAGE 03 CONTRACT — topology, mobility and assembly strategy
#
# The stage carrying the most new responsibility. Geometry first appears here,
# and it is SYMBOLIC: frames, axis directions, sidedness. No magnitudes.

# U-2B (S-2): the two undefined hypothesis families are RETIRED.
# They were REQUIRED by this contract, defined by no contract, owned by no
# stage and produced by no code - the clearest case of a stage contract
# requiring a concept that did not exist. Replaced by the canonical
# progression PhysicalEffectObligation (s02, role level) ->
# PhysicalInteraction (s03). Not aliases: the old names named BODIES at a
# stage forbidden to decide topology, which is why they are not revived.
# The FAMILIES are defined now; PRODUCING them is S-4 / U-5.
