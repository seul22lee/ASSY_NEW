# CONTRACT_AUTHORITY - which file owns which semantic fact
#
# U-2B (S-2). Before this file the corpus distributed overlapping semantics
# across DESIGN_STATE_CONTRACT, ENTITY_FAMILY_AUDIT, STAGE_OWNERSHIP_MATRIX,
# the stage contracts and prompt prose, with no statement of which one wins.
# Reviewers reconciled ownership by hand, and the audit found they disagreed.
#
# The invariant this file exists to establish:
#
#     ONE SEMANTIC FACT HAS ONE AUTHORITATIVE DEFINITION.
#
# Everything else that mentions the same fact is a PROJECTION, and a structural
# test checks each projection against its source rather than asking a reader to.

schema_version: "0.1.0"
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml

sources_of_truth:

  entity_semantics:
    file: ver3/contracts/DESIGN_STATE_CONTRACT.yaml
    owns:
      - canonical family identity and purpose
      - owning stage per family
      - required and optional fields
      - authority class (family default and per-field override)
      - field-level extendability (which stage, which field)
      - reference targets and cardinality
      - spatial frame semantics
      - representational semantic dependencies
      - relation addressability
      - enum vocabularies belonging to a family

  stage_responsibility:
    file: ver3/contracts/STAGE_RESPONSIBILITY_CONTRACT.yaml
    owns:
      - stage responsibility
      - engineering questions
      - required reasoning-premise classes and their justification
      - permitted output semantics
      - prohibited decisions

  status_semantics:
    file: ver3/contracts/STATUS_SEMANTICS.yaml
    owns:
      - the four status constructs and their separation
      - execution status vocabulary
      - evaluation outcome vocabulary
      - forbidden collapses

  mutation_semantics:
    file: ver3/contracts/STAGE_PATCH_CONTRACT.yaml
    owns:
      - patch envelope
      - controlled operation semantics

  provenance_semantics:
    file: ver3/contracts/PROVENANCE_CONTRACT.yaml
    owns:
      - provenance record shape and method vocabulary

projections:

  - file: ver3/contracts/STAGE_OWNERSHIP_MATRIX.yaml
    projects: entity_semantics
    projects_what: "per-stage `owns` and `extends` lists"
    rule: >
      Derived from DESIGN_STATE_CONTRACT `owned_by` and `extendable_fields`.
      It may add prose about a stage's role; it may NOT disagree about who owns
      or who extends. Checked by CON-01 and CON-08.

  - file: ver3/contracts/ENTITY_FAMILY_AUDIT.yaml
    projects: entity_semantics
    projects_what: "per-family consumer analysis and status"
    rule: >
      A REVIEW RECORD, not an authority. Its `owning_stage` must agree with
      DESIGN_STATE_CONTRACT and is checked, but nothing may cite it to settle a
      semantic question. It was treated as an authority before S-2 and
      contributed to the ownership disagreements the audit found.

  - file: "ver3/assy_v3/stages/*.py (prompt text)"
    projects: entity_semantics
    projects_what: "explanation of fields to a model"
    rule: >
      A prompt may EXPLAIN a contract. A prompt may never BE the contract. A
      model-output field whose only semantic definition is prompt prose is a
      contract defect - checked by CON-09. Before S-2 at least two fields were
      defined nowhere else.

  # ------------------------------------------------------------ S-2 closure
  - file: "ver3/contracts/stages/*.yaml"
    projects: [entity_semantics, stage_responsibility]
    projects_what: "per-stage ownership, responsibility, and producer interface"
    rule: >
      A file named *_CONTRACT.yaml is NOT a semantic authority by default. Every
      semantic section declares an `authority_status.<section>.class`, and there
      is no ambiguous fourth state:

        CANONICAL_PROJECTION - repeats a fact owned elsewhere. Must name its
          source and must match it. Checked by CLOSURE-01 and CLOSURE-03.

        LEGACY_PRODUCER - describes what the CURRENT producer still emits, ahead
          of its scheduled migration. Must name its canonical replacement, its
          canonical source, a migration step, and
          `authoritative_for_canonical_semantics: false`. Checked by CLOSURE-02
          and CLOSURE-10.

        OPERATIONAL - non-semantic detail that defines no canonical meaning.

        RETIRED - kept only as a record of something withdrawn.

      This is the distinction the corpus lacked: canonical contract says what ASSY
      MEANS; legacy producer contract says what the code still EMITS until its
      step. Collapsing them would either falsify the producer or weaken the
      canonical semantics, and the migration schedule depends on neither.

# ------------------------------------------------------------ projection integrity
# A CANONICAL_PROJECTION must be MACHINE-CHECKABLE. Naming a source file alone
# said where to look and nothing about what to compare, so 24 sections were
# labelled canonical and only ownership was actually checked. A section that
# cannot carry this metadata is not a projection - it is operational prose, and
# classifying it honestly is preferred over inventing a transformation that makes
# a paraphrase "match".
projection_metadata_schema:
  canonical_source:
    file: "the canonical document"
    path: "the exact semantic fragment - a dotted path, or a declared derivation"
    relation: "one of the supported relations below"
    derived_as: "optional prose describing a derivation path"
  projected_key: "the key inside the section holding the projected value"
  projects: "what fact this projects, in one line"
supported_projection_relations:
  EXACT: "the projected value must equal the canonical value"
  SUBSET: "every projected item must exist in the canonical value"
  ORDERED_SUBSET: "as SUBSET, where order carries meaning"
  note: >
    Deliberately tiny. A larger transformation language would let a projection
    satisfy a test by being clever rather than by being the same fact.
non_binding_pointer:
  key: see_canonical
  requires: [file, path, binding]
  checked_by: [PROJ-05, META-06, META-07]
  meaning: >
    An OPERATIONAL section may point a reader at the canonical value. The pointer
    is `binding: false` and is never compared for equality - it is a courtesy, not
    an authority claim.
  but_not_unchecked: >
    NON-BINDING means "not semantically equal", not "pointer validity is
    unchecked". If a section claims a canonical value exists somewhere, that
    somewhere must resolve: the file exists, the path resolves, and any stage id
    in the path is a real canonical stage. A dangling pointer misdirects a reader
    as effectively as a wrong value.

stage_contract_status_vocabulary:
  CANONICAL_PROJECTION:
    # The declared requirement is the one actually enforced. It said `source`
    # while the validator reads a nested `canonical_source` with a fragment and a
    # relation - a schema that describes something other than what is checked is
    # the same defect this file exists to prevent, one level up.
    requires: [canonical_source, projected_key, projects]
    requires_nested:
      canonical_source: [file, path, relation]
    checked_by: [PROJ-01, PROJ-02, PROJ-03, PROJ-04, PROJ-05, PROJ-06,
                 CLOSURE-01, CLOSURE-03, CLOSURE-09]
    enforcement_note: >
      PROJ-01..06 establish projection integrity: the source file and fragment
      resolve, the relation is supported, the projection satisfies it, no
      unresolved canonical stage id is accepted, and prose cannot pass as an EXACT
      projection. CLOSURE-01/03/09 remain and cover ownership specifically.
  LEGACY_PRODUCER:
    requires: [describes, canonical_replacement, canonical_source, migration_step,
               authoritative_for_canonical_semantics]
    checked_by: [CLOSURE-02, CLOSURE-05, CLOSURE-10]
  OPERATIONAL:
    requires: [note]
    checked_by: [CLOSURE-07]
  RETIRED:
    requires: [note]
    checked_by: [CLOSURE-05]

duplication_rule: >
  Where a fact must appear in more than one file, the projection is checked
  against its source by a structural test. Manual agreement is not a mechanism:
  the audit found three files disagreeing about ownership while all three looked
  authoritative.

adding_a_family: >
  Editing DESIGN_STATE_CONTRACT (the family and its field semantics) plus the
  STAGE_OWNERSHIP_MATRIX projection line for its owner. Stage responsibility is
  edited only if the new family changes what a stage is FOR. No unrelated
  stage-pair whitelist needs touching, which is the sprawl risk the
  implementation plan records as R-1.
