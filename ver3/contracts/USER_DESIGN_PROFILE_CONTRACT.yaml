# USER DESIGN PROFILE — the two things a user tells us, kept apart
#
# S-7 / U-8. One file, two sections, and the split is the whole point.
#
#   design_constraints     what may be BUILT AT ALL
#   selection_preferences  which buildable thing is WANTED
#
# They are not two flavours of one "preference" list. A hard requirement bounds
# the design and can make a candidate ineligible; a preference can never do
# that, and a mechanism is not less feasible for being more complex than one
# somebody would rather have. Modelling both as preferences is what lets a
# stated wish quietly become an engineering verdict.

schema_version: "0.1.0"
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml
declared_by: "S-7 / U-8, substep S7-A."
ingester_status: >
  LIVE since the S7-B correction. `design_constraints` is read by s01
  (`ingest_design_constraints`), deterministically and without paraphrase;
  see S01_CONTRACT.constraint_ingress for the mechanism. The
  `selection_preferences` materialiser is still S7-C's and nothing reads
  that section today - which is what makes preference blindness a property
  of the code rather than a promise about it.

visibility:
  design_constraints: >
    AUTHORITATIVE FROM EARLY REQUIREMENT CAPTURE. Ingested at s01 as
    DesignConstraint, and standing in DesignState from that moment.
    EXISTENCE IS NOT VISIBILITY, and the earlier wording here conflated them: it
    said every stage may see them, which would have meant injecting a hard
    requirement into every consumer view. Visibility is
    RESPONSIBILITY-DRIVEN like everything else - a stage receives one when its
    declared reasoning requires the `design_constraint` role, or when a
    justified representational dependency reaches it, and not otherwise. Nothing
    is globally injected; that is what a context dump is.
  the_asymmetry: >
    A HARD REQUIREMENT MAY legitimately affect upstream engineering reasoning - a
    plastic-only design is a different design problem, and a stage that must
    satisfy it may need to know. A SELECTION PREFERENCE MUST NOT, ever. "May
    affect" is a permission that each responsibility exercises by declaring the
    role; "must not" is a prohibition enforced by no responsibility declaring the
    other role at all. The two are not symmetric and are not implemented the same
    way.
  selection_preferences: >
    INVISIBLE UNTIL SELECTION. No responsibility from s01 through `feasibility`
    receives one, and the enforcement is the input boundary rather than a
    sentence in a prompt: nothing before `selection` declares the
    `selection_preference` semantic role, so the consumer view cannot contain
    one. A stage told to ignore a preference has already seen it.
  falsifier: >
    A SelectionProfile appearing in any pre-selection ConsumerView is a contract
    failure and is tested as one.

ingestion:
  design_constraints: >
    DETERMINISTIC, AND LIVE. A profile that already says PLASTIC_ONLY is a
    structured fact, and handing it to a model to reinterpret would turn a
    stated requirement into an inference. The ingester maps declared kinds onto
    DesignConstraint and does not paraphrase. It maps only the kinds
    DESIGN_STATE_CONTRACT.DesignConstraint.kinds declares - the same authority
    the source channel uses - because being structured says a value was not
    inferred, not that it is one anything can act on. It also does not COMPLETE: a limit
    with no unit is carried as a limit with no unit, and the compliance record
    downstream says NOT_YET_EVALUABLE - the design not yet having said, rather
    than the ingester guessing what it meant.
  selection_preferences: >
    DETERMINISTIC, and materialised only at the selection boundary, as a
    SelectionProfile carrying its version and the hash of the source it came
    from - so a decision names the exact preferences it was made under and
    changing them reopens the choice without touching an engineering fact.

design_constraints:
  meaning: >
    A HARD requirement. Machine-evaluable ones carry parameters a check can read;
    human-evaluable ones are recorded and evaluated by a person.
  entry_shape:
    kind: "a declared constraint kind"
    statement: "what it requires, in the user's words"
    parameters: "structured values a check can read, where the kind has them"
    blocks_selection: "whether an unsatisfied instance stops a final choice. Default true"
  evaluation_rule: >
    A REQUIREMENT EXISTING IS NOT THE SAME AS ITS BEING EVALUABLE. Until the
    design has the fact a constraint is about, its compliance is
    NOT_YET_EVALUABLE - never SATISFIED and never VIOLATED. Absence of a material
    assignment is not "plastic only, satisfied"; it is the design not yet having
    said. A candidate may be ruled out early only when the constraint is
    evaluable at the current maturity AND incompatibility is established.
  example:
    - kind: MATERIAL_CLASS_ONLY
      statement: "every manufactured part must be plastic"
      parameters: {material_class: PLASTIC}
      blocks_selection: true
    - kind: MAX_OVERALL_DIMENSION
      statement: "it must fit through a standard doorway"
      parameters: {axis: ANY, limit: 760, unit: mm}
      blocks_selection: true
    - kind: PROHIBITED_ENERGY_SOURCE
      statement: "no external electrical power"
      parameters: {source: MAINS_ELECTRICAL}
      blocks_selection: true

selection_preferences:
  meaning: >
    What is WANTED among designs that already work. Ranked, never weighted into
    a single score: collapsing a trade-off into a number invents a decision the
    evidence does not contain.
  entry_shape:
    criterion: "what is being preferred over"
    objective: "MINIMIZE or MAXIMIZE"
    priority: "HIGH, MEDIUM or LOW - a tier, not a weight"
  comparison_rule: >
    Tiers are compared lexicographically and by dominance. Where one candidate
    dominates under the current tiers the system may say so deterministically;
    where none does, the trade-off stays a trade-off and a human resolves it.
  example:
    part_count: {objective: MINIMIZE, priority: HIGH}
    assembly_complexity: {objective: MINIMIZE, priority: HIGH}
    actuation_complexity: {objective: MINIMIZE, priority: MEDIUM}
    package_volume: {objective: MINIMIZE, priority: MEDIUM}
    maintainability: {objective: MAXIMIZE, priority: LOW}

not_in_this_file:
  - what: "a weighting that turns the tiers into one number"
    why: "a score is a decision, and the decision is a human's"
  - what: "a preference that makes a candidate ineligible"
    why: "that is a design constraint, and it belongs in the other section"
  - what: "a metric value"
    why: "metrics are computed from state, never stated by the user"
