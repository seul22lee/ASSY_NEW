schema_version: 0.1.0
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml
references:
- ver3/contracts/DESIGN_STATE_CONTRACT.yaml
- ver3/contracts/STAGE_OWNERSHIP_MATRIX.yaml
- ver3/contracts/GENERATED_ASSURANCE_PACKAGE_CONTRACT.yaml
audit_scope:
  families_audited: 58
  re_run_note: 'The family set grew from 32 to 37 by CONTRACT CHANGE (five families added to DESIGN_STATE_CONTRACT
    under docs/PIPELINE_IMPLEMENTATION_PROPOSAL.md rev 2: RigidGroup, LoadCase, LoadPath, FunctionalRegion,
    AssemblyStep). This audit was RE-RUN over the new set and asks the same consumer question of each.
    The audit itself still adds and deletes nothing, which is what families_added and families_deleted
    below record.

    '
  audit_blind_spot_closed: 'The first pass asked only "does each existing family have a consumer?" and
    declared its own scope so that it could not ask "is there engineering content with no family?". That
    blind spot hid three of the five families added above. Both questions are now in scope.

    '
  families_added: 0
  s4_growth_note: >
    Migration step S-4 added one family by CONTRACT CHANGE: ReactionSiteRequirement.
    The plan's M-7 recorded the gap - "Reaction sites do not exist as a type, so a
    load path cannot terminate outside the product" - and without it the world had
    to be modelled as a body, which it is not. As with the earlier growth recorded
    below, the audit itself still adds and deletes nothing.
  s2_growth_note: >
    Migration step S-2 (U-2B) added three families by CONTRACT CHANGE:
    ConstraintRelation, PhysicalEffectObligation and PhysicalInteraction. The
    first replaces the non-addressable blocked_by relation; the other two replace
    the two undefined hypothesis families, which a stage contract required and
    no contract defined. AT S-2, stated as a fact of that moment: no stage
    produced any of them, that being S-4/U-5's work, so this file recorded their
    canonical definition rather than their use. All three are produced today -
    the sentence is kept because it explains why the entries were written, and
    is dated so it cannot be read as a current claim. (S7-B correction)
    This file is a REVIEW RECORD and a projection, never an authority: see
    ver3/contracts/CONTRACT_AUTHORITY.yaml.
  s1_growth_note: >
    Migration step S-1 (U-2A) added three families by CONTRACT CHANGE:
    ReachResult, EliminationRecord and ReferenceScale. All three are engineering
    conclusions s04a already authored and held as bare attributes on the state
    object, with no identity, no owner and no provenance; nothing could read
    them. Giving them a family is what allowed the uncontrolled write path to be
    removed. As with the earlier growth recorded above, the audit itself still
    adds and deletes nothing - families_added records the audit's own additions.
  families_deleted: 0
  no_stage_contract_frozen_by_this_audit: true
summary:
  # S7-E: four families moved PROVISIONAL -> CORE. HumanDecisionInput and
  # SelectionDecision were declared ahead of their producers, which is this
  # contract's normal way of working, and both now have one. SelectionAdvisory
  # and SelectionConcern were open on one question - what a human does with a
  # review - and S7-E answered it: shown before the submission, considered after
  # the commitment, a premise of neither.
  CORE: 43
  PROVISIONAL: 12
  MERGE_CANDIDATE: 3
  UNSUPPORTED: 0
  note_on_zero_unsupported: 'No family is unproducible or unconsumable, so none is UNSUPPORTED. Two EXPRESSIVENESS
    GAPS were found (retention and assembly ordering, section 3), but those are missing relations between
    existing families, not families that cannot be supported. Recording a family as UNSUPPORTED to populate
    the category would be false.

    '
  note_on_window2_growth: 'Three families were added in Window 2 (Envelope, SweptVolume, SelectionDecision).
    The growth came from a producer/consumer audit finding that the s04 contract required the stage to
    create entities the representation could not express at all, not from an audit of existing families.

    '
families:
  SourceClause:
    owning_stage: s01
    first_downstream_consumer: s01
    consumer_note: Requirement creation cites clauses; s11 cites them again when stating scope.
    unique_responsibility: The only family holding verbatim source text with a locator.
    duplicates: none
    overlap_note: 'Overlaps Requirement, which also carries statement_verbatim and source_locator. They
      are distinguished by cardinality: a Requirement may derive from several clauses, and a clause may
      yield no requirement at all.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-01
    status: CORE
    obligation: 'Requirement.source_locator should become a typed reference to SourceClause IDs rather
      than an independent locator string, so the two cannot disagree about where a sentence is. Recorded,
      not applied.

      '
  Requirement:
    owning_stage: s01
    first_downstream_consumer: s02
    consumer_note: s02 derives Obligations; s08 plans against it; s11 evaluates it.
    unique_responsibility: A rank-1 source statement with its verification kind and observable.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-01
    - PKG-02
    - PKG-24
    status: CORE
  Freedom:
    owning_stage: s01
    first_downstream_consumer: s06
    consumer_note: 's06 is the first stage that can consume one: an underdetermined solve must record
      which Freedom it is resolving rather than silently picking.

      '
    unique_responsibility: A decision the SOURCE deliberately leaves open.
    duplicates: none
    overlap_note: 'Overlaps UnresolvedDecision. The boundary is provenance, not shape: a Freedom is a
      property OF THE SOURCE and is permanent; an UnresolvedDecision is a state OF THE RUN and is expected
      to close. A freedom the run has not yet consumed is legitimately both.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-03
    status: CORE
    why_not_merged: 'Merging would lose INV-014, which forbids a freedom becoming an assertion target.
      That prohibition is meaningless for an UnresolvedDecision, which is supposed to be resolved.

      '
  Ambiguity:
    owning_stage: s01
    first_downstream_consumer: s12
    consumer_note: 'No stage between s01 and s12 consumes it. s12 carries it out as a human question.
      This thin consumption is what makes it a merge candidate.

      '
    unique_responsibility: A source CONFLICT recorded rather than resolved.
    duplicates: UnresolvedDecision
    overlap_note: 'PKG-04 projects Ambiguity and UnresolvedDecision into the SAME package section, which
      is the clearest evidence of the overlap. Every field of Ambiguity has a counterpart: statement/decision,
      conflicting_clauses/alternatives, resolvable_when/why_open.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-04
    status: MERGE_CANDIDATE
    recommendation: 'Make Ambiguity a subtype of UnresolvedDecision distinguished by why_open = SOURCE_CONFLICT,
      with conflicting_clauses as a subtype field. This keeps the reporting distinction that matters -
      a source conflict cannot be resolved by the pipeline, only by new source or a human - while removing
      a near-identical family.

      '
    decision_required_before: s01 implementation (STAGE_PROGRESSION_CONTRACT step 1).
  Scenario:
    owning_stage: s01
    first_downstream_consumer: s08
    consumer_note: A VerificationPlanItem names the scenario it plans in; s11 needs it for scope.
    unique_responsibility: A declared operating scenario with its system boundary.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-05
    status: CORE
    why_it_earns_its_place: 'INV-009''s PASS scope has a scenario field. Without this family that field
      would be a free string, which is the R-20 defect.

      '
  Obligation:
    owning_stage: s02
    first_downstream_consumer: s03
    consumer_note: s03 shapes topology to satisfy it; s05 discharges it; s11 closes it.
    unique_responsibility: What must be physically true for a requirement to hold.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-06
    - PKG-15
    - PKG-28
    status: CORE
  Candidate:
    owning_stage: s02
    first_downstream_consumer: s03
    unique_responsibility: A persisting branch in the solution space.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-07
    status: CORE
    why_it_earns_its_place: 'INV-007 forbids a selected-candidate field. Candidates must persist as entities
      or there is nowhere for the unpursued branches to live.

      '
  AcceptanceContract:
    owning_stage: s02
    first_downstream_consumer: s08
    consumer_note: s08 plans verification consistent with it; s11 judges against it.
    unique_responsibility: What a specific CANDIDATE must satisfy to count as realized.
    duplicates: none
    overlap_note: 'Overlaps VerificationPlanItem: both are criteria fixed before results exist. They differ
      in subject and in time - this one is per-candidate and pre-geometry, the plan item is per-requirement
      and operational.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-08
    status: PROVISIONAL
    open_question: 'What happens when a VerificationPlanItem contradicts the AcceptanceContract of the
      candidate it tests? Nothing currently detects that, and it is exactly how a criterion gets quietly
      relaxed after the geometry exists.

      '
    decision_required_before: s08 implementation.
  Body:
    owning_stage: s03
    first_downstream_consumer: s04
    unique_responsibility: A rigid part, with metric pose and extent.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-10
    status: CORE
  Joint:
    owning_stage: s03
    first_downstream_consumer: s04
    consumer_note: s04 builds States and Transitions from joint coordinates.
    unique_responsibility: 'The KINEMATIC relation between two bodies: what motion is permitted.'
    duplicates: none
    overlap_note: 'The sharpest overlap in the topology group, examined in section 2.1. A journal bearing
      is a Joint AND an Interface. They remain distinct because each exists without the other: an idealised
      joint may have no modelled contact region, and two bolted faces are an Interface with no Joint.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-10
    status: CORE
    obligation: 'Joint needs an optional typed reference to the Interface(s) that realize it, so the same
      journal cannot be represented twice without the duplication being visible. Recorded, not applied.

      '
  Interface:
    owning_stage: s03
    first_downstream_consumer: s05
    consumer_note: s05 attaches the Features that make the interaction real.
    unique_responsibility: 'The REGION where two bodies meet, classified by interaction kind. This is
      the interaction-site family; no separate one exists.

      '
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-11
    status: CORE
    obligation: 'No direct Interface -> Feature link exists today; the association runs indirectly through
      Realization.participating_features. An unrealized Interface is therefore hard to detect. Recorded,
      not applied.

      '
  Configuration:
    owning_stage: s03
    first_downstream_consumer: s04
    unique_responsibility: Which bodies are PRESENT - an assembly configuration.
    duplicates: none
    overlap_note: 'Name collision with State, which is also ''a configuration''. They are orthogonal:
      Configuration says which bodies EXIST, State says where they ARE. A partially assembled product
      is a Configuration; mid-travel is a State. Both are needed and both are needed together to say ''at
      this stage of assembly, in this pose''.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-12
    status: CORE
    obligation: Document the Configuration/State distinction where both are defined.
  MobilityExpectation:
    owning_stage: s03
    first_downstream_consumer: s04
    consumer_note: s04's DOF_ABSENCE witnesses test exactly the forbidden set declared here.
    unique_responsibility: INTENDED and FORBIDDEN degrees of freedom, per configuration.
    duplicates: none
    overlap_note: 'Distinct from Constraint, which is algebraic and solved numerically by s06. This is
      topological and is tested kinematically.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-12
    status: CORE
    why_it_earns_its_place: 'An unintended DOF can only be checked against a DECLARED forbidden set. Without
      this family, unintended-DOF checking degenerates into "nothing obviously moved", which cannot fail.

      '
  State:
    owning_stage: s04
    first_downstream_consumer: s08
    unique_responsibility: A named pose of the mechanism, in unit-bearing joint coordinates.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-13
    status: CORE
  TransitionRequirement:
    owning_stage: s03
    first_downstream_consumer: s04
    consumer_note: >
      NOT YET CONSUMED. Unit 1 defines the vocabulary only: no responsibility
      requires it as a premise, no producer writes one, and a state containing
      none is complete. s04 is named because realizing a demanded state change -
      placing the joints and computing the motion - is what will first read it,
      and naming the stage that will read it is how this audit records a family
      defined ahead of its consumer.
    unique_responsibility: >
      WHAT STATE CHANGE MUST BE POSSIBLE, directed and symbolic: which relative
      joint motions a transition from one configuration to another needs, and
      which restraints it must release.
    duplicates: none
    duplicates_note: >
      Transition RECORDS a realized change between two States and carries the
      coordinates it moves. This DEMANDS that a change be possible and carries no
      realization at all. MobilityExpectation is configuration-local and says
      what holds WITHIN a state, not what must be possible between two.
      Configuration.distinguishing_basis says how two states are told apart,
      which is not a requirement that either can be reached from the other.
    required_for_assurance_package: false
    status: PROVISIONAL
    open_question: >
      Whether `required_relative_motions` and `released_constraints` are
      sufficient to state a demanded state change, or whether a producer writing
      them finds it needs something this unit deliberately left out - a trigger,
      an actuation route, or a condition under which the transition is required
      rather than merely possible. The vocabulary was kept minimal on purpose, so
      the answer comes from a producer trying to use it and not from guessing
      ahead of one.
    decision_required_before: >
      the s03b producer migration, which is the unit that first writes one: a
      family whose shape is still open must not acquire recorded instances, and a
      consumer must not be pointed at it until its shape is settled.
    s10_note: >
      Added at S-10 Unit 1 as semantic substrate. PROVISIONAL because nothing
      produces or consumes it yet; the migration that gives it a producer is a
      later unit.

  Transition:
    owning_stage: s04
    first_downstream_consumer: s08
    unique_responsibility: A path between two States, with DECLARED sampling.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-13
    status: CORE
    why_it_earns_its_place: 'R-07: a constant offset between endpoints is not a motion model. The path
      and its sampling must be an entity or the claim rests on two poses.

      '
  Witness:
    owning_stage:
    - s04
    - s09
    first_downstream_consumer: s11
    consumer_note: s11 cites witnesses when evaluating; s10 reconciles them with evidence.
    unique_responsibility: An executable demonstration that something holds.
    duplicates: EvidenceItem
    overlap_note: 'Examined in section 2.2. Both carry an outcome, a fidelity and artifacts. The defensible
      distinction is planned-ness: a Witness is produced during DESIGN, before any verification plan exists;
      an EvidenceItem answers a VerificationPlanItem. That distinction holds for s04''s witnesses and
      collapses entirely for s09''s.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-14
    status: MERGE_CANDIDATE
    recommendation: 'Restrict Witness ownership to s04 - design-time demonstrations that precede any plan
      - and let s09 produce EvidenceItem only, with EvidenceItem gaining a typed reference to any Witness
      it re-executes. This removes the duplicate without losing s04''s ability to demonstrate mobility
      before s08 exists.

      '
    also_fixes: The dual-ownership defect in section 2.4.
    decision_required_before: s04 implementation.
  Feature:
    owning_stage: s05
    first_downstream_consumer: s07
    unique_responsibility: Named geometry ON A BODY that participates in an interaction.
    duplicates: none
    overlap_note: 'Body-level, where Interface is pair-level. The same physical chamfer is one Feature
      on one body; the fit it forms with another body is one Interface.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-15
    status: CORE
  Realization:
    owning_stage: s05
    first_downstream_consumer: s08
    consumer_note: s08 plans against its verification_predicate; s11 closes the obligation.
    unique_responsibility: The embodiment that DISCHARGES an obligation, with its predicate.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-15
    status: CORE
    why_it_earns_its_place: 'INV-008: an obligation is never discharged by a label. This family is the
      link that makes discharge checkable, and it is where retention is currently expressed (section 3.1).

      '
  KinematicRealization:
    owning_stage: s05
    first_downstream_consumer: s06
    consumer_note: s06's entry gate refuses a branch whose declared relations nothing embodies;
      s07 builds only what the gate admitted.
    unique_responsibility: WHICH s05 GEOMETRY EMBODIES ONE UPSTREAM KINEMATIC RELATION - a Joint
      or a ConstraintRelation - and nothing else.
    duplicates: none
    required_for_assurance_package: true
    package_items: []
    status: CORE
    why_it_earns_its_place: 'A joint_type label alone is inert (INV-008), and so is a blocked_dofs
      list. Realization was inferred before this family existed: from a feature being placed at a
      joint, then from its axis as well, and for a restraint from whether a body carried a feature
      whose kind was spelled STOP, SHOULDER or KEEPER. Each is a coincidence a design can satisfy
      without embodying anything - a keeper on a hinge axis permits no rotation, and a feature named
      STOP restrains nothing by being named. This family makes the claim declared and therefore
      checkable. It is NOT Realization, which means obligation discharge alone; one family carrying
      both subjects could not be read without asking which one a record meant.

      '
  Parameter:
    owning_stage: s05
    first_downstream_consumer: s06
    unique_responsibility: A named quantity with a MANDATORY unit.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-16
    - PKG-18
    status: CORE
  Constraint:
    owning_stage: s05
    first_downstream_consumer: s06
    unique_responsibility: An algebraic relation the parameters must satisfy.
    duplicates: none
    overlap_note: 'Distinct from MobilityExpectation (topological) and from Interface (spatial). This
      one is numeric and is what s06 actually solves.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-16
    - PKG-18
    status: CORE
  # ConstructionStatement: RETIRED in Unit G; construction is Feature.construction.

  GeometrySignature:
    owning_stage: s07
    first_downstream_consumer: s09
    consumer_note: Evidence is only interpretable against the geometry it was measured on.
    unique_responsibility: A deterministic semantic description of the built geometry.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-19
    status: PROVISIONAL
    open_question: 'This is the one family that does not denote a real-world THING. It describes the whole
      model, which sits awkwardly with INV-001''s one-entity-per-thing framing, and it may belong in the
      run record beside ToolRunRecord rather than in DesignState.

      '
    argument_for_keeping_it_here: 'It must be referenced by EvidenceItem and by RequirementEvaluation
      scope, and cross-referencing DesignState to the run record for something that central would be worse
      than the awkwardness.

      '
    decision_required_before: s07 implementation.
  VerificationPlanItem:
    owning_stage: s08
    first_downstream_consumer: s09
    unique_responsibility: 'The plan: requirement x criterion x scenario x observable x fidelity, fixed
      BEFORE execution.

      '
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-20
    - PKG-23
    status: CORE
    why_it_earns_its_place: 'AL-04: a criterion created after the result is known is not a criterion.
      Ownership by s08, strictly before s09 executes, is what makes the plan a prediction.

      '
  NegativeControl:
    owning_stage:
    - s08
    - s09
    first_downstream_consumer: s10
    consumer_note: s10 judges control adequacy; s11 may not PASS without one.
    unique_responsibility: A deliberate mutation and whether its validator DETECTED it.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-21
    status: PROVISIONAL
    open_question: 'Dual ownership (section 2.4). s08 designs the mutation and s09 measures detection,
      which is one entity created once and extended once - not two creations. The matrix currently lets
      both CREATE it.

      '
    recommendation: 'owns: [s08]; extends: [s09].'
    decision_required_before: s08 implementation.
  EvidenceItem:
    owning_stage: s09
    first_downstream_consumer: s10
    unique_responsibility: The measured outcome of a plan item, with fidelity and contact resolution.
    duplicates: Witness
    overlap_note: See Witness. The recommendation resolves it in this family's favour.
    required_for_assurance_package: true
    package_items:
    - PKG-22
    - PKG-23
    - PKG-24
    - PKG-25
    status: CORE
  RequirementEvaluation:
    owning_stage: s11
    first_downstream_consumer: s12
    unique_responsibility: The per-requirement verdict, with its six-field scope block.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-26
    - PKG-28
    status: CORE
  ExcludedClaim:
    owning_stage: s11
    first_downstream_consumer: s12
    consumer_note: Consumed by the package projection and carried to human review.
    unique_responsibility: A property the evidence does NOT establish, named explicitly.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-27
    status: CORE
    why_it_earns_its_place: 'Silence is not exclusion. Without this family, "we did not check strength"
      and "strength is fine" look identical in the output - which is the failure BM-002''s REQ-003 UNSUPPORTED
      position exists to prevent.

      '
  Assumption:
    owning_stage: any
    first_downstream_consumer: s11
    consumer_note: s11 must scope a PASS by the assumptions it rests on; s12 attributes failures to them.
    unique_responsibility: An inferred fact the source did not state.
    duplicates: none
    overlap_note: 'Distinct from Freedom: a Freedom is openness the source INTENDED; an Assumption is
      a gap the pipeline FILLED. Conflating them would let a filled gap inherit the source''s authority.

      '
    required_for_assurance_package: true
    package_items:
    - PKG-02
    status: CORE
  UnresolvedDecision:
    owning_stage: any
    first_downstream_consumer: s12
    unique_responsibility: A recorded openness in the RUN.
    duplicates: none
    overlap_note: See Freedom and Ambiguity.
    required_for_assurance_package: true
    package_items:
    - PKG-04
    - PKG-18
    status: CORE
  RejectedAlternative:
    owning_stage: any
    first_downstream_consumer: s12
    consumer_note: Consumed by the package projection; s12 shows it in revision history.
    unique_responsibility: A branch that was considered and dropped, with a reason KIND.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-09
    - PKG-30
    status: CORE
    why_it_earns_its_place: 'INV-011: rejection for absence-from-library is not infeasibility. The reason_kind
      enumeration only has somewhere to live if rejections are entities.

      '
  FailureProvenance:
    owning_stage: s12
    first_downstream_consumer: s12
    consumer_note: 'Terminal. Its consumer is the assurance package projection, which is the declared
      sufficiency consumer for s12.

      '
    unique_responsibility: A failure routed to the decision and stage that own it.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-29
    - PKG-30
    status: CORE
  HumanReviewQuestion:
    owning_stage: s12
    first_downstream_consumer: s12
    consumer_note: Terminal; consumed by the projection and by the human.
    unique_responsibility: A question only a human can settle.
    duplicates: none
    required_for_assurance_package: true
    package_items:
    - PKG-31
    status: CORE
    why_it_earns_its_place: 'The pipeline never self-approves. Questions must survive to the end as entities,
      or approval becomes the absence of recorded doubt.

      '
  Actor:
    owning_stage: s01
    first_downstream_consumer: s02
    unique_responsibility: 'A participant outside the product, and what it must reach. Nothing else carries
      reachability as an obligation rather than an assumption.

      '
    duplicates: none
    duplicates_note: Scenario names which actors participate; Actor says what each must reach.
    required_for_assurance_package: false
    package_debt: not projected today; a reviewer needs actor reach to read an access claim
    status: CORE
    evidence: 'Found by the first execution of s01: S01_CONTRACT creates Actor and DESIGN_STATE_CONTRACT
      had no such family, so the patch was rejected as UNKNOWN_FAMILY.

      '
  RigidGroup:
    owning_stage: s03
    first_downstream_consumer: s04
    unique_responsibility: 'A maximal rigid sub-region of a Body. Nothing else can say that a part is
      not rigid, which is what makes a DOF disposition well-defined for a compliant part and a deflected
      assembly configuration a POSE.

      '
    duplicates: none
    duplicates_note: Body is a manufactured part; RigidGroup is a rigidity region within one.
    required_for_assurance_package: false
    package_debt: 'NOT projected by GENERATED_ASSURANCE_PACKAGE_CONTRACT today. It should be: a reviewer
      needs load paths, functional regions and rigidity regions to read the design. Expanding the package
      contract is out of scope for a RED closure and is recorded here as a debt.

      '
    status: CORE
    evidence: 'BM-001-02 describes its own compliant assembly state as "a rigid inboard translation of
      the tab region ... conserves volume exactly". Without this family that sentence has no typed home.

      '
  LoadCase:
    owning_stage: s02
    first_downstream_consumer: s03
    unique_responsibility: 'An applied load implied by a scenario, candidate-independent. Nothing else
      can state what the world does to the product before a mechanism exists.

      '
    duplicates: none
    duplicates_note: Scenario carries the operating context; LoadCase carries what is applied within it.
    required_for_assurance_package: false
    package_debt: 'NOT projected by GENERATED_ASSURANCE_PACKAGE_CONTRACT today. It should be: a reviewer
      needs load paths, functional regions and rigidity regions to read the design. Expanding the package
      contract is out of scope for a RED closure and is recorded here as a debt.

      '
    status: CORE
    evidence: 'NRM-BM-002-006 quantifies over "every element that carries a transverse or radial load
      in the declared operating scenario". Without this family the domain of that statement is uncomputable
      and s03 assigns supports by joint type, which is R-10.

      '
  LoadPath:
    owning_stage: s03
    first_downstream_consumer: s04
    unique_responsibility: 'How one LoadCase reaches a reaction site through ONE candidate. Element load
      components are DERIVED from it and never stored, which is what keeps SF-5.3 out of the data model.

      '
    duplicates: none
    duplicates_note: Interface is a meeting region; LoadPath is an ordered traversal of them.
    required_for_assurance_package: false
    package_debt: 'NOT projected by GENERATED_ASSURANCE_PACKAGE_CONTRACT today. It should be: a reviewer
      needs load paths, functional regions and rigidity regions to read the design. Expanding the package
      contract is out of scope for a RED closure and is recorded here as a debt.

      '
    status: CORE
    evidence: 'BM-002 wrote this graph by hand in its rationale section 8, and CHG-02 shows a path that
      was topologically sound and geometrically impossible.

      '
  FunctionalRegion:
    owning_stage: s03
    first_downstream_consumer: s04
    unique_responsibility: 'A volume the design PROMISES - access, support, keep-out, aperture - as distinct
      from a volume it happens to occupy.

      '
    duplicates: none
    duplicates_note: Interface is where bodies meet; a functional region is where they must not, or where
      a user or payload must reach.
    required_for_assurance_package: false
    package_debt: 'NOT projected by GENERATED_ASSURANCE_PACKAGE_CONTRACT today. It should be: a reviewer
      needs load paths, functional regions and rigidity regions to read the design. Expanding the package
      contract is out of scope for a RED closure and is recorded here as a debt.

      '
    status: CORE
    evidence: 'BM-001-02''s declared 84 mm access was violated by a Stage-05 feature. The Oracle already
      required declared_usable_access_region at s04.

      '
  AssemblyStep:
    owning_stage: s03
    first_downstream_consumer: s04
    unique_responsibility: 'One installation operation with its order, access side, activated relations,
      termination strategy and path kind. Subsumes the precedes(Configuration, Configuration) relation
      recorded as GAP-02.

      '
    duplicates: Configuration
    required_for_assurance_package: false
    status: MERGE_CANDIDATE
    recommendation: 'Keep both. Configuration records WHAT is present; AssemblyStep records HOW it got
      there, in what order, through which access side, and with which termination strategy. A merge would
      force ordering and access information onto a family whose consumers do not need it. Revisit if s04
      finds it is reading only one of the two.

      '
    decision_required_before: s03 implementation
    evidence: 'BM-002''s nine-step assembly has a genuinely forced order; BM-003 R4 burned three hinge
      topologies before the retention-termination strategy was treated as a planning input rather than
      a discovery.

      '
  Envelope:
    owning_stage: s04
    first_downstream_consumer: s04
    consumer_note: s04b places bodies and sweeps them; it cannot do either without an extent.
    unique_responsibility: The only family holding a body's spatial extent before features exist.
    duplicates: none
    overlap_note: Overlaps SweptVolume, which is occupancy over a motion rather than a static extent.
      An Envelope is a property of a body; a SweptVolume is a property of a transition.
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: 'Does a PROVISIONAL extent that no feature has yet justified belong in the assurance
      package at all, or only once s05 has given it a feature basis? Publishing it early is how a packaging
      guess acquires the authority of a dimension.

      '
    decision_required_before: s05 implementation.
    package_debt: 'Added in Window 2 and not yet projected by GENERATED_ASSURANCE_PACKAGE_CONTRACT. Recorded
      as debt rather than papered over with an invented package id.

      '
  SweptVolume:
    owning_stage: s04
    first_downstream_consumer: s04
    consumer_note: The occupancy result that clearance and assembly-path checks read.
    unique_responsibility: The only family holding occupancy over a transition, with its sampling declared.
    duplicates: none
    overlap_note: Overlaps Envelope as above, and Witness, which records that a check was run rather than
      what the motion occupied.
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: 'At what fidelity does a swept occupancy stop being conservative? A coarse hull is
      safe for no-overlap and useless for overlap, and nothing yet records which way a given result was
      used.

      '
    decision_required_before: s08 implementation.
    package_debt: 'Added in Window 2 and not yet projected by GENERATED_ASSURANCE_PACKAGE_CONTRACT. Recorded
      as debt rather than papered over with an invented package id.

      '
  DesignConstraint:
    owning_stage: s01
    first_downstream_consumer: s02
    consumer_note: >
      A hard requirement bounds what may be built, so it is a demand on the design from the moment the design has one.
    unique_responsibility: >
      A hard requirement on the design, held apart from a preference so that what may be built is never decided by what is wanted.
    duplicates: none
    overlap_note: >
      Overlaps Requirement, which is a source statement carried verbatim. A DesignConstraint may derive from one and is machine-evaluable where a Requirement need not be.
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: >
      PRODUCED. The S7-B correction added the deterministic ingress: s01 maps a
      user design profile's `design_constraints` section onto this family
      without paraphrase, and `feasibility` evaluates each one. What is open is
      the reach of the channel, not the producer - a hard requirement stated
      only in the request prose is not ingested, because reading it out of prose
      would be the inference this family exists to avoid.
    decision_required_before: "a structured channel for source-stated hard requirements, if one is wanted."
  FeasibilityDomainAssessment:
    owning_stage: feasibility
    first_downstream_consumer: s05
    consumer_note: >
      One domain's verdict for one candidate. Eligibility rests on all of them,
      and everything after the choice embodies the chosen candidate.
    unique_responsibility: >
      The DOMAIN is the unit of dependency: a motion verdict and a load verdict
      rest on different facts, and one record for all nine could carry only the
      union.
    duplicates: none
    overlap_note: >
      Overlaps MechanicalFeasibilityAssessment, which AGGREGATES these into one
      eligibility answer and holds no independent domain status of its own.
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: >
      Declared and produced at S7-B. What is open is re-evaluation when new
      evidence arrives, which is S7-F.
    decision_required_before: "S7-F implementation."
  HardRequirementCompliance:
    owning_stage: feasibility
    first_downstream_consumer: s05
    consumer_note: >
      Whether a candidate satisfies a hard requirement decides whether it may be chosen at all, and everything after the choice embodies the chosen one.
    unique_responsibility: >
      Whether one candidate satisfies one hard requirement, at the maturity the evidence has now.
    duplicates: none
    overlap_note: >
      Overlaps MechanicalFeasibilityAssessment, which asks whether the mechanism can work at all. A violated requirement is not a broken mechanism, and the two are kept apart for exactly that reason.
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: >
      Declared and produced at S7-B. What is open is re-evaluation when new
      evidence arrives, which is S7-F.
    decision_required_before: "S7-F implementation."
  MechanicalFeasibilityAssessment:
    owning_stage: feasibility
    first_downstream_consumer: s05
    consumer_note: >
      Eligibility decides the population a choice may act on, and everything after the choice embodies the chosen candidate.
    unique_responsibility: >
      Whether one candidate could work on the engineering evidence established so far.
    duplicates: none
    overlap_note: >
      Overlaps EliminationRecord, which is s04's LOCAL geometric finding. The finding is INPUT to this; this is the verdict on eligibility taken from the whole picture.
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: >
      Declared and produced at S7-B. What is open is re-evaluation when new
      evidence arrives, which is S7-F.
    decision_required_before: "S7-F implementation."
  SelectionProfile:
    owning_stage: selection
    first_downstream_consumer: s05
    consumer_note: >
      A decision names the profile version it was made under, so the profile outlives the moment of choosing.
    unique_responsibility: >
      The user's ranked preferences, versioned, and visible nowhere before a choice is made.
    duplicates: none
    overlap_note: >
      none
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: >
      Declared and produced at S7-C. What is open is the deterministic
      comparison's own reopening when new evidence ARRIVES rather than changes,
      which is S7-F.
    decision_required_before: "S7-F implementation."
  CandidateComparison:
    owning_stage: selection
    first_downstream_consumer: s05
    consumer_note: >
      The deterministic ground of a choice, carried with the choice.
    unique_responsibility: >
      Deterministic metrics over the eligible candidates, computed before anything is asked of a model.
    duplicates: none
    overlap_note: >
      none
    required_for_assurance_package: false
    package_items: []
    status: PROVISIONAL
    open_question: >
      Declared and produced at S7-C. What is open is the deterministic
      comparison's own reopening when new evidence ARRIVES rather than changes,
      which is S7-F.
    decision_required_before: "S7-F implementation."
  SelectionAdvisory:
    owning_stage: selection
    first_downstream_consumer: s05
    consumer_note: >
      Recorded because a human reviewed it. Advisory, never a premise.
    unique_responsibility: >
      A reviewer's opinion on an already-eligible field of candidates.
    duplicates: none
    overlap_note: >
      Overlaps SelectionConcern, which is one raised issue rather than a recommendation over the field.
    required_for_assurance_package: false
    package_items: []
    status: CORE
    open_question: >
      Declared and produced at S7-D; what a human does with it was answered at
      S7-E. It is inside the review a person decides from - so changing it before
      they submit forces a re-review - and it is recorded on the commitment as
      CONSIDERED material, never as a premise, so rewording it afterwards
      disturbs nothing. Nothing about this family is open.
    decision_required_before: none.
  SelectionConcern:
    owning_stage: selection
    first_downstream_consumer: s05
    consumer_note: >
      A concern raised for a human to weigh, carried with its evidence status.
    unique_responsibility: >
      One decision-critical concern the metrics and the preferences do not represent.
    duplicates: none
    overlap_note: >
      Overlaps SelectionAdvisory, which carries the recommendation this concern qualifies.
    required_for_assurance_package: false
    package_items: []
    status: CORE
    open_question: >
      Declared and produced at S7-D; what a human does with it was answered at
      S7-E. It is inside the review a person decides from - so changing it before
      they submit forces a re-review - and it is recorded on the commitment as
      CONSIDERED material, never as a premise, so rewording it afterwards
      disturbs nothing. Nothing about this family is open.
    decision_required_before: none.
  HumanDecisionInput:
    owning_stage: selection
    first_downstream_consumer: s05
    consumer_note: >
      What the person submitted, and what they were shown when they submitted it.
    unique_responsibility: >
      A human's submitted request at the decision screen, with the premise digest they saw.
    duplicates: none
    overlap_note: >
      Overlaps SelectionDecision, which is what a deterministic writer commits after re-checking the premises. The input is a request; the decision is the commitment.
    required_for_assurance_package: false
    package_items: []
    status: CORE
    open_question: >
      Declared and produced at S7-E. The `selection_human_review` pass assembles
      the snapshot and the submission records the digest of exactly it; nothing
      here is open. What a later step does with a KEEP_UNRESOLVED or a
      REQUEST_MORE_EVIDENCE - reopening, re-running evidence - is S7-F.
    decision_required_before: "S7-F lifecycle work."
  SelectionDecision:
    # S-7 / U-8: owner moved off s04. s04 authors spatial evidence and does not
    # choose; the responsibility that chooses is `selection`, and it runs after
    # s04 rather than between its two passes.
    owning_stage: selection
    first_downstream_consumer: s05
    consumer_note: Everything after the decision embodies one candidate; that choice has to be a
      recorded fact with its evidence, its profile version and the human who made it.
    unique_responsibility: The only family recording which candidate was retained and what permitted it.
    duplicates: none
    overlap_note: 'Overlaps UnresolvedDecision only where that family''s own preconditions hold. S7-E
      separated three things one word was carrying: TRADEOFF_UNRESOLVED is a CandidateComparison outcome,
      KEEP_UNRESOLVED is a HumanDecisionInput action, and a generic UnresolvedDecision requires typed
      kept_open_by evidence that a human declining to commit does not create. A tie with no discriminating
      evidence is a comparison outcome and is not a SelectionDecision; it is not automatically an
      UnresolvedDecision either.'
    required_for_assurance_package: false
    package_items: []
    status: CORE
    open_question: >
      Produced at S7-E by the `selection_decision` pass, and only from a human
      SELECT whose review the writer recomputed. What remains open is what the
      pipeline does when a human keeps the choice open: every later stage embodies
      one candidate, and whether it may proceed with several retained candidates
      or must stop is S7-F lifecycle work rather than a property of this family.
      (S7-A: reworded off "the gate", which no longer names anything. S7-E: the
      producer is live and the openness is narrowed to what it actually is.)
    decision_required_before: s05 implementation.
    package_debt: 'Added in Window 2 and not yet projected by GENERATED_ASSURANCE_PACKAGE_CONTRACT. Recorded
      as debt rather than papered over with an invented package id.

      '
  # ------------------------------------------------------------- S-1 (U-2A)
  ReachResult:
    owning_stage: s04
    first_downstream_consumer: s04
    unique_responsibility: >
      Whether an actor can reach a target, and from which side. A conclusion
      ABOUT an arrangement, not a property of any one entity in it, which is why
      it cannot live on a Body or a FunctionalRegion.
    duplicates: none
    duplicates_note: >
      FunctionalRegion says a volume is promised. This says an actor can get to
      it in the arrangement s04a produced.
    required_for_assurance_package: false
    status: CORE
    s1_note: >
      Held as state.s04a_reach before S-1: no entity, no id, no provenance, and
      no check could read it.
  EliminationRecord:
    owning_stage: s04
    first_downstream_consumer: s04
    unique_responsibility: >
      Whether s04a eliminated the candidate it ran on, and the geometric reason.
    duplicates: none
    duplicates_note: >
      SelectionDecision records which candidate a human CHOSE. This records that
      s04a found a geometric ground against one, which is a different act by a
      different responsibility and happens earlier: it is INPUT to eligibility,
      not a verdict on it.
    required_for_assurance_package: false
    status: CORE
    s1_note: >
      Held as state.s04a_elimination before S-1. Recording an elimination is not
      selection; what acts on it is the `feasibility` responsibility, and the
      choice itself is `selection`'s. (S7-A: it used to say "the gate that would
      act on it", and no gate is coming.)
  ReferenceScale:
    owning_stage: s04
    first_downstream_consumer: s04
    unique_responsibility: >
      The basis in which every s04 spatial value is expressed. A coordinate has
      no meaning without it, so it is a representational premise of every s04
      spatial commitment rather than a value of its own.
    duplicates: none
    duplicates_note: >
      Parameter carries a value with a unit. This carries the basis the values
      are expressed in, including the honest case of a relative basis with no
      absolute anchor at all.
    required_for_assurance_package: false
    status: CORE
    s1_note: >
      Held as state.s04a_scale before S-1. It is now the recorded premise of the
      spatial commitments that depend on it, so withdrawing it costs them their
      unqualified authority (FA-5).

  # ------------------------------------------------------------- S-2 (U-2B)
  ConstraintRelation:
    owning_stage: s03
    first_downstream_consumer: s03
    unique_responsibility: >
      What constrains a rigid group, in which direction and configurations, and
      what provides it - as an ADDRESSABLE entity, so a mobility disposition can
      cite it and the citation resolves.
    duplicates: none
    duplicates_note: >
      Joint constrains by kinematic type. This records a specific constraint on a
      specific group with a provider and a defeat condition, which a joint type
      alone cannot express.
    required_for_assurance_package: false
    status: CORE
    s2_note: "Replaces the blocked_by typed relation, which had no identity."
  ReactionSiteRequirement:
    owning_stage: s02
    first_downstream_consumer: s03
    unique_responsibility: >
      Where a reaction must ultimately be available, at role level, typed EXTERNAL
      or INTERNAL from the scenario's declared system boundary.
    duplicates: none
    duplicates_note: >
      LoadCase says what the world does and on which role. This says where the
      reaction it names is allowed to be taken, and whether that place is outside
      the product. LoadPath is the candidate-specific route to it. Three different
      facts, three owners.
    required_for_assurance_package: false
    status: CORE
  PhysicalEffectObligation:
    owning_stage: s02
    first_downstream_consumer: s03
    unique_responsibility: >
      What physical effect must occur between which ROLES, stated without naming
      a mechanism.
    duplicates: none
    duplicates_note: >
      Obligation says what must be true. This says what must physically happen,
      between what, and is the premise topology synthesis was missing.
    required_for_assurance_package: false
    status: CORE
    s2_note: "Replaces the retired body-level hypothesis, which named bodies at a stage forbidden to decide them."
  PhysicalInteraction:
    owning_stage: s03
    first_downstream_consumer: s03
    unique_responsibility: >
      What physically transmits a required effect between two rigid groups. A
      joint CONSTRAINS; an interaction TRANSMITS.
    duplicates: none
    duplicates_note: >
      Interface is where bodies meet. This is what passes through that meeting,
      and which effect obligation it discharges.
    required_for_assurance_package: false
    status: CORE
    s2_note: "Replaces the retired interaction-level hypothesis, which no contract defined."

overlap_analysis:
- id: OV-01
  group:
  - Joint
  - Interface
  - Feature
  - Constraint
  - MobilityExpectation
  question: Do the topology families denote the same thing more than once?
  finding: "No. They are separated by WHAT THEY CONSTRAIN, and each exists without the others:\n  Joint\
    \               permitted MOTION between two bodies (kinematic)\n  Interface           the REGION\
    \ where two bodies meet (spatial, pair-level)\n  Feature             the GEOMETRY on one body (spatial,\
    \ body-level)\n  Constraint          a numeric RELATION among parameters (algebraic)\n  MobilityExpectation\
    \ intended and forbidden DOF per configuration (topological)\nAn idealised joint may have no modelled\
    \ region; two bolted faces are an Interface with no Joint; a datum Feature may participate in no interaction.\n"
  residual_risk: 'A journal bearing is legitimately a Joint and an Interface. Nothing today links them,
    so the same physical bearing could be represented twice without the duplication being detectable.

    '
  action: Recorded as an obligation on Joint and on Interface. No merge.
- id: OV-02
  group:
  - Witness
  - EvidenceItem
  question: Are demonstrations and evidence records the same family?
  finding: 'Partly. The distinction is planned-ness, and it holds only for s04. An s04 witness precedes
    any verification plan, so it cannot be an EvidenceItem - there is no VerificationPlanItem for it to
    answer. An s09 witness is produced during plan execution and is an EvidenceItem in all but name.

    '
  action: 'MERGE_CANDIDATE. Recommendation: Witness owned by s04 only; s09 produces EvidenceItem, which
    may cite a Witness it re-executed.

    '
- id: OV-03
  group:
  - Freedom
  - Ambiguity
  - Assumption
  - UnresolvedDecision
  question: Four families for openness. Are all four needed?
  finding: "Three are. They differ in ORIGIN, which determines who can close them:\n  Freedom        \
    \    the source left it open        -> may never be closed by assertion (INV-014)\n  Assumption  \
    \       the pipeline filled a gap      -> closed by evidence or by the source\n  UnresolvedDecision\
    \ the run has not decided yet    -> closed by a later stage\n  Ambiguity          the source CONTRADICTS\
    \ itself  -> closable only by new source or a human\nAmbiguity's closure rule is a special case of\
    \ UnresolvedDecision's, and PKG-04 already projects the two into one section.\n"
  action: Ambiguity -> MERGE_CANDIDATE as a subtype. The other three stay.
- id: OV-04
  group:
  - NegativeControl
  - Witness
  question: Should a family have two owning stages?
  finding: 'No. Both dual-ownership cases are one entity CREATED once and EXTENDED once, mis-recorded
    as two owners. Dual ownership weakens INV-001''s ownership check: with two legitimate creators, a
    duplicate created by the second is indistinguishable from a legitimate creation.

    '
  action: 'NegativeControl owns: [s08], extends: [s09]. Witness owns: [s04] under the OV-02 recommendation.
    Both recorded, neither applied.

    '
- id: OV-05
  group:
  - State
  - Configuration
  question: Two families both meaning 'configuration'?
  finding: 'A name collision, not a duplication. Configuration = which bodies are PRESENT. State = where
    they ARE. Both are needed simultaneously to say ''at this stage of assembly, in this pose'', which
    is exactly what an assembly witness asserts.

    '
  action: Documentation obligation only. No merge.
- id: OV-06
  group:
  - AcceptanceContract
  - VerificationPlanItem
  question: Two families of pre-committed criteria?
  finding: 'Distinct in subject and time - per-candidate and pre-geometry, versus per-requirement and
    operational - but nothing detects a plan item that contradicts the acceptance contract of the candidate
    it tests.

    '
  action: AcceptanceContract -> PROVISIONAL pending a consistency rule.
expressiveness_gaps:
- id: GAP-01
  concern: Retention and capture relationships
  currently_expressed_as: 'A pattern across three families: Interface (interaction_kind), Realization
    (discharges the retention obligation, with a verification predicate) and MobilityExpectation (the
    forbidden DOF, per configuration).

    '
  what_cannot_be_said: 'That a body is captured by two others JOINTLY - that neither retainer alone suffices.
    The pattern expresses "this DOF is forbidden in this configuration", not "these two bodies together
    are what forbid it".

    '
  why_it_matters: 'BM-002''s pin retention is single-retainer and is expressible. Every BM-003 brief in
    BM-003_SELECTION_CRITERIA.md turns on joint capture, so this gap becomes load-bearing as soon as the
    third benchmark exists.

    '
  proposed_resolution: 'A typed relation - retained_by(Body, [Body], Configuration) - via the RELATE patch
    operation, which already exists. NO NEW FAMILY REQUIRED.

    '
  status: OPEN
  decision_required_before: s03 implementation.
- id: GAP-02
  concern: Assembly sequence ordering
  currently_expressed_as: 'A series of Configurations plus ASSEMBLY_INSERTION Witnesses.

    '
  what_cannot_be_said: 'That step A must precede step B, and that the reverse order is geometrically impossible.
    The ordering is implicit in the sequence of Configurations and is never asserted, so nothing can check
    it.

    '
  why_it_matters: 'BM-002''s 9-step assembly has a genuinely forced order - the shaft must enter through
    the journal bore before the panel closes. A pipeline that emitted the steps in an impossible order
    would currently produce a structurally valid result.

    '
  proposed_resolution: 'A typed precedes(Configuration, Configuration) relation with a required reason,
    again via RELATE. NO NEW FAMILY REQUIRED.

    '
  status: OPEN
  decision_required_before: s03 implementation.
findings_by_stage:
  before_s01:
  - Ambiguity merge decision
  before_s03:
  - GAP-01 retention relation
  - GAP-02 assembly ordering
  - Joint/Interface link
  - Interface/Feature link
  before_s04:
  - Witness ownership and merge decision
  before_s07:
  - GeometrySignature placement
  before_s08:
  - NegativeControl dual ownership
  - AcceptanceContract consistency rule
closing_note: 'Every finding above is recorded rather than applied. Applying any of them is a contract
  change, and a contract change runs through STAGE_PROGRESSION_CONTRACT step 1 for the affected stage.
  This audit freezes nothing.

  '
