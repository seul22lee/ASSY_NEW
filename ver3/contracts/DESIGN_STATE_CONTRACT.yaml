# DESIGN_STATE_CONTRACT — what the single design world contains
#
# There is exactly ONE DesignState per run. Stages do not own private truth
# stores; a stage proposes a StagePatch and the patch is applied to this state.
# Ver2's Stage 05 kept its own entities and that is R-19.
#
# NO STAGE LOGIC IS DEFINED HERE. This file says what may exist and what shape it
# has. It does not say how any stage decides anything.

schema_version: "0.1.0"
status: draft
governed_by: ver3/phase0/ARCHITECTURE_INVARIANTS.yaml

# =====================================================================
# 1. Identity
# =====================================================================
identity:
  principle: >
    Exactly one entity per real-world thing (INV-001). A downstream stage extends
    an entity by its stable ID; it never creates a second entity denoting the
    same thing.
  entity_id:
    format: "<type_prefix>-<zero_padded_ordinal>"
    example: "BODY-0007"
    rules:
      - "Assigned by the owning stage at CREATE time; immutable thereafter."
      - "Never reused, never recycled, never renumbered."
      - "No legacy ID format is accepted (see RETIREMENT_MATRIX ver2_modules assy/domain/common.py)."
      - "IDs are opaque. No behaviour may branch on an ID's numeric part."
  instance_identity:
    what: >
      A token distinguishing legitimately multiple instances of the same kind:
      two rails, four fasteners, N identical guides.
    why: >
      INV-001's duplicate check requires POSITIVE evidence of re-denotation.
      Instance count is never evidence of duplication, and this token is how the
      validator tells multiplicity from duplication.
    required_on: [Body, Joint, Interface, Feature, Realization]
  references:
    rule: >
      Every reference is a typed reference to an existing entity ID. A
      free-string subject is a SCHEMA ERROR, not a warning (R-20).
    forbidden: ["free-string subject", "name-based lookup", "positional reference"]

# =====================================================================
# 2. Entity families
#    Fields marked authoritative_geometry MUST have metric types (INV-003).
# =====================================================================
# ---------------------------------------------------------------- U-2A (S-1)
# Frozen architecture FA-2 / FA-3. Added by migration step S-1 as the minimum
# authority substrate. The COMPLETE per-family classification is U-2B work and
# is deliberately not attempted here.
authority_model:
  schema_version: 1
  classes:
    AUTHORITATIVE: "Class A. Engineering state the design asserts. Controlled mutation only; provenance required."
    DERIVED: "Class B. Strict consequence of class-A premises. Recomputable; carries its premise set."
    EPHEMERAL: "Class C. Views, serializations, caches, provider payloads. Never stored in DesignState."
    ASSURANCE: "Class D. Check results and findings. Append-only consumer of class A, never a producer of it."
  default_class: AUTHORITATIVE
  default_rationale: >
    A family with no explicit class is treated as class A, the strictest regime.
    Defaulting to strict means no family can escape controlled mutation by
    omission. Misclassifying an assurance artifact as authoritative costs only
    extra rigour; the reverse would open exactly the hole S-1 exists to close.
  class_overrides: {}
  class_overrides_note: >
    RESOLVED for MobilityExpectation at S-5 / U-6, and the resolution is that no
    override is needed. The split the note anticipated - a derived domain and an
    authored disposition inside one family - would have required an authority
    class this table cannot express, because it maps a FAMILY to a class. What
    the split actually calls for is that the derived half not be stored at all:
    the DOF domain is a function of standing branch topology, recomputed on every
    read, and MobilityExpectation stores dispositions. So the family is
    AUTHORITATIVE, declared on the family itself, and there is no field in it
    claiming a class runtime does not enforce.
    Reclassifying the rest of the assurance_families block remains U-2B.
  controlled_operations:
    CREATE: "The owning stage introduces an entity, once."
    EXTEND: "A permitted stage adds a permitted field, once, never over an existing value."
    SUPERSEDE: "A replacement value is recorded with a reason. Both values are retained."
    INVALIDATE: "A value is marked no longer standing, with a reason. Nothing is deleted."
  mutation_rule: >
    No stage, runner, projection helper, absorber, provider adapter or validator
    may mutate class-A facts outside a StagePatch carrying one of the four
    controlled operations. Enforced at runtime by assy_v3/state/authority.py.
  validity_vocabulary:
    STANDING: "Current; no premise it depends on has changed."
    SUPERSEDED: "A replacement was recorded. This value is retained and readable."
    INVALIDATED: "Explicitly withdrawn with a reason. The record remains."
    STALE: "A premise this value depends on changed. The value was not touched; it has lost unqualified authority."
  premise_rule: >
    FA-5. An operation may declare the class-A entity ids its value depends on.
    When such a premise is REVISED - superseded, invalidated, or extended with an
    authoritative field by a stage that does not own it - every dependent whose
    validity is STANDING becomes STALE, and so does every dependent of THOSE, all
    the way out. Currentness is a property of the graph and is walked as one
    (S7-F): before that it stopped after a single hop, which made correctness
    depend on every producer copying the whole premise closure into every output.
    The dependent is never deleted and never silently remains unqualifiedly
    authoritative.
  extension_rule: >
    AN EXTENSION IS A COMPLETION, AND STILL AN AUTHORITATIVE CHANGE. EXTEND is
    permitted only for a field the family DECLARES extendable, by exactly the
    stage named as its author, and only where no value exists - changing an
    authored value is a SUPERSEDE. So the owner's own passes are not staled by
    one: s03 authors a Joint and s04 places it, and s03b's DOF grid was never
    entitled to the placement it did not have. A conclusion drawn from OUTSIDE
    the owner is staled, because it was decided over a record that has since
    gained authoritative content. (S7-F)
  absence_rule: >
    A PREMISE THAT IS AN ABSENCE HAS NO ID, so no edge can carry it. A feasibility
    answer of NOT_ESTABLISHED because no load path exists depends on there being
    none, and the entity that ends that absence is a CREATE nothing could have
    named in advance. CREATE therefore has no generic propagation - a global
    invalidation would destroy every dependency it has - and absence-to-evidence
    is closed the other way: the deterministic responsibilities are asked to
    answer again over current state, and their new answers replace what stands
    where the two differ. The two mechanisms are complementary and neither
    substitutes for the other. (S7-F)

# ---------------------------------------------------------------- U-2B (S-2)
# Field-level canonical semantics. DESIGN_STATE_CONTRACT is the SOURCE OF TRUTH
# for entity semantics (see CONTRACT_AUTHORITY.yaml); every other file that
# mentions a family is a checked projection of this one.
#
# Declared per field ONLY where the field carries semantics a reader cannot
# infer: a reference, a spatial value, or an authority class that differs from
# the family's. Ordinary scalar fields inherit the family's class and need no
# entry - this is deliberate, so adding a family does not mean writing a
# paragraph per field (implementation plan R-1, contract sprawl).
# U-2B (S-2): two families outside the S01-S04 migration declare more than one
# owner. That is a real ownership contradiction, and it is recorded rather than
# silently accepted: a family with several owners has no single stage answerable
# for its meaning. They are out of scope here because nothing in S01-S04 creates
# or consumes them; resolving them belongs to whichever step brings s08/s09 into
# scope. Any NEW multi-owner declaration is a defect.
multi_owner_exceptions:
  rule: >
    A family may declare several owners only with an entry here, a reason, and a
    step at which it is resolved. Absent an entry, one owner is required.
  rows:
    - family: Witness
      owners: [s04, s09]
      why: >
        Two different artifacts under one name: motion witnesses would be s04's
        and verification witnesses s09's. NEITHER IS PRODUCED - the ownership is
        declared, the producers are not written, and S04_CONTRACT records Witness
        under `not_owned_here`. Stated in that tense because the row read as a
        claim that s04 emits one today.
      resolution_step: "the step that brings s09 into scope; out of S01-S04"
    - family: NegativeControl
      owners: [s08, s09]
      why: "declared jointly by two stages outside this migration"
      resolution_step: "the step that brings s08/s09 into scope; out of S01-S04"

# ---------------------------------------------------------------- S-3 readiness
# SEMANTIC ROLES: what a family IS, independent of any consumer.
#
# The entity contract says what a family IS; the stage responsibility contract
# says what a stage NEEDS; a generic resolver matches one against the other. That
# is what stops a stage contract from having to know every family in existence -
# which a family list cannot avoid, however machine-readable it looks.
#
# A role must carry stable engineering meaning OUTSIDE the one consumer that
# happens to use it today. `things_s04a_currently_needs` would be a whitelist
# wearing a tag; `topology_relation` is a fact about Joint whether or not any
# stage ever asks for it.
#
# A NEW FAMILY PARTICIPATES BY DECLARING ITS OWN ROLES - no consuming stage and
# no resolver code is edited.
semantic_role_vocabulary:
  actor_role: >
    Something outside the product that acts on it or must reach into it.
  assembly_order: >
    The order and access by which the product goes together.
  candidate: >
    A mechanism family or arrangement under consideration.
  candidate_acceptance: >
    Which obligations ONE candidate must satisfy to be judged realized. The
    design-wide obligation set says what the design owes; this says which of that
    debt is THIS candidate's. Without it a stage embodying one alternative cannot
    tell a universal obligation from another alternative's, and coverage over the
    whole set would demand that the selected candidate discharge obligations
    belonging to a candidate nobody chose.
  configuration_state: >
    A named state of the mechanism, distinguished by what differs in it.
  constraint_relation: >
    What constrains a group, in which directions and configurations.
  elimination_evidence: >
    That a candidate is no longer viable, and on what geometric ground.
  functional_region: >
    A volume the design promises, as distinct from one it occupies.
  kinematic_axis: >
    A direction about or along which relative motion is defined.
  load_case: >
    A candidate-independent demand the world places on the product.
  load_route: >
    How ONE load reaches a declared reaction site through ONE candidate
    mechanism. Candidate-specific where the demand it answers is not: two
    alternatives carry the same load through different interfaces, and that
    difference is the whole of what this role names. (S7-B)
  open_item: >
    A recorded openness that may bind a later commitment.
  open_question: >
    Something the source left undetermined, recorded rather than resolved.
  reaction_site: >
    Where a reaction must ultimately be available, typed from the scenario's
    declared system boundary rather than from what kind of thing it is.
  physical_effect_obligation: >
    A physical effect that must occur between roles, stated without naming a mechanism.
  physical_interaction: >
    What transmits a required effect between two rigid groups.
  physical_obligation: >
    Something that must be true for a requirement to hold.
  quantity_constraint: >
    A stated or derived quantity that bounds a design value.
  reach_evidence: >
    Whether an actor can reach a target in a given arrangement.
  scenario_context: >
    A declared operating situation and the boundary that bounds it.
  design_constraint: >
    A HARD requirement on the design - what may be built at all. Distinct from a
    preference, which says which buildable thing is wanted and may never make a
    candidate ineligible. (S-7 / U-8)
  realized_configuration: >
    The coordinate values that realize one named configuration - what the
    mechanism is actually SET TO when it is in that state, as against the
    configuration itself, which only names it.
  motion_path: >
    A path between two realized configurations, and which coordinates it
    changes. How a design says a motion HAPPENS, distinct from the states it
    happens between.
  motion_occupancy: >
    The space a moving group occupies along a motion, and at what evidence level
    that occupancy was computed. What makes "does this sweep into something"
    answerable at all.
  mobility_disposition: >
    What is known about one degree of freedom of one rigid group in one
    configuration, and on what evidence.
  eligibility_evidence: >
    Whether ONE candidate may be chosen from at all: can it work, and does it
    satisfy the hard requirements. Candidate-local and blind to what anyone
    wants; it decides the population a choice may act on and never which member
    of that population wins.
  selection_preference: >
    What the user WANTS among designs that already work, ranked and versioned. It
    can never make a candidate ineligible, and it is withheld from every
    reasoning step that decides whether one is - a preference nothing can see
    cannot bias anything.
  selection_evidence: >
    Deterministic comparison material over eligible candidates, computed from
    state before anything is asked of a model.
  advisory: >
    A reviewer's opinion. CONSIDERED by a decision, never a premise of one: it
    may raise a concern the metrics do not represent, and it may not decide.
  human_decision: >
    What a person submitted at the decision screen, and what they were shown when
    they submitted it.
  selection_decision: >
    The recorded commitment to one candidate.
  source_requirement: >
    A statement the source obliges, carried with its qualifier.
  spatial_commitment: >
    A committed spatial value: extent, region, direction, frame or placement.
  spatial_frame: >
    The basis a spatial value is expressed in.
  topology_element: >
    A thing the mechanism is made of.
  topology_relation: >
    A connection between things the mechanism is made of.
  extension_rule: >
    A new role is added here with its engineering meaning, then declared by the
    families that carry it. A role used by no family, or declared by a family but
    absent here, is a defect - both are checked.

field_semantics_rules:
  reference: >
    A field whose value identifies another entity. It MUST declare `target`
    (the family it resolves to) and `cardinality`. `resolvable` says whether an
    unresolved value is legal; the default is false, so a dangling reference is
    a defect rather than a style. Before S-2 there was no declaration at all and
    integrity was guessed from a key-name suffix plus an is-upper-case heuristic.
  referent_population: >
    OPTIONAL on a `reference` field. The population a consumer may resolve this
    field's PRE-EXISTING referent from, using the vocabulary defined in
    STAGE_RESPONSIBILITY_CONTRACT.instance_selection_vocabulary. It is selection
    scope for the referent - not applicability, not ownership, and not branch
    lineage itself.
    Absent, the conservative default is INVOCATION_BRANCH: an undeclared
    reference must not silently widen what a consumer sees.
    It is declared DESIGN_WIDE where the referent is a demand ON the design
    rather than a product of any alternative. Requiring such a referent to be
    branch-scoped ALREADY is circular: the reference being authored is what makes
    it branch material. Declaring the population does not change `cardinality` or
    `resolvable`, which remain separate questions.
  spatial: >
    A coordinate, axis, extent, offset, path or transform. It MUST declare
    `frame`: the entity or declaration that establishes what the numbers are
    measured in. A spatial value with no frame is representation-incomplete -
    the numbers have no meaning, and two stages can disagree without either
    being detectably wrong.
  authority_class: >
    Overrides the family's class for one field. Used where a family carries both
    authored engineering conclusions and derived bookkeeping.
  semantic_dependency: >
    What must exist for this value to have traceable meaning. This is the
    REPRESENTATIONAL half of Consumer Sufficiency (freeze §4 source A). It is
    NOT the reasoning-premise half, which belongs to stage responsibility and
    lives in STAGE_RESPONSIBILITY_CONTRACT.yaml. The two are kept apart
    deliberately; S-3 unions them, S-2 must not.
  enum: >
    A closed vocabulary. Declared so a reference check does not mistake an
    enum member for an entity id.
  premise_record_list: >
    A field holding a LIST OF RECORDS, each of which asserts something and must
    name the evidence for it. It declares `discriminator` (the record field
    whose value says what kind of assertion this is), `premise_field` (that
    value -> the record field that must carry its premise, or null where the
    value is an explicit statement that there is no evidence) and
    `record_field_semantics` (per record field, the same declarations a
    top-level field uses, so a nested reference resolves by exactly the rule a
    flat one does).
    Introduced because a premise buried one level down was invisible to both
    boundaries: the write boundary walked top-level fields only, so a citation
    could be any string at all, and a contract could declare `premise_required`
    without anything being able to check it. The discriminator is what makes the
    premise TYPED rather than merely present - a record may not carry another
    kind's premise field, so evidence of the wrong kind is a defect and not a
    matter of interpretation.

entity_families:

  Requirement:
    semantic_roles: [source_requirement, quantity_constraint]
    owned_by: s01
    purpose: "A rank-1 source statement, carried verbatim with its qualifier."
    required_fields: [entity_id, statement_verbatim, kind, verification_kind, observable_verbatim, source_locator, quantity_class]
    quantity_class: [MAGNITUDE, BAND, COMPARATIVE, NONE]
    rules:
      - "The source's own qualifier ('approximately') is preserved, never sharpened."
      - "This is the ONLY family whose creation may consult raw source text (INV-002)."

  Obligation:
    semantic_roles: [physical_obligation]
    field_semantics:
      derived_from_requirements:
        kind: reference
        target: Requirement
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
      involves_actors:
        kind: reference
        target: Actor
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s02
    purpose: "A physical or functional thing that must be true for a requirement to hold."
    required_fields: [entity_id, statement, derived_from_requirements, mandatory, scope, satisfiable_at, evidence_route, route_available]
    optional_fields: [derivation_premises, involves_actors]
    scope: [UNIVERSAL, CANDIDATE_DISCRIMINATING]
    satisfiable_at: [s02, s03, s04, s05]
    rules:
      - "Every mandatory obligation must reach a terminal status (INV-008)."
      - "An obligation is never discharged by a label, a field or a relationship."
      - >
        scope distinguishes an obligation EVERY candidate must satisfy - an
        assembly sequence exists, a load reaches a reaction site - from one whose
        satisfaction DIFFERS BY CANDIDATE. Without it, coverage cannot be read:
        a universal obligation that no candidate lists looks identical to a
        discriminating one that every candidate ignored. Found by the first
        evaluation of the s01+s02 window, where 7 to 9 obligations per case were
        unaddressed and most of them legitimately so.
      - >
        evidence_route and route_available make an unevaluable requirement
        VISIBLE. A requirement whose obligation has route_available false is
        addressed and un-evidenceable, which is a different thing from a
        requirement nobody derived an obligation from.
      - "involves_actors cites the Actor entities a reachability obligation depends on."
      - >
        satisfiable_at names the earliest stage at which an obligation can
        actually be satisfied. A candidate at s02 is a PRINCIPLE FAMILY, not a
        mechanism, so an obligation like "every element carrying a load component
        has a reaction" cannot be addressed there at all - it needs a topology.
        Without this field, coverage flags every such obligation as unaddressed
        and the real omissions are invisible among them. Found by the regression
        run of the first s01+s02 revision.

  Candidate:
    semantic_roles: [candidate]
    field_semantics:
      addresses_obligations:
        kind: reference
        target: Obligation
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
      obligations_created:
        kind: reference
        target: Obligation
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s02
    purpose: "A mechanism family or arrangement under consideration."
    # U-2B (S-2): `addresses_obligations` is the one canonical name and meaning
    # for "the upstream obligations this entity was authored to discharge".
    # Previously the same concept appeared as obligations_addressed (contract),
    # addresses_obligations (prompts) and discharges_obligations (Realization).
    required_fields: [entity_id, summary, family, principle, addresses_obligations, obligations_created, evidence_route_verdict]
    # U-2B (S-2): ONE canonical shape. The contract previously declared no shape
    # at all, and three incompatible ones lived in prompts and fixtures - a bare
    # string, parallel arrays, and a mapping. A candidate performs several
    # function classes, so only a mapping can say which principle serves which;
    # a single-principle candidate is a one-entry map.
    principle_shape:
      kind: mapping
      key: function_class
      value: principle_family
      cardinality: "one principle_family per function_class; at least one entry"
      single_principle_form: "a one-entry mapping, never a bare string"
      rejected_shapes: ["bare string", "parallel arrays of function classes and principle families"]
      no_compatibility_shim: >
        No parser may accept a rejected shape. Producers and fixtures still
        emitting one are LEGACY (see legacy_producers) and migrate at their
        scheduled step rather than being accommodated here.
    optional_fields: [self_locking]
    rules:
      - "Candidates PERSIST as branches. Stage 02 has NO selected-candidate field (INV-007)."
      - "Element count is never a ranking input; mandatory realization is not a penalty."
      - >
        obligations_created is required: a candidate that needs a bearing has
        CREATED a bearing obligation. Without it, an incomplete candidate looks
        cheaper than a complete one, which is R-16.
      - >
        evidence_route_verdict references the capability registry. Choosing a
        mechanism partly because it can be evidenced is legitimate and must be
        RECORDED - three benchmarks did it and none had an owner.

  Body:
    semantic_roles: [topology_element]
    field_semantics:
      addresses_obligations:
        kind: reference
        target: Obligation
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
    # DECLARED, because the s03 prompt already demanded it: "list the obligation
    # ids it is the reason for - the design decision has to be traceable to the
    # obligation that forced it, or nothing downstream can tell a load-bearing
    # choice from an arbitrary one". The producer wrote the field and no family
    # declared it, so it entered state untyped: prose would have been accepted,
    # a dangling id would have been accepted, and no consumer could dereference
    # it. That is the same defect this contract records for reach_targets at
    # U-2B - a field whose only semantic definition was a prompt.
    owned_by: s03
    extendable_by: [s05, s06, s07]
    purpose: "A rigid part of the product."
    optional_fields: [addresses_obligations]
    required_fields: [entity_id, instance_identity, role, created_by_stage]
    authoritative_geometry_fields: [pose, extent, swept_volume]
    annotation_fields: [region_label, canonical_role]
    rules:
      - "pose is a frame/transform with units. An enum may annotate it, never be it (INV-003)."
      - "A generic block is not an embodiment (R-09)."

  Joint:
    semantic_roles: [topology_relation, kinematic_axis]
    field_semantics:
      parent_group:
        kind: reference
        target: RigidGroup
        cardinality: one
        resolvable: false
      child_group:
        kind: reference
        target: RigidGroup
        cardinality: one
        resolvable: false
      joint_type:
        kind: enum
      # REPRESENTATION CORRECTION (S-3). These cited ReferenceScale, a family
      # s04a creates, so the s03 responsibilities could never satisfy their own
      # outputs' dependencies. That contradicted the Joint family's own rule -
      # "s03 cannot know where an axis is" - and the producers' behaviour: both
      # emit a token from a closed set (+X/-X/+Y/-Y/+Z/-Z/NONE), not a located
      # vector. No engineering meaning changes here. The LOCATED axis and frame
      # remain s04b's, through `frame_origin` and `located_frame`.
      axis_direction:
        kind: spatial
        # The frame is the joint's OWN declaration, which is what `frame_ids`
        # says it is - not a scale that does not exist yet.
        frame: Joint.frame_ids
      frame_ids:
        kind: spatial
        frame: SELF_DECLARING
        note: this field IS the frame declaration other spatial values cite
      frame_origin:
        kind: spatial
        frame: ReferenceScale
    # U-2A (S-1): frame_origin is the field the implementation actually writes
    # and reads. fields_owned_by_s04b names `located_frame`, which no code
    # produces or consumes - that divergence is recorded and DEFERRED TO U-2B.
    # S-1 declares the field in use; it does not rename either one.
    extendable_fields:
      frame_origin: s04
    owned_by: s03
    extendable_by: [s04, s05, s06]
    purpose: "A kinematic relation between two rigid groups."
    required_fields: [entity_id, joint_type, parent_group, child_group, dof, axis_direction, frame_ids]
    # U-2B (S-2): declared as a field, not only as an extension target.
    #
    # The eight COMPLIANT variant fields are declared HERE as well as in
    # `conditional_requirements`. They are optional unconditionally - an ordinary
    # revolute joint carries none of them - and required the moment joint_type is
    # COMPLIANT. Listing them only as conditional left them undeclared as fields:
    # a field the contract can REQUIRE but does not DECLARE has no home, and the
    # producer audit rightly reported writing them as writing something unknown.
    optional_fields: [frame_origin, mode, direction, required_travel,
                      allowable_travel, actuation, compliant_element,
                      root_interface, activation_window]
    fields_owned_by_s04b: [located_frame]
    rules:
      - "A joint_type label alone is inert. A realization on each side is required (INV-008)."
      - "axis_direction is a unit vector in a named frame, and is owned by s03."
      - >
        The located FRAME is owned by s04b at PROVISIONAL maturity and promoted
        to AUTHORITATIVE by s06. s03 cannot know where an axis is: BM-002's crank
        axis height was determined by a pin-boss radius that is an s05 feature
        dimension, and fixing it at s03 is CHG-01.
      - "The joint graph must be SIMULATION-COMPLETE: projectable into a multibody model without re-derivation."
    # ENFORCED. `compliant_variant` below states the same rule in prose and has
    # done since D-2; prose is not consumed by the write boundary, so a
    # cross-body Joint labelled COMPLIANT with none of the variant fields was
    # accepted and only discovered downstream, if at all.
    # ENFORCED at the write boundary. The compliant_variant note below has said
    # this since D-2 - "Compliance is a joint_type of Joint between RigidGroups
    # of one body" - and it was prose, so a cross-body joint wearing the label
    # became standing state. S05-C1 could report it much later; by then it had
    # already been read as grounds for omitting geometry.
    relational_invariants:
      - name: compliant_joint_is_internal_to_one_body
        rule: same_body_rigid_groups
        applies_when: {field: joint_type, equals: COMPLIANT}
        reference_fields: [parent_group, child_group]
        compare_field: body
        why: >-
          Compliance is part of a body flexing relative to the rest of it. Two
          groups on different bodies is a different relation entirely, and
          admitting it lets a malformed record stand for a flexure nobody drew.
    conditional_requirements:
      - name: axis_needs_a_named_frame
        # PRESENT AND NOT NONE. `AXIS_DIRECTIONS` declares NONE as the legitimate
        # no-axis value - a FIXED joint constrains everything and points nowhere -
        # and demanding a frame for it would require naming the frame of a
        # direction that does not exist.
        applies_when: {field: axis_direction, present: true, not_equals: NONE}
        required_shape:
          frame_ids:
            non_empty_list: true
        why: >-
          A REAL `axis_direction` is declared spatial in frame `Joint.frame_ids`,
          and the rule above says it "is a unit vector in a NAMED frame". An empty
          frame list therefore leaves the direction expressed in nothing: +Z
          relative to what is unanswerable, and s04b has no frame to locate.
          s03 names the frame symbolically - it is `SELF_DECLARING`, so the id
          is a name this stage coins rather than a reference to something that
          must already exist. WHERE that frame sits is s04b's, and stays s04b's.
      - name: compliant_joint_variant
        applies_when: {field: joint_type, equals: COMPLIANT}
        additional_required_fields: [mode, direction, required_travel, allowable_travel, actuation, compliant_element, root_interface, activation_window]
        why: >-
          Compliance is a joint_type of Joint between RigidGroups of ONE body.
          A label alone is inert: without the travel, the actuation and the
          element that deflects, nothing downstream can model it and nothing can
          check it.
    compliant_variant:
      applies_when: "joint_type is compliant"
      additional_required_fields: [mode, direction, required_travel, allowable_travel, actuation, compliant_element, root_interface, activation_window]
      actuation: [PRESCRIBED_KINEMATIC]
      rules:
        - "NOT a separate family. Compliance is a joint_type of Joint between RigidGroups of one body (proposal D-2). A separate key would contradict that and leave the variant ownerless."
        - >
          required_travel and allowable_travel are NEVER one number. required_travel
          is kinematic and authoritative; allowable_travel is a material fact whose
          status is UNSUPPORTED until a compliance route exists.
        - "actuation PRESCRIBED_KINEMATIC states that no force in this model produces the deflection."
        - "compliant_element and root_interface name the geometry a reduced-order beam model would consume."
        - "Outside its activation_window the joint coordinate MUST be zero, and s04b checks it."
        - "An ExcludedClaim for strain is GENERATED from allowable_travel's status, never authored."

  Interface:
    semantic_roles: [topology_relation]
    field_semantics:
      addresses_obligations:
        kind: reference
        target: Obligation
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
      bodies:
        kind: reference
        target: Body
        cardinality: many
        resolvable: false
    owned_by: s03
    extendable_by: [s04, s05]
    # LATER-OWNED, not current. `fields_owned_by_s04b: [engagement_site]` claimed
    # s04b owns a field it produces nothing for, and S04_CONTRACT already records
    # it under `not_owned_here` - two files disagreeing about the same ownership.
    # The concept is kept because it is real and wanted; what is corrected is the
    # claim that it is current s04b truth.
    engagement_site_status:
      owner: "later stages - no producer exists and frozen U-7 does not require one"
      what: >
        The metric localisation of a symbolic meeting region. s05 would consume it
        to place features and to anchor the ROI, so that where the interaction
        moves the ROI follows this site's frame rather than a fixed box the joint
        orbits out of. Named as an s05 input before the U-2B correction, and
        produced by nothing then or now.
    purpose: "A region where two bodies meet, with its declared kind."
    optional_fields: [addresses_obligations]
    required_fields: [entity_id, bodies, interaction_kind, nominal]
    # S7-B CORRECTION - CONTRACT TRUTH. This list read
    # [DECLARED_CONTACT, DECLARED_CLEARANCE, DECLARED_INTERFERENCE_FIT,
    #  DECLARED_COMPLIANT_INTERACTION, NOT_INTENDED_TO_INTERACT]
    # and the producer has always emitted, validated and checked the unprefixed
    # names. Two vocabularies for one field, and NOT ONE VALUE IN COMMON: every
    # interface in every recording would have failed this list, and every value
    # this list names would have been refused by s03's own validator. Nothing
    # read the contract, so nothing noticed.
    #
    # The list is corrected to the one in force rather than the runtime to the
    # list, because the runtime is frozen S-4/S-5/S-6 behaviour with recordings
    # behind it, and because the shorter names are the ones every check, prompt
    # and fixture already uses. What is LOST by doing it this way is recorded
    # below rather than quietly dropped.
    interaction_kinds: [CONTACT, CLEARANCE, INTERFERENCE_FIT, COMPLIANT_INTERACTION]
    # WHAT AN INTERFACE SAYS ABOUT ITS PAIR SHARING SPACE. Declared here because
    # a consumer asking "may these two overlap?" needs a typed answer, and
    # without one the S7-B evaluator read "an interface exists" as "these two
    # are allowed to overlap" - which turned CLEARANCE, the strongest statement
    # a design can make about a pair staying apart, into an exemption from ever
    # checking it. `s04.interface_expectation` is the one reader.
    spatial_expectation:
      TOUCHES: [CONTACT, INTERFERENCE_FIT, COMPLIANT_INTERACTION]
      CLEAR: [CLEARANCE]
      rule: >
        Only TOUCHES exempts a pair from generic interference: two bodies
        declared to meet are SUPPOSED to overlap as boxes, and reporting that
        would be reporting the design. A CLEARANCE pair that overlaps is the
        promise unverified - NOT_ESTABLISHED, never PASS, and never FAIL either,
        since a box overlap is not a collision.
    rules:
      - "Every region where two bodies meet is classified. An unclassified region is REPRESENTATION_INCOMPLETE."
      - >
        NOT_INTENDED_TO_INTERACT WAS DECLARED HERE AND NEVER PRODUCIBLE - s03's
        validator rejects it, so no interface has ever carried it. It is the
        only kind that would let a design say "these two must never meet" as a
        positive fact, which is also the only shape from which gross
        interference could ever produce a FAIL rather than a NOT_ESTABLISHED.
        Reintroducing it is a producer change and belongs with the exact-geometry
        work, not with a vocabulary edit. (S7-B correction; owner S-8)

  Feature:
    # The spatial claim an occupancy check needs, and the reason it is canonical.
    #
    # S05-C8 re-runs s04b's occupancy against the NEW geometry. It cannot do that
    # from `geometry`, which is prose. The first implementation read
    # `intrudes_region` off the response - a key no contract declares and no
    # producer emits - so the check read None and passed on everything.
    #
    # Same shape as FunctionalRegion.volume and the same frame, so the two are
    # comparable by declaration rather than by an assumed convention, and the
    # same aabb/overlaps helpers judge both.
    optional_fields: [envelope]
    field_semantics:
      envelope:
        kind: spatial
        frame: ReferenceScale
      body:
        kind: reference
        target: Body
        cardinality: one
        resolvable: false
      feature_kind:
        kind: enum
    owned_by: s05
    purpose: "A named geometric feature on a body that participates in an interaction."
    required_fields: [entity_id, body, feature_kind, geometry]
    rules:
      - "OCCT/CAD face indices are never a persistent identity."

  Realization:
    field_semantics:
      addresses_obligations:
        kind: reference
        target: Obligation
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
        # WHICH of that design-wide population a realization may cite. The
        # obligation corpus belongs to the design, so DESIGN_WIDE is right for
        # WHERE; but a realization authored for the selected candidate may only
        # discharge what that candidate owes, and citing another alternative's
        # obligation is a claim about a mechanism this design does not use.
        #
        # Declared here as well as on the premise because a family reached by
        # two requirements is selected by their UNION - narrowing one path
        # alone narrows nothing, which is exactly what happened first.
        referent_applicability: APPLICABLE_TO_COMMITTED_CANDIDATE
      participating_features:
        kind: reference
        target: Feature
        cardinality: many
        resolvable: false
    owned_by: s05
    purpose: "The embodiment that discharges one or more obligations."
    required_fields: [entity_id, addresses_obligations, participating_features, verification_predicate]
    rules:
      - "Must cite the obligation IDs it discharges (INV-008)."
      - "A realization with no verification predicate discharges nothing."

  State:
    # Declared at S7-A. This family, Transition and SweptVolume carried NO
    # semantic role, so a responsibility needing to know whether a mechanism's
    # motion works could not ask for them by role and would have had to name the
    # family - the whitelist U-3 exists to remove. The same gap
    # MobilityExpectation had.
    semantic_roles: [realized_configuration]
    field_semantics:
      # S-6 / U-7. WHICH CONFIGURATION THIS REALIZES. The producer wrote it and
      # nothing declared it, so the write boundary could not check it and Source
      # A could not see it. A State exists to realize one Configuration; that is
      # a typed relation, not a label.
      configuration:
        kind: reference
        target: Configuration
        cardinality: one
        resolvable: false
      joint_coordinates:
        kind: spatial
        frame: Joint.frame_origin
    owned_by: s04
    purpose: "A named configuration of the mechanism."
    required_fields: [entity_id, name, configuration, joint_coordinates]
    authoritative_geometry_fields: [body_poses, swept_volumes]
    rules:
      - "Joint coordinates are unit-bearing values, not ordinal intervals (R-03, R-05)."
      - >
        S-6 / U-7 DEPENDENCY. A State rests on the Configuration it realizes, on
        the Joints its coordinates are coordinates OF, and on the ReferenceScale
        they are expressed in - and on nothing else. It is not computed from any
        body's extent, so an envelope changing does not make a joint angle wrong.

  Transition:
    semantic_roles: [motion_path]
    field_semantics:
      from_state:
        kind: reference
        target: State
        cardinality: one
        resolvable: false
      to_state:
        kind: reference
        target: State
        cardinality: one
        resolvable: false
      path:
        kind: spatial
        frame: ReferenceScale
      changed_coordinates:
        # JOINT IDS, not coordinates. The name reads spatial and the value is a
        # list of references: which joints this transition moves. Declaring it
        # makes the endpoint agreement checkable and stops a spelling heuristic
        # from calling it a frameless spatial value.
        kind: reference
        target: Joint
        cardinality: many
        resolvable: false
    owned_by: s04
    purpose: "A path between two states."
    required_fields: [entity_id, from_state, to_state, path, changed_coordinates]
    authoritative_geometry_fields: [path, swept_volume]
    # S-6 / U-7. `sampling_declaration` LEFT this family. It was written here by
    # the parser from a module constant before any sweep had run, and a check
    # then validated the property that constant guaranteed - a declaration
    # deciding the claim, with the causal arrow pointing the wrong way. The
    # evidence now lives on the SweptVolume the computation produced, in one
    # place, and a transition that moves something with no SweptVolume is a
    # transition whose motion was never evidenced.
    rules:
      - "A constant offset between endpoints is not a motion model (R-07)."
      # RETIRED at S-6 / U-7: "Sampling is DECLARED, never adaptive-and-
      # unrecorded." Sampling is not a Transition field and is not declared
      # anywhere - it is RECORDED by the computation, on the SweptVolume that
      # computation produced. The rule survived beside the rule that replaced it,
      # so this family carried both readings at once.
      - >
        changed_coordinates names the joints whose coordinate this transition
        changes. It is checkable against the endpoint states and must agree with
        them: a declared change the coordinates do not make is a finding, and so
        is a coordinate that changes without being declared.
      - >
        Motion evidence is SweptVolume.fidelity and is a FUNCTION OF THE
        COMPUTATION PERFORMED: how many poses were evaluated and of what kind. It
        may never be authored ahead of the computation, and a level this
        pipeline's method cannot support - it unions discrete poses, so never
        SWEPT or CONTINUOUS - may not be claimed by declaring it.

  Parameter:
    semantic_roles: [quantity_constraint]
    owned_by: s05
    extendable_by: [s06]
    # THE ENFORCED AUTHORITY. `extendable_by` above is prose; the write boundary
    # reads `extendable_fields` and refuses anything absent from it, so a family
    # named there with no field listed here grants nothing. Exactly two fields,
    # both settlement facts:
    #   value      what the solver determined
    #   solved_by  the solver artifact that determined it
    # s06 owns no engineering decision, and these are the only two things it
    # learns. `status` is deliberately NOT here: s05 declares it and a revision
    # of an authored value is a SUPERSEDE, not an extension.
    extendable_fields:
      value: s06
      solved_by: s06
    purpose: "A named quantity the design depends on."
    required_fields: [entity_id, symbol, unit, status]
    # Declared, because an extendable field must be a field the family HAS.
    # Optional because a Parameter is authored before it is settled: s05 declares
    # it with no value, and s06 fills these two or the parameter stays free.
    optional_fields: [value, solved_by, lower, upper]
    rules:
      - "unit is MANDATORY. 'dimensionless' is explicit. A null unit is a schema error (INV-004)."
      - "A value without a cited solver artifact is not settled (S05-C10, R-23)."

  Constraint:
    owned_by: s05
    extendable_by: [s06]
    # One field: what the settlement said about this relation. s06 may record an
    # outcome against a constraint; it may not rewrite the relation, because the
    # relation is s05's engineering statement.
    extendable_fields:
      settlement: s06
    purpose: "A relation the parameters must satisfy."
    required_fields: [entity_id, expression, parameters, kind]
    # WHICH INTERFACE THIS CONSTRAINT GOVERNS.
    #
    # S05-C9 requires every declared clearance to become a Constraint. The first
    # implementation looked for `interface`/`realizes` keys that no contract
    # declares, so the link set was always empty and the rule could only be
    # satisfied by a test injecting a field production never writes.
    #
    # A typed reference instead: the Constraint points at the Interface whose
    # clearance it expresses. Direction chosen so the constraint - the later,
    # derived thing - carries the reference, as every other derived family does.
    optional_fields: [settlement, governs_interface]
    field_semantics:
      governs_interface:
        kind: reference
        target: Interface
        cardinality: one
        resolvable: false

  UnresolvedDecision:
    semantic_roles: [open_item]
    owned_by: any
    purpose: >
      A recorded openness. Subsumes Ver2's UnresolvedLayoutChoice and
      LayoutConflict (RETIREMENT_MATRIX undecided U-03, resolved here).
    field_semantics:
      # TWO legitimate families, which is why `target` is a list. The rule below
      # already said it - "kept_open_by CITES the Ambiguity or Freedom entities
      # that keep this decision open, by ID" - and `field_semantics` was empty,
      # so the rule was prose and the field was untyped: prose, a dangling id, or
      # a Body id were all accepted.
      kept_open_by:
        kind: reference
        target: [Ambiguity, Freedom]
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
      # WHAT THIS OPENNESS PREVENTS FROM BEING SETTLED.
      #
      # `target: ANY` is a DECISION, not an omission. What an open decision
      # blocks is genuinely polymorphic and the evidence says so: two live
      # readers treat these as PhysicalEffectObligation ids - s03b's physical
      # completeness excuses an undischarged demand that is "recorded open", and
      # the assurance closure check reports the same - while the recorded corpus
      # holds 29 Obligation ids and one UnresolvedDecision id, and an s04 exit
      # fixture blocks a LoadPath.
      #
      # An enumerated union was tried and was wrong twice over. It rejected the
      # LoadPath, which is a legitimate thing for an open decision to block; and
      # naming Obligation made this a representational dependency that pulled
      # the DESIGN-WIDE obligation set back into every view creating an
      # UnresolvedDecision - re-widening the s05 embodiment duty set that
      # `APPLICABLE_TO_COMMITTED_CANDIDATE` exists to narrow. Enumerating
      # families here would be guessing at a list the design keeps extending.
      #
      # What IS enforced is the part that makes the field machine-readable: the
      # members are entity ids and they resolve. A consumer can dereference them
      # and ask each referent what it is.
      blocks:
        kind: reference
        target: ANY
        cardinality: many
        resolvable: false
    required_fields: [entity_id, decision, why_open, alternatives, alternatives_kind, blocks, kept_open_by]
    alternatives_kind: [ENTITY_REFS, PRINCIPLE_FAMILIES, FREE_TEXT]
    # `alternatives_kind` already types the list; this makes the typing
    # ENFORCEABLE. When it says ENTITY_REFS the members must be entity ids that
    # resolve - the corpus holds 36 Candidate ids under that kind - and when it
    # says FREE_TEXT or PRINCIPLE_FAMILIES nothing dereferences them, because no
    # reference is declared at all.
    #
    # NO TARGET FAMILY. What a decision is between is the decision's business:
    # today they are candidates, and constraining the family would refuse a
    # legitimate future alternative for no canonical reason.
    conditional_references:
      - name: entity_ref_alternatives_are_ids
        applies_when: {field: alternatives_kind, equals: ENTITY_REFS}
        field: alternatives
        cardinality: many
        resolvable: false
        why: >-
          A consumer told the list is dereferenceable will dereference it. Prose
          under an ENTITY_REFS kind is a promise the producer did not keep, and
          nothing downstream could tell the difference until it followed one.
    rules:
      - "Recording openness is always permitted. Resolving it silently is never permitted."
      - >
        kept_open_by CITES the Ambiguity or Freedom entities that keep this
        decision open, by ID. Restating them in why_open prose is consumer
        reconstruction: the upstream stage already typed the fact and the
        downstream stage derived it again, so nothing can tell whether the two
        agree. Found by the first evaluation of the s01+s02 window, where every
        Freedom and every Ambiguity was unreferenced on all three cases.
      - "alternatives_kind types the alternatives list so a consumer knows whether to dereference it."

  VerificationPlanItem:
    owned_by: s08
    required_fields: [entity_id, requirement_id, criterion_id, scenario_id, observable_id, planned_fidelity]

  EvidenceItem:
    owned_by: s09
    required_fields: [entity_id, plan_item, outcome, fidelity, structural_artifacts, contact_resolution]
    rules:
      - "Evidence declares its contact resolution. A declared-pair result is marked as such."

  RequirementEvaluation:
    field_semantics:
      requirement_id:
        kind: reference
        target: Requirement
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s11
    required_fields: [entity_id, requirement_id, outcome, scope]
    rules:
      - "A PASS requires a non-empty scope block with all six fields (INV-009)."
      - "Matching is on (requirement_id, criterion_id, scenario_id, observable_id). NEVER on unit (INV-012)."

  RigidGroup:
    semantic_roles: [topology_element]
    field_semantics:
      body:
        kind: reference
        target: Body
        cardinality: one
        resolvable: false
    owned_by: s03
    purpose: >
      A maximal rigid sub-region of a Body. A Body with exactly one group may
      omit it; the Body then IS its group and nothing changes for rigid designs.
    required_fields: [entity_id, body, members, is_default]
    rules:
      - "Joints connect RigidGroups, not Bodies. A Body-level reference resolves to its sole group when unambiguous."
      - "ONE group per compliant MEMBER. Four independent tabs are four groups, not one region."
      - "Grouping independent compliant members asserts a coupling that does not physically exist."

  LoadCase:
    semantic_roles: [load_case]
    field_semantics:
      scenario:
        kind: reference
        target: Scenario
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
      direction_class:
        kind: enum
      # S-4. REQUIRED, because the freeze says a LoadCase is "reacted at which
      # ReactionSiteRequirement" - not "may name one". A load with nowhere
      # declared to be reacted cannot be closed by any candidate, and leaving the
      # relation optional made that hole silent: U5-3 skipped its wrong-terminus
      # check whenever the expectation happened to be missing.
      #
      # `reacted_at_role` stays as the SOURCE-LEVEL
      # description it has always been - what the request said, in its own words.
      # This is the authoritative relation, by id, so downstream code never has to
      # rebuild it by comparing role strings. Two fields, two different facts: one
      # records what was said, one records what it resolves to.
      # S-4 EXIT AUDIT. These declared `resolvable: true`, which by this
      # contract's own words means "an unresolved value is legal". That confused
      # OPTIONAL FIELD with UNRESOLVED REFERENT: the field may be omitted, but a
      # site, hop, provider or interface that IS named must exist. A load
      # terminating at a reaction site nothing declared has not been closed, and
      # this family's own rule already said it for providers - "a provider is a
      # resolvable reference or the relation is incomplete".
      reacted_at_site:
        kind: reference
        target: ReactionSiteRequirement
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s02
    purpose: "An applied load implied by a scenario. CANDIDATE-INDEPENDENT."
    required_fields: [entity_id, scenario, applied_to_role, reacted_at_role, direction_class, kind, magnitude_or_status,
                      reacted_at_site]
    kinds: [GRAVITY, PAYLOAD, ACTOR_APPLIED, REACTION]
    rules:
      - "Says what the world does to the product, never what any mechanism carries."
      - "A magnitude appears only if s01's quantity inventory supplies one; otherwise UNSUPPORTED."
      - "MUST NOT name a specific element. Which element carries which component is candidate-dependent (SF-5.3)."
      - >
        reacted_at_role names WHERE the load leaves the product - the surface it
        stands on, the hand that holds it, the fixture it mounts to. It is a
        ROLE, not a body, so it stays candidate-independent. Without it a
        LoadPath has no declared terminus and 'terminates at a reaction site' is
        uncheckable.

  ReactionSiteRequirement:
    semantic_roles: [reaction_site]
    field_semantics:
      scenario:
        kind: reference
        target: Scenario
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s02
    authority_class: AUTHORITATIVE
    addressable: true
    purpose: >
      A typed, addressable site derived from a scenario's declared system
      boundary, marked EXTERNAL or INTERNAL. Candidate-independent: it says WHERE
      a reaction must ultimately be available, at role level, without naming a
      mechanism or a coordinate.
    required_fields: [entity_id, scenario, boundary_side, at_role]
    optional_fields: [why]
    boundary_side: [EXTERNAL, INTERNAL]
    rules:
      - >
        S-4 adds it. The plan's M-7 recorded the gap: "Reaction sites do not exist
        as a type, so a load path cannot terminate outside the product." Without
        it the world had to be modelled as a body, and it is not one.
      - >
        EXTERNAL or INTERNAL is read from the scenario's system boundary, not from
        the kind of thing the site is. Whether an actor may be a reaction site is a
        property of that boundary (R-12), never a rule about hands.
      - >
        Candidate-independent. Two candidates react at the same declared site and
        reach it differently; that difference lives in their LoadPaths.

  LoadPath:
    # S7-B. THE FAMILY CARRIED NO ROLE AT ALL, so nothing could ask for it by
    # what it is. A consumer view is assembled from declared roles, and a
    # responsibility whose job includes "does every load close outside the
    # product" could not name the family that answers it - the paths arrived in
    # no view, and a load closure domain would have read an empty list as
    # nothing to close.
    semantic_roles: [load_route]
    field_semantics:
      load_case:
        kind: reference
        target: LoadCase
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
      candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
      # S-4. The hops were untyped, so a path could be a list of prose and no
      # closure was checkable. This family's own rule already said what a hop is:
      # "Each hop names the Interface that carries it."
      ordered_hops:
        kind: reference
        target: Interface
        cardinality: many
        resolvable: false
        referent_population: INVOCATION_BRANCH
      # Where the path closes. A terminal site EXTERNAL for the scenario the load
      # acts in closes the path; one terminating inside the product is OPEN - a
      # legitimate recorded state, not an error to hide (R-12).
      terminates_at:
        kind: reference
        target: ReactionSiteRequirement
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s03
    extendable_by: [s04, s06]
    purpose: "How one LoadCase reaches a reaction site through ONE candidate mechanism."
    required_fields: [entity_id, load_case, candidate, ordered_hops, maturity]
    optional_fields: [terminates_at]
    maturity_progression: [HYPOTHESIS, SPATIALLY_INSTANTIATED, AUTHORITATIVE]
    rules:
      - "Each hop names the Interface that carries it."
      - "CANDIDATE-SPECIFIC. Different candidates have different paths for the same load."
      - "Per-element load components are DERIVED from this path and are NEVER stored as fields."
      - "No element acquires a reaction obligation from its type. 'Shaft -> bearing' is unreachable by construction."

  FunctionalRegion:
    semantic_roles: [spatial_commitment, functional_region]
    field_semantics:
      owning_bodies:
        kind: reference
        target: Body
        cardinality: many
        resolvable: false
      volume:
        kind: spatial
        frame: ReferenceScale
      required_by_actors:
        kind: reference
        target: Actor
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
      reach_targets:
        kind: reference
        target: FunctionalRegion
        cardinality: many
        resolvable: false
    # U-2A (S-1): the field s04a extends. Was written by a runner helper with no
    # operation and no provenance; now the only permitted path is EXTEND.
    extendable_fields:
      volume: s04
    owned_by: s03
    extendable_by: [s04]
    purpose: "A volume the design promises: access, support, keep-out, aperture."
    # U-2B (S-2): required_by_actors and reach_targets existed ONLY in s03 prompt
    # prose. A model-output field whose sole semantic definition is a prompt has
    # no canonical home, so nothing could check it and no consumer could rely on
    # it. Promoted here. The prompt is NOT rewritten in S-2, and may now explain
    # this contract instead of being it.
    optional_fields: [volume, required_by_actors, reach_targets]
    required_fields: [entity_id, role, owning_bodies]
    authoritative_geometry_fields: [volume]
    #: THE ROLE VOCABULARY, and what each role means for OCCUPANCY.
    #:
    #: Both were previously implicit: the vocabulary lived as a Python tuple in
    #: s04, and the occupancy policy as two independently hard-coded tuples - one
    #: in s04b, one in S05-C8. Two copies of a rule are two rules, and nothing
    #: made them agree about the same box.
    #:
    #: `excludes_occupancy` is the question "is a body or feature being here a
    #: defect?". It is not the same as "is this region important".
    role_policy:
      ACCESS:
        excludes_occupancy: true
        why: >-
          A region the design promises can be reached into. A body sitting in it
          is an access the design does not actually have.
      APERTURE:
        excludes_occupancy: true
        why: >-
          A region something passes through. Material in it is the passage being
          blocked.
      KEEP_OUT:
        excludes_occupancy: true
        why: >-
          A region nothing may enter. A body entering it is the promise being
          broken by the promiser.
      SUPPORT:
        excludes_occupancy: false
        why: >-
          A region where the product meets what carries it. Contact here is the
          POINT of the region, so occupancy is expected and reporting it as an
          intrusion would flag every design that actually rests on something.
          The load-carrying question this region raises is real, but it is a
          different question from occupancy and is not answered by a box test.
    rules:
      - "s03 declares the role. s04a gives it a metric volume. s04b proves occupancy across every state and path."
      - >
        Feature occupancy must satisfy role_policy. A Feature may not occupy a
        region whose role declares excludes_occupancy true; s05 re-runs the
        occupancy check against the new geometry. This was previously stated as
        a blanket rule - "no Feature may intrude into a FunctionalRegion" - which
        contradicts SUPPORT, where contact is the point of the region and
        reporting it would flag every design that actually rests on something.
      - >
        role_policy is the ONE authority on which roles exclude occupancy. s04b
        and S05-C8 must both read it rather than each carrying a list, so the two
        stages cannot reach different answers about the same region.

  AssemblyStep:
    semantic_roles: [spatial_commitment, assembly_order]
    field_semantics:
      body:
        kind: reference
        target: Body
        cardinality: one
        resolvable: false
      path_kind:
        kind: enum
      activates:
        kind: reference
        target: Interface
        cardinality: many
        resolvable: false
      depends_on:
        kind: reference
        target: AssemblyStep
        cardinality: many
        resolvable: false
      insertion_direction:
        kind: spatial
        frame: ReferenceScale
    # U-2A (S-1): declared here for the first time. The field was written
    # directly by a runner helper and had no contract declaration at all.
    extendable_fields:
      insertion_direction: s04
    owned_by: s03
    extendable_by: [s04]
    purpose: "One installation operation, its order, its access side and what it activates."
    required_fields: [entity_id, order_index, body, access_side, activates, termination_strategy, path_kind, depends_on]
    # U-2B (S-2): declared as a field, not only as an extension target.
    optional_fields: [insertion_direction]
    termination_strategy: [LATER_BODY_COVER, ROTATION, ELASTICITY]
    path_kind: [RIGID, DEFORMATION_RESOLVED]
    rules:
      - "A rigid part installed by one straight translation always leaves the reverse direction open; retention needs one of the three termination strategies."
      - "A DEFORMATION_RESOLVED path forces NOT_VERIFIED, never PASS. Rigid geometry cannot observe the deflection the path depends on."
      - "s03 fixes order and access side. Direction FEASIBILITY is proven at s04b."
      - "Subsumes the precedes(Configuration, Configuration) relation recorded as ENTITY_FAMILY_AUDIT GAP-02."

# =====================================================================
# 3. Geometric authority
# =====================================================================
  # -------------------------------------------------------------- U-2A (S-1)
  # Three engineering conclusions that s04a authored and that were held as bare
  # attributes on the state object: no identity, no owner, no provenance, and no
  # contract. Nothing read them. They are class-A facts and are given a home so
  # that U-4 can remove the side channel. Fields mirror what s04a already emits;
  # no new semantics are introduced.
  ReachResult:
    semantic_roles: [reach_evidence]
    field_semantics:
      actor:
        kind: reference
        target: Actor
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s04
    authority_class: AUTHORITATIVE
    purpose: "Whether an actor can reach a target, and from which side. An engineering conclusion of s04a."
    required_fields:
      - entity_id
      - actor
      - target
      - reachable
    optional_fields:
      - approach_side
      - why
    rules:
      - "s04a authors it from the arrangement it produced. It is a conclusion, not a measurement."
      - "Held as a bare state attribute before S-1, so no check could read it and no provenance existed."
  EliminationRecord:
    semantic_roles: [elimination_evidence]
    field_semantics:
      candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
    owned_by: s04
    authority_class: AUTHORITATIVE
    purpose: "Whether s04a eliminated the candidate it was run on, and the geometric reason."
    required_fields:
      - entity_id
      - eliminated
    optional_fields:
      - reason
      - candidate
    rules:
      - >
        Recording an elimination is not selection. S7-A: what ACTS on it is the
        `feasibility` responsibility, which reads it as one local geometric
        finding among the evidence and decides whether this candidate is eligible
        to be chosen from. The choice itself is `selection`'s, later. The rule
        used to name "the gate that does not exist yet", which was true of a
        gate that is not coming.
      - "An elimination with eliminated=true and no reason is an incomplete record, not a decision."
  ReferenceScale:
    semantic_roles: [spatial_commitment, spatial_frame]
    # ENFORCED. The third rule below says a coordinate becomes comparable with a
    # stated quantity ONLY when basis is ABSOLUTE and `absolute` gives both the
    # unit and what one coordinate is worth. That was prose, so "80-100 mm" in
    # the `absolute` field, or a bare number, or {} was written into state and
    # every dimensional comparison downstream silently read a scale that says
    # nothing. RELATIVE with absolute null stays legal and is not defaulted.
    conditional_requirements:
      - name: absolute_scale_is_structured
        applies_when: {field: basis, equals: ABSOLUTE}
        additional_required_fields: [absolute]
        required_shape:
          absolute:
            mapping: true
            required_keys: [unit, per_unit]
            non_empty_string: [unit]
            positive_finite_number: [per_unit]
        why: >-
          An ABSOLUTE basis is a promise that stored coordinates can be compared
          with a stated quantity. Without a unit and a per_unit that is a real
          positive number, the promise is unkeepable and the comparison it
          licenses is meaningless.
    owned_by: s04
    authority_class: AUTHORITATIVE
    purpose: "The basis in which every s04 spatial value is expressed."
    # S-6 / U-7. An s04a spatial COMMITMENT like the envelopes are, and carried
    # the same way - see `spatial_commitments`.
    commitment_class: [PROVISIONAL, COMPARABLE, AUTHORITATIVE, OVERTURNABLE_WITH_REASON]
    required_fields:
      - entity_id
      - basis
    optional_fields:
      - absolute
      - note
    rules:
      - "A coordinate has no meaning without the basis it is expressed in, so this is a representational premise of every s04 spatial commitment."
      - "basis RELATIVE with absolute null is a legitimate, honest value. It is not a defect and must not be defaulted to a number."
      # S7-B. WHAT MAKES A DIMENSIONAL REQUIREMENT EVALUABLE AT ALL. A limit in
      # millimetres and an extent in a relative basis are not comparable, and any
      # rule converting between them would be a consumer choosing the scale this
      # family deliberately leaves free.
      - >
        A stored coordinate becomes comparable with a stated quantity ONLY when
        basis is ABSOLUTE and `absolute` states both the unit and what one
        coordinate is worth in it - {unit, per_unit}. Anything less is
        NOT_YET_EVALUABLE for a dimensional requirement, which is a finding about
        the evidence and not about the design.

  # -------------------------------------------------------------- U-2B (S-2)
  # CURRENT PRODUCER STATUS (S-4):
  #   PhysicalEffectObligation  canonical producer s02   PRODUCED
  #   ReactionSiteRequirement   canonical producer s02   PRODUCED
  #   PhysicalInteraction       canonical producer s03b  PRODUCED
  #   ConstraintRelation        canonical producer s03b  PRODUCED
  #   LoadPath                  canonical producer s03b  PRODUCED, and its
  #                             canonical structure now includes terminates_at
  #
  # ConstraintRelation carried a legacy compatibility input through S-4: the s03b
  # response contained blocking_relations[] and the DOF expansion consumed it.
  # RETIRED at the S-5 correction - no live path parses it - and the last
  # consumer contract requiring it (S04) was corrected at S-6.
  #
  # SUPERSEDED (S-2 state, kept as history, not as current fact):
  #
  # (historical) Canonical substrate only. No stage produces these yet: the physical-effect
  # progression and the constraint relations dispositions will cite are S-4/U-5.
  # What S-2 establishes is that the concepts have an identity, an owner and
  # resolvable references, so no contract requires a family defined nowhere.
  ConstraintRelation:
    semantic_roles: [constraint_relation]
    field_semantics:
      retained_group: {kind: reference, target: RigidGroup, cardinality: one, resolvable: false}
      provider_body: {kind: reference, target: Body, cardinality: one, resolvable: false}
      # S-4. The plan says the provider is a "body or external reaction site", and
      # Body alone could not say the second. A load reacted outside the product is
      # provided by the declared site, not by a body of the product - modelling
      # the world as a body is exactly what ReactionSiteRequirement exists to stop.
      #
      # PROVIDER IDENTITY, which is candidate-independent when it is external.
      # `provider_site` stays what it was: the candidate-local Interface at which
      # the constraint acts. Who provides and where it acts are different facts.
      provider_reaction_site: {kind: reference, target: ReactionSiteRequirement, cardinality: one, resolvable: false, referent_population: DESIGN_WIDE}
      provider_site: {kind: reference, target: Interface, cardinality: one, resolvable: false}
      configurations: {kind: reference, target: Configuration, cardinality: many, resolvable: false}
      maintaining_interaction: {kind: reference, target: PhysicalInteraction, cardinality: one, resolvable: false}
      # Symbolic direction token, same correction as Joint.axis_direction. This
      # family declares no frame of its own, and the relation it blocks is named
      # by `retained_group`; the token is a direction class, not a placed vector.
      blocked_direction: {kind: enum}
    owned_by: s03
    authority_class: AUTHORITATIVE
    addressable: true
    purpose: >
      What constrains a rigid group, in which direction, in which configurations,
      provided by what, and how a test would defeat it. Replaces the
      non-addressable blocked_by relation.
    required_fields: [entity_id, retained_group, blocked_dofs, configurations, driver]
    optional_fields: [blocked_direction, provider_body, provider_reaction_site, provider_site,
                      maintaining_interaction, defeat_specification, release_transition]
    driver: [LOAD, KINEMATIC_NECESSITY, DECLARED_SCENARIO]
    rules:
      - "It has an id, so a mobility disposition can cite it and the citation resolves."
      - "'Is this DOF constrained?' is answered by the relation existing; 'what constrains it?' by provider_body / provider_site / maintaining_interaction. Two questions, two answers."
      - "A provider is a resolvable reference or the relation is incomplete. No sentinel string stands in for one."
      - >
        The provider is a body of the product OR a declared external reaction
        site. `provider_site` is neither: it is the candidate-local Interface at
        which the constraint acts. A relation may name where it acts without
        naming what provides it, and saying only where would leave the constraint
        standing on nothing.
      - "S-2 defines it. S-4/U-5 is where s03 begins producing it."

  PhysicalEffectObligation:
    semantic_roles: [physical_effect_obligation]
    field_semantics:
      # S-4 CORRECTION. This was a reference to Actor, which conflates two things
      # the architecture keeps apart: an Actor is an EXTERNAL participant, while
      # these are PRODUCT/FUNCTION roles - "a force must pass from the actuation
      # role to the closing role". The freeze says "between which roles (never
      # bodies - they do not exist yet)" and never gives a role an addressable
      # identity; LoadCase.applied_to_role and reacted_at_role already carry roles
      # the same way, as declared values.
      #
      # Discharge stays checkable through PhysicalInteraction.discharges_effect,
      # which IS addressable - that never depended on roles being entities.
      between_roles: {kind: role_name, cardinality: many}
      under_load_case: {kind: reference, target: LoadCase, cardinality: one, resolvable: false, referent_population: DESIGN_WIDE}
      addresses_obligations: {kind: reference, target: Obligation, cardinality: many, resolvable: false, referent_population: DESIGN_WIDE}
    owned_by: s02
    authority_class: AUTHORITATIVE
    purpose: >
      What physical effect must occur, between which ROLES, under which load case
      or scenario - stated without naming a mechanism. Replaces the undefined
      PhysicalEffectObligation, which named bodies at a stage forbidden to decide them.
    required_fields: [entity_id, effect, between_roles, addresses_obligations]
    optional_fields: [under_load_case, persistence]
    effect: [TRANSMIT_FORCE, TRANSMIT_MOTION, CONVERT_MOTION, PERMIT_MOTION,
             PREVENT_MOTION, LOCATE, CONTAIN, METER]
    persistence: [PERSISTENT, INTERMITTENT, RELEASABLE]
    rules:
      - "Roles, never bodies. s02 may not decide topology, and a body-level hypothesis decides it."
      - "S-2 defines it. S-4/U-5 is where s02 begins producing it."

  PhysicalInteraction:
    semantic_roles: [physical_interaction]
    field_semantics:
      groups: {kind: reference, target: RigidGroup, cardinality: many, resolvable: false}
      at_interface: {kind: reference, target: Interface, cardinality: one, resolvable: false}
      configurations: {kind: reference, target: Configuration, cardinality: many, resolvable: false}
      discharges_effect: {kind: reference, target: PhysicalEffectObligation, cardinality: one, resolvable: false, referent_population: DESIGN_WIDE}
    owned_by: s03
    authority_class: AUTHORITATIVE
    purpose: >
      What physically transmits a required effect between two rigid groups.
      Distinct from Joint: a joint CONSTRAINS, an interaction TRANSMITS. Replaces
      the undefined PhysicalInteraction.
    required_fields: [entity_id, groups, effect, discharges_effect]
    optional_fields: [at_interface, configurations]
    rules:
      - "Every PhysicalEffectObligation is discharged by a named interaction or is explicitly open. Checkable because the reference resolves."
      - "S-2 defines it. S-4/U-5 is where s03 begins producing it."

geometric_authority:
  rule: >
    Pose, orientation, extent, offset, motion path, contact, clearance and
    geometric feasibility are represented and proven by metric geometry.
  field_roles:
    authoritative: "metric type; may be an input to a geometric predicate"
    annotation: "enum/ordinal/label; MAY exist; may NEVER be a predicate input"
  predicate_rule: >
    Every geometric predicate declares its input fields. If any input resolves to
    an annotation-role field, the predicate is INVALID.
  ablation_rule: >
    Dropping every annotation-role field must not change any geometric verdict.

  maturity_rule:
    principle: >
      Maturity is a property of a VALUE, not of a stage. Within one patch some
      values are authoritative and others provisional.
    vocabulary: [SYMBOLIC, PROVISIONAL, AUTHORITATIVE, FROZEN]
    required_on: "every authoritative_geometry field, and every Parameter value"
    why: >
      Without it a scout-informed placeholder and a solved value are
      indistinguishable, and no check can refuse immature input - which is how a
      proxy result gets cited as a CAD result.
    check_precondition: >
      A check declares the minimum maturity of its inputs. Running below it is a
      SCHEMA_FAILURE, not a warning.
    worked_case: >
      A joint frame placement is created PROVISIONAL at s04b and promoted to
      AUTHORITATIVE at s06, because its value depends on a feature envelope that
      does not exist at s04b (BM-002 CHG-01).

  derived_not_stored:
    principle: >
      A value that is a projection of other state is DERIVED and must not be
      stored as a field.
    instances:
      - what: "per-element load components"
        derived_from: LoadPath
        why: >
          A stored field would be candidate-independent-looking about a
          candidate-dependent fact, and a later stage could not tell whether it
          was traced or assumed. This is SF-5.3 at the data level.
      - what: "the pose law"
        derived_from: "located Joint frames + State joint_coordinates"
        why: >
          Authoring it makes motion an s05/s07 concern and contradicts s04's
          ownership of State and Transition. Deriving it removes the s07 input
          contradiction entirely.
      - what: "support"
        derived_from: "an Interface of contact kind appearing in a LoadPath"
      - what: "reaction"
        derived_from: "the terminal hop of a LoadPath"

# =====================================================================
# 3b. Typed relations
#     Relations between existing families. NO new family is implied by these.
# =====================================================================
typed_relations:

  # U-2B (S-2): `blocked_by` is RETIRED as an authoritative relation shape. It
  # had no identity, so a disposition citing it could not be resolved, and
  # "is this DOF constrained?" and "what constrains it?" could not be asked
  # separately. Its semantics move to the ConstraintRelation entity family,
  # which has an id. Retained here only as a retirement record.
  blocked_by:
    status: RETIRED_BY_S2
    superseded_by: ConstraintRelation
    may_be_referenced: false
    retirement_reason: >
      Non-addressable. A relation the architecture treats as first-class must
      have a resolvable id (freeze FA-12, R-10).
    created_by: s03
    subject: RigidGroup
    required_fields: [retained_group, blocked_direction, blocker_body, promised_features, configurations, defeat_specification, driver]
    optional_fields: [depends_on_compliant_recovery]
    driver: [LOAD, KINEMATIC_NECESSITY, DECLARED_SCENARIO]
    rules:
      - "Direction and blocker are required TOGETHER. A blocking fact without a direction cannot be tested, and one without a named blocker passes when an unrelated body happens to be in the way."
      - "driver LOAD requires a LoadCase. driver KINEMATIC_NECESSITY does not - a lead-screw nut is anti-rotated because the conversion needs it (NRM-BM-002-007 exclusion b)."
      - "defeat_specification is authored HERE, with the relation, never reconstructed from geometry at s08."
      - "depends_on_compliant_recovery names the compliant Joint whose return to zero the retention requires."

  retained_by:
    status: RETIRED_BY_S2
    superseded_by: ConstraintRelation
    may_be_referenced: false
    retirement_reason: >
      Non-addressable, exactly as blocked_by was. A relation a downstream entity
      may cite must have a resolvable id; these had none, so the citation could
      not be checked. Semantics move to the superseding addressable family.
    created_by: s03
    purpose: "Joint capture: neither retainer alone suffices."
    required_fields: [retained_group, retainer_groups, configuration]
    resolves: "ENTITY_FAMILY_AUDIT GAP-01"

  co_actuated_by:
    status: RETIRED_BY_S2
    superseded_by: PhysicalInteraction
    may_be_referenced: false
    retirement_reason: >
      Non-addressable, exactly as blocked_by was. A relation a downstream entity
      may cite must have a resolvable id; these had none, so the citation could
      not be checked. Semantics move to the superseding addressable family.
    created_by: s03
    purpose: >
      Several compliant Joints moved together by one Transition. This is what a
      compliant REGION is: a set of joints, not an entity.
    required_fields: [joints, transition]

# =====================================================================
# 4. What DesignState may never contain
# =====================================================================
prohibited_content:
  - what: "raw request text at or after Stage 02"
    invariant: INV-002
    retirement_row: R-13
  - what: "an entity whose provenance names a render step"
    invariant: INV-005
    retirement_row: R-01
  - what: "a geometric property whose authoritative value is an enum or ordinal"
    invariant: INV-003
    retirement_rows: [R-02, R-03, R-04, R-05]
  - what: "a defaulted unit, dimension, face, axis, span, placement or form"
    invariant: INV-004
    retirement_row: R-21
  # S7-A: there is no "Stage 03/04 feasibility gate". Nothing before the
  # `selection` responsibility may hold a selected candidate, and that is a
  # stronger and simpler statement than the one that named a gate between two
  # s04 passes.
  - what: "a selected-candidate field anywhere before the `selection` responsibility"
    invariant: INV-007
    retirement_row: R-15
  - what: "a free-string subject"
    invariant: INV-001
    retirement_row: R-20
  - what: "an entity created by a stage that does not own its type"
    invariant: INV-001
    reference: STAGE_OWNERSHIP_MATRIX.yaml

# =====================================================================
# 5. Serialization
# =====================================================================
serialization:
  canonical_form:
    rule: "Sorted keys, explicit units, no timestamps, no absolute paths, no RNG."
    why: "Determinism is a build property (INV-018); byte-identical on re-run."
  forbidden_in_output: [wall_clock_time, absolute_filesystem_path, unseeded_random, set_iteration_order]

# =====================================================================
# 6. Families required by the runtime assurance package
#    GENERATED_ASSURANCE_PACKAGE_CONTRACT defines a PROJECTION of this state.
#    A projection can only show what the state holds, so every element the
#    package must be capable of containing needs a typed home here. Adding these
#    families is what stops the package becoming a second design world or a
#    hand-assembled report disconnected from stage output.
# =====================================================================
assurance_families:

  SourceClause:
    field_semantics:
      directionality:
        kind: enum
    owned_by: s01
    purpose: "A verbatim span of the source request, with its locator."
    required_fields: [entity_id, verbatim, locator, quantity_kinds, directionality]
    rules:
      - "The only family that may hold source text. Nothing downstream re-reads it (INV-002)."

  Assumption:
    owned_by: any
    purpose: "An inferred fact that the source did not state."
    required_fields: [entity_id, statement, inferred_by_stage, why, would_be_invalidated_by]
    rules:
      - "A user-stated fact is a SourceClause. An inferred one is an Assumption. Conflating them is a defect."

  Freedom:
    semantic_roles: [open_question]
    owned_by: s01
    purpose: "A decision the source deliberately leaves open."
    required_fields: [entity_id, decision, why_free]
    rules:
      - "A freedom may never become an assertion target (INV-014)."

  Ambiguity:
    semantic_roles: [open_question]
    owned_by: s01
    purpose: "A source conflict recorded rather than resolved."
    required_fields: [entity_id, statement, conflicting_clauses, resolvable_when]

  Actor:
    semantic_roles: [actor_role]
    owned_by: s01
    purpose: "A participant outside the product that operates or receives it."
    required_fields: [entity_id, name, must_reach]
    rules:
      - >
        must_reach lists what this actor must be able to operate or access. It is
        what makes reachability a checkable obligation at s04a rather than an
        assumption; an actor with nothing to reach is not an actor.

  Scenario:
    semantic_roles: [scenario_context]
    field_semantics:
      actors:
        kind: reference
        target: Actor
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s01
    purpose: "A declared operating scenario with its boundary."
    required_fields: [entity_id, name, kind, system_boundary, actors, environment]
    kinds: [OPERATION, SERVICE, ASSEMBLY, TRANSPORT]
    rules:
      - >
        kind is required. Service is a DIFFERENT activity from operation and
        retention requirements differ between them; without the distinction a
        design either forbids service or lets retention mean two things at once.

  RejectedAlternative:
    owned_by: any
    purpose: "A candidate, principle or arrangement that was considered and dropped."
    required_fields: [entity_id, what, rejected_by_stage, reason_kind, reason, evidence]
    reason_kinds: [SOURCE_CONTRADICTION, PHYSICAL_INFEASIBILITY, FEASIBILITY_EVIDENCE, SUPERSEDED]
    rules:
      - "Rejection for absence-from-library is NOT a reason kind; that is UNSUPPORTED (INV-011)."
      - "Failed alternatives are retained, never deleted. The package must be able to show them."

  AcceptanceContract:
    semantic_roles: [candidate_acceptance]
    field_semantics:
      candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
      obligations:
        kind: reference
        target: Obligation
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s02
    purpose: "What a specific candidate must satisfy to be judged realized."
    required_fields: [entity_id, candidate, obligations, predicates]

  Configuration:
    # S-3 contract closure. `bodies_present` carries Body IDs and declared no
    # reference semantics, so the reference graph could not see the edge. This
    # makes an already-required relationship machine-representable; it changes no
    # stage responsibility and no engineering meaning.
    field_semantics:
      bodies_present:
        kind: reference
        target: Body
        cardinality: many
        resolvable: false
      # THE NESTED REFERENCES, typed. `distinguishing_basis` is a list of
      # {rigid_group, dof, differs_from[]} and both id-bearing members were
      # unreachable by any boundary: a group id that named nothing, or named a
      # Body, was accepted, and the s04b check that realizes this basis in
      # coordinates would then be comparing against a record it cannot resolve.
      #
      # A plain record list, not a premise-record list: every row has the same
      # shape and there is no discriminator, so declaring one would be inventing
      # structure to reach the existing walker.
      distinguishing_basis:
        kind: record_list
        record_field_semantics:
          rigid_group:
            kind: reference
            target: RigidGroup
            cardinality: one
            resolvable: false
          differs_from:
            kind: reference
            target: Configuration
            cardinality: many
            resolvable: false
    semantic_roles: [configuration_state]
    owned_by: s03
    purpose: "A named assembly configuration, e.g. partially assembled, closed."
    required_fields: [entity_id, name, bodies_present, expected_mobility]
    # S-6 / U-7. WHAT MAKES THIS CONFIGURATION A DIFFERENT ONE - the (rigid
    # group, DOF) pairs whose values distinguish it from its named siblings.
    # s03 authors it, because it is a mobility statement and not a geometry
    # statement, and s04b must realize it: without it, two configurations differ
    # only by having different ids, and a realization that gives them identical
    # coordinates cannot be told from one that does not.
    optional_fields: [distinguishing_basis, kind]
    rules:
      - >
        distinguishing_basis is a list of {rigid_group, dof, differs_from}. It is
        OPTIONAL: a mechanism may declare no required distinctness, and the check
        that realizes it is conditional on the declaration. It is never "all
        joint pairs must differ", which would be a rule about products rather
        than about this design.

  MobilityExpectation:
    # Role declared at S-7 / U-8: the family carried none, so a responsibility
    # needing to know what a DOF is dispositioned as could not ask by role.
    semantic_roles: [mobility_disposition]
    # DECLARED, not defaulted. This entity is the AUTHORITATIVE DISPOSITION
    # CONTAINER: what it stores is engineering claims about DOF cells. It does
    # not store the domain, so it carries no class-B content and needs no
    # per-field override - see authority.class_overrides_note.
    authority_class: AUTHORITATIVE
    field_semantics:
      configuration:
        kind: reference
        target: Configuration
        cardinality: one
        resolvable: false
      # S-5 correction. `authorship_split.disposition` declared premise_required
      # and premise_target in PROSE, and the premise itself was a bare string
      # inside a list of records - a shape no boundary could see. The write
      # boundary walks top-level fields, so `constraint_relation: "anything"`
      # entered state unexamined, and "every disposition cites a resolvable
      # premise" was a claim about the producer rather than a property of the
      # data.
      #
      # ONE premise field per disposition, each with its own target family. That
      # is what makes the premise TYPED: the disposition value selects which
      # field must be present, and the field selects which family it must
      # resolve to. A single premise_target could not do this - a Joint, a
      # ConstraintRelation and a Scenario are three different kinds of evidence
      # for three different claims, and collapsing them would make "is this the
      # right kind of premise?" unanswerable.
      dispositions:
        kind: premise_record_list
        discriminator: disposition
        # rigid_group / configuration / dof are the ADDRESS of the derived cell
        # this claim is about. They identify which cell; they do not assert that
        # it exists. Cell existence has exactly one executable answer -
        # `current_dof_domain`, computed from standing branch topology - and no
        # stored structure is consulted for it. A record whose address is not in
        # the current domain is a claim about a cell the design no longer has,
        # which is what DOF_DISPOSITION_OUT_OF_DOMAIN reports.
        cell_address: [rigid_group, configuration, dof]
        premise_field:
          INTENDED: by_joint
          BLOCKED_BY: constraint_relation
          IRRELEVANT_BECAUSE: scenario
          UNDISPOSITIONED: null
        record_field_semantics:
          by_joint:
            kind: reference
            target: Joint
            cardinality: one
            resolvable: false
          constraint_relation:
            kind: reference
            target: ConstraintRelation
            cardinality: one
            resolvable: false
          scenario:
            kind: reference
            target: Scenario
            cardinality: one
            resolvable: false
            referent_population: DESIGN_WIDE
    owned_by: s03
    purpose: >
      Two different things about degrees of freedom, kept apart: which DOF cells
      EXIST, and what is known about each.
    # U-2B (S-2): the authorship split. Before it one field carried both, so
    # "this cell exists" and "there is engineering evidence for this cell" were
    # indistinguishable - which is how a deterministic enumerator could appear to
    # have established a mobility conclusion.
    #
    # LIVE at S-5 / U-6 (ADR-005): the derivation implements this split, and the
    # premise declaration above is what makes `premise_required` checkable rather
    # than asserted.
    authorship_split:
      domain:
        authority_class: DERIVED
        authored_by: deterministic
        # NOT STORED. This is what makes the class-B claim operational rather
        # than prose: the domain is a pure function of standing branch topology,
        # recomputed on every read, held in no entity and revised by no
        # operation. An entity that stored it would be a second authority for
        # cell existence sitting inside an AUTHORITATIVE family - which is the
        # mismatch this declaration used to describe rather than prevent.
        stored: false
        computed_by: "stages.s03_topology_and_mobility.current_dof_domain"
        recomputed_from: [standing RigidGroup, standing Configuration, branch membership]
        meaning: >
          the complete set of (rigid group, configuration, DOF) cells OF ONE
          BRANCH. A mechanism is a branch's, so a cell pairing one alternative's
          group with another's configuration belongs to no mechanism and is not
          in any domain. Over accumulated state holding several alternatives the
          domain is the UNION of the branches', never the product of every group
          with every configuration.
        currentness: >
          STANDING topology only. Superseded, invalidated and stale records stay
          readable as history (FA-1) and define nothing: the ConsumerView the
          producer works from has always been standing-only, so a domain computed
          over all history was a SECOND currentness rule inside one pipeline.
        totality: >
          Structurally testable, and BOOKKEEPING: it is guaranteed by the
          enumerator and may never be counted as engineering assurance. Scoping
          it to the branch and to standing topology does not change that - it
          makes the bookkeeping about the production it is bookkeeping for.
      disposition:
        authority_class: AUTHORITATIVE
        authored_by: "model, or strictly derived from an explicit sufficient premise"
        premise_required: true
        # WHICH premise is per disposition and is declared, machine-readably, in
        # field_semantics.dispositions.premise_field above. A single
        # premise_target named only BLOCKED_BY's, so the other two dispositions
        # had no declared evidence type at all.
        premise_target: "field_semantics.dispositions.premise_field"
        meaning: "what is known about one cell, and on what evidence"
        # A CITATION AND A DEPENDENCY ARE TWO FACTS. The premise fields above
        # make the citation typed and checkable at the write boundary. FA-4
        # additionally requires a class-B value to carry its premise SET, so the
        # premises a MobilityExpectation's cells were actually derived from are
        # also its `Op.premise_refs` - the same substrate every other dependent
        # value uses, so FA-5 stales it when one of them is superseded or
        # invalidated. The dependency set is DERIVED from the cited premises and
        # is not a second canonical field: cells that cite nothing, which is what
        # UNDISPOSITIONED does, contribute nothing.
        dependency: >
          TWO HALVES, both on the creating operation, with different
          consequences. DOMAIN-DEFINING: the candidate whose branch this is, the
          Configuration, and every RigidGroup whose cells this record contains -
          withdraw one and the cells stop being in the current domain, so the
          grid describing them must lose standing with them. DISPOSITION: the
          premises the cells actually cite - withdraw one and the cells remain
          while the conclusion about them loses unqualified authority.
          Availability is not dependency: an entity the consumer view held and no
          cell used is not a premise, and UNDISPOSITIONED contributes none.
        completeness: >
          A separate, reported engineering quantity. NOT implied by domain
          totality, and not satisfied by it.
    required_fields: [entity_id, configuration, dispositions]
    # The LIVE vocabulary. UNDISPOSITIONED was vocabulary only at S-2; the
    # behaviour arrived at S-5 / U-6.
    disposition_values: [INTENDED, BLOCKED_BY, IRRELEVANT_BECAUSE, UNDISPOSITIONED]
    retired_disposition_values:
      MAINTAINED_BY_CLASS:
        retired_by: "S-5 / U-6 correction"
        was: >
          written by the derivation's else branch with a holding_class composed
          from the first joint reaching the group, or the literal string "joint
          class of no joint" when there was none
        why_retired: >
          Its evidence was a CLASS STRING. A string names no entity, so it can
          never be the resolvable premise U-6 requires, and no frozen source
          supplies one: proposal 11.2 and 20.2 enumerate exactly INTENDED,
          CONSTRAINED, IRRELEVANT and UNDISPOSITIONED. S-5 stopped producing it
          from absence but left it in the vocabulary, which kept a legal
          disposition that nothing could back - an enum member preserved because
          historical code used it. A cell a joint class would have "maintained"
          is UNDISPOSITIONED, which is the true statement.
        historical_data: >
          Recordings and replays predating the retirement contain it. Corpus debt
          (Impl S-9); no live producer emits it and the write boundary rejects it.
    rules:
      - >
        TOTALITY. dispositions is a TOTAL function: for every rigid group in the
        configuration, every rigid-body DOF maps to exactly one value. A declared
        set that omits a DOF cannot fail, and all three BM-001 human-review
        rejections plus BM-003 R2 were omissions from declared sets.
      - "BLOCKED_BY must cite an addressable ConstraintRelation by id. The former blocked_by relation had no identity, so the citation could not be resolved."
      - "UNDISPOSITIONED is the honest value for a cell no premise covers. Vocabulary at S-2; the behaviour is S-5."
      - >
        A PREMISE DISPOSES THE CELLS IT DECLARES AND NO OTHERS. A ConstraintRelation
        expands over its own retained_group, its own blocked_dofs and its own
        configurations; one that declares no configuration holds in none, because
        an empty declaration is the author saying nothing rather than saying
        everywhere. A Joint declares no configuration set at all, so it is
        unconditioned by construction - silence about a field that exists is not
        the same fact as a field that does not.
      - >
        IRRELEVANT_BECAUSE must name a scenario in which that DOF is both
        unloaded and unactuated, cross-checked against the LoadCases. This is
        what converts the one unverifiable disposition into a checkable one.
        The scenario is a REFERENCE and must resolve. What the bounded check
        establishes today is scenario-level: a scenario carrying any load case is
        not one in which anything is unloaded. Per-DOF load and actuation
        resolution is the ENGINEERING CONSEQUENCE check the plan assigns to U-9,
        and no rule here should be read as claiming it already happens.
      - "This output is a mechanical FMEA obtained free from the joint graph."

  Witness:
    owned_by: [s04, s09]
    purpose: >
      An executable demonstration that something holds: an assembly insertion,
      a mobility count, a full-operation cycle.
    required_fields: [entity_id, witness_kind, subject, method, fidelity, result, artifacts]
    witness_kinds: [ASSEMBLY_INSERTION, MOBILITY, DOF_ABSENCE, FULL_OPERATION, ENGAGEMENT_PERSISTENCE, RETENTION_PERSISTENCE, SCOUT]
    rules:
      - "A witness declares its fidelity. A proxy-geometry witness is not a CAD witness."
      - >
        A witness of fidelity SCOUT is exploratory geometry. It may ONLY RAISE,
        never SET: it may raise an UnresolvedDecision, propose a Constraint, or
        report a measured conflict. It may never supply a value, a pose, a form
        or a placement.
      - "A SCOUT witness may not CREATE or EXTEND any other entity, and s07 must never read one."
      - "It records the parent_state_hash it was built from and must be re-derivable from it."
      - "Every SCOUT finding must be DISCHARGED before its stage's gate: by a change the owning stage makes for its own reasons, or by a recorded decision not to."
      - >
        Laundering barrier: a Parameter value's provenance must cite a Constraint,
        and a Constraint's provenance must cite a Requirement, an Obligation, a
        feature envelope or a LoadCase - NEVER a Witness.

  ConstructionStatement:
    field_semantics:
      body:
        kind: reference
        target: Body
        cardinality: one
        resolvable: false
      feature:
        kind: reference
        target: Feature
        cardinality: one
        resolvable: false
      # AN AXIS NAME, not a direction vector. ROTATE turns about one of the
      # owning body's own axes, so the value is X, Y or Z and carries no frame of
      # its own - the frame is the body's, by the construction frame rule. A
      # spatial declaration here would claim a coordinate this field never holds.
      axis:
        kind: enum
    owned_by: s05
    purpose: "One step of the ConstructionProgram that Stage 07 compiles."
    required_fields: [entity_id, operation, operands, parameters]
    # Declared so state can hold them. `body` is what the construction frame rule
    # implies - a statement is expressed in the OWNING body's own frame, so there
    # is an owning body - and s07 refuses a statement it cannot attribute to one.
    # The COMPILER requires it; storage does not, and the required_fields above
    # are left as authored rather than widened to suit an implementation.
    # `axis` is required by ROTATE and by nothing else; `feature` links the step
    # to the Feature it realizes, which is what makes geometry traceable upstream.
    optional_fields: [body, axis, feature]
    rules:
      - "Stage 07 compiles these or fails, preserving the originating statement (INV-006)."
      - "Expressed in the owning body's own frame. World placement never appears in a construction program."

  GeometrySignature:
    owned_by: s07
    # s07 EXTENDS NOTHING, and that is a currentness fact rather than a
    # preference. An extension by a stage outside the owner stales what was
    # concluded from the record, so recording compilation facts onto Body and
    # Feature staled every construction statement premised on that Body - the
    # compiler's own record of success invalidating the inputs it had just
    # compiled, in the ordinary successful flow.
    #
    # The facts belong here instead. `per_body` already carried the measurements;
    # `feature_map` carries the statement->feature traceability that made
    # `Why does this geometry exist` answerable. One owner, one record, and
    # nothing upstream is disturbed by a successful compile.
    optional_fields: [feature_map, compiled_bodies]
    purpose: "A deterministic semantic description of built geometry."
    required_fields: [entity_id, signature_sha256, per_body, critical_dimensions]

  NegativeControl:
    owned_by: [s08, s09]
    purpose: "A deliberate mutation and whether its validator detected it."
    required_fields: [entity_id, control_id, mutation, checked_by, detected, measured]
    rules:
      - "A control that cannot fail is not a control. `detected` is measured, never asserted."

  ExcludedClaim:
    owned_by: s11
    purpose: "A property the evidence does NOT establish, named explicitly."
    required_fields: [entity_id, claim, why_not_established, would_require]
    rules:
      - "Silence is not exclusion. A property outside the evidence must be named."

  FailureProvenance:
    owned_by: s12
    purpose: "A failure routed to the decision and stage that own it."
    required_fields: [entity_id, failure, owning_decision, owning_stage, invalidation_cone, revision_patch]

  HumanReviewQuestion:
    owned_by: s12
    purpose: "A question only a human can settle, carried to the end."
    required_fields: [entity_id, question, why_human, relates_to]
    rules:
      - "Every question is PENDING until a human answers it. The pipeline never self-approves."

  # ---- added in Window 2 -------------------------------------------------
  # Three families the s04 contract requires the stage to CREATE and which the
  # representation could not express at all. Rule 8 is satisfied by that
  # absence: an s04a that must produce an Envelope has nowhere to put one.
  # AMBIGUOUS GEOMETRY ESTABLISHES NOTHING. A body carrying more than one current
  # extent has no extent any deterministic verdict may use: `feasibility` treats
  # it exactly as an unplaced body, so no gap, overlap, insertion corridor or
  # overall dimension can be computed from a box that nothing selected. Detecting
  # the duplicate and then measuring with whichever one an index kept is how a
  # recognised ambiguity still decided a verdict - and decided it differently
  # depending on which envelope was written last. (S7-B closure)
  Envelope:
    semantic_roles: [spatial_commitment]
    field_semantics:
      body:
        kind: reference
        target: Body
        cardinality: one
        resolvable: false
      extent:
        kind: spatial
        frame: Envelope.frame
      frame:
        kind: spatial
        frame: SELF_DECLARING
        note: this field IS the frame declaration other spatial values cite
    owned_by: s04
    purpose: "A body's provisional extent. Conservative: no-overlap is a proof, overlap is not."
    required_fields: [entity_id, body, extent, frame, maturity]
    maturity: [PROVISIONAL, AUTHORITATIVE]
    # S-6 / U-7. Freeze section 7: a commitment carries a CLASS, and a later
    # stage may refine within it or supersede it with an explicit reason, never
    # silently contradict it. Before S-6 an s04a extent carried maturity and no
    # class, so "s04b may extend this but not contradict it" had nowhere to live
    # and no operation could be checked against it.
    commitment_class: [PROVISIONAL, COMPARABLE, AUTHORITATIVE, OVERTURNABLE_WITH_REASON]
    rules:
      - "extent is an axis-aligned half-extent triple in the body frame."
      - "PROVISIONAL means the value follows from packaging reasoning, not from a feature."
      - >
        s04a commits COMPARABLE: the arrangement exists so alternatives can be
        compared on it, which is a stronger claim than PROVISIONAL and a weaker
        one than AUTHORITATIVE.
      - >
        A later pass EXTENDS a commitment - adding what the commitment left open
        - or SUPERSEDES it with a GEOMETRIC REASON. Superseding is a premise
        change, so every spatial value that cited this envelope loses unqualified
        authority through the ordinary FA-5 path. A revision with no reason is
        refused; a revision that is not recorded at all is the audited defect.
  SweptVolume:
    semantic_roles: [motion_occupancy]
    field_semantics:
      rigid_group:
        kind: reference
        target: RigidGroup
        cardinality: one
        resolvable: false
      transition:
        kind: reference
        target: Transition
        cardinality: one
        resolvable: false
    owned_by: s04
    purpose: "The occupancy of a moving group along a transition, at the sampling the computation performed."
    required_fields: [entity_id, rigid_group, transition, sampling_declaration, occupancy, fidelity]
    fidelity: [ENDPOINTS_ONLY, SAMPLED, SWEPT, CONTINUOUS]
    rules:
      # RETIRED at S-6 / U-7: "endpoint-only sampling is refused". It sat beside
      # the rule below, which names ENDPOINTS_ONLY as a level this method
      # produces, and beside a `fidelity` vocabulary containing it - so the
      # family refused a value it also enumerated. Refusing a density
      # categorically is a rule about how much evidence an unseen claim needs,
      # which belongs to the claim and to assurance (S-8 / U-9), not to a schema.
      - "sampling_declaration is mandatory and non-adaptive. It records what the computation DID."
      - "fidelity records what the occupancy is made of, so a coarse hull is never read as a proof."
      - >
        S-6 / U-7: fidelity is the MOTION EVIDENCE LEVEL, and it is an output of
        the computation. This pipeline unions the axis-aligned bounds of discrete
        poses, so it can produce ENDPOINTS_ONLY or SAMPLED and never SWEPT or
        CONTINUOUS; the vocabulary containing those words is not permission to
        claim them. A transition with no SweptVolume was not evidenced.

  # ================================================================== S-7 / U-8
  # THE TWO QUESTIONS SELECTION USED TO ASK AT ONCE.
  #
  #   CAN THIS DESIGN WORK?      candidate-local, preference-blind, no winner
  #   WHICH WORKING DESIGN?      comparison, preferences, advice, a human
  #
  # The old `gate` responsibility asked both and answered them in one act, which
  # is how a preference could reach a feasibility judgement: a four-bar that
  # works is not less feasible than a hinge that works, and nothing in the old
  # shape could say so. The families below make the two answers separate facts
  # with separate producers, separate premises and separate reopening behaviour.
  #
  # DECLARED HERE AHEAD OF THEIR PRODUCERS, which is this contract's normal way
  # of working (`legacy_producers.rule`): S7-A freezes the authority, S7-B..S7-E
  # build it. A family with no producer is a defined target, never a claim that
  # anything emits it.

  DesignConstraint:
    semantic_roles: [design_constraint]
    field_semantics:
      derived_from_requirements:
        kind: reference
        target: Requirement
        cardinality: many
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: s01
    authority_class: AUTHORITATIVE
    purpose: >
      A HARD requirement on the design, from the user's design profile or from
      the source. It is not a preference and never becomes one: "all parts must
      be plastic" constrains what may be built, where "minimise part count" only
      says which buildable thing is wanted.
    required_fields: [entity_id, kind, statement, source, evaluability]
    optional_fields: [parameters, blocks_selection, derived_from_requirements]
    evaluability: [MACHINE_EVALUABLE, HUMAN_EVALUABLE]
    # THE KINDS THIS PIPELINE CAN CARRY, and what each needs before it means
    # anything. A kind absent from this list is not ingested from either channel:
    # a constraint nothing can act on is a word, and inventing a kind to hold it
    # would be inventing the requirement.
    #
    # `quantity` names the parameter that carries the number. A QUANTITATIVE kind
    # may be ingested FROM THE SOURCE only when the Requirement it comes from has
    # quantity_class MAGNITUDE and that parameter is present and numeric - which
    # is how "keep it reasonably compact" is refused without any code reading the
    # prose. s01's own typed capture answers it. (S7-B correction)
    kinds:
      MATERIAL_CLASS_ONLY:
        quantitative: false
        parameters: [material_class]
      PROHIBITED_ENERGY_SOURCE:
        quantitative: false
        parameters: [source]
      MAX_OVERALL_DIMENSION:
        quantitative: true
        quantity: limit
        parameters: [axis, limit, unit]
      LOAD_CAPACITY:
        quantitative: true
        quantity: magnitude
        parameters: [magnitude, unit]
    origins:
      user_design_profile: >
        A structured section the user supplied. Carried across exactly, with no
        completeness demand: a limit with no unit stays one, and the compliance
        record downstream says NOT_YET_EVALUABLE.
      explicit_source_requirement: >
        A hard requirement the user STATED IN THE REQUEST, captured by s01
        alongside the Requirement it comes from and normalized deterministically
        after the model's output. It must name that Requirement, so a constraint
        always leads back to the sentence that created it.

        A HARD REQUIREMENT MUST NOT DEPEND ON A PROFILE EXISTING. "All parts must
        be plastic" in the request is the same demand whether or not anyone also
        wrote it into a structured file, and reading only the profile lost it
        entirely on every design that shipped without one.
    rules:
      - >
        Ingested DETERMINISTICALLY from BOTH channels. A profile that already
        says PLASTIC_ONLY is a fact, and asking a model to reinterpret it would
        turn a stated requirement into an inference. A source-stated requirement
        is transcribed and classified during ordinary capture - which the model
        may do - and then normalized by code, which is what keeps the parameters
        the user's.
      - >
        NOTHING IS COMPLETED. A stated limit with no unit, or no axis, is carried
        as stated; the missing piece surfaces downstream as NOT_YET_EVALUABLE.
        Filling it would answer the requirement from a number nobody supplied.
      - >
        blocks_selection says whether an unsatisfied instance stops a final
        choice. Default true. A constraint that blocks nothing is a preference
        wearing the wrong word.
      - >
        A PREFERENCE NEVER BECOMES ONE, and the enforcement is structural in both
        channels: the profile ingester names one section and never reads the
        other, and EVERY entry from EITHER channel must carry a kind from the
        list above - which contains no way to say "fewer" or "smaller is nicer".
      - >
        ONE VOCABULARY AUTHORITY, WHICHEVER DOOR THE CONSTRAINT CAME IN. The
        profile channel used to take the file's word for the kind, on the
        reasoning that a structured input is already a fact - so a section headed
        `design_constraints` could carry MINIMIZE_PART_COUNT and make a wish into
        a hard requirement by the one route the other channel is built to refuse.
        Being structured says the value was not inferred; it does not say the
        value is one anything can act on. (S7-B closure)

  HardRequirementCompliance:
    semantic_roles: [eligibility_evidence]
    field_semantics:
      candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
      constraint:
        kind: reference
        target: DesignConstraint
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
    owned_by: feasibility
    authority_class: AUTHORITATIVE
    purpose: "Whether ONE candidate satisfies ONE hard requirement, at the maturity the evidence has now."
    required_fields: [entity_id, candidate, constraint, status, why]
    status: [NOT_YET_EVALUABLE, SATISFIED, VIOLATED]
    rules:
      - >
        A REQUIREMENT EXISTING IS NOT THE SAME AS ITS BEING EVALUABLE. Absence of
        a material assignment is not PLASTIC_ONLY satisfied and is not
        PLASTIC_ONLY violated; it is NOT_YET_EVALUABLE, which is what the design
        actually knows. Defaulting either way is absence becoming an assertion
        (FA-8).
      - >
        A candidate may be ruled out early ONLY when the requirement is evaluable
        at the current maturity AND incompatibility is established. VIOLATED is a
        finding about the candidate; NOT_YET_EVALUABLE is a finding about the
        evidence.
      - "This is not mechanical feasibility. A violated requirement is not a broken mechanism."

  FeasibilityDomainAssessment:
    semantic_roles: [eligibility_evidence]
    field_semantics:
      candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
    owned_by: feasibility
    authority_class: AUTHORITATIVE
    purpose: >
      ONE mechanical domain's verdict for ONE candidate. The domain is the unit
      of dependency: what a motion verdict rests on is not what a load verdict
      rests on, and a single record for all nine could only carry the union - so
      changing an envelope would have staled the load closure it cannot affect.
    required_fields: [entity_id, candidate, domain, status, reason_codes]
    optional_fields: [summary]
    domain:
      - physical_realization
      - load_reaction_closure
      - mobility_disposition
      - required_configurations
      - motion_and_transitions
      - spatial_realization
      - reach
      - assemblability
      - gross_interference
    status: [PASS, FAIL, NOT_ESTABLISHED, NOT_APPLICABLE]
    rules:
      - >
        NO `evidence_refs` FIELD. The operation's `premise_refs` ARE the evidence:
        exactly the current positive facts this verdict was read from, and
        nothing that merely happened to be in the view. A second reference list
        beside them would be a second answer to "what did you use".
      - >
        APPLICABILITY IS DECIDED BEFORE STATUS. NOT_APPLICABLE means the design
        poses no question in this domain - no load case, no required motion - and
        it never blocks. It is not a weaker PASS.
      - >
        ABSENCE IS NOT_ESTABLISHED AND NEVER PASS, and never FAIL either: a
        conservative overlap, a missing envelope, a path that cannot be checked
        are all things the design has not established. FAIL is reserved for a
        current typed fact that positively contradicts a requirement.
      - >
        A MODEL-LOCAL CONCLUSION DECIDES NOTHING. A ReachResult or an
        EliminationRecord contributes a reason code - MODEL_LOCAL_NEGATIVE,
        MODEL_LOCAL_POSITIVE - and cannot by itself produce PASS or FAIL. A
        deterministic wrapper around a model's opinion is still the model's
        opinion.

  MechanicalFeasibilityAssessment:
    semantic_roles: [eligibility_evidence]
    field_semantics:
      candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
      domain_assessments:
        kind: reference
        target: FeasibilityDomainAssessment
        cardinality: many
        resolvable: false
    owned_by: feasibility
    authority_class: AUTHORITATIVE
    purpose: >
      CAN THIS CANDIDATE WORK, on the engineering evidence established so far.
      Candidate-local, preference-blind, and never a comparison.
    required_fields: [entity_id, candidate, status, domain_assessments]
    # `findings` is a HUMAN-READABLE SUMMARY and is not a second domain-status
    # authority. The canonical per-domain result is `domain_assessments`; free
    # text beside it that could disagree is how two answers start.
    optional_fields: [findings, blocking_findings, evaluated_domains]
    status: [FEASIBLE_FOR_SELECTION, INFEASIBLE, NOT_ESTABLISHED]
    evaluated_domains:
      - physical_realization
      - load_reaction_closure
      - mobility_disposition
      - required_configurations
      - motion_and_transitions
      - spatial_realization
      - reach
      - assemblability
      - gross_interference
    aggregation: >
      any applicable domain FAIL -> INFEASIBLE; else any applicable domain
      NOT_ESTABLISHED -> NOT_ESTABLISHED; else FEASIBLE_FOR_SELECTION.
      NOT_APPLICABLE never blocks. Complexity, part count, preference and
      relative quality are not inputs, and a mechanism is not less feasible for
      having more joints than one somebody would rather have.
    rules:
      - >
        ITS PREMISES ARE THE DOMAIN ASSESSMENTS AND EVERYTHING THEY USED. The raw
        union was originally carried because propagation stopped after one hop,
        so naming the domain records alone would have left this standing on a
        verdict that had just lost authority. S7-F made propagation transitive
        and the union is kept anyway: it is true, it costs nothing, and deleting
        correct provenance to demonstrate that a mechanism works is not a test
        of it.
      - >
        RE-EVALUABLE, AND ONE CURRENT ANSWER PER CANDIDATE. When the evidence it
        was reached over is revised, or evidence appears where there was none,
        the same evaluator answers again: the previous record is INVALIDATED with
        a reason and remains readable, and the new answer is written beside it
        carrying `evaluation_basis` - the lifecycle fingerprint of the exact
        premise revisions it was decided over. Two answers over the same basis
        are one answer, so reconciling an unchanged design writes nothing. Two
        STANDING assessments for one candidate is a lifecycle defect and is
        reported as one. (S7-F)
      - >
        CANDIDATE-LOCAL. It reads one branch's evidence and says whether that
        branch could work. It never reads another candidate, never ranks, and
        never prefers a simpler mechanism: two mechanically valid alternatives
        are both FEASIBLE_FOR_SELECTION however differently complex they are.
      - >
        PREFERENCE-BLIND, and enforced at the input boundary rather than by
        asking a prompt not to look. A SelectionProfile reaching this
        responsibility's consumer view is a contract failure.
      - >
        MISSING EVIDENCE IS NOT FEASIBILITY. A domain the design has not
        established yields NOT_ESTABLISHED for that domain and for the assessment;
        it never yields FEASIBLE_FOR_SELECTION. FEASIBLE_FOR_SELECTION means the
        established evidence contains nothing that stops this candidate - not
        that the candidate has been proven to work, which is assurance (U-9).
      - >
        NOT AUTHORED BY A MODEL. It is derived from what S1-S6 established, so a
        model cannot declare a mechanism feasible; the name says
        FOR_SELECTION because it answers eligibility and not engineering truth.
      - >
        Local geometric evidence - an EliminationRecord, an interference finding -
        is INPUT to this, not a decision. s04 reports what it computed; this
        family decides what that means for eligibility, from the whole picture.

  SelectionProfile:
    semantic_roles: [selection_preference]
    owned_by: selection
    authority_class: AUTHORITATIVE
    purpose: >
      WHICH working design is wanted: the user's ranked preferences, materialised
      as a versioned snapshot at the selection boundary and nowhere earlier.
    required_fields: [entity_id, profile_version, source_hash, criteria]
    criteria_shape: "criterion -> {objective: MINIMIZE|MAXIMIZE, priority: HIGH|MEDIUM|LOW}"
    rules:
      - >
        INVISIBLE BEFORE SELECTION. No stage from s01 through the feasibility
        responsibility may receive one. This is an input-boundary rule, not a
        prompt instruction: a preference a stage cannot see cannot bias it.
      - >
        VERSIONED AND SNAPSHOTTED. A decision names the exact profile it was made
        under, so changing preferences reopens the choice without touching a
        single engineering fact.
      - "A preference is never a constraint. It cannot make a candidate ineligible."
      - >
        ONE CURRENT SNAPSHOT. `source_hash` is SHA-256 over the canonicalized
        preference mapping ALONE - not the hard requirements, not the request, not
        any engineering fact - so the same preferences in a different key order
        are the same snapshot and produce the same entity. A changed preference
        SUPERSEDES the standing profile rather than overwriting it, and the
        comparison built on the old one goes STALE by ordinary propagation while
        every feasibility artifact stays STANDING. (S7-C)
      - >
        A MALFORMED PROFILE IS NOT PARTIALLY MATERIALISED. An invalid objective or
        priority rejects the whole snapshot: dropping the bad criterion and keeping
        the rest would record a preference set the user never stated. An unknown
        CRITERION NAME is not malformed - the user may want something this pipeline
        cannot yet measure, and the metric registry answers NOT_AVAILABLE rather
        than the profile silently forgetting the request. (S7-C)

  CandidateComparison:
    semantic_roles: [selection_evidence]
    field_semantics:
      candidates:
        kind: reference
        target: Candidate
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      profile:
        kind: reference
        target: SelectionProfile
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
      # S7-C. THE CANDIDATES THE COMPARISON DID NOT DISCRIMINATE BETWEEN, typed
      # so a reader can follow it and so the write boundary checks it. NOT a
      # winner: a frontier of one says the deterministic comparison ran out of
      # candidates to distinguish, which is a fact about the metrics rather than
      # a commitment to anything.
      frontier:
        kind: reference
        target: Candidate
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
    owned_by: selection
    authority_class: DERIVED
    purpose: "Deterministic metrics over the ELIGIBLE candidates, computed before anything is asked of a model."
    required_fields: [entity_id, candidates, profile, metrics, outcome, frontier]
    optional_fields: [stopping_priority, unavailable_criteria, incomparable_criteria]
    # S7-C. `availability` and `reason_code` are REQUIRED of every entry, because
    # a metric shape that can omit them lets absence look like an unfilled field.
    metric_shape: "criterion -> per candidate {availability, value, unit, reason_code, source_refs}"
    availability: [AVAILABLE, NOT_AVAILABLE]
    # WHAT THE DETERMINISTIC COMPARISON WAS ABLE TO SAY. Four answers, and none of
    # them is a choice.
    outcome:
      - SOLE_ELIGIBLE
      - DOMINANT_UNDER_PROFILE
      - TRADEOFF_UNRESOLVED
      - NOT_COMPARABLE
    stopping_priority: [HIGH, MEDIUM, LOW]
    rules:
      - >
        NO SILENT SURROGATE. A metric with no canonical source is NOT_AVAILABLE
        and says so. Manufactured part count is not Body count unless a contract
        establishes that equivalence, and substituting one for the other would
        answer a question the design has not answered.
      - >
        Every value names the state facts it was computed from, so a reader can
        check it and so changing those facts reopens the comparison.
      - >
        NO WEIGHTED SCORE. Criterion vectors, dominance, and the profile's tiers.
        A genuine trade-off stays a trade-off: collapsing one into a number
        invents a decision the evidence does not contain.
      - >
        TIERS ARE EVALUATED HIGH, THEN MEDIUM, THEN LOW, and a lower tier may only
        be reached when the tier above produced an EXACT TIE. A tier where
        candidates trade off against one another is TRADEOFF_UNRESOLVED and the
        comparison stops there: letting MEDIUM pick between two candidates that
        disagree at HIGH would answer the important question with the unimportant
        one. (S7-C)
      - >
        NOT_AVAILABLE IS NEITHER GOOD NOR BAD. Never a sentinel value, never
        infinity, never zero, never "worst". A criterion needed at the tier being
        evaluated and unavailable for any candidate still in the frontier stops
        the comparison as NOT_COMPARABLE - the available subset is not a smaller
        version of the question the user asked. (S7-C)
      - >
        THE POPULATION IS EVERY ELIGIBLE CANDIDATE AND NOTHING ELSE. Eligibility is
        decided upstream and read, never re-derived under preference: a candidate
        whose eligibility cannot be established from current evidence makes the
        POPULATION unestablished, and no comparison is written at all. Comparing
        the subset that happened to be knowable would publish a conclusion about a
        design nobody has. (S7-C)
      - >
        NO TIE-BREAK EXISTS. Not candidate id, not insertion order, not the order
        the criteria were written in. Where the evidence does not discriminate, the
        frontier holds every candidate it did not discriminate between. (S7-C)
      - >
        TWO ESTABLISHED VALUES ARE NOT TWO COMPARABLE NUMBERS. A criterion whose
        AVAILABLE records are stated in more than one unit is NOT_COMPARABLE for
        that frontier - 2 cm3 is not less than 1000 mm3, and `<` says it is. The
        incompatibility belongs to the PAIR rather than to either record, so it
        stops the tier being evaluated and is reported in
        `incomparable_criteria`; the metric itself stays AVAILABLE, because it
        was established. No conversion is attempted: nothing in this repository
        is an authority on what one unit is worth in another. (S7-C correction)

  SelectionAdvisory:
    semantic_roles: [advisory]
    field_semantics:
      candidates:
        kind: reference
        target: Candidate
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      comparison:
        kind: reference
        target: CandidateComparison
        cardinality: one
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      # S7-D. WHO THE REVIEWER WOULD PICK, typed - so a reader can follow it and
      # the write boundary checks it. An opinion about an already-eligible field;
      # naming it `selected_candidate` would make it read like a commitment, and
      # no field here is one.
      recommended_candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
    owned_by: selection
    authority_class: ASSURANCE
    purpose: "An engineering reviewer's opinion on an already-eligible field. Advisory, never authoritative."
    required_fields: [entity_id, candidates, comparison, recommendation, reasoning, comparison_alignment]
    optional_fields: [sensitivity, recommended_candidate]
    recommendation: [PREFER_CANDIDATE, NO_CLEAR_PREFERENCE]
    # WHETHER THE REVIEWER AGREES WITH THE DETERMINISTIC COMPARISON, computed by
    # the producer from the comparison's own outcome and frontier. The model does
    # not author it: a reviewer saying "I agree with the metrics" is a claim about
    # the metrics, and the metrics already said what they said.
    comparison_alignment: [ALIGNS_WITH_FRONTIER, DEPARTS_FROM_FRONTIER, NO_DETERMINISTIC_PREFERENCE]
    rules:
      - >
        MAY NOT AUTHOR MechanicalFeasibilityAssessment, HardRequirementCompliance
        or SelectionDecision. It advises on candidates already established
        eligible; it cannot make one eligible and cannot make one ineligible.
      - >
        May say which candidate looks preferable under the current priorities,
        and under which change of priority that would flip. That is judgement
        about a trade-off, which is what a reviewer is for.
      - "It is CONSIDERED by a decision, not a premise of it. Rewording it invalidates nothing."
      - >
        THE STRUCTURAL FIELDS ARE THE PRODUCER'S, NOT THE MODEL'S. `candidates` is
        copied from the comparison, `comparison` names it, `comparison_alignment`
        is computed from its outcome and frontier, and `recommended_candidate` is
        validated against its population. A model asked to author any of them
        would be a model deciding who is eligible - and a reviewer recommending a
        candidate nobody may choose has not given an opinion, it has given a
        malformed one. (S7-D)
      - >
        PREFER_CANDIDATE REQUIRES A CANDIDATE AND NO_CLEAR_PREFERENCE FORBIDS ONE.
        "I prefer one" naming nothing, and "I have no preference" naming one, are
        both a recommendation that does not say what it means. (S7-D)
      - >
        DEPARTING FROM THE FRONTIER IS LEGAL AND EXPLICIT. A reviewer may prefer a
        candidate the registered metrics do not favour - that is what a reviewer
        is FOR, because the concern being raised is one no metric represents. What
        is forbidden is departing SILENTLY: the disagreement is a field, so a
        human sees it. (S7-D)

  SelectionConcern:
    semantic_roles: [advisory]
    field_semantics:
      candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
      advisory:
        kind: reference
        target: SelectionAdvisory
        cardinality: one
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
    owned_by: selection
    authority_class: ASSURANCE
    purpose: >
      A decision-critical engineering concern the explicit preferences and the
      deterministic metrics do not represent - what a reviewer would raise and a
      metric cannot.
    required_fields: [entity_id, candidate, advisory, issue, importance, evidence_status]
    optional_fields: [supporting_refs, evidence_note]
    evidence_status: [SUPPORTED_BY_STATE, PLAUSIBLE_NOT_ESTABLISHED, SPECULATIVE]
    # HOW MUCH HUMAN ATTENTION IT DESERVES, and nothing else. HIGH eliminates no
    # candidate, touches no eligibility and carries no authority: a concern raises
    # a question and never decides one.
    importance: [HIGH, MEDIUM, LOW]
    rules:
      - >
        THE STATUS IS THE POINT. "Repeated flexure may be durability-sensitive"
        is PLAUSIBLE_NOT_ESTABLISHED and is worth raising. "This hinge fails after
        20,000 cycles" is a number the design does not have, and a concern
        claiming SUPPORTED_BY_STATE must cite state that supports it or be
        downgraded.
      - "A concern raises a question. It never decides one."
      - >
        SUPPORT IS PRESERVED OR DOWNGRADED, NEVER UPGRADED. The model proposes an
        evidence status and the deterministic writer checks it: SUPPORTED_BY_STATE
        with no valid current reference becomes PLAUSIBLE_NOT_ESTABLISHED, and
        `evidence_note` records why. It is never raised the other way, because
        refs happening to resolve is not the same fact as those refs supporting
        the claim - only the reviewer can say that, and only about what it saw.
        (S7-D)
      - >
        A REFERENCE THAT WAS NOT IN THE REVIEWED VIEW NEVER ENTERS STATE. An id
        the model invented resolves to nothing and would make a fabricated
        citation look like provenance; it is dropped, and dropping it is what
        triggers the downgrade. (S7-D)
      - >
        IMPORTANCE IS NOT AUTHORITY. A HIGH concern changes no eligibility, no
        feasibility verdict and no comparison. It changes what a human is asked to
        look at. (S7-D)
      - >
        A REVIEW IS OF A DESIGN, AND THE DESIGN MOVES. `review_context_digest` is
        the producer's canonical digest of the EXACT payload the provider was
        given, taken before the response exists and never authored by the model.
        `premise_refs` withdraws the review when something it was shown is
        revised; the digest catches the other half - an entity that did not exist
        then and would be in the review now - which no premise edge could, because
        the reviewer never saw it. When the two differ the review is retired
        WITHOUT a provider being called: an advisory is assurance, a design with
        no current review is an ordinary state a human may still decide in, and
        asking for a new opinion is a person's decision. (S7-F)

  HumanDecisionInput:
    semantic_roles: [human_decision]
    field_semantics:
      selected_candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
      comparison:
        kind: reference
        target: CandidateComparison
        cardinality: one
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      profile:
        kind: reference
        target: SelectionProfile
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
      reviewed_advisories:
        kind: reference
        target: SelectionAdvisory
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      # TWO KINDS OF REVIEWED MATERIAL. A record naming only recommendations
      # could not say which raised ISSUES a person actually read, and a concern
      # is the thing a reviewer is for - "they saw the advisory it hangs off" is
      # a different statement. (S7-A correction)
      reviewed_concerns:
        kind: reference
        target: SelectionConcern
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
    owned_by: selection
    authority_class: AUTHORITATIVE
    purpose: "What a human submitted at the decision screen, and what they were looking at when they submitted it."
    required_fields: [entity_id, action, rationale, comparison, profile, premise_digest]
    optional_fields: [selected_candidate, reviewed_advisories, reviewed_concerns]
    action: [SELECT, KEEP_UNRESOLVED, REQUEST_MORE_EVIDENCE]
    rules:
      - >
        THE UI WRITES THIS AND NOTHING ELSE. A SelectionDecision is written by a
        deterministic backend writer that re-reads the premises; a screen cannot
        author a commitment.
      - >
        `premise_digest` is what the human was SHOWN. If it does not match the
        current premises at submit time the decision is refused and the screen
        must refresh - a person may leave a decision open while the engineering
        moves under it, and a stale approval is not an approval.
      - >
        A human may choose against the advisory. That is not an error to
        reconcile; it is the reason a human is in the loop, and the rationale
        records it. The only prohibition is a candidate outside the currently
        eligible population - preference cannot make someone eligible, and
        neither can a reviewer or a person.
      - >
        HISTORICAL PROVENANCE, SO IT CARRIES NO PREMISES. "I submitted this after
        seeing snapshot X" stays true when X stops being current, and that is
        exactly the fact a stale submission is made of: a record that went STALE
        with the comparison could not be found afterwards to be refused, and the
        evidence that a person submitted against an old view would have quietly
        disappeared. What was shown is recorded in the fields and in the digest;
        the record claims nothing about it still holding. Nothing rewrites or
        erases it, and a refused submission stays. (S7-E)
      - >
        `premise_digest` IS A DIGEST OF THE REVIEW SNAPSHOT, not of the design.
        A whole-state hash would make every unrelated write a reason to ask a
        person to look again, which trains people to click through the thing that
        exists to stop them. It covers the comparison, the profile, the
        eligibility basis and the advisory material actually shown - the values,
        not just the ids, so the same entity revised is a different review. (S7-E)
      - >
        THE UI SUPPLIES THREE THINGS: the action, the candidate when the action
        is SELECT, and the rationale. Which comparison, which profile, which
        advisory material and the digest all come from the snapshot that was
        rendered, so a client cannot claim to have reviewed one thing while
        submitting against another. (S7-E)


  SelectionDecision:
    semantic_roles: [selection_decision]
    # SELECTION IS AN AUTHORITY, so exactly one of these may speak for the
    # design at a time. Two standing decisions were reachable through ordinary
    # writes and `committed_branch` returned whichever came first, so the whole
    # downstream followed one of two contradictory choices with nothing
    # recording that the other existed.
    #
    # Changing a decision keeps its history: SUPERSEDE the standing one, or
    # INVALIDATE it and record a new one. What is refused is a second decision
    # standing BESIDE the first.
    relational_invariants:
      - name: one_standing_selection
        rule: at_most_one_standing
        why: >-
          s05 embodies the selected candidate and s06/s07 settle and compile it.
          If two decisions stand, those three stages can silently disagree about
          which design they are working on, and every artifact downstream looks
          equally authoritative.
    field_semantics:
      selected_candidate:
        kind: reference
        target: Candidate
        cardinality: one
        resolvable: false
      eligible_candidates:
        kind: reference
        target: Candidate
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      feasibility_assessments:
        kind: reference
        target: MechanicalFeasibilityAssessment
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      hard_requirement_results:
        kind: reference
        target: HardRequirementCompliance
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      selection_profile:
        kind: reference
        target: SelectionProfile
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
      comparison:
        kind: reference
        target: CandidateComparison
        cardinality: one
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      human_decision:
        kind: reference
        target: HumanDecisionInput
        cardinality: one
        resolvable: false
        referent_population: DESIGN_WIDE
      considered_advisories:
        kind: reference
        target: SelectionAdvisory
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
      considered_concerns:
        kind: reference
        target: SelectionConcern
        cardinality: many
        resolvable: false
        referent_population: ALL_RETAINED_BRANCHES
    # S-7 / U-8: OWNERSHIP MOVED OUT OF s04. s04 authors spatial evidence; it
    # does not choose. The old `gate` responsibility sat between s04a and s04b
    # and mixed two questions - "is this candidate mechanically eligible" and
    # "which eligible one do we want" - which is why a preference could reach a
    # feasibility judgement and why s04b required a decision that could not exist.
    owned_by: selection
    purpose: "The candidate a HUMAN selected, with the evidence that made it eligible and the profile it was judged under."
    required_fields:
      - entity_id
      - selected_candidate
      - eligible_candidates
      - feasibility_assessments
      - hard_requirement_results
      - selection_profile
      - comparison
      - human_decision
    # CONSIDERED, never premise - separate fields from the premise ones above,
    # so no propagation path runs from a model's wording to this decision's
    # standing. Rewording an advisory or a concern stales nothing.
    optional_fields: [considered_advisories, considered_concerns, rationale]
    rules:
      - >
        Only a candidate that is SELECTION_ELIGIBLE may be selected: mechanical
        feasibility FEASIBLE_FOR_SELECTION and every selection-blocking hard
        requirement SATISFIED. Eligibility is deterministic and is established
        before this record exists.
      - >
        NEVER A SCORE AND NEVER AN ARBITRARY PICK. Three different things were
        being said with one word, and S7-E had to separate them before a writer
        could act: TRADEOFF_UNRESOLVED is a CandidateComparison OUTCOME - the
        deterministic evidence did not discriminate; KEEP_UNRESOLVED is a
        HumanDecisionInput ACTION - a person declined to commit, which is an
        answer and creates no decision of any kind; and a generic
        UnresolvedDecision is emitted only where its own canonical preconditions
        genuinely exist, because that family REQUIRES `kept_open_by` to cite the
        Ambiguity or Freedom entities keeping the item open. Manufacturing one
        from a human's decision not to choose would fabricate exactly that typed
        evidence, and a fabricated openness is worse than a recorded one. (S7-E)
      - >
        A HUMAN decides. This record is written by a deterministic writer FROM a
        HumanDecisionInput, after re-checking that the premises the human was
        shown are still the current ones. No LLM and no UI may author it.
      - >
        PREMISES vs CONSIDERED. The feasibility assessments, the hard-requirement
        results, the comparison and the profile are PREMISES: change one and this
        decision loses unqualified authority. Advisory material is CONSIDERED -
        recorded because the human reviewed it, and rewording it invalidates
        nothing, because the model's wording was never the ground of the choice.
      - >
        THE SAME MATERIAL, TWO DIFFERENT QUESTIONS, AND THEY HAVE DIFFERENT
        ANSWERS. Before submission the advisory and the concerns are inside the
        review digest, because a person reading an opinion that has since changed
        is reading an old screen and must look again. After a commitment exists
        they are outside its premise set, because what made the candidate
        choosable was the engineering evidence and never the sentence beside it.
        A record that went stale on a reworded advisory would teach a reader that
        the model's prose was load-bearing. (S7-E)
      - >
        WRITTEN BY THE `selection_decision` PASS, from a HumanDecisionInput whose
        `premise_digest` the writer RECOMPUTED from current state - never from the
        digest the submission carried, and never from the comparison's candidate
        list in place of re-establishing eligibility. A screen submits a claim
        about what it showed; only the design can say whether that is still what
        it says. (S7-E)

# ---------------------------------------------------------------- U-2B (S-2)
# The canonical contract is deliberately AHEAD of several producers. Recording
# that is the point: a contract quietly weakened to accept what the code already
# emits would carry the audited defect forward under a new name.
#
# No compatibility shim exists for any row below. Each migrates at its step.
# S-4 CLOSED THESE. They are no longer ACTIVE rows: an active row means "the
# canonical target exists and the current producer does not conform", and that is
# now false for all of them. History is kept here and deliberately NOT in `rows` -
# one active authority, not two.
superseded_legacy_producers:
  meaning: >
    Rows that WERE active and are not any more. Historical record only; nothing
    reads this to decide current behaviour.
  rows:
    - concept: ConstraintRelation
      was: "s03 emitted the non-addressable blocked_by shape"
      now: "s03b authors ConstraintRelation with an id and a resolvable provider"
      closed_by: "S-4 / U-5; the last reader removed at the S-5 correction"
      residual: >
        Recorded fixtures still contain `blocking_relations[]`. Corpus debt (Impl
        S-9): no live path parses it, and the alias table, the canonicaliser and
        the per-DOF relation reconstructor that made it usable are deleted. A run
        record counts what a recording holds, which feeds nothing.
    - concept: Candidate.principle
      was: "the s02 prompt asked for a bare principle family; parsers tolerated a scalar"
      now: >
        the response schema shows the canonical mapping {function_class:
        principle_family}, the prompt says a one-thing candidate is a ONE-ENTRY
        mapping and never a bare string, and a rejected shape is REPORTED rather
        than coerced - the contract's own `no_compatibility_shim` requires that
      closed_by: "S-4 / U-5 prompt migration"
      residual: >
        Recorded fixtures predating the migration still carry the scalar shape.
        They are corpus debt (Impl S-9) and no live parser accepts them.
    - concept: addresses_obligations
      was: >
        the model was asked for `obligations_addressed` and the producer renamed
        it to `addresses_obligations` on the way into state - a semantic rename,
        which is a compatibility shim rather than a finished migration
      now: "the model authors `addresses_obligations`; nothing renames anything"
      closed_by: "S-4 / U-5 prompt migration"
      residual: >
        Recorded fixtures still use the old key. Corpus debt (Impl S-9); the live
        producer no longer reads it.
    - concept: MobilityExpectation domain and disposition split
      was: >
        domain enumeration and disposition assignment were one function, and its
        else branch wrote MAINTAINED_BY_CLASS with a holding class composed from
        the first joint reaching the group - or the literal "joint class of no
        joint" when there was none. Absence was used as a premise.
      now: >
        the domain is enumerated deterministically and reported as BOOKKEEPING;
        dispositions come only from a present premise - INTENDED from an authored
        joint, BLOCKED_BY citing an addressable ConstraintRelation,
        IRRELEVANT_BECAUSE naming a scenario - and a cell no premise covers is
        UNDISPOSITIONED, naming what is missing. Disposition completeness is
        reported as an engineering quantity.
      closed_by: "S-5 / U-6 (ADR-005), completed at the S-5 correction"
      residual: >
        Recorded fixtures predating the migration still contain the pre-split
        shape and the legacy blocking relations. Corpus debt (Impl S-9); no live
        path reads either.
      why_it_took_two_passes: >
        The first pass changed the derivation and declared the migration closed
        while THREE live paths still contradicted it, and none of them was in the
        function that was rewritten. s03a parsed `mobility` and `dof_dispositions`
        into MobilityExpectation from two branches no prompt documented, so a
        stale recording replayed through the topology pass still produced
        MAINTAINED_BY_CLASS cells. The derivation itself was invoked by ONE
        runner after the stage returned, so a second canonical caller got a state
        with no mobility at all and no sign of it. And the premise the whole
        migration is about was a bare string in a list of records, which no
        boundary could see - `premise_required: true` was a sentence rather than
        a property. Rewriting the defective function is not the same act as
        removing every path that reaches its output.
    - concept: MobilityExpectation premise typing and producer singularity
      was: >
        the disposition premise was an undeclared string inside `dispositions[]`,
        invisible to the write boundary and to Source A; two live producers could
        create the family and neither responsibility declared it as an output;
        the derivation was owned by a runner; and a ConstraintRelation naming no
        configuration was expanded over ALL of them
      now: >
        `dispositions` is a declared premise_record_list - the disposition value
        selects which field must carry its premise and which family that premise
        must resolve to, checked at the write boundary for every producer. s03b
        declares MobilityExpectation as an output and derives it inside its own
        invocation, in the same patch as the relations it derives from. s03a
        parses no mobility at all. A relation disposes the configurations it
        declares and no others.
      closed_by: "S-5 correction"
      residual: none
    - concept: FunctionalRegion.required_by_actors and reach_targets
      was: >
        the s03 prompt carried its own prose definition of these fields, so the
        contract and the prompt each defined them and could drift apart
      now: >
        the producer emits the canonical field names and the prompt cites the
        contract instead of redefining them
      closed_by: "S-4 (prompt cites the contract)"
      residual: none
      why_it_lingered: >
        Its status text read like a completion note - "producer emits the same
        field names" - inside a structure whose own rule says a row means the
        producer does NOT conform. Benign prose in an active list is still an
        active claim, which is why the gate now reads placement and ownership
        rather than the status token.
    - concept: PhysicalEffectObligation and PhysicalInteraction
      was: "none - no stage produced either"
      now: "s02 authors PhysicalEffectObligation; s03b authors PhysicalInteraction"
      closed_by: "S-4 / U-5"
      residual: none

# ---------------------------------------------------------------- S-6 / U-7
spatial_commitments:
  purpose: >
    WHICH VALUES s04a COMMITS, at what class, and how a later pass may change
    them. Declared here because "the arrangement is a commitment" has to be
    answerable by code, not only by prose - a downstream reader asks this
    structure which values it may not silently contradict.
  enforced_by: >
    `spatial_commitment_check`, which reads THIS declaration - so a family added
    here is checked without editing code, and the check and the contract cannot
    drift. It is the single enforcement point for both kinds, and it validates
    VOCABULARY MEMBERSHIP, which a required-field rule never could: a class of
    "x" would satisfy `required_fields` and mean nothing. That is also why
    `commitment_class` is not in either family's required_fields - putting it
    there would move enforcement to a weaker place and oblige every fixture that
    builds one of these for an unrelated reason to carry a field it is not about.
  granularity_rule: >
    A commitment is a VALUE, and s04a authors two kinds. Some are whole entities
    it creates, and those carry `commitment_class` ON THE ENTITY - the class is a
    field of the thing, validated against the vocabulary by the check named in
    `enforced_by` rather than by `required_fields`, which could only ask whether
    something was present. Others are single FIELDS it adds to an entity another
    stage owns, and those cannot carry a class of their own: runtime has no
    per-field authority, and inventing a field to hold one would declare an
    enforcement that does not exist. They are listed here instead, and what IS
    enforced for them is what the boundary already enforces - the field is
    extendable by s04 and by no one else, and changing it afterwards is a
    SUPERSEDE, which requires a reason.
  entity_level:
    - family: Envelope
      class_field: commitment_class
      committed_by: s04a
      refinement: "s04b EXTENDs, or SUPERSEDEs with a geometric reason"
    - family: ReferenceScale
      class_field: commitment_class
      committed_by: s04a
      refinement: >
        SUPERSEDE with a reason. Every s04 spatial value declares it as a
        premise, so replacing it costs all of them their unqualified authority -
        the correct consequence of changing what the numbers mean.
  field_level:
    - family: FunctionalRegion
      field: volume
      committed_by: s04a
      class: COMPARABLE
      enforced_by: "extendable_fields.volume == s04; a later change is a SUPERSEDE with a reason"
    - family: AssemblyStep
      field: insertion_direction
      committed_by: s04a
      class: COMPARABLE
      enforced_by: "extendable_fields.insertion_direction == s04; a later change is a SUPERSEDE with a reason"


legacy_producers:
  rule: >
    A row here means the canonical target is defined, the producer does not yet
    conform, and no parser accepts the old shape as if it did. It is NOT a claim
    of conformance.
  #: EMPTY at S-5 closure. Every migration this structure carried has been
  #: completed and moved to `superseded_legacy_producers`. An empty list is the
  #: statement "no producer is known to be nonconforming" - which is a claim, and
  #: a different one from the list having been deleted.
  rows: []
