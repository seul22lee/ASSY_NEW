# Ver3 boundary enforcement.
#
# These tests are the reason the rebuild rules are rules rather than intentions.
# They run on every push and pull request that touches the ver3 tree.
#
# Deliberately stdlib-only: the suite uses unittest and PyYAML, with no pytest
# and no project install step. A boundary check that needs an environment to be
# built first is a boundary check that gets skipped when the environment breaks.

name: ver3 boundaries

on:
  push:
    paths: ['ver3/**', '.github/workflows/ver3-boundaries.yml']
  pull_request:
    paths: ['ver3/**', '.github/workflows/ver3-boundaries.yml']
  workflow_dispatch:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install --upgrade pyyaml

      - name: Meta tests (boundaries and contracts)
        run: python -m unittest discover -s ver3/tests/meta -t . -v

      - name: Canonical state tests (authority, currentness, patch semantics)
        # A SEPARATE STEP, deliberately. This package was not run by CI at all -
        # the job discovered ver3/tests/meta only - and two of its tests had been
        # failing for three green runs, both broken by repairs to the very layer
        # they cover: SUPERSEDE authority and the ReferenceScale conditional
        # rule. A core suite outside CI is a suite that reports nothing until
        # someone runs it by hand.
        #
        # Its own step rather than a widened discover, so a state failure is
        # attributed to the state package instead of appearing inside a meta
        # run. Stdlib-only like the rest of this job: the package needs no CAD
        # kernel, and installing one here to make tests pass would defeat the
        # separation the downstream job exists for.
        run: python -m unittest discover -s ver3/tests/state -t . -v

      - name: assy_v3 imports cleanly with nothing else on the path
        # The RULE is unchanged and still valid; only its stated premise was
        # stale. It used to read "an empty boundary that imports nothing cannot
        # violate anything" - true when the package was a scaffold. The package
        # now contains S01-S04, so the check has become more meaningful rather
        # than less: it catches an accidental dependency that the AST scan misses
        # because it only appears at import time.
        run: python -c "import ver3.assy_v3, ver3.assy_v3.providers; print('assy_v3 boundary ok')"

      # RETIRED: "No stages package exists".
      #
      # Its purpose was the progression gate - stage code must not appear before
      # its contract has been through STAGE_PROGRESSION_CONTRACT step 1. That is
      # still the property worth holding. What is obsolete is the LIFECYCLE
      # ASSUMPTION it encoded: that the correct number of stage modules is zero.
      # S01-S04 now exist deliberately, and migration steps S-1 and S-2 have
      # already reshaped them, so "stages exist" cannot be a failure condition.
      #
      # The property outlived the assertion. tests/meta/test_no_stage_implementation.py
      # carries the evolved form - "once stage work begins, it fails on any stage
      # module whose contract has not been through step 1" - and it runs above.
      # It is invoked by name here so a failure reports the PROPERTY rather than
      # the milestone, and so retiring the shell check does not quietly reduce
      # coverage.
      - name: Stage modules respect the progression gate and the package boundary
        run: |
          python -m unittest -v \
            ver3.tests.meta.test_no_stage_implementation \
            ver3.tests.meta.test_no_legacy_imports \
            ver3.tests.meta.test_package_path

  # THE DETERMINISTIC DOWNSTREAM, with a real CAD kernel.
  #
  # Split into its own job because it is the one part of this repository with a
  # heavy binary dependency, and the boundary job above must stay fast and
  # stdlib-only. Split, NOT skipped: the s07 compiler tests are the only thing
  # standing between "the program compiled" and a kernel quietly supplying a
  # number nobody decided (R-24), and a suite that skips them in CI is a suite
  # that does not cover the CAD stage at all.
  #
  # `cadquery-ocp-novtk` is the OpenCascade binding without the visualization
  # stack, which is the whole of what a compiler needs. Pinned, because a kernel
  # version change moves geometry and would move the signatures that S07-C5
  # compares.
  downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML and the OpenCascade kernel
        run: python -m pip install --upgrade pyyaml cadquery-ocp-novtk==7.9.3.1.1

      - name: The kernel is actually present
        # Asserted before the tests run, so an install that silently produced no
        # kernel fails HERE rather than as a suite full of skips.
        run: |
          python -c "from ver3.assy_v3.downstream import compiler; compiler.kernel(); print('OpenCascade kernel ok')"

      - name: Typed IR, s06 solver and s07 compiler
        run: python -m unittest -v ver3.tests.meta.test_downstream_ir_solver_compiler

      - name: s05, the canonical adapters, currentness and the integrated CAD chain
        # These need the kernel too: the currentness tests compile real geometry
        # to prove a stale artifact stops being current, and the integrated chain
        # runs s05 -> s06 -> s07 end to end. Running them here rather than in the
        # stdlib job is what stops them skipping in CI.
        run: |
          python -m unittest -v \
            ver3.tests.meta.test_s05_embodiment \
            ver3.tests.meta.test_supersede_authority \
            ver3.tests.meta.test_downstream_integration \
            ver3.tests.meta.test_downstream_currentness

      - name: The benchmarks are BUILDABLE by the opcode set that must build them
        # BM-001, BM-002 and BM-003 decomposed into geometric capability classes
        # and put through a real OpenCascade compile.
        #
        # These live in ver3/tests/kernel, NOT ver3/tests/meta, and the placement
        # is the point. The boundaries job above discovers everything under
        # ver3/tests/meta with nothing but PyYAML installed, so an OpenCascade
        # test placed there fails that job for an environment reason unrelated to
        # any boundary. Separating by DEPENDENCY keeps the stdlib job stdlib and
        # keeps these unguarded: the kernel-presence step above has already run,
        # so a failure here is always a real failure and never a skip.
        #
        # The kernel-INDEPENDENT half of the same review - opcode vocabulary,
        # solver formulations, and the recorded limits of both - is
        # ver3.tests.meta.test_downstream_capability, which the boundaries job
        # runs on every push.
        run: python -m unittest -v ver3.tests.kernel.test_capability_geometry

      - name: The selected candidate, and only that one, reaches geometry
        # The production seam end to end: a standing SelectionDecision, the real
        # S05 invocation path, s06, s07 and an OpenCascade solid - plus the
        # lifecycle that makes it worth having, where reopening the choice
        # withdraws the geometry transitively and revising an unrelated
        # candidate does not.
        run: |
          python -m unittest -v \
            ver3.tests.kernel.test_selected_branch_compilation \
            ver3.tests.kernel.test_selected_seam_to_geometry
