# ---------------------------------------------------------------------------
# Curated claim seeds  --  input to scripts/build_claims.py
#
# Each claim is a single assertion attributed to one source, restated in
# controlled vocabulary, and bound to one or more VERIFIED evidence spans.
#
# What an analyst writes here:  the normalized statement, its subject /
# predicate / object, the conditions and assumptions the source itself placed
# on it, any quantities with their units, and which ontology individuals the
# claim is about.
#
# What an analyst does NOT write here:  chapter, section, printed page or PDF
# page.  Those are resolved from the cited evidence spans, which were
# themselves verified against the PDF.  Citations are therefore assembled, not
# typed.
#
# REVIEW STATUS.  Every claim in v0.1 is `NeedsReview`.  These statements were
# authored by an analyst reading the cited pages and were mechanically checked
# against the PDF text, which is stronger than automatic extraction but is not
# human sign-off.  `HumanVerified` is reserved for a named person who has
# compared the normalized statement against the printed page.  v0.1 contains
# zero HumanVerified claims by design.
# ---------------------------------------------------------------------------

version: "0.1.0"

defaults:
  review_status: "NeedsReview"
  extraction_method: "analyst-curated-from-source-page, anchor-verified against PDF"
  extraction_confidence: 0.90

claims:

  # =========================================================================
  # PILOT TOPIC 1  --  general design: design factor / factor of safety
  # =========================================================================
  - id: mott6-c-0001
    doc: mott6
    topic: design-factor
    subject: "design factor N"
    predicate: "is defined as"
    object: "a measure of the relative safety of a load-carrying component; the material strength divided by the design factor gives the design (allowable) stress"
    normalized_statement: >-
      Mott defines the design factor N as a measure of the relative safety of a
      load-carrying component. In most cases the strength of the material is
      divided by N to obtain a design stress (also called the allowable stress),
      and the actual stress must be less than the design stress.
    exceptions:
      - "For column buckling, Mott applies the design factor to the load on the column rather than to the material strength."
    evidence: [mott6-es-0001, mott6-es-0002]
    about: ["mdcore:SafetyRequirement"]

  - id: mott6-c-0002
    doc: mott6
    topic: design-factor
    subject: "value of the design factor"
    predicate: "is governed by"
    object: "codes established by standards-setting organizations, or by company policy"
    normalized_statement: >-
      Mott states that the value of the design factor or design stress is often
      governed by codes from standards-setting organizations, and that some
      companies adopt their own policies based on past experience.
    evidence: [mott6-es-0004]
    about: ["mdcore:SafetyRequirement"]
    external_authority: ["mdcore:RequiresExternalStandard", "mdcore:RequiresCompanySpecification"]

  - id: mott6-c-0003
    doc: mott6
    topic: design-factor
    subject: "selection of the design factor"
    predicate: "requires"
    object: "designer judgement when no code or standard applies"
    normalized_statement: >-
      Mott states that in the absence of codes or standards the designer must
      use judgement to specify the desired design factor.
    evidence: [mott6-es-0003]
    about: ["mdcore:SafetyRequirement"]
    external_authority: ["mdcore:RequiresEngineeringReview"]

  - id: shigley10-c-0001
    doc: shigley10
    topic: design-factor
    subject: "design factor n_d"
    predicate: "is defined as"
    object: "loss-of-function strength divided by allowable stress"
    normalized_statement: >-
      Shigley defines the design factor n_d as the ratio of the loss-of-function
      strength to the allowable stress, and calls the deterministic form of this
      approach the classical method of design.
    equations: ["1-1", "1-3"]
    evidence: [shigley10-es-0001]
    about: ["mdcore:SafetyRequirement"]

  - id: shigley10-c-0002
    doc: shigley10
    topic: design-factor
    subject: "factor of safety n"
    predicate: "is distinguished from"
    object: "design factor n_d"
    normalized_statement: >-
      Shigley distinguishes the design factor n_d, chosen before the design is
      completed, from the factor of safety n, which is the value actually
      achieved after choices such as rounding up to a standard size. The two have
      the same definition but generally differ numerically.
    evidence: [shigley10-es-0002]
    about: ["mdcore:SafetyRequirement"]
    analyst_note: >-
      Terminology difference from Mott, who uses a single symbol N for the
      design factor. Recorded as a terminology alignment, not merged.

  - id: shigley10-c-0003
    doc: shigley10
    topic: design-factor
    subject: "design factor evaluation"
    predicate: "requires"
    object: "analysis of all loss-of-function modes, with the smallest resulting factor governing"
    normalized_statement: >-
      Shigley states that all loss-of-function modes must be analyzed and that
      the mode leading to the smallest design factor governs.
    evidence: [shigley10-es-0003]
    about: ["mdcore:SafetyRequirement"]

  - id: shigley10-c-0004
    doc: shigley10
    topic: design-factor
    subject: "stress and strength terms in the design-factor equation"
    predicate: "must be"
    object: "of the same type and units, and applied at the same critical location"
    normalized_statement: >-
      Shigley states that the stress and strength terms used in the design-factor
      equation must be of the same type and the same units, and must apply to the
      same critical location in the part.
    equations: ["1-3"]
    evidence: [shigley10-es-0004]
    about: ["mdcore:SafetyRequirement"]

  - id: shigley10-c-0005
    doc: shigley10
    topic: design-factor
    subject: "assignment of a design factor value"
    predicate: "requires"
    object: "experience, company policies and applicable codes"
    normalized_statement: >-
      Shigley states that the designer must rely on experience, company policies
      and applicable codes to arrive at an appropriate design factor, because of
      the difficulty of evaluating the uncertainties involved.
    evidence: [shigley10-es-0005]
    about: ["mdcore:SafetyRequirement"]
    external_authority: ["mdcore:RequiresExternalStandard", "mdcore:RequiresCompanySpecification", "mdcore:RequiresEngineeringReview"]

  # =========================================================================
  # PILOT TOPIC 2  --  failure: fatigue
  # =========================================================================
  - id: mott6-c-0010
    doc: mott6
    topic: fatigue
    subject: "boundary between low-cycle and high-cycle fatigue"
    predicate: "is"
    object: "not sharply definable; designers often take up to about 1000 cycles as low-cycle fatigue"
    normalized_statement: >-
      Mott states that no specific dividing line can be defined between low-cycle
      and high-cycle fatigue, and that designers often use up to 1000 cycles for
      low-cycle fatigue and higher numbers, up to infinite life, for high-cycle
      fatigue.
    conditions:
      - "Applies to designers' working practice, not to a physical boundary."
    quantities:
      - role: "low-cycle fatigue practical upper bound"
        value: 1000
        unit: "cycle"
        original_value: "1000 cycles (10^3)"
        original_unit: "cycles"
    threshold:
      term: "low-cycle fatigue"
      is_universal: false
      scope_note: "The source explicitly denies that a specific dividing line can be defined."
    evidence: [mott6-es-0010]
    about: ["mech:FatigueFracture"]

  - id: mott6-c-0011
    doc: mott6
    topic: fatigue
    subject: "fatigue failures"
    predicate: "frequently occur at"
    object: "areas of stress concentration such as keyways or grooves in shafts, steps in cross section, and notches"
    normalized_statement: >-
      Mott states that fatigue failures frequently occur within areas of stress
      concentration such as keyways or grooves in shafts, steps in the size of a
      cross section, notches and other geometric discontinuities, and that even
      surface roughness or accidental nicks can initiate cracks.
    evidence: [mott6-es-0011]
    about: ["mech:FatigueFracture", "mech:Keyseat"]

  - id: mott6-c-0012
    doc: mott6
    topic: fatigue
    subject: "fatigue cracks"
    predicate: "initiate at"
    object: "small surface cracks, internal imperfections or grain boundaries in areas subjected to tensile stress"
    normalized_statement: >-
      Mott states that fatigue failures start at small surface cracks, internal
      imperfections, or grain boundaries in areas subjected to tensile stress,
      and grow with repeated stress application until the component fails, often
      suddenly.
    evidence: [mott6-es-0012]
    about: ["mech:FatigueCrackInitiationAndGrowth"]

