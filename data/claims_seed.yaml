    evidence: [mott6-es-0047]
    about: ["melem:InvoluteSpline", "melem:StraightSidedSpline", "mech:MaintainConcentricity", "mech:Hobbing"]

  - id: mott6-c-0047
    doc: mott6
    topic: substitution
    subject: "torque capacity of SAE straight-sided splines"
    predicate: "is based on"
    object: "a limit of 1000 psi bearing stress on the sides of the splines, giving T = 1000 N R h per inch of spline length"
    normalized_statement: >-
      Mott states that the torque capacity for SAE straight-sided splines is based
      on a limit of 1000 psi bearing stress on the sides of the splines, from
      which T = 1000 N R h is derived, where N is the number of splines, R the
      mean radius and h the spline depth. The torque capacity is per inch of
      spline length.
    quantities:
      - role: "allowable bearing stress on spline sides assumed by the SAE capacity formula"
        value: 1000
        unit: "psi"
        original_value: "1000"
        original_unit: "psi"
    assumptions:
      - "Dimensions in inches and torque in pound-inches; the formula is not dimensionally general."
      - "Capacity is stated per inch of spline length and must be multiplied by the engaged length."
    conditions:
      - "Applies to SAE straight-sided splines with h taken from the source's dimension table."
