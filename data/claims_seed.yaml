  # --- Mott on splines ------------------------------------------------------
  - id: mott6-c-0040
    doc: mott6
    topic: substitution
    subject: "splines"
    predicate: "perform"
    object: "the same function as a key in transmitting torque from shaft to mating element"
    normalized_statement: >-
      Mott states that splines perform the same function as a key in transmitting
      torque from the shaft to the mating element, a spline being a series of
      axial keys machined into the shaft with corresponding grooves in the bore of
      the mating part.
    figures: ["11-6"]
    evidence: [mott6-es-0040]
    about: ["melem:Spline", "mech:TransmitTorqueShaftToHub"]

  - id: mott6-c-0041
    doc: mott6
    topic: substitution
    subject: "splines compared with keys"
    predicate: "have"
    object: "many advantages"
    normalized_statement: >-
      Mott states that the advantages of splines over keys are many.
    evidence: [mott6-es-0041]
    about: ["melem:Spline", "melem:Key"]
    analyst_note: >-
      A qualitative evaluative claim. Contrast with Shigley, who emphasises that
      splines are much more expensive than keys and usually unnecessary for
      simple torque transmission.

  - id: mott6-c-0042
    doc: mott6
    topic: substitution
    subject: "spline with four or more teeth"
    predicate: "produces"
    object: "more uniform torque transfer and lower loading on a given part of the shaft/hub interface than one or two keys"
    normalized_statement: >-
      Mott states that because usually four or more splines are used, as compared
      with one or two keys, a more uniform transfer of torque and a lower loading
      on a given part of the shaft/hub interface result.
    evidence: [mott6-es-0042]
    about: ["melem:Spline", "mech:DistributedToothContact"]

  - id: mott6-c-0043
    doc: mott6
    topic: substitution
    subject: "splines"
    predicate: "are"
    object: "integral with the shaft, so no relative motion can occur as between a key and the shaft"
    normalized_statement: >-
      Mott states that splines are integral with the shaft, so that no relative
      motion can occur of the kind that can occur between a key and the shaft, and
      that splines are accurately machined to provide a controlled fit between
      mating internal and external splines.
    evidence: [mott6-es-0043]
    about: ["melem:Spline", "mech:FrettingWear"]

  - id: mott6-c-0044
    doc: mott6
    topic: substitution
    subject: "sliding motion between a standard parallel key and the mating element"
    predicate: "should not be"
    object: "permitted"
    normalized_statement: >-
      Mott states that sliding motion between a standard parallel key and the
      mating element should not be permitted, whereas a spline surface is often
      hardened to resist wear and to facilitate use in applications where axial
      motion of the mating element is desired.
    evidence: [mott6-es-0044, mott6-es-0045]
    about: ["melem:ParallelKeyConnection", "mech:AxialSlidingUnderTorque", "mech:PermitAxialMotion"]
    analyst_note: >-
      This is the decisive constraint behind substitution assessment SA-001: a
      requirement for axial sliding under torque excludes the plain parallel key
      regardless of its torque capacity.

  - id: mott6-c-0045
    doc: mott6
    topic: substitution
    subject: "multiple splines on a shaft"
    predicate: "allow"
    object: "the mating element to be indexed to various angular positions"
    normalized_statement: >-
      Mott states that because of the multiple splines on the shaft, the mating
      element can be indexed to various positions.
    evidence: [mott6-es-0046]
    about: ["melem:Spline", "mech:AngularIndexingFunction"]

  - id: mott6-c-0046
    doc: mott6
    topic: substitution
    subject: "involute spline form"
    predicate: "is preferred over"
    object: "the straight-sided form, because it self-centres the mating element and can be cut with standard gear hobs"
    normalized_statement: >-
      Mott states that the involute spline form is preferred because it provides
