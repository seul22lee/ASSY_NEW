    artifact_refs: [{kind: table, number: "11-2"}]

  - id: mott6-es-0023
    doc: mott6
    pdf_page_index: 488
    topic: shaft-hub-connection
    anchor: "this design gives a smaller bearing area on the sides of the key, and the bearing stress must be checked"
    artifact_refs: [{kind: figure, number: "11-3"}]

  - id: mott6-es-0024
    doc: mott6
    pdf_page_index: 488
    topic: shaft-hub-connection
