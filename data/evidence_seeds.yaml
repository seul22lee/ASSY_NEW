# ---------------------------------------------------------------------------
# Curated evidence seeds  --  input to scripts/build_evidence_spans.py
#
# An analyst supplies only: the document, the PDF page index, a short anchor
# phrase read on that page, and a topic tag.  Everything else -- printed page
# label, chapter, section, block, bounding box, text-integrity verdict -- is
# resolved and VERIFIED against the PDF by the builder.  A seed whose anchor is
# not present on the stated page fails the build.
#
# Page indices are 0-based PDF indices.  The corresponding printed page is
# resolved from the PDF page-label tree and is never computed by arithmetic.
# For reference only (do not rely on it in code): in these two files the front
# matter happens to offset mott6 by 16 and shigley10 by 22.
#
# Anchors are matched after de-hyphenation and whitespace collapsing, so they
# may be typed as continuous prose even where the PDF breaks them across lines.
# ---------------------------------------------------------------------------

version: "0.1.0"

evidence_seeds:

  # =========================================================================
  # MOTT 6e  --  general design topic: design factor
  # =========================================================================
  - id: mott6-es-0001
    doc: mott6
    pdf_page_index: 205
    topic: design-factor
    anchor: "The term design factor, N, is a measure of the relative safety of a load-carrying component"
    artifact_refs: [{kind: section, number: "5-9"}]

  - id: mott6-es-0002
    doc: mott6
    pdf_page_index: 205
    topic: design-factor
    anchor: "the strength of the material from which the component is to be made is divided by the design factor to determine a design stress"

  - id: mott6-es-0003
    doc: mott6
    pdf_page_index: 205
    topic: design-factor
    anchor: "In the absence of codes or standards, the designer must use judgment to specify the desired design factor"

  - id: mott6-es-0004
    doc: mott6
    pdf_page_index: 205
    topic: design-factor
    anchor: "Often the value of the design factor or the design stress is governed by codes established by standards-setting organizations"

  # =========================================================================
  # MOTT 6e  --  failure topic: fatigue
  # =========================================================================
  - id: mott6-es-0010
    doc: mott6
    pdf_page_index: 192
    topic: fatigue
    anchor: "While no specific dividing line can be defined, designers often use up to 1000 cycles"
    note: "Source explicitly denies a sharp LCF/HCF boundary; modelled as a non-universal ThresholdDefinition."

  - id: mott6-es-0011
    doc: mott6
    pdf_page_index: 192
    topic: fatigue
    anchor: "Such failures frequently occur within areas of stress concentration such as keyways or grooves in shafts"

  - id: mott6-es-0012
    doc: mott6
    pdf_page_index: 192
    topic: fatigue
    anchor: "Fatigue failures start at small surface cracks, internal imperfections, or even at grain boundaries"

  # =========================================================================
